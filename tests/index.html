120px;margin:auto;border-top:1px solid var(--line);padding:24px;font-size:14px;color:var(--muted)}.intro{max-width:750px;font-size:21px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:32px 0}.button{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);text-decoration:none;border-radius:4px;padding:11px 22px;font-weight:600}.button.secondary{background:transparent;color:var(--green)}.summary{border-left:4px solid var(--green);padding:4px 24px;margin:38px 0;font-size:19px}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.resource{border:1px solid var(--line);padding:22px}.resource h3{margin:0 0 10px}.resource p{font-size:16px;margin:0;color:var(--muted)}.local-file{color:var(--muted)}.meta{color:var(--muted);font-size:14px}.toc{border:1px solid var(--line);padding:16px 24px;margin:28px 0;font-size:15px}.toc>ul{margin:0}.toc li{margin:4px 0}li{margin:8px 0}.downloads{margin:0 0 30px}.measurements ul{padding-left:24px}@media(max-width:650px){body{font-size:16px}main{padding:30px 18px 50px}h1{font-size:29px}h2{font-size:23px}.intro{font-size:19px}.resources{grid-template-columns:1fr}header{padding:16px 18px}table{min-width:680px}.actions{gap:10px}.button{padding:9px 16px}}@media print{header,footer,.downloads{display:none}main{max-width:none;padding:0}body{font-size:11pt}h1{font-size:24pt}h2{font-size:18pt}table{font-size:9pt}.table-scroll{overflow:visible}a{color:inherit}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../tests/index.html\">직접 테스트\u003c/a>\u003ca href=\"../docs/implementation/SPIKE-DECISION-REPORT.html\">상세 보고서\u003c/a>\u003ca href=\"../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"eyebrow\">브라우저에서 직접 확인\u003c/p>\u003ch1>3D 스파이크 테스트\u003c/h1>\u003cp>대종사 십상과 관련 성지를 웹 가상 공간으로 구현하기 위한 사전 기술 시험입니다. 특정 플랫폼에 되도록 묶이지 않도록 공통 자산과 장면 데이터를 사용했습니다. 여기서는 실제 성지 대신 웹에서 내려받은 Knock Community Hall과 Sunnyvale Museum 샘플을 실행합니다. 촬영·사진에서 스플랫 생성·역사 복원은 이번 시험에 포함하지 않았습니다. \u003ca href=\"../index.html\">프로젝트 배경과 샘플 출처 보기\u003c/a>\u003c/p>\u003cp class=\"intro\">같은 장면을 PlayCanvas + Ammo, Three.js + BVH, Three.js + Rapier로 열어 비교할 수 있습니다.\u003c/p>\u003cdiv class=\"actions\">\u003ca class=\"button\" href=\"playcanvas/?scene=hall\">PlayCanvas + Ammo 시작\u003c/a>\u003ca class=\"button secondary\" href=\"three/?scene=hall&amp;controller=bvh\">Three.js + BVH 시작\u003c/a>\u003ca class=\"button secondary\" href=\"three/?scene=hall&amp;controller=rapier\">Three.js + Rapier 시작\u003c/a>\u003c/div>\u003ch2>조작 방법\u003c/h2>\u003cul>\u003cli>화면을 클릭하고 WASD로 이동합니다. 마우스로 시선을 돌리고 Esc로 마우스를 해제합니다.\u003c/li>\u003cli>‘과거 보기 / 현재 보기’로 시대를 전환하고, 장소 이름을 눌러 설명을 확인합니다.\u003c/li>\u003cli>‘충돌 면 보기’로 바닥과 벽을 확인합니다. ‘시작점으로’ 또는 R로 돌아갑니다.\u003c/li>\u003cli>‘위치 JSON 저장’으로 현재 상태를, ‘비교 경로 재생’ 후 ‘결과 JSON 저장’으로 측정 결과를 내려받을 수 있습니다.\u003c/li>\u003c/ul>\u003cp>모바일에서는 화면의 이동·시선 터치 영역을 사용합니다. 대형 원본이 열리지 않으면 기본 공간 또는 구역 로딩 장면부터 확인해 주세요. 엔진을 바꿔 비교할 때는 기존 테스트 탭을 닫고 하나씩 실행하면 됩니다.\u003c/p>\u003ch2>장면별 실행\u003c/h2>\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>장면\u003c/th>\u003cth>PlayCanvas + Ammo\u003c/th>\u003cth>Three.js + BVH\u003c/th>\u003cth>Three.js + Rapier\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">기본 공간\u003cbr>\u003cspan class=\"meta\">이동·시대 전환·장소 설명을 먼저 확인합니다.\u003c/span>\u003c/th>\u003ctd>\u003ca href=\"playcanvas/?scene=hall\">실행\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"three/?scene=hall&amp;controller=bvh\">실행\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"three/?scene=hall&amp;controller=rapier\">실행\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Sunnyvale 원본\u003cbr>\u003cspan class=\"meta\">대형 원본 장면과 벽 비침을 확인합니다.\u003c/span>\u003c/th>\u003ctd>\u003ca href=\"playcanvas/?scene=sunnyvale\">실행\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"three/?scene=sunnyvale&amp;controller=bvh\">실행\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"three/?scene=sunnyvale&amp;controller=rapier\">실행\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Sunnyvale 구역 로딩\u003cbr>\u003cspan class=\"meta\">이동하면서 화면과 충돌 구역이 함께 바뀌는지 확인합니다.\u003c/span>\u003c/th>\u003ctd>\u003ca href=\"playcanvas/?scene=sunnyvale-stream\">실행\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"three/?scene=sunnyvale-stream&amp;controller=bvh\">실행\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"three/?scene=sunnyvale-stream&amp;controller=rapier\">실행\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Sunnyvale 시대·설명 연동\u003cbr>\u003cspan class=\"meta\">구역 로딩, 시대 전환, 설명 표시를 함께 확인합니다.\u003c/span>\u003c/th>\u003ctd>\u003ca href=\"playcanvas/?scene=sunnyvale-era\">실행\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"three/?scene=sunnyvale-era&amp;controller=bvh\">실행\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"three/?scene=sunnyvale-era&amp;controller=rapier\">실행\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">기본 공간 구역 로딩\u003cbr>\u003cspan class=\"meta\">가까운 구역의 상세 화면이 로딩되는지 확인합니다.\u003c/span>\u003c/th>\u003ctd>\u003ca href=\"playcanvas/?scene=stream\">실행\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"three/?scene=stream&amp;controller=bvh\">실행\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"three/?scene=stream&amp;controller=rapier\">실행\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">기본 공간 구역·시대 연동\u003cbr>\u003cspan class=\"meta\">구역 로딩과 현재·과거 전환을 함께 확인합니다.\u003c/span>\u003c/th>\u003ctd>\u003ca href=\"playcanvas/?scene=stream-era\">실행\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"three/?scene=stream-era&amp;controller=bvh\">실행\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"three/?scene=stream-era&amp;controller=rapier\">실행\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">시대별 벽 전환\u003cbr>\u003cspan class=\"meta\">벽이 바뀔 때 충돌과 안전한 위치 이동을 확인합니다.\u003c/span>\u003c/th>\u003ctd>\u003ca href=\"playcanvas/?scene=era\">실행\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"three/?scene=era&amp;controller=bvh\">실행\u003c/a>\u003c/td>\u003ctd>\u003ca href=\"three/?scene=era&amp;controller=rapier\">실행\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"meta\">시대 전환 장면의 과거 화면과 설명은 기능 확인용 테스트 데이터입니다. 실제 역사 복원 결과가 아닙니다. 이번 공유용 빌드는 보고서 작성 후 만든 실행본이므로, 여기서 새로 얻은 측정값은 보고서의 기존 측정값과 구분해 주세요.\u003c/p>\u003c/main>\u003cfooter>테스트 기간 2026-10-02~04 · 기존 측정 기록을 정리한 자료입니다. 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../site-access.js"></script></body></html>
