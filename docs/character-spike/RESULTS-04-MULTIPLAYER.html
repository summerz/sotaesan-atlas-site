th:1120px;margin:auto;border-top:1px solid var(--line);padding:24px;font-size:14px;color:var(--muted)}.intro{max-width:750px;font-size:21px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:32px 0}.button{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);text-decoration:none;border-radius:4px;padding:11px 22px;font-weight:600}.button.secondary{background:transparent;color:var(--green)}.summary{border-left:4px solid var(--green);padding:4px 24px;margin:38px 0;font-size:19px}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.resource{border:1px solid var(--line);padding:22px}.resource h3{margin:0 0 10px}.resource p{font-size:16px;margin:0;color:var(--muted)}.local-file{color:var(--muted)}.meta{color:var(--muted);font-size:14px}.toc{border:1px solid var(--line);padding:16px 24px;margin:28px 0;font-size:15px}.toc>ul{margin:0}.toc li{margin:4px 0}li{margin:8px 0}.downloads{margin:0 0 30px}.measurements ul{padding-left:24px}@media(max-width:650px){body{font-size:16px}main{padding:30px 18px 50px}h1{font-size:29px}h2{font-size:23px}.intro{font-size:19px}.resources{grid-template-columns:1fr}header{padding:16px 18px}table{min-width:680px}.actions{gap:10px}.button{padding:9px 16px}}@media print{header,footer,.downloads{display:none}main{max-width:none;padding:0}body{font-size:11pt}h1{font-size:24pt}h2{font-size:18pt}table{font-size:9pt}.table-scroll{overflow:visible}a{color:inherit}}\n\n:focus-visible{outline:3px solid var(--green);outline-offset:5px}.trial-steps{padding-left:26px;max-width:780px}.trial-steps li{padding-left:8px;margin:18px 0}.trial-steps strong{display:block}.controls{display:grid;grid-template-columns:160px 1fr;gap:10px 24px;max-width:780px}.controls dt{font-weight:600}.controls dd{margin:0}.archive{margin-top:52px;border-top:1px solid var(--line);padding-top:24px}.archive>summary{cursor:pointer;font-size:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"RESULTS-04-MULTIPLAYER.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"4\">4회차: 함께 공간에 들어오기\u003c/h1>\n\u003cul>\n\u003cli>작성일: 2026-11-07\u003c/li>\n\u003cli>범위: 소규모 다중 접속 기능 구현과 배포 확인. 성능 비교·장시간 부하·iPhone 실기기 시험은 아니다.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"_1\">구현과 이용 방법\u003c/h2>\n\u003cp>\u003ca href=\"https://sotaesan-atlas-test.summerz.net/\">공유 사이트\u003c/a>에서 현재 테스트에 입장한다. 기본은 혼자 탐색이다. ‘안내·조작’을 열고 사이트 입장 때와 같은 검토용 비밀번호로 ‘함께 입장’을 누른다. 다른 브라우저나 기기도 같은 방법으로 입장하면 최대 4명까지 함께 표시된다. ‘혼자 탐색’으로 나올 수 있다.\u003c/p>\n\u003cp>방문자는 임시 번호와 색 테두리 이름표로 구분한다. 위치·방향·대기·걷기·달리기·합장을 초당 10회 공유하고 수신 화면에서 위치와 방향을 보간한다. 기존 아바타 모델과 합장 자세를 재사용한다. 다른 방문자는 충돌체가 없는 시각적 인물이다.\u003c/p>\n\u003cp>NPC와 안내문 전달·소지는 각 방문자에게 독립적이다. 누군가 안내문을 받아도 다른 이용자의 안내문은 소진되지 않는다. 공유 NPC 차례·계정·채팅·영구 저장은 구현하지 않았다. 새로 입장하면 새 임시 ID가 생기며 번호는 재사용된다.\u003c/p>\n\u003ch2 id=\"_2\">서버와 장애 처리\u003c/h2>\n\u003cp>정적 앱은 GitHub Pages에 유지하고 \u003ccode>wss://atlas-ws.summerz.net/ws\u003c/code>로 접속한다. 기존 VPS에 별도 컨테이너 \u003ccode>sotaesan-atlas-realtime\u003c/code>을 추가했다. 호스트의 \u003ccode>127.0.0.1:8791\u003c/code>만 바인딩하고 전용 Caddy 설정으로 HTTPS/WSS를 제공한다. 기존 앱의 설정은 변경하지 않았다.\u003c/p>\n\u003cul>\n\u003cli>이미지: \u003ccode>sotaesan-atlas-realtime:2026-11-07\u003c/code>, linux/amd64.\u003c/li>\n\u003cli>상한: 메모리 256MiB, CPU 0.5개, 프로세스 64개, 읽기 전용 파일 시스템. 초기 운영 상한이며 부하 시험으로 정한 필요 용량은 아니다.\u003c/li>\n\u003cli>설치 직후 상태: healthy, 재시작 0회. 유휴 단발 표본 약 27.46MiB / CPU 0.57%. 4명 부하·장시간 안정성을 증명하지 않는다.\u003c/li>\n\u003cli>서버 비밀번호 재검증, 허용 Origin, 메시지 크기·빈도·접속 수 제한을 적용했다. 검토용 공통 비밀번호는 공개 문서에도 있으므로 개인 인증·비공개 서비스가 아니다.\u003c/li>\n\u003cli>좌표 이력을 파일이나 DB에 저장하지 않는다. 클라이언트가 보내는 좌표의 물리적 타당성을 서버가 판정하지 않는다.\u003c/li>\n\u003cli>연결이 끊기면 원격 인물을 지우고 단독 이동을 유지한다. 페이지 메모리의 비밀번호로 지연 재접속하며, 나가거나 페이지를 닫으면 비밀번호를 버린다.\u003c/li>\n\u003c/ul>\n\u003cp>구성·제한·철회 방법은 \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">중계 서버 설명 (원본 저장소 파일)\u003c/span>을 따른다.\u003c/p>\n\u003ch2 id=\"_3\">확인한 것과 원본\u003c/h2>\n\u003cp>\u003ccode>pnpm check\u003c/code>가 통과했다. 중계 서버 5개 시험은 입장·늦은 입장·이동·퇴장·재입장, 잘못된 비밀번호, 정원 초과, 유효하지 않은 값·중복 순번·과대 메시지, 허용하지 않은 Origin을 검사한다. 기존 PlayCanvas 27개 회귀 시험도 포함된다.\u003c/p>\n\u003cp>별도 headed Chromium의 독립된 두 컨텍스트에서 다음을 확인했다. 사용자 브라우저와 기존 시험 세션은 조작하지 않았다.\u003c/p>\n\u003col>\n\u003cli>서로 다른 ID를 받고 상대 아바타 한 명씩 표시한다.\u003c/li>\n\u003cli>실제 Shift+S 입력의 달리기와 정지, 합장 손 모음·허리 숙임이 상대에게 전달된다. 정지 후 보간 좌표가 송신 위치의 0.2 장면 단위 이내로 수렴한다.\u003c/li>\n\u003cli>한쪽이 안내문을 받아도 다른 쪽의 소지는 변하지 않는다.\u003c/li>\n\u003cli>퇴장하면 상대 인물이 사라지고 재입장 시 중복 없이 새 ID 하나만 표시된다.\u003c/li>\n\u003cli>서버 중지 중에도 실제 A 키 입력으로 단독 이동한다. 서버를 다시 켜면 두 컨텍스트가 자동 재입장하고 각각 원격 인물 한 명만 표시한다.\u003c/li>\n\u003cli>390×844 화면에서 열린 패널이 화면 안에 들어가고 가로 넘침이 없다. 닫으면 안내·조작 핸들 하나만 남는다. 모바일 크기 에뮬레이션이며 iPhone 실기기 판정이 아니다.\u003c/li>\n\u003c/ol>\n\u003cp>로컬 개발 콘솔의 favicon 404와 의도적인 서버 중지 때의 WebSocket 연결 실패를 구분했다. 별도 Docker 이미지도 상한·읽기 전용 조건에서 건강 상태를 확인했다. 공개 도메인에서는 HTTPS health 200, WSS 정상 비밀번호 입장, 잘못된 비밀번호 거부, 잘못된 Origin 403을 확인했다. 공개 앱의 최종 검증 결과는 아래 배포 기록에 덧붙인다.\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"../implementation/measurements/atlas-multiplayer-local.json\">두 방문자·상호작용 JSON\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../implementation/measurements/atlas-multiplayer-reconnect.json\">중단·이동·자동 재접속 JSON\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../implementation/measurements/atlas-multiplayer-public-relay.json\">공개 WSS 검사 JSON\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../implementation/measurements/atlas-multiplayer-two-visitors.png\">두 방문자 화면\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../implementation/measurements/atlas-multiplayer-mobile-panel.png\">390px 패널 화면\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"_4\">남은 범위\u003c/h2>\n\u003cp>서로 다른 실제 기기·외부 네트워크의 지연, 실제 4명 동시 사용, 장시간 접속, iPhone 사용성은 아직 판정하지 않았다. 이번 확인은 독립된 두 브라우저 컨텍스트의 기능 시험이다. 서버의 정원 4명은 구현한 제한이며 4명 실사용 검증 결과가 아니다.\u003c/p>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
