argin-top:52px;border-top:1px solid var(--line);padding-top:24px}.archive>summary{cursor:pointer;font-size:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"RESULTS-01-AVATAR.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"1\">1회차 보완: 사람 아바타와 키보드 카메라\u003c/h1>\n\u003cul>\n\u003cli>작성일: 2026-11-07\u003c/li>\n\u003cli>대상: PlayCanvas \u003ccode>?scene=content&amp;character=1\u003c/code>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"_1\">변경\u003c/h2>\n\u003cp>로봇을 poly.pizza의 Quaternius Casual Character(CC0)로 교체했다. 대기·걷기 클립을 연결하고 높이를 1.7m로 맞췄다. 원본·라이선스·파일 해시는 \u003ca href=\"ASSET-LICENSE.html\">자산 기록\u003c/a>에 있다. 손목·손가락 뼈대를 가진 방문자 모델이며 교무님 복장·합장·전달 동작이 완성된 모델은 아니다.\u003c/p>\n\u003cp>전신 구도를 더 낮췄다. 시선 목표의 추가 높이는 신장 × 0.35에서 × 0.55로 변경했다. 장애물 근처에서는 카메라 거리 × 0.25로 제한한다. 기본 궤도 pitch -28°, 거리 3.8m는 유지한다. 초기 보완에서 상한 -25°를 시험했으나 사용자가 카메라가 충분히 낮아지지 않는다고 피드백해 \u003cstrong>최종 범위는 -50°~-15°\u003c/strong>로 풀었다. 시작점에서 가장 낮은 시점은 아바타 발 좌표보다 약 2.00m 위였다. 이는 해당 열린 구간에서의 값이며 장애물 보정 중 높이 보장은 아니다.\u003c/p>\n\u003cp>캐릭터 모드에서 \u003cstrong>WASD는 이동, 화살표키는 둘러보기\u003c/strong>로 분리했다. 좌우는 회전, 위아래는 시선 조절이며 마우스 드래그와 같은 경로·각도 제한을 사용한다. 초당 72° 기준이고 프레임 시간에 비례한다. WASD와 동시에 사용할 수 있다. 기존 1인칭 모드는 화살표 이동 기본값을 유지한다.\u003c/p>\n\u003ch2 id=\"_2\">확인\u003c/h2>\n\u003cp>별도 headed Playwright CLI, 단일 탭, Vite 개발 서버, Apple M4 Pro / ANGLE Metal, DPR 1. 스크린샷·입력 원본은 \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">evidence/2026-11-07/avatar (원본 저장소 파일)\u003c/span>에 보존했다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>결과·근거\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>기본 전신 구도\u003c/td>\n\u003ctd>1440×900 및 390×844에서 머리부터 발까지 하단 중앙 표시. \u003ccode>desktop-idle.png\u003c/code>, \u003ccode>mobile-idle.png\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>새 모델 이동\u003c/td>\n\u003ctd>Idle→Walking→Idle, 실제 이동 약 1.88m/s. 걷기 자세와 뒤쪽 방향 확인. \u003ccode>movement.txt\u003c/code>, \u003ccode>desktop-walk.png\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>키보드 카메라\u003c/td>\n\u003ctd>ArrowRight 약 0.5초에 yaw 0→-37.14°, 아바타 좌표 불변. 키 해제 후 yaw 불변. 왼쪽 키는 반대 회전. \u003ccode>keyboard.txt\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>동시 입력·해제\u003c/td>\n\u003ctd>W+ArrowRight로 이동·방향 전환·Walking 확인, R 복귀. 합성 blur 이벤트 후 회전 입력 초기화 확인. 실제 OS 포커스 전환 시험은 아님\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>상하 제한\u003c/td>\n\u003ctd>초기 -25° 및 -50° 확인 뒤, 최종 -15° 상한 재확인. 최종 화면에서 전신 유지. \u003ccode>lower-camera.txt\u003c/code>, \u003ccode>lower-camera.png\u003c/code>가 최종 상한 근거이며 \u003ccode>keyboard.txt\u003c/code>의 -25°는 변경 전 값\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>안내\u003c/td>\n\u003ctd>화살표키 안내를 야외·통로 패널에 반영. 초기 모델 교체 후 모바일 패널 열기 확인. 안내 패널을 열어도 탐색 입력은 활성 상태이며 일시정지 패널은 아님\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>검사\u003c/td>\n\u003ctd>최종 각도 변경 후 \u003ccode>pnpm check\u003c/code> exit 0. \u003ccode>check.log\u003c/code>. 콘솔 오류는 favicon 404\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>모바일 크기 확인은 데스크톱 뷰포트 시험이며 실기기 성능 판정이 아니다. 기존 통로 모서리 급전환·근접 전신 잘림은 이번 변경으로 해결됐다고 판단하지 않는다. NPC·안내문·다중 사용자는 후속 회차다.\u003c/p>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
