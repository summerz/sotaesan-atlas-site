:1120px;margin:auto;border-top:1px solid var(--line);padding:24px;font-size:14px;color:var(--muted)}.intro{max-width:750px;font-size:21px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:32px 0}.button{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);text-decoration:none;border-radius:4px;padding:11px 22px;font-weight:600}.button.secondary{background:transparent;color:var(--green)}.summary{border-left:4px solid var(--green);padding:4px 24px;margin:38px 0;font-size:19px}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.resource{border:1px solid var(--line);padding:22px}.resource h3{margin:0 0 10px}.resource p{font-size:16px;margin:0;color:var(--muted)}.local-file{color:var(--muted)}.meta{color:var(--muted);font-size:14px}.toc{border:1px solid var(--line);padding:16px 24px;margin:28px 0;font-size:15px}.toc>ul{margin:0}.toc li{margin:4px 0}li{margin:8px 0}.downloads{margin:0 0 30px}.measurements ul{padding-left:24px}@media(max-width:650px){body{font-size:16px}main{padding:30px 18px 50px}h1{font-size:29px}h2{font-size:23px}.intro{font-size:19px}.resources{grid-template-columns:1fr}header{padding:16px 18px}table{min-width:680px}.actions{gap:10px}.button{padding:9px 16px}}@media print{header,footer,.downloads{display:none}main{max-width:none;padding:0}body{font-size:11pt}h1{font-size:24pt}h2{font-size:18pt}table{font-size:9pt}.table-scroll{overflow:visible}a{color:inherit}}\n\n:focus-visible{outline:3px solid var(--green);outline-offset:5px}.trial-steps{padding-left:26px;max-width:780px}.trial-steps li{padding-left:8px;margin:18px 0}.trial-steps strong{display:block}.controls{display:grid;grid-template-columns:160px 1fr;gap:10px 24px;max-width:780px}.controls dt{font-weight:600}.controls dd{margin:0}.archive{margin-top:52px;border-top:1px solid var(--line);padding-top:24px}.archive>summary{cursor:pointer;font-size:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"RESULTS-01.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"1\">1회차: 내 아바타와 카메라\u003c/h1>\n\u003cul>\n\u003cli>작성일: 2026-11-07\u003c/li>\n\u003cli>상태: 조작 가능한 시제품. 기본 이동과 통로 정지·복귀 확인. \u003cstrong>모서리 급전환과 근접 전신 잘림이 남아 카메라 품질 합격은 아니다.\u003c/strong>\u003c/li>\n\u003cli>전체 순서와 결정: \u003ca href=\"PLAN.html\">계획\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"_1\">실행과 조작\u003c/h2>\n\u003cp>저장소 루트에서 \u003ccode>pnpm --filter @atlas/spike-playcanvas dev --host 127.0.0.1 --port 5174\u003c/code>로 실행한다. 현재 작업에서는 이 서버를 켜 두었다.\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"http://127.0.0.1:5174/?scene=content&amp;character=1\">야외 탐색\u003c/a>: WASD 또는 방향키 이동, 왼쪽 마우스 드래그로 둘러보기, R로 시작점 복귀.\u003c/li>\n\u003cli>\u003ca href=\"http://127.0.0.1:5174/?scene=content&amp;character=1&amp;cameraLab=1\">좁은 구간 시험\u003c/a>: W로 직진하면 카메라는 멈추고 인물만 통로 안으로 이동한다. S로 나오면 추적이 복구된다. 끝벽까지 간 뒤 D로 오른쪽 모서리를 돌면 근접 보완 동작과 현재 한계를 볼 수 있다.\u003c/li>\n\u003cli>화면 오른쪽 링크로 야외/통로를 오간다. 통로의 단색 벽과 바닥은 실제 장소가 아닌 임시 시험 형상이다.\u003c/li>\n\u003c/ul>\n\u003cp>기존 1인칭 모드는 \u003ccode>?scene=content\u003c/code>로 연다. 이번 시제품에는 교무님 NPC, 합장, 안내문, 접속자 동기화가 아직 없다.\u003c/p>\n\u003ch2 id=\"_2\">구현한 범위\u003c/h2>\n\u003cp>\u003cstrong>PlayCanvas 2.22.6 + Ammo, 현재 \u003ccode>sunnyvale-content\u003c/code>\u003c/strong>를 고정해 사용한다. 기존 동적 캡슐이 이동·바닥·벽 충돌을 처리하고, 전신 모델이 캡슐 발 위치를 따른다. 실제 이동량으로 대기/걷기를 전환하고 이동 방향으로 몸을 돌린다. 벽에 막혀 멈추면 걷기 애니메이션도 멈춘다. 외형은 높이 1.7m에 맞춘 CC0 RobotExpressive이며 \u003ca href=\"ASSET-LICENSE.html\">출처·라이선스·해시\u003c/a>를 별도로 보존했다. 최종 방문자나 교무님 외형을 정한 것은 아니다.\u003c/p>\n\u003cp>기본 카메라는 인물 뒤쪽 3.8m, 위에서 조금 내려다보는 시점이다. 카메라 방향을 기준으로 이동하며, 마우스를 놓은 뒤에는 새 회전 입력을 받지 않는다. 자동 연출·시대 전환·기존 안내 인물·핫스폿을 캐릭터 모드에서 제외했다. 환경음은 기존 것을 재사용한다.\u003c/p>\n\u003cp>카메라는 \u003ccode>follow → hold → close\u003c/code> 상태로 움직인다. \u003ccode>hold\u003c/code>는 위치를 유지하면서 인물을 바라보며, 기존 시점에서 인물이 가려지면 \u003ccode>close\u003c/code>로 거리를 줄인다. 시험 통로에는 정지 구역을 명시했다. \u003cstrong>모든 좁은 공간을 자동으로 찾아 적절한 고정 시점을 만드는 구현은 아니다.\u003c/strong> 장애물 판정에는 현재 로딩된 충돌 형상과 중앙·주변 5개 광선을 사용한다. 정지 구역을 벗어나 시야가 0.4초 동안 확보되면 추적으로 복귀한다. 사용자 드래그는 정지보다 우선한다.\u003c/p>\n\u003cp>구현: \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">캐릭터 (원본 저장소 파일)\u003c/span>, \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">카메라 (원본 저장소 파일)\u003c/span>, \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">앱 연결 (원본 저장소 파일)\u003c/span>, \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">입력 (원본 저장소 파일)\u003c/span>. 입력의 기본값은 기존 포인터 잠금이며 캐릭터 모드만 드래그를 선택한다.\u003c/p>\n\u003ch2 id=\"_3\">확인 결과\u003c/h2>\n\u003cp>별도 headed Chrome의 단일 탭에서 Playwright CLI로 키와 마우스를 조작했다. Apple M4 Pro / ANGLE Metal, 1440×900, DPR 1이다. 좌표는 월드 기준 미터이며 아래 수치는 반올림했다. 원본은 \u003ca href=\"evidence/2026-11-07/lab-final.json\">통로\u003c/a>, \u003ca href=\"evidence/2026-11-07/outdoor.json\">야외\u003c/a>, \u003ca href=\"evidence/2026-11-07/drag.json\">드래그\u003c/a>, \u003ca href=\"evidence/2026-11-07/first-person.json\">1인칭 회귀 확인\u003c/a>에 있다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>관찰\u003c/th>\n\u003cth>판정\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>야외 전신·대기·걷기\u003c/td>\n\u003ctd>머리부터 발까지 표시. W 이동 중 \u003ccode>Walking\u003c/code>, 실제 속도 표본 약 1.78m/s. D 이동 때 몸 방향 약 180°→90°\u003c/td>\n\u003ctd>시작점 주변 확인\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>통로 카메라 정지\u003c/td>\n\u003ctd>발 z가 -3.380→-4.170으로 이동하는 동안 카메라는 약 (0, 2.174, 1.296) 유지\u003c/td>\n\u003ctd>확인\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>벽 충돌\u003c/td>\n\u003ctd>D를 계속 눌러도 옆벽 앞 x≈0.700에서 정지. 끝벽 앞 z≈-6.650에서 정지\u003c/td>\n\u003ctd>시험 형상에서 확인\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>통로 이탈\u003c/td>\n\u003ctd>S로 빠져나온 발 위치 약 (0.701, 0.126, 0.217)에서 \u003ccode>follow\u003c/code> 복구\u003c/td>\n\u003ctd>확인\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>모서리 가림\u003c/td>\n\u003ctd>\u003ccode>hold\u003c/code>에서 \u003ccode>close\u003c/code>로 전환해 인물 쪽으로 당긴 뒤 \u003ccode>follow\u003c/code> 복구. 연속 100ms 표본 사이 카메라 z≈1.299→-5.718 급변\u003c/td>\n\u003ctd>\u003cstrong>부드러운 전환 실패\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>좁은 통로에서 드래그\u003c/td>\n\u003ctd>yaw 0°→72°, 포인터 잠금 없이 회전. 가까운 벽 때문에 카메라가 인물에 과도하게 접근하고 전신이 잘림\u003c/td>\n\u003ctd>입력 확인, \u003cstrong>화면 구성 실패\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>드래그 종료·리사이즈·복귀\u003c/td>\n\u003ctd>야외에서 버튼을 놓은 후 마우스만 움직여도 yaw/pitch 유지. 1200×800 변경 시 canvas도 같은 크기. R로 위치·시점 복귀\u003c/td>\n\u003ctd>확인\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>기존 1인칭\u003c/td>\n\u003ctd>캐릭터 HUD 없음. W 이동으로 카메라 z≈0→-1.256, R로 원위치\u003c/td>\n\u003ctd>이동·복귀 확인\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>화면: \u003ca href=\"evidence/2026-11-07/outdoor-idle.png\">야외 대기\u003c/a>, \u003ca href=\"evidence/2026-11-07/outdoor-walking.png\">걷기\u003c/a>, \u003ca href=\"evidence/2026-11-07/hold.png\">통로 정지\u003c/a>, \u003ca href=\"evidence/2026-11-07/wall.png\">옆벽 정지\u003c/a>, \u003ca href=\"evidence/2026-11-07/drag.png\">근접 시 전신 잘림\u003c/a>.\u003c/p>\n\u003cp>\u003ccode>pnpm check\u003c/code> 종료 코드 0. 기존 검사·테스트, 추가 카메라 테스트 5개, 전체 타입 검사, 두 앱 프로덕션 빌드와 배포 파일 검사를 통과했다. 추가 테스트는 정지/복귀, 가림, 주변 광선, 수동 회전, 초기화를 확인한다. \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">검사 로그 (원본 저장소 파일)\u003c/span>, \u003ca href=\"evidence/2026-11-07/verification.json\">소스·자산 해시와 빌드 식별자\u003c/a>를 남겼다. 브라우저 시험은 Vite 개발 서버에서 수행했으므로 프로덕션 빌드의 성능 검증으로 표현하지 않는다. 빌드의 큰 청크 경고는 남아 있다.\u003c/p>\n\u003cp>초기 포인터 잠금 시험은 \u003ccode>WrongDocumentError\u003c/code>로 회전하지 못했다. 기존에 기록된 시험 환경 문제와 같은 오류이며 원인을 새로 확정하지 않았다. 캐릭터 조작을 드래그로 바꾼 뒤 실제 마우스 드래그를 검증했다. 최종 페이지의 콘솔 오류는 \u003ccode>favicon.ico\u003c/code> 404만 관찰했다. 기존 1인칭 포인터 잠금의 정상 동작을 이번 회귀 확인으로 보증하지 않는다.\u003c/p>\n\u003ch2 id=\"_4\">남은 제한과 다음 작업\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>카메라 급전환·과도한 근접을 먼저 보완한다.\u003c/strong> 가림이 생긴 다음 급히 당기는 현재 방식 대신, 모서리 전에 정지를 풀고 이동할 경로를 확보하는 전환을 시험한다. 수동 회전으로 벽에 접근할 때도 허용 각도나 위치를 조절해 전신을 유지할 수 있는 범위를 확인한다. 현재 전신·벽 비투과·자유 회전을 동시에 보장하지 않는다.\u003c/li>\n\u003cli>5개 광선은 근사 검사다. 카메라 이동 경로 전체나 화면 가장자리 전체의 충돌을 보장하지 않는다. 촬영 스플랫과 충돌 메시의 차이도 남는다. 시험 통로 결과를 실제 장소의 모든 벽으로 일반화하지 않는다.\u003c/li>\n\u003cli>구역 스트리밍 기준은 여전히 인물 위치다. 멀리 멈춘 카메라에서 보이는 배경의 정밀도·충돌 준비가 모든 구역에서 충분한지는 확인하지 않았다. 아바타에는 발 IK·접지 그림자·경사 보정이 없고, 임시 모델의 걷기와 실제 속도가 정밀하게 맞지는 않는다.\u003c/li>\n\u003cli>이번에는 짧은 기능·시각 시험을 했다. 장시간 안정성, FPS 합격선, iPhone 실기기, 다중 사용자 성능은 판정하지 않았다. 기존 기술 비교 결과에 이번 숫자를 합치지 않는다.\u003c/li>\n\u003c/ol>\n\u003cp>다음 회차 전에 사용자에게 야외 아바타 크기·이동 속도·카메라 거리·드래그 조작감을 확인받고 위 카메라 실패 항목을 보완한다. 교무님 합장 이후 안내문, 마지막으로 소규모 접속자 동기화라는 순서는 유지한다.\u003c/p>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
