u003ccode>CharacterArmature|Idle_Neutral\u003c/code>, 걷기는 \u003ccode>CharacterArmature|Walk\u003c/code>, 달리기는 \u003ccode>CharacterArmature|Run\u003c/code>을 사용한다.\u003c/li>\n\u003cli>선택 이유: 로봇보다 방문자로 읽히는 일상복과 사람 비율, 기존 대기·걷기 클립, 후속 손동작 제작에 쓸 뼈대. 저작자 공개 조건과 출처를 위에 보존한다.\u003c/li>\n\u003cli>NPC 방향: 같은 제작자의 \u003ca href=\"https://quaternius.com/packs/ultimatemodularcharacters.html\">Ultimate Modular Men Pack\u003c/a>도 CC0로 공개되어 있다. 이번에 적용한 캐릭터는 방문자용이다. 교무님 복장·합장·안내문 전달은 포함되어 있지 않으며 별도 제작·검증이 필요하다. 손가락 뼈대가 있다는 이유로 해당 동작이 완성됐다고 판단하지 않는다.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"robotexpressive\">이전 시험: RobotExpressive\u003c/h2>\n\u003cp>이전 회차 재현용으로 남겨두며 현재 캐릭터 모드에서는 로드하지 않는다.\u003c/p>\n\u003cul>\n\u003cli>Model: Tomás Laulhé (Quaternius), modifications: Don McCurdy.\u003c/li>\n\u003cli>License: CC0 1.0 — https://creativecommons.org/publicdomain/zero/1.0/\u003c/li>\n\u003cli>Source and license: https://github.com/mrdoob/three.js/tree/r180/examples/models/gltf/RobotExpressive\u003c/li>\n\u003cli>Download: https://raw.githubusercontent.com/mrdoob/three.js/r180/examples/models/gltf/RobotExpressive/RobotExpressive.glb\u003c/li>\n\u003cli>Retrieved: 2026-11-07. Original file, no modifications. Scale and placement adjusted at runtime.\u003c/li>\n\u003cli>Size: 463988 bytes.\u003c/li>\n\u003cli>SHA-256: \u003ccode>047f5e5fb3bb6d378bd1df16ca6137f2a596c99b3a1b5690b4020c05aaf6f319\u003c/code>\u003c/li>\n\u003c/ul>\n\u003cp>Temporary visitor avatar for the character spike. This is not a depiction of a Won Buddhist minister or a final character design.\u003c/p>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
