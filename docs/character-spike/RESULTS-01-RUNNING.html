-width:1120px;margin:auto;border-top:1px solid var(--line);padding:24px;font-size:14px;color:var(--muted)}.intro{max-width:750px;font-size:21px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:32px 0}.button{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);text-decoration:none;border-radius:4px;padding:11px 22px;font-weight:600}.button.secondary{background:transparent;color:var(--green)}.summary{border-left:4px solid var(--green);padding:4px 24px;margin:38px 0;font-size:19px}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.resource{border:1px solid var(--line);padding:22px}.resource h3{margin:0 0 10px}.resource p{font-size:16px;margin:0;color:var(--muted)}.local-file{color:var(--muted)}.meta{color:var(--muted);font-size:14px}.toc{border:1px solid var(--line);padding:16px 24px;margin:28px 0;font-size:15px}.toc>ul{margin:0}.toc li{margin:4px 0}li{margin:8px 0}.downloads{margin:0 0 30px}.measurements ul{padding-left:24px}@media(max-width:650px){body{font-size:16px}main{padding:30px 18px 50px}h1{font-size:29px}h2{font-size:23px}.intro{font-size:19px}.resources{grid-template-columns:1fr}header{padding:16px 18px}table{min-width:680px}.actions{gap:10px}.button{padding:9px 16px}}@media print{header,footer,.downloads{display:none}main{max-width:none;padding:0}body{font-size:11pt}h1{font-size:24pt}h2{font-size:18pt}table{font-size:9pt}.table-scroll{overflow:visible}a{color:inherit}}\n\n.button{font:inherit;cursor:pointer}.button:disabled{opacity:.5;cursor:not-allowed}:focus-visible{outline:3px solid var(--green);outline-offset:5px}.trial-steps{padding-left:26px;max-width:780px}.trial-steps li{padding-left:8px;margin:18px 0}.trial-steps strong{display:block}.controls{display:grid;grid-template-columns:160px 1fr;gap:10px 24px;max-width:780px}.controls dt{font-weight:600}.controls dd{margin:0}.archive{margin-top:52px;border-top:1px solid var(--line);padding-top:24px}.archive>summary{cursor:pointer;font-size:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"RESULTS-01-RUNNING.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"1\">1회차 보완: 달리기와 축척 확인\u003c/h1>\n\u003cul>\n\u003cli>날짜: 2026-11-07\u003c/li>\n\u003cli>범위: PlayCanvas + Ammo, \u003ccode>?scene=content&amp;character=1\u003c/code>. 기존 카메라 구도·장면·인물 크기 유지.\u003c/li>\n\u003cli>요청: 달리기 제안 적용, 맵에 비해 인물이 작게 보이는 이유와 축척 확인.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"_1\">적용\u003c/h2>\n\u003cul>\n\u003cli>PC: WASD 걷기, 왼쪽·오른쪽 Shift를 누른 채 이동하면 달리기. Shift 해제 시 걷기로 복귀한다. 화살표키는 기존대로 카메라 회전이다.\u003c/li>\n\u003cli>터치: 왼쪽 이동 터치를 시작점에서 85 CSS px 이상 밀면 달리고, 65 px 미만으로 되돌리면 걷는다. 경계에서 모드가 반복되는 것을 막기 위해 진입·해제 거리를 다르게 했다. 오른쪽은 둘러보기이며 추가 버튼은 없다.\u003c/li>\n\u003cli>속도: 걷기 설정 2 단위/초, 달리기 3.4 단위/초(1.7배). 대각선 입력 정규화와 기존 충돌·스트리밍 진입 검사를 그대로 거친다. 기존 비교 모드에는 달리기를 켜지 않는다.\u003c/li>\n\u003cli>모델의 \u003ccode>CharacterArmature|Run\u003c/code> 클립을 연결했다. 실제 수평 이동 속도에 따라 대기·걷기·달리기를 0.18초로 전환하며, 벽에 막혀 이동하지 않으면 달리기를 멈춘다. 달리기 중 카메라 거리·시야각을 확대하지 않는다.\u003c/li>\n\u003c/ul>\n\u003cp>구현: \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">입력 (원본 저장소 파일)\u003c/span>, \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">이동 속도 (원본 저장소 파일)\u003c/span>, \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">애니메이션·안내 (원본 저장소 파일)\u003c/span>.\u003c/p>\n\u003ch2 id=\"_2\">확인 결과\u003c/h2>\n\u003cp>별도 headed Chromium, 시험 탭 1개, Apple M4 Pro / ANGLE Metal, DPR 1. 개발 서버 5174의 기능 확인이며 아래 속도는 각 시점의 앱 진단 표본이다. 성능 비교나 장시간 안정성 판정이 아니다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>시험\u003c/th>\n\u003cth>관찰\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1440×900, W → Shift+W → W → 해제\u003c/td>\n\u003ctd>Walking 1.95 → Running 3.40 → Walking 1.84 → Idle, 거의 0 단위/초\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>오른쪽 Shift만 누름\u003c/td>\n\u003ctd>Idle, 이동하지 않음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>오른쪽 Shift+W, 시험 통로 끝까지 약 4초\u003c/td>\n\u003ctd>Running에서 벽 앞 z≈−6.65에 정지, 입력을 유지해도 Idle·속도≈0. 카메라 hold 유지\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>달리는 중 합성 blur\u003c/td>\n\u003ctd>입력 초기화 후 Idle·속도 0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>390×844, 왼쪽 합성 터치 거리 50 → 90 → 75 → 60 px → 해제\u003c/td>\n\u003ctd>Walking → Running → Running → Walking → Idle. 속도 약 1.80 → 3.31 → 3.40 → 1.89 → 0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>안내 패널\u003c/td>\n\u003ctd>390×844·844×390에서 페이지 크기가 viewport를 넘지 않음. 가로 화면의 긴 안내는 패널 내부 스크롤. 닫으면 안내·조작 버튼 하나만 남음\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>스크린샷에서 전신 달리기와 모바일 안내 줄바꿈을 확인했다. 모바일 입력은 데스크톱 Chromium의 합성 TouchEvent이며 iPhone 실기기·손가락 사용성 확인을 대신하지 않는다. 콘솔 오류는 favicon 404뿐이었다. \u003ccode>pnpm check\u003c/code>의 기존 시험·타입 검사·두 앱 빌드·자산 검증 통과. 번들 크기 경고는 남아 있다.\u003c/p>\n\u003cp>원본: \u003ca href=\"evidence/2026-11-07/running/desktop.txt\">데스크톱 입력\u003c/a>, \u003ca href=\"evidence/2026-11-07/running/mobile.txt\">터치 입력\u003c/a>, \u003ca href=\"evidence/2026-11-07/running/wall.txt\">벽·blur\u003c/a>, \u003ca href=\"evidence/2026-11-07/running/landscape.txt\">가로 패널\u003c/a>, \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">검사 로그 (원본 저장소 파일)\u003c/span>, \u003ca href=\"evidence/2026-11-07/running/provenance.json\">소스 식별\u003c/a>.\u003c/p>\n\u003cp>화면: \u003ca href=\"evidence/2026-11-07/running/desktop-run.png\">달리기\u003c/a>, \u003ca href=\"evidence/2026-11-07/running/mobile-panel.png\">모바일 안내\u003c/a>, \u003ca href=\"evidence/2026-11-07/running/landscape-panel.png\">가로 안내\u003c/a>, \u003ca href=\"evidence/2026-11-07/running/wall.png\">벽 앞 정지\u003c/a>.\u003c/p>\n\u003cp>기존 모퉁이 카메라 급전환·벽 근처 전신 잘림은 이번 변경으로 해결한 것이 아니다. 이번 달리기 시험은 직선 통로의 정지까지 확인했다.\u003c/p>\n\u003ch2 id=\"_3\">인물과 맵 크기: 실제 비율까지 맞춘 상태는 아님\u003c/h2>\n\u003cp>인물은 초기 메시 경계 높이를 월드의 \u003ccode>capsuleHeight: 1.7\u003c/code>에 맞춰 정규화한다. \u003ccode>sunnyvale-content.json\u003c/code>은 미터 단위를 선언하고 장면·충돌 메시의 배율을 \u003ccode>[1,1,1]\u003c/code>로 사용한다. 그러나 미터 선언은 실측 검증의 근거가 아니다. \u003ca href=\"../implementation/SECOND-SCENE.html\">SECOND-SCENE.md\u003c/a>는 원본 예제의 단위를 따랐으며 \u003cstrong>실측 축척을 검증하지 않았다\u003c/strong>고 명시한다. 현재 인물을 실제 장소와 정확한 1.7m 비율로 맞췄다고 말할 수 없다.\u003c/p>\n\u003cp>화면에서도 인물이 작게 느껴질 수 있다. 현재 카메라 거리 3.8 단위·수직 시야각 70°이며, 데스크톱 달리기 화면에서 전신이 화면 높이의 약 30%를 차지한다. 넓은 시야가 이 인상에 기여할 수 있다는 해석이며, 이것만으로 맵이 실제보다 몇 배 크다고 판단하지 않는다.\u003c/p>\n\u003cp>이번에는 인물·충돌체·맵 크기를 변경하지 않았다. 다음 크기 조정은 두 목적을 구분한다. 화면에서 인물을 더 크게 보고 싶다면 카메라 거리를 먼저 조정한다. 실제 장소 대비 비율을 맞추려면 치수를 아는 물체나 현장 실측을 기준으로 스플랫·충돌체·이동 단위의 관계를 함께 검증한다. 인물 메시만 키워 이를 실측 보정이라고 표현하지 않는다.\u003c/p>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
