{margin-top:52px;border-top:1px solid var(--line);padding-top:24px}.archive>summary{cursor:pointer;font-size:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"RESULTS-01-LAYOUT.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"1\">1회차 보완: 아바타 구도와 단일 안내 패널\u003c/h1>\n\u003cul>\n\u003cli>작성일: 2026-11-07\u003c/li>\n\u003cli>대상: PlayCanvas \u003ccode>?scene=content&amp;character=1\u003c/code>, 통로 시험 \u003ccode>&amp;cameraLab=1\u003c/code>\u003c/li>\n\u003cli>앞선 결과: \u003ca href=\"RESULTS-01.html\">1회차\u003c/a>. 이번 변경 후 결과는 별도 보존하며 이전 측정에 합치지 않는다.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"_1\">반영한 요청\u003c/h2>\n\u003cp>아바타를 화면 하단 중앙으로 내리고, 주변 공간이 위쪽에 더 보이도록 시선 목표를 몸 중심보다 높였다. 카메라 거리 3.8m는 유지했다. 기본 궤도 pitch는 -15°에서 -28°로 바꾸고, 입력 범위는 -55°~+10°에서 \u003cstrong>-50°~-20°\u003c/strong>로 제한했다. 이 값은 아바타 주위 카메라 위치의 궤도 각도이며, 구도를 위한 시선 오프셋이 있어 실제 광축 각도와 같지 않다. 가까운 장애물 앞에서는 오프셋도 거리에 맞춰 줄인다.\u003c/p>\n\u003cp>이번 캐릭터 모드의 안내·상태·시작점·음소거·통로 링크를 한 패널로 모았다. PC와 모바일 모두 \u003cstrong>닫힌 상태로 시작\u003c/strong>하고, 기존 패널의 저장된 펼침 설정을 따르지 않는다. 닫으면 ‘안내·조작’ 버튼 하나만 남는다. 열면 닫기 버튼은 상단에 유지하고 내용만 내부 스크롤한다. Esc는 패널 내부 포커스에서 닫고 토글 버튼으로 포커스를 돌린다. 초기 로딩 오류는 재시도 버튼을 볼 수 있도록 패널을 연다.\u003c/p>\n\u003cp>패널에는 임시 아바타·대역 장면 안내, 현재 카메라 상태, 키보드·마우스·터치 조작, 야외/통로 이동, 시작점과 음소거만 표시한다. 엔진·장면 선택, 시대 전환, 벤치마크·충돌 진단 등은 이번 시험 화면에서 제외했다. 기존 1인칭 URL의 패널은 유지한다.\u003c/p>\n\u003ch2 id=\"_2\">확인 결과\u003c/h2>\n\u003cp>별도 headed Playwright CLI, 단일 탭, Vite 개발 서버, Apple M4 Pro / ANGLE Metal, DPR 1에서 확인했다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>확인\u003c/th>\n\u003cth>결과\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1440×900 기본 구도\u003c/td>\n\u003ctd>머리부터 발까지 하단 중앙에 표시. \u003ca href=\"evidence/2026-11-07/layout/desktop.png\">화면\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>상하 마우스 드래그·R\u003c/td>\n\u003ctd>pitch -20° 및 -50°에서 제한, 반복 입력에도 유지. R로 -28° 복귀. \u003ca href=\"evidence/2026-11-07/layout/camera.json\">상태 원본\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>390×844 새로고침\u003c/td>\n\u003ctd>기존 저장값을 펼침으로 넣어도 닫혀 시작. 표시 버튼은 ‘안내·조작’ 한 개. \u003ca href=\"evidence/2026-11-07/layout/mobile-closed.png\">닫힘\u003c/a>, \u003ca href=\"evidence/2026-11-07/layout/mobile-open.png\">열림\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>390×844·320×568·844×390\u003c/td>\n\u003ctd>열린 패널이 화면 경계 안에 있고 문서 가로 넘침 없음. 가로 화면의 본문은 가용 높이 300px / 내용 310px로 내부 스크롤. \u003ca href=\"evidence/2026-11-07/layout/responsive.json\">원본\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>통로의 더 긴 안내\u003c/td>\n\u003ctd>844×390에서도 경계 안, 본문 300px / 내용 328px. \u003ca href=\"evidence/2026-11-07/layout/lab-landscape.png\">화면\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>조작 버튼\u003c/td>\n\u003ctd>음소거 후 ‘소리 켜기’로 표시 전환, 시작점 버튼으로 기본 구도 복귀, Esc 닫기 후 토글 포커스 복귀\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>기존 1인칭 URL\u003c/td>\n\u003ctd>기존 제목·장면 선택·패널이 남고 캐릭터 전용 클래스 없음. \u003ca href=\"evidence/2026-11-07/layout/first-person.json\">원본\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>전체 검사\u003c/td>\n\u003ctd>\u003ccode>pnpm check\u003c/code> exit 0. \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">로그 (원본 저장소 파일)\u003c/span>, \u003ca href=\"evidence/2026-11-07/layout/verification.json\">소스 해시·환경\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>모바일 크기 레이아웃 확인이며 iPhone 실기기·실제 손가락 사용성·성능 시험은 아니다. 음소거는 버튼 및 연결 상태 확인이며 청감 평가를 하지 않았다. 콘솔 오류는 favicon 404다. 기존 모서리 급전환·장애물 근접 시 전신 잘림은 이번 구도·패널 수정으로 해결했다고 판정하지 않는다.\u003c/p>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
