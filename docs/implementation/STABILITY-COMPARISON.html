th:1120px;margin:auto;border-top:1px solid var(--line);padding:24px;font-size:14px;color:var(--muted)}.intro{max-width:750px;font-size:21px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:32px 0}.button{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);text-decoration:none;border-radius:4px;padding:11px 22px;font-weight:600}.button.secondary{background:transparent;color:var(--green)}.summary{border-left:4px solid var(--green);padding:4px 24px;margin:38px 0;font-size:19px}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.resource{border:1px solid var(--line);padding:22px}.resource h3{margin:0 0 10px}.resource p{font-size:16px;margin:0;color:var(--muted)}.local-file{color:var(--muted)}.meta{color:var(--muted);font-size:14px}.toc{border:1px solid var(--line);padding:16px 24px;margin:28px 0;font-size:15px}.toc>ul{margin:0}.toc li{margin:4px 0}li{margin:8px 0}.downloads{margin:0 0 30px}.measurements ul{padding-left:24px}@media(max-width:650px){body{font-size:16px}main{padding:30px 18px 50px}h1{font-size:29px}h2{font-size:23px}.intro{font-size:19px}.resources{grid-template-columns:1fr}header{padding:16px 18px}table{min-width:680px}.actions{gap:10px}.button{padding:9px 16px}}@media print{header,footer,.downloads{display:none}main{max-width:none;padding:0}body{font-size:11pt}h1{font-size:24pt}h2{font-size:18pt}table{font-size:9pt}.table-scroll{overflow:visible}a{color:inherit}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/index.html\">직접 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">상세 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"STABILITY-COMPARISON.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"10\">10분 반복 조작 안정성 비교\u003c/h1>\n\u003ch2 id=\"_1\">결과\u003c/h2>\n\u003cp>2026-10-02 별도 headed Chromium에서 Three.js BVH·Rapier와 PlayCanvas Ammo를 한 앱씩 시험했다. 구현별 약 10분의 측정 구간 동안 WASD 이동, 설명 패널, 현재/과거 전환, 충돌 면 표시를 반복했다. \u003cstrong>세 구현 모두 이 시나리오에서 앱 예외나 WebGL context loss가 관찰되지 않았다.\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>구현\u003c/th>\n\u003cth style=\"text-align: right;\">측정 시간\u003c/th>\n\u003cth style=\"text-align: right;\">프레임 간격 p95\u003c/th>\n\u003cth style=\"text-align: right;\">p99\u003c/th>\n\u003cth style=\"text-align: right;\">최댓값\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Three.js BVH\u003c/td>\n\u003ctd style=\"text-align: right;\">599.94초\u003c/td>\n\u003ctd style=\"text-align: right;\">17.4 ms\u003c/td>\n\u003ctd style=\"text-align: right;\">17.6 ms\u003c/td>\n\u003ctd style=\"text-align: right;\">50.2 ms\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Three.js Rapier\u003c/td>\n\u003ctd style=\"text-align: right;\">599.90초\u003c/td>\n\u003ctd style=\"text-align: right;\">17.4 ms\u003c/td>\n\u003ctd style=\"text-align: right;\">17.6 ms\u003c/td>\n\u003ctd style=\"text-align: right;\">17.8 ms\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PlayCanvas Ammo\u003c/td>\n\u003ctd style=\"text-align: right;\">599.93초\u003c/td>\n\u003ctd style=\"text-align: right;\">17.4 ms\u003c/td>\n\u003ctd style=\"text-align: right;\">17.7 ms\u003c/td>\n\u003ctd style=\"text-align: right;\">33.7 ms\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>p95·p99는 각 구현의 20개 측정 구간에서 얻은 전체 rAF 간격을 합쳐 계산했다. 모두 약 60 FPS 부근이며 이 시험만으로 처리 여력이나 최종 엔진의 우열을 정할 수 없다. 최댓값은 단일 프레임의 관찰값이며 반복 측정에 의한 대표값이 아니다.\u003c/p>\n\u003ch2 id=\"_2\">조건과 실제 조작\u003c/h2>\n\u003cul>\n\u003cli>릴리스: \u003ccode>local-4d5905679d2e-6df18be3ac38\u003c/code>. 앞선 로딩·짧은 전환 시험의 릴리스와 구분한다.\u003c/li>\n\u003cli>Playwright MCP, Chromium 154, Apple M4 Pro. WebGL renderer는 \u003ccode>ANGLE (Apple, ANGLE Metal Renderer: Apple M4 Pro, Unspecified Version)\u003c/code>.\u003c/li>\n\u003cli>viewport 1200×863 CSS px, 기기 DPR 2, 앱 렌더링 DPR 1.5. 한 앱·한 탭이며 측정 중 숨김/포커스 상실 프레임은 0이었다.\u003c/li>\n\u003cli>Knock Hall: 현재 SOG 900,000개, 과거 SOG 701,370개, 충돌 메시 24삼각형. Sunnyvale의 337,680삼각형 충돌 시험과 합산하지 않는다.\u003c/li>\n\u003cli>구현마다 30초 측정 구간 20회. 각 구간에서 시작점 복귀, 설명 패널 열기/닫기, W·D·S·A 각각 2.5초 유지, 현재→과거→현재 전환을 수행했다. 5회마다 충돌 면 표시/복귀도 확인했다.\u003c/li>\n\u003cli>구현마다 이동 입력 80회(총 200초), 패널 왕복 20회, 시대 전환 40회, 충돌 면 표시 왕복 4회. 위치 JSON으로 이동 전후 좌표와 전환 후 상태를 기록했다.\u003c/li>\n\u003cli>GC와 페이지/worker 메모리 조회는 프레임 측정 구간 밖에서 수행했다. 시작과 4·8·12·16·20회 후 표본을 남겼다.\u003c/li>\n\u003cli>BVH→Rapier→Ammo 순서로 각 1회 실행했다. 캐시를 초기화하지 않았으므로 cold 로딩 비교가 아니다.\u003c/li>\n\u003c/ul>\n\u003cp>전체 경과 시간은 BVH 622.62초, Rapier 622.82초, Ammo 699.21초다. 조작·GC·도구 호출 간 간격이 포함되며 Ammo에는 도구 호출 사이의 추가 대기가 있었다. 위 프레임 통계는 실제 측정한 약 600초만 사용했다. 전체 경과 시간으로 엔진 속도를 비교하지 않는다.\u003c/p>\n\u003ch2 id=\"_3\">오류와 메모리\u003c/h2>\n\u003cp>세 구현의 \u003ccode>error\u003c/code>·\u003ccode>unhandledrejection\u003c/code>·앱 진단 오류·\u003ccode>webglcontextlost\u003c/code>·\u003ccode>webglcontextrestored\u003c/code> 기록은 비어 있었다. PlayCanvas 최초 로드의 콘솔에는 \u003ccode>favicon.ico\u003c/code> 404가 있었다. 앱 실패와 구분하며 콘솔 오류가 전혀 없었다고 표현하지 않는다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>구현\u003c/th>\n\u003cth style=\"text-align: right;\">메인 JS heap: 시작 → 마지막\u003c/th>\n\u003cth style=\"text-align: right;\">메인 backing storage: 시작 → 마지막\u003c/th>\n\u003cth style=\"text-align: right;\">조회한 worker 수\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Three.js BVH\u003c/td>\n\u003ctd style=\"text-align: right;\">8.28 → 9.82 MiB\u003c/td>\n\u003ctd style=\"text-align: right;\">24.2045 → 24.2049 MiB\u003c/td>\n\u003ctd style=\"text-align: right;\">3 → 3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Three.js Rapier\u003c/td>\n\u003ctd style=\"text-align: right;\">12.78 → 10.47 MiB\u003c/td>\n\u003ctd style=\"text-align: right;\">28.3405 → 28.3407 MiB\u003c/td>\n\u003ctd style=\"text-align: right;\">3 → 3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PlayCanvas Ammo\u003c/td>\n\u003ctd style=\"text-align: right;\">9.21 → 11.41 MiB\u003c/td>\n\u003ctd style=\"text-align: right;\">17.1422 → 17.1809 MiB\u003c/td>\n\u003ctd style=\"text-align: right;\">1 → 1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>값은 GC 이후 CDP \u003ccode>Runtime.getHeapUsage\u003c/code>다. Rapier heap은 4회 후 13.80 MiB에서 8회 후 10.08 MiB로 낮아졌고 이후 소폭 증가했다. 내려간 원인은 확정하지 않았다. Three.js worker heap은 개별 약 0.44–0.53 MiB 범위였다. Ammo의 worker는 약 0.29 MiB와 backing storage 18.17 MiB를 유지했지만 처음과 마지막 worker URL은 달랐다. 같은 worker 인스턴스가 계속 유지됐다는 뜻은 아니다.\u003c/p>\n\u003cp>메인 backing storage는 큰 증가가 없었으나 BVH·Ammo의 JS heap은 늘었다. 앱의 누적 \u003ccode>frameMs\u003c/code> 배열과 측정 기록도 실행 중 쌓인다. 이 영향과 자산 캐시·기타 객체를 분리하지 않았으므로 증가분을 모두 누수 또는 모두 정상이라고 단정하지 않는다. 공유 버퍼의 중복 계측 가능성이 있어 페이지와 worker의 backing storage를 합쳐 물리 RAM으로 표시하지 않는다. GPU/VRAM은 측정하지 않았다.\u003c/p>\n\u003ch2 id=\"_4\">아직 확인하지 않은 범위\u003c/h2>\n\u003cp>이 결과는 단순 충돌 장면에서 반복 조작을 유지한 시험이다. Sunnyvale의 계단·벤치·급경사·낙하/복귀, 앱을 백그라운드로 보냈다가 돌아오는 동작, 모바일 장시간 유지, 실제 과거 건물 자산은 별도 확인이 필요하다. 한 실행에서 context loss가 발생하지 않았다는 결과가 context loss 후 복구를 검증한 것은 아니다.\u003c/p>\n\u003cp>데스크톱에서 로딩·보행 비용·반복 조작 자료는 확보했다. 후속 \u003ca href=\"MOBILE-COMPARISON.html\">iPhone 11 Safari 비교\u003c/a>에서 정지·합성 터치 이동의 프레임 간격과 처리 시간을 측정했다. 실제 손가락 조작·화면 회전과 모바일 10분 유지 시험은 남아 있다. Android 결과가 없으므로 iPhone 결과를 전체 모바일에 일반화하지 않는다.\u003c/p>\n\u003ch2 id=\"_5\">근거와 재실행\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"measurements/2026-10-02/stability-browser.json\">전체 원본과 요약\u003c/a>: 각 구간의 프레임 간격, 위치 JSON, 실제 조작, 오류, GC 전후 메모리.\u003c/li>\n\u003cli>\u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">MCP 콜백 (원본 저장소 파일)\u003c/span>: \u003ccode>prepare(page)\u003c/code> 후 \u003ccode>chunk(page, {cycle, durationMs: 30000})\u003c/code>를 20회 호출한다. 단독 CLI 실행기가 아니다.\u003c/li>\n\u003cli>종료 화면: \u003ca href=\"measurements/2026-10-02/three-bvh-final.png\">BVH\u003c/a>, \u003ca href=\"measurements/2026-10-02/three-rapier-final.png\">Rapier\u003c/a>, \u003ca href=\"measurements/2026-10-02/playcanvas-ammo-final.png\">Ammo\u003c/a>.\u003c/li>\n\u003cli>함께 읽을 자료: \u003ca href=\"PHYSICS-COST-COMPARISON.html\">보행 처리 비용\u003c/a>, \u003ca href=\"LOADING-MEMORY-COMPARISON.html\">초기 로딩·전환·메모리\u003c/a>.\u003c/li>\n\u003c/ul>\n\u003cp>\u003ccode>./dev.sh --preview both\u003c/code>로 서버를 준비하고 별도 headed 브라우저에서 \u003ccode>http://127.0.0.1:5173/?controller=bvh\u003c/code>, \u003ccode>http://127.0.0.1:5173/?controller=rapier\u003c/code>, \u003ccode>http://127.0.0.1:5174/\u003c/code>를 한 번에 하나씩 연다. 준비 표시·릴리스·GPU·탭 수·가시성을 확인하고 실행한다. 테스트 브라우저는 종료했다. 사용자 개발 서버는 유지했다.\u003c/p>\u003c/main>\u003cfooter>테스트 기간 2026-10-02~04 · 기존 측정 기록을 정리한 자료입니다. 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
