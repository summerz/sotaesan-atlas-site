<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>보행 물리 처리 비용 비교 · Sotaesan Atlas</title><style>body{background:#f6f4ec;color:#173c33;font-family:system-ui,sans-serif}</style></head><body><noscript>자료를 보려면 브라우저에서 JavaScript를 허용해 주세요.</noscript><script type="application/json" id="site-page">"\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>보행 물리 처리 비용 비교 · Sotaesan Atlas\u003c/title>\u003cstyle>\n:root{color-scheme:light;--paper:#f6f4ec;--ink:#173c33;--green:#137466;--muted:#546960;--line:#cdd6cd}\n*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:\"Apple SD Gothic Neo\",\"Noto Sans KR\",system-ui,sans-serif;font-size:17px;line-height:1.75}\na{color:var(--green);text-underline-offset:4px}header{border-bottom:1px solid var(--line);padding:20px max(24px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}header>a{font-weight:700;text-decoration:none}nav{display:flex;gap:20px;font-size:15px;flex-wrap:wrap}main{max-width:1120px;margin:auto;padding:44px 24px 70px}h1,h2,h3{line-height:1.45;word-break:keep-all;letter-spacing:-.025em}h1{font-size:36px;margin:0 0 28px}h2{font-size:26px;margin:44px 0 20px;border-top:1px solid var(--line);padding-top:28px}h3{font-size:21px;margin-top:28px}p{word-break:keep-all}table{border-collapse:collapse;width:100%;font-size:15px;margin:22px 0}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{border-bottom:2px solid var(--ink);background:#e9eee5}pre{overflow:auto;background:#e9eee5;padding:20px;font-size:14px;line-height:1.6}code{font-size:.9em;overflow-wrap:anywhere}img{max-width:100%;height:auto}.table-scroll{overflow-x:auto}footer{max-width:1120px;margin:auto;border-top:1px solid var(--line);padding:24px;font-size:14px;color:var(--muted)}.intro{max-width:750px;font-size:21px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:32px 0}.button{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);text-decoration:none;border-radius:4px;padding:11px 22px;font-weight:600}.button.secondary{background:transparent;color:var(--green)}.summary{border-left:4px solid var(--green);padding:4px 24px;margin:38px 0;font-size:19px}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.resource{border:1px solid var(--line);padding:22px}.resource h3{margin:0 0 10px}.resource p{font-size:16px;margin:0;color:var(--muted)}.local-file{color:var(--muted)}.meta{color:var(--muted);font-size:14px}.toc{border:1px solid var(--line);padding:16px 24px;margin:28px 0;font-size:15px}.toc>ul{margin:0}.toc li{margin:4px 0}li{margin:8px 0}.downloads{margin:0 0 30px}.measurements ul{padding-left:24px}@media(max-width:650px){body{font-size:16px}main{padding:30px 18px 50px}h1{font-size:29px}h2{font-size:23px}.intro{font-size:19px}.resources{grid-template-columns:1fr}header{padding:16px 18px}table{min-width:680px}.actions{gap:10px}.button{padding:9px 16px}}@media print{header,footer,.downloads{display:none}main{max-width:none;padding:0}body{font-size:11pt}h1{font-size:24pt}h2{font-size:18pt}table{font-size:9pt}.table-scroll{overflow:visible}a{color:inherit}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/index.html\">직접 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">상세 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"PHYSICS-COST-COMPARISON.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"_1\">보행 물리 처리 비용 비교\u003c/h1>\n\u003ch2 id=\"_2\">현재 결론\u003c/h2>\n\u003cp>2026-10-02 사용자 확인에서는 이동감의 큰 차이가 없었다. 이제 보행 계산 시간, 초기화, 다운로드, 메모리와 유지보수 부담을 중심으로 비교한다.\u003c/p>\n\u003cp>Playwright MCP의 별도 headed 브라우저에서 Three.js BVH·Rapier와 PlayCanvas Ammo를 직접 측정했다. 시작점 정지와 외벽 밀기를 각각 30초씩 3회, 총 18회 완료했다. 각 조건의 반복 중앙값 기준으로 기록된 물리 계산 p95는 0.1–0.6ms였다. 이는 모든 호출이 1ms 미만이라는 뜻은 아니며, 최대값은 원본에 별도로 남겼다.\u003c/p>\n\u003cp>현재 데스크톱·장면에서 평균 보행 계산 비용은 작다. 다만 PlayCanvas와 Three.js의 통계 범위와 실제 벽 접촉 위치가 달라 물리 엔진 자체의 성능 순위는 확정하지 않는다. 전체 프레임 성능에는 차이가 있었다. 이후 초기 로딩 18회·시대 전환 120회와 메모리 관찰을 완료했으며 \u003ca href=\"LOADING-MEMORY-COMPARISON.html\">로딩·메모리 비교\u003c/a>에 기록했다. \u003ca href=\"MOBILE-COMPARISON.html\">iPhone 비교\u003c/a>에서는 정지 상태를 측정했지만 이동 경로가 충돌 바닥 밖으로 나가 정상 보행 순위를 정하지 않았다. 모바일의 남은 검증과 보행 정책의 유지보수 부담까지 확인한 뒤 최종 엔진을 선택한다.\u003c/p>\n\u003ch2 id=\"node\">Node 자동 측정 조건\u003c/h2>\n\u003cul>\n\u003cli>Apple M4 Pro, Darwin 25.6.0, Node v24.12.0.\u003c/li>\n\u003cli>실제 Sunnyvale 충돌 메시 337,680삼각형, 동일 원본·월드 변환·캡슐 설정.\u003c/li>\n\u003cli>앱의 \u003ccode>CapsuleWalker.step\u003c/code> / \u003ccode>RapierWalker.step\u003c/code>을 실행한다. Rapier WASM과 물리 월드 처리도 포함한다.\u003c/li>\n\u003cli>시작점 정지, 벤치 정지, 외벽 밀기, 계단 앞뒤 이동의 네 경우. 60Hz와 20Hz에서 각각 5회, 실행당 4초 측정. 준비·착지 시간은 제외한다.\u003c/li>\n\u003cli>두 컨트롤러의 측정 순서를 교대한다. 입력은 같지만 접촉 결과와 실제 이동 경로까지 같지는 않다.\u003c/li>\n\u003cli>렌더링, GPU, 네트워크, 브라우저, 모바일과 메모리는 측정하지 않는다. 짧은 Node 측정이므로 실제 브라우저 FPS나 배터리 소모를 예측하는 값으로 사용하지 않는다.\u003c/li>\n\u003c/ul>\n\u003cp>원본에는 실행 환경, 설정, 구현 파일·월드·충돌 메시의 SHA-256, 실행 전후 좌표와 전체 80회 결과를 보관했다: \u003ca href=\"measurements/2026-10-02/physics-node.json\">physics-node.json\u003c/a>.\u003c/p>\n\u003ch2 id=\"node_1\">Node 보행 계산 시간\u003c/h2>\n\u003cp>각 행은 5회 실행의 \u003cstrong>평균값 중앙값 / p95 중앙값\u003c/strong>, 단위는 호출당 ms이다. p95는 해당 실행에서 호출의 95%가 이 시간 이내였다는 뜻이다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>60Hz 조건\u003c/th>\n\u003cth style=\"text-align: right;\">기존 BVH 평균 / p95\u003c/th>\n\u003cth style=\"text-align: right;\">Rapier 평균 / p95\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>시작점 정지\u003c/td>\n\u003ctd style=\"text-align: right;\">0.0068 / 0.0072\u003c/td>\n\u003ctd style=\"text-align: right;\">0.0328 / 0.0393\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>벤치 부근 정지\u003c/td>\n\u003ctd style=\"text-align: right;\">0.0122 / 0.0125\u003c/td>\n\u003ctd style=\"text-align: right;\">0.0332 / 0.0357\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>외벽 밀기\u003c/td>\n\u003ctd style=\"text-align: right;\">0.1687 / 0.2963\u003c/td>\n\u003ctd style=\"text-align: right;\">0.1125 / 0.1876\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>계단 앞뒤 이동\u003c/td>\n\u003ctd style=\"text-align: right;\">0.0785 / 0.3140\u003c/td>\n\u003ctd style=\"text-align: right;\">0.0529 / 0.1121\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>60Hz 외벽 조건에서 초당 누적 처리 시간은 BVH 약 10.12ms, Rapier 약 6.75ms였다. 이는 측정 구간의 경과 시간 합계이며 프로세스 전체 CPU 사용률이 아니다. 이 데스크톱·장면에서는 작은 비용이지만 모바일에서도 같다고 가정하지 않는다.\u003c/p>\n\u003cp>20Hz에서는 Rapier가 프레임당 최대 3회의 60Hz 내부 처리로 이동을 나눈다. 기존 BVH와 처리 횟수가 달라 호출당 수치만으로 비교하기 어렵다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>20Hz 조건\u003c/th>\n\u003cth style=\"text-align: right;\">기존 BVH ms/시뮬레이션 초\u003c/th>\n\u003cth style=\"text-align: right;\">Rapier ms/시뮬레이션 초\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>시작점 정지\u003c/td>\n\u003ctd style=\"text-align: right;\">0.14\u003c/td>\n\u003ctd style=\"text-align: right;\">1.85\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>벤치 부근 정지\u003c/td>\n\u003ctd style=\"text-align: right;\">0.24\u003c/td>\n\u003ctd style=\"text-align: right;\">1.94\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>외벽 밀기\u003c/td>\n\u003ctd style=\"text-align: right;\">2.42\u003c/td>\n\u003ctd style=\"text-align: right;\">6.95\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>계단 앞뒤 이동\u003c/td>\n\u003ctd style=\"text-align: right;\">3.23\u003c/td>\n\u003ctd style=\"text-align: right;\">3.10\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>측정 전체에서 자동 복귀는 0회였다. 이는 네 측정 구간의 결과이며, 장면 전체의 이동 문제 해결을 뜻하지 않는다.\u003c/p>\n\u003ch2 id=\"_3\">초기화와 다운로드\u003c/h2>\n\u003cp>Node에서 충돌 GLB를 읽고 파싱한 후 컨트롤러를 만드는 시간이다. 렌더러와 자산 로딩은 제외한다. 최초 생성은 1회 관찰, 초기화 이후 재생성은 5회 중앙값이다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>준비 비용\u003c/th>\n\u003cth style=\"text-align: right;\">기존 BVH\u003c/th>\n\u003cth style=\"text-align: right;\">Rapier\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>최초 생성\u003c/td>\n\u003ctd style=\"text-align: right;\">111.87ms\u003c/td>\n\u003ctd style=\"text-align: right;\">362.01ms\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>초기화 이후 재생성 중앙값\u003c/td>\n\u003ctd style=\"text-align: right;\">88.72ms\u003c/td>\n\u003ctd style=\"text-align: right;\">265.85ms\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Rapier의 최초 생성에는 WASM 초기화가 포함된다. 별도 모듈 import 관찰값 22.79ms는 위 생성 시간에 포함하지 않았다. BVH import는 측정 전에 끝났으므로 import 시간의 직접 비교는 하지 않는다. 재생성에도 변동이 있으며 원본에 각 값을 남겼다.\u003c/p>\n\u003cp>현재 프로덕션 산출물의 크기는 다음과 같다. MB는 1,000,000바이트, gzip은 로컬 Python \u003ccode>gzip.compress(..., compresslevel=9, mtime=0)\u003c/code>로 계산한 값이다. 실제 전송량은 서버 압축·캐시 정책에 따라 달라진다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>로딩 구성\u003c/th>\n\u003cth style=\"text-align: right;\">원본 MB\u003c/th>\n\u003cth style=\"text-align: right;\">gzip MB\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Three.js 기본 앱 JS\u003c/td>\n\u003ctd style=\"text-align: right;\">3.201\u003c/td>\n\u003ctd style=\"text-align: right;\">1.061\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rapier 선택 시 추가 JS/WASM 청크\u003c/td>\n\u003ctd style=\"text-align: right;\">4.336\u003c/td>\n\u003ctd style=\"text-align: right;\">1.653\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PlayCanvas 기본 앱 JS\u003c/td>\n\u003ctd style=\"text-align: right;\">1.982\u003c/td>\n\u003ctd style=\"text-align: right;\">0.502\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ammo WASM 경로의 JS glue + WASM\u003c/td>\n\u003ctd style=\"text-align: right;\">1.190\u003c/td>\n\u003ctd style=\"text-align: right;\">0.341\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Rapier 청크는 선택 시에만 로드한다. Ammo의 JS fallback은 WASM 경로와 함께 합산하지 않는다. 기본 앱 JS에는 렌더링 등 다른 코드도 들어 있으므로 이 표가 물리 라이브러리만의 크기 비교는 아니다.\u003c/p>\n\u003cp>두 앱이 사용하는 Sunnyvale SOG 58.07MB와 충돌 GLB 6.18MB는 위 코드 크기에 포함하지 않았다. 실제 초기 로딩에서는 공통 자산 비용도 크다. 현재 Rapier 구현은 핫스팟 가림 검사와 충돌 면 표시용 BVH도 유지하므로 두 충돌 구조를 갖는다. 이후 브라우저 관찰에서 Rapier 선택 시 BVH만 사용하는 경우보다 메인 JS heap 약 4.91MB, backing storage 약 10.52MB가 더 컸다. 이는 현재 구현의 GC 후 관찰값이며 GPU나 총 물리 메모리는 아니다. 조건과 한계는 \u003ca href=\"LOADING-MEMORY-COMPARISON.html\">로딩·메모리 비교\u003c/a>에 있다.\u003c/p>\n\u003ch2 id=\"_4\">브라우저에 추가한 기록\u003c/h2>\n\u003cp>두 앱의 \u003cstrong>위치 JSON 저장\u003c/strong>에 초기화와 \u003ccode>walkingTimings\u003c/code>를 추가했다. 전체 호출 수·평균·최대 외에 최근 600호출의 평균·p95·최대, 입력 없음/이동 요청의 분리 통계, 시뮬레이션 초당 처리 시간을 저장한다. 벽에 막힌 채 W를 누르는 경우도 이동 요청으로 분류한다. 숨겨진 탭과 카메라 경로 재생 구간은 기록에서 제외한다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>앱\u003c/th>\n\u003cth>기록 범위\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Three.js\u003c/td>\n\u003ctd>\u003ccode>walker.step\u003c/code>: 충돌, 보행 정책, Rapier 선택 시 물리 월드 처리\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PlayCanvas\u003c/td>\n\u003ctd>엔진의 \u003ccode>app.stats.frame.physicsTime\u003c/code>: 물리 월드, rigidbody 동기화와 접촉 처리\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>PlayCanvas의 입력·속도 설정과 앱의 턱 보정 등은 엔진 물리 시간 바깥에 있을 수 있다. 범위가 다르므로 물리 라이브러리 전체 작업량의 동일한 비교로 표현하지 않는다. PlayCanvas는 \u003ccode>ammoInitializationMs\u003c/code>와 \u003ccode>controllerBuildMs\u003c/code>를 나누어 저장하고, Three.js의 준비 시간에는 선택 청크·WASM·충돌 구조 준비가 포함되므로 준비 시간 역시 범위를 확인한다.\u003c/p>\n\u003cp>기존 \u003cstrong>비교 경로 재생\u003c/strong>은 카메라를 직접 이동한다. Three.js에서는 보행 호출을 건너뛰고, PlayCanvas에서는 플레이어 body를 비활성화해도 물리 월드 업데이트가 남는다. 기존 재생 결과만으로 보행 비용을 판단하지 않는다.\u003c/p>\n\u003ch2 id=\"playwright-mcp\">Playwright MCP 브라우저 측정 완료\u003c/h2>\n\u003ch3 id=\"_5\">조건과 원본\u003c/h3>\n\u003cul>\n\u003cli>별도 프로필의 headed Chrome 154, Apple M4 Pro의 ANGLE Metal renderer를 확인했다. Chrome 확장과 사용자 Chrome 세션은 사용하지 않았다.\u003c/li>\n\u003cli>Sunnyvale Museum, SOG 3,999,361개, 충돌 메시 337,680삼각형. 유효 실행 18개의 빌드 식별자 \u003ccode>local-4d5905679d2e-5135b39646a7\u003c/code>와 장면 자산 해시가 동일하다.\u003c/li>\n\u003cli>viewport 1200 × 863, 기기 DPR 2, 앱 렌더링 DPR 상한 1.5. 한 앱·한 시험 탭에서 측정했다. Rapier는 초기 준비 때 단일 탭을 확인했고, 이후 PlayCanvas·BVH는 매 회차 탭 수를 명시적으로 확인했다.\u003c/li>\n\u003cli>정지는 시작점 복귀 후 2초 준비, 벽은 W를 누른 채 10초 준비 후 30초 측정했다. 벽 시험은 브라우저의 world JSON 응답에만 시작 좌표 \u003ccode>[-8, 0, -12]\u003c/code>, 방향 \u003ccode>[0, 90, 0]\u003c/code>을 적용했다. 앱 소스와 자산은 변경하지 않았다.\u003c/li>\n\u003cli>전체 프레임 간격은 30초간 \u003ccode>requestAnimationFrame\u003c/code>으로 기록했다. 숨김·포커스 상실 프레임은 모든 유효 실행에서 0이었다. 물리 통계는 저장 시점의 \u003cstrong>최근 600호출\u003c/strong>이며, 해당 시뮬레이션 시간은 약 11.7–23.0초로 회차마다 다르다.\u003c/li>\n\u003cli>실행 순서는 Rapier → PlayCanvas → BVH이며 교대하지 않았다. 장시간 발열·다른 프로세스 부하는 통제하지 않았다.\u003c/li>\n\u003c/ul>\n\u003cp>원본·환경·제외한 실행: \u003ca href=\"measurements/2026-10-02/physics-browser.json\">physics-browser.json\u003c/a>. 측정 본문: \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">playwright-physics.mjs (원본 저장소 파일)\u003c/span>.\u003c/p>\n\u003ch3 id=\"_6\">앱이 기록한 물리 계산 시간\u003c/h3>\n\u003cp>각 값은 3회 실행의 중앙값이다. 평균·p95는 호출당 ms, 마지막 열은 기록된 처리 시간 합계를 시뮬레이션 시간으로 나눈 값이다. 프로세스 전체 CPU 사용률이 아니다. 페이지 시계 해상도가 약 0.1ms이므로 작은 차이의 정밀한 순위는 해석하지 않는다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>컨트롤러\u003c/th>\n\u003cth>조건\u003c/th>\n\u003cth style=\"text-align: right;\">평균 ms\u003c/th>\n\u003cth style=\"text-align: right;\">p95 ms\u003c/th>\n\u003cth style=\"text-align: right;\">ms/시뮬레이션 초\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Three.js BVH\u003c/td>\n\u003ctd>시작점 정지\u003c/td>\n\u003ctd style=\"text-align: right;\">0.031\u003c/td>\n\u003ctd style=\"text-align: right;\">0.1\u003c/td>\n\u003ctd style=\"text-align: right;\">0.89\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Three.js BVH\u003c/td>\n\u003ctd>외벽 밀기\u003c/td>\n\u003ctd style=\"text-align: right;\">0.225\u003c/td>\n\u003ctd style=\"text-align: right;\">0.3\u003c/td>\n\u003ctd style=\"text-align: right;\">11.54\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Three.js Rapier\u003c/td>\n\u003ctd>시작점 정지\u003c/td>\n\u003ctd style=\"text-align: right;\">0.143\u003c/td>\n\u003ctd style=\"text-align: right;\">0.2\u003c/td>\n\u003ctd style=\"text-align: right;\">4.12\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Three.js Rapier\u003c/td>\n\u003ctd>외벽 밀기\u003c/td>\n\u003ctd style=\"text-align: right;\">0.384\u003c/td>\n\u003ctd style=\"text-align: right;\">0.6\u003c/td>\n\u003ctd style=\"text-align: right;\">12.84\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PlayCanvas Ammo\u003c/td>\n\u003ctd>시작점 정지\u003c/td>\n\u003ctd style=\"text-align: right;\">0.079\u003c/td>\n\u003ctd style=\"text-align: right;\">0.2\u003c/td>\n\u003ctd style=\"text-align: right;\">3.84\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PlayCanvas Ammo\u003c/td>\n\u003ctd>외벽 밀기\u003c/td>\n\u003ctd style=\"text-align: right;\">0.088\u003c/td>\n\u003ctd style=\"text-align: right;\">0.2\u003c/td>\n\u003ctd style=\"text-align: right;\">4.27\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Three.js는 보행 정책까지 포함한 \u003ccode>walker.step\u003c/code>, PlayCanvas는 엔진의 \u003ccode>physicsTime\u003c/code>이다. PlayCanvas의 앱 입력·턱 보정 등은 표의 시간에 포함되지 않을 수 있다. 또한 보행 정책도 완전히 같지 않다. 이번 PlayCanvas 기록의 \u003ccode>stepClimbing\u003c/code>은 false이고, Rapier에는 0.2m 턱 오르기 설정이 있다. \u003cstrong>이 표로 Ammo가 Rapier보다 같은 작업을 몇 배 빠르게 처리한다고 결론 내릴 수 없다.\u003c/strong>\u003c/p>\n\u003ch3 id=\"_7\">전체 프레임 결과\u003c/h3>\n\u003cp>30초 구간 전체의 FPS와 프레임 간격 p95의 3회 중앙값이다. 물리 계산, 렌더링과 앱 실행을 함께 반영하며 물리 라이브러리 단독 지표가 아니다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>컨트롤러\u003c/th>\n\u003cth>조건\u003c/th>\n\u003cth style=\"text-align: right;\">평균 FPS\u003c/th>\n\u003cth style=\"text-align: right;\">프레임 간격 p95 ms\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Three.js BVH\u003c/td>\n\u003ctd>시작점 정지\u003c/td>\n\u003ctd style=\"text-align: right;\">28.5\u003c/td>\n\u003ctd style=\"text-align: right;\">50.5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Three.js BVH\u003c/td>\n\u003ctd>외벽 밀기\u003c/td>\n\u003ctd style=\"text-align: right;\">50.3\u003c/td>\n\u003ctd style=\"text-align: right;\">49.3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Three.js Rapier\u003c/td>\n\u003ctd>시작점 정지\u003c/td>\n\u003ctd style=\"text-align: right;\">28.4\u003c/td>\n\u003ctd style=\"text-align: right;\">50.3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Three.js Rapier\u003c/td>\n\u003ctd>외벽 밀기\u003c/td>\n\u003ctd style=\"text-align: right;\">26.5\u003c/td>\n\u003ctd style=\"text-align: right;\">116.7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PlayCanvas Ammo\u003c/td>\n\u003ctd>시작점 정지\u003c/td>\n\u003ctd style=\"text-align: right;\">48.0\u003c/td>\n\u003ctd style=\"text-align: right;\">33.8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PlayCanvas Ammo\u003c/td>\n\u003ctd>외벽 밀기\u003c/td>\n\u003ctd style=\"text-align: right;\">47.3\u003c/td>\n\u003ctd style=\"text-align: right;\">33.7\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>이번 조건에서는 PlayCanvas의 프레임 간격이 더 일정했다. Three.js 정지 조건에서는 BVH와 Rapier가 비슷했으며, 벽 조건에서는 Rapier가 더 긴 프레임 간격을 보였다. 물리 시간만으로 이 차이를 설명할 수 없다. 렌더러 CPU/GPU 프로파일과 동일한 카메라·접촉 위치 비교가 없으므로 원인은 미확정이다.\u003c/p>\n\u003cp>같은 시작 좌표와 W 입력을 사용해도 최종 접촉 위치는 달랐다. 특히 Rapier 외벽 첫 회차는 10초 준비 이후에도 약 0.83m 이동했고 이후 반복에서는 정착했다. BVH·Ammo는 서로 다른 접촉 지점에 정착했다. 따라서 같은 입력이 동일한 충돌 작업량이나 같은 화면을 보장하지 않는다. Three.js의 기록 dt는 최대 0.05초로 제한되므로 시뮬레이션 초와 실제 경과 시간도 다를 수 있다.\u003c/p>\n\u003cp>시각 근거: \u003ca href=\"measurements/2026-10-02/bvh-spawn.png\">BVH 시작점\u003c/a>, \u003ca href=\"measurements/2026-10-02/bvh-wall.png\">BVH 벽\u003c/a>, \u003ca href=\"measurements/2026-10-02/rapier-spawn.png\">Rapier 시작점\u003c/a>, \u003ca href=\"measurements/2026-10-02/rapier-wall.png\">Rapier 벽\u003c/a>, \u003ca href=\"measurements/2026-10-02/playcanvas-spawn.png\">Ammo 시작점\u003c/a>, \u003ca href=\"measurements/2026-10-02/playcanvas-wall.png\">Ammo 벽\u003c/a>.\u003c/p>\n\u003ch3 id=\"_8\">도구 오류와 제외 기준\u003c/h3>\n\u003cp>PlayCanvas 위치 JSON의 \u003ccode>download.saveAs\u003c/code>가 두 번 페이지/컨텍스트 종료 오류를 반환했다. 이후 시험 탭이 두 개 남아 있었던 예비 정지 3회·벽 1회는 제외하고 단일 탭에서 모두 다시 측정했다. BVH의 첫 벽 시험도 시작점 복귀 전에 페이지가 닫혀 제외하고 재실행했다. 페이지 종료의 원인은 확정하지 않았다.\u003c/p>\n\u003cp>유효 PlayCanvas·BVH 기록은 기존 ‘위치 JSON 저장’ 핸들러의 JSON Blob을 페이지 안에서 읽어 저장했다. 다운로드용 클릭만 잠시 억제하고 변경한 브라우저 함수를 \u003ccode>finally\u003c/code>에서 복구했다. Rapier는 실제 다운로드 JSON을 사용했다. 세 방식의 측정 완료 시 콘솔 조회에는 오류·경고가 없었으며, 초기 페이지의 favicon 404는 별도 로드 문제였다.\u003c/p>\n\u003cp>네트워크·캐시는 통제하지 않았고 world 응답 가로채기는 HTTP 캐시를 비활성화한다. 이번 실행은 cold/warm 로딩, 메모리, 모바일, 전력 소모나 장시간 안정성 시험이 아니다. 앞선 카메라 경로 재생과 빌드·장면·viewport·동작이 달라 합산하지 않는다.\u003c/p>\n\u003ch2 id=\"_9\">다음 판단에 필요한 자료\u003c/h2>\n\u003cp>데스크톱에서 정지·외벽 보행과 아래 1·2번의 직접 측정을 완료했다. 같은 조건을 사용자에게 다시 수동 실행하도록 요청할 필요는 없다. 남은 비용과 유지보수 부담은 3·4번과 저작·배포 작업량을 확인한다.\u003c/p>\n\u003col>\n\u003cli>완료: Sunnyvale에서 GC 후 페이지·worker 메모리를 관찰하고 Knock Hall에서 구현별 왕복 20회 후 자원 추이를 기록했다. GPU 메모리와 장시간 누수 여부는 미확정이다.\u003c/li>\n\u003cli>완료: 요청 가로채기 없이 cold/warm 로딩 각 3회와 실제 HTTP 전송량을 기록했다. 상세 결과는 \u003ca href=\"LOADING-MEMORY-COMPARISON.html\">로딩·메모리 비교\u003c/a>에 있다.\u003c/li>\n\u003cli>\u003ca href=\"MOBILE-COMPARISON.html\">iPhone Safari\u003c/a>의 공통 장면 정지·합성 이동 프레임과 처리 시간은 측정했다. PlayCanvas의 이동 기록은 바닥 밖 무한 낙하로 비교에서 제외했다. 실제 손가락 보행·상호작용·회전, 대형 장면의 동일 경로 보행과 Android 확인은 남아 있다. Mac 결과로 모바일 여력을 예측하지 않는다.\u003c/li>\n\u003cli>10분 탐색·반복 시대 전환으로 추락·복귀·멈춤·context loss를 확인하고, 같은 계단·경사 정책을 구현하는 작업량을 비교한다.\u003c/li>\n\u003c/ol>\n\u003cp>이동감이 비슷한 현재 상태에서는 작은 물리 계산 차이와 함께 위 항목을 고려한다. BVH를 제거하려면 핫스팟 가림 검사와 충돌 면 표시를 대체해야 하므로 바로 삭제하지 않는다.\u003c/p>\n\u003ch2 id=\"_10\">재실행\u003c/h2>\n\u003cpre>\u003ccode class=\"language-sh\">pnpm benchmark:physics --output artifacts/physics-cost.json\n\u003c/code>\u003c/pre>\n\u003cp>브라우저 기록은 \u003ccode>pnpm check\u003c/code> 후 \u003ccode>./dev.sh --preview both\u003c/code>로 최신 산출물을 사용한다. 서버는 둘 다 켜도 측정 브라우저에는 앱 하나만 연다. Three.js의 Sunnyvale에서 \u003ccode>controller=bvh\u003c/code> 또는 \u003ccode>controller=rapier\u003c/code>를 선택하고, PlayCanvas도 같은 Sunnyvale 장면을 사용한다.\u003c/p>\n\u003cp>Playwright MCP 절차는 \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">AGENTS.md (원본 저장소 파일)\u003c/span>에 있다. \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">브라우저 측정 본문 (원본 저장소 파일)\u003c/span>의 \u003ccode>measure\u003c/code> 함수를 \u003ccode>browser_run_code_unsafe\u003c/code>에서 호출한다. 먼저 로딩·GPU·단일 탭을 확인하고, 벽 시험에는 위 응답 좌표 변경을 따로 적용한다. 이 파일은 CLI에서 브라우저를 여는 실행기가 아니다.\u003c/p>\n\u003cp>Node 측정 도구는 \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">benchmark-physics.ts (원본 저장소 파일)\u003c/span>, 통계 구현은 \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">step-timings.ts (원본 저장소 파일)\u003c/span>에 있다.\u003c/p>\u003c/main>\u003cfooter>테스트 기간 2026-10-02~04 · 기존 측정 기록을 정리한 자료입니다. 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
