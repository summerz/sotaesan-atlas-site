<main><h1>Sunnyvale 보행·시대 전환 조사</h1>
<p>벽 뒤 황색 표식을 넣어 원본과 작은 보정 면을 비교합니다. 보행 회차는 실제 좌표가 달라 픽셀 차이 비교용이 아닙니다. 시대 화면의 좌우·하향 시선은 합성 터치 입력이며 실제 마우스·손가락 검증이 아닙니다.</p>
<p>근접 재현에서는 보정 면 전체가 화면 아래로 벗어나 표식이 다시 보입니다. 표식 광선은 면의 위쪽으로 지나갑니다. 이 결과로 창문·셔터의 불투명도를 판단하거나 면을 창문까지 넓히지는 않습니다.</p>
