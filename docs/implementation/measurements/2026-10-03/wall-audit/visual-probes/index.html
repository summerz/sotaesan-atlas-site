<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Sunnyvale 벽 비침 비교</title><style>body{background:#f6f4ec;color:#173c33;font-family:system-ui,sans-serif}</style></head><body><noscript>자료를 보려면 브라우저에서 JavaScript를 허용해 주세요.</noscript><script type="application/json" id="site-page">"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Sunnyvale 벽 비침 비교\u003c/title>\n\u003cstyle>\n:root{color-scheme:light dark;font:16px/1.6 system-ui,sans-serif}body{max-width:1500px;margin:auto;padding:24px}h1{font-size:26px;margin:0}p{max-width:85ch}select{font:inherit;padding:8px;margin:4px 16px 12px 4px}section{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;min-width:0}img{display:block;width:100%;height:auto;border:1px solid #777;border-radius:6px}figcaption{padding:8px 0}a{color:light-dark(#1857a4,#8ec6ff)}details{margin:16px 0}code{font-size:14px}@media(max-width:800px){section{grid-template-columns:1fr}body{padding:16px}}\n\u003c/style>\n\u003ch1>Sunnyvale 벽 비침 비교 · 2026-10-03\u003c/h1>\n\u003cp>같은 카메라에서 원본과 한 가지 조건만 바꾼 화면을 비교합니다. 벽 뒤의 주황색 불투명 표식이 두 엔진에서 모두 비쳐 보입니다. 시험용 표식과 SOG 점 제외는 진단용이며, 제품 수정 결과가 아닙니다.\u003c/p>\n\u003clabel>엔진 \u003cselect id=\"engine\">\u003coption value=\"three\">Three.js\u003c/option>\u003coption value=\"playcanvas\">PlayCanvas\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>시험 조건 \u003cselect id=\"control\">\n\u003coption value=\"opaque-marker\">벽 뒤 불투명 표식\u003c/option>\n\u003coption value=\"rgba-roundtrip\">RGBA 재인코딩 대조군\u003c/option>\n\u003coption value=\"no-sh\">방향별 색상 SH 제거\u003c/option>\n\u003coption value=\"exterior-16_3\">중심 X &lt; -16.3m 점 제외\u003c/option>\n\u003coption value=\"exterior-16_5\">중심 X &lt; -16.5m 점 제외\u003c/option>\n\u003coption value=\"exterior-17_5\">중심 X &lt; -17.5m 점 제외\u003c/option>\n\u003c/select>\u003c/label>\n\u003cp id=\"note\" aria-live=\"polite\">\u003c/p>\n\u003csection>\n\u003cfigure>\u003cfigcaption id=\"baselineTitle\">원본\u003c/figcaption>\u003ca id=\"baselineLink\">\u003cimg id=\"baseline\" alt=\"선택한 엔진의 원본 SOG 화면\" width=\"1280\" height=\"800\">\u003c/a>\u003c/figure>\n\u003cfigure>\u003cfigcaption id=\"probeTitle\">시험\u003c/figcaption>\u003ca id=\"probeLink\">\u003cimg id=\"probe\" alt=\"선택한 엔진의 시험 조건 화면\" width=\"1280\" height=\"800\">\u003c/a>\u003c/figure>\n\u003c/section>\n\u003cdetails>\u003csummary>조건과 한계\u003c/summary>\n\u003cp>eye [-14.24, 2.15, -11.09]m, 회전 pitch -20° / yaw 90°, 1280×800, DPR 1, 세로 FOV 70°, near 0.05m. 원래 위치 JSON과 빨간 박스는 없어 당시 화면의 정확한 재현이라고 판정하지 않습니다.\u003c/p>\n\u003cp>world 응답의 spawn·고정 비교 경로, 시험 SOG 응답, 표식 조건의 objects만 일시 변경했습니다. 원본 자산과 앱 소스는 변경하지 않았습니다. 요청 가로채기가 있으므로 로딩·성능 비교에 사용하지 않습니다. 점 중심의 X 기준 제외는 Gaussian 크기까지 자르는 평면 클리핑이 아닙니다.\u003c/p>\n\u003cp>창 아래 비교 영역은 (400,540)–(500,670), 오른쪽 보조 벽은 (900,480)–(1100,650)입니다. UI가 가린 부분은 판단에서 제외합니다. RGB 차이는 영상 변화량이며 실제 가구 존재나 벽의 불투명도 수치를 증명하지 않습니다.\u003c/p>\n\u003c/details>\n\u003cp>\u003ca href=\"wall-audit-final-captures.json\">카메라·환경·오류 원본\u003c/a> · \u003ca href=\"wall-audit-image-differences.json\">영상 차이와 캡처 해시\u003c/a> · \u003ca href=\"control-manifest.json\">SOG 시험 자산 해시\u003c/a> · \u003ca href=\"wall-audit-pixel-rays.json\">픽셀 광선 교차점\u003c/a>\u003c/p>\n\u003cscript>\nconst engine=document.querySelector('#engine'),control=document.querySelector('#control');\nconst notes={\n 'opaque-marker':'원본 SOG를 유지하고 충돌 벽 뒤 X=-16.3m에 표식만 추가했습니다. 창 아래 벽 영역에서 주황색과 표식 테두리가 보이며, 벽 무늬도 그 위에 남습니다.',\n 'rgba-roundtrip':'점 위치·형상·색상·불투명도 값은 유지하고 sh0 WebP만 무손실 재인코딩했습니다. 창 아래 비교 영역은 두 엔진 모두 픽셀 차이가 0입니다. PlayCanvas 보조 벽은 최대 RGB 1단계 차이가 있습니다.',\n 'no-sh':'고차 SH 파일을 제외해 기본 색상만 사용했습니다. 색상은 달라지지만 어두운 형태는 남아 SH만으로 현상을 설명하지 못합니다.',\n 'exterior-16_3':'중심 world X \u003c -16.3m인 점의 불투명도를 0으로 했습니다. 어두운 형태가 변하지만 벽 표현도 바뀌므로 완성된 보정이 아닙니다.',\n 'exterior-16_5':'중심 world X \u003c -16.5m인 점의 불투명도를 0으로 했습니다. 원본과 비교해 국소 변화와 벽 손상을 함께 확인합니다.',\n 'exterior-17_5':'더 깊은 중심 world X \u003c -17.5m인 점을 제외했습니다. 넓은 구간 제외만으로 깨끗한 벽이 만들어지지 않습니다.'\n};\nfunction update(){const label=engine.selectedOptions[0].text;for(const [id,c] of [['baseline','original'],['probe',control.value]]){const src='wall-audit-'+engine.value+'-'+c+'.png';document.getElementById(id).src=src;document.getElementById(id+'Link').href=src;}document.querySelector('#baselineTitle').textContent=label+' · 원본';document.querySelector('#probeTitle').textContent=label+' · '+control.selectedOptions[0].text;document.querySelector('#note').textContent=notes[control.value];}\nengine.addEventListener('change',update);control.addEventListener('change',update);update();\n\u003c/script>\n\u003c/html>\n"</script><script src="../../../../../../site-access.js"></script></body></html>
