<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Sunnyvale 벽 보정 시안 비교</title><style>body{background:#f6f4ec;color:#173c33;font-family:system-ui,sans-serif}</style></head><body><noscript>자료를 보려면 브라우저에서 JavaScript를 허용해 주세요.</noscript><script type="application/json" id="site-page">"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Sunnyvale 벽 보정 시안 비교\u003c/title>\n\u003cstyle>\n  :root { color-scheme: dark; font-family: system-ui,sans-serif; background:#131719; color:#e7ecee }\n  body { max-width:1600px; margin:auto; padding:24px }\n  h1 { font-size:24px; margin:0 0 12px }\n  p { line-height:1.65; color:#bcc8cd; margin:8px 0 }\n  .controls { display:flex; flex-wrap:wrap; gap:18px; align-items:center; margin:24px 0 }\n  label { display:flex; gap:8px; align-items:center }\n  select { font:inherit; background:#252d31; color:inherit; border:1px solid #617079; border-radius:6px; padding:8px }\n  input { width:18px; height:18px; accent-color:#83cfb3 }\n  .comparison { display:grid; grid-template-columns:1fr 1fr; gap:16px }\n  figure { margin:0; min-width:0 }\n  figcaption { padding:10px 0; font-weight:600 }\n  img { width:100%; height:auto; display:block; background:#252d31; border-radius:8px }\n  output { display:block; margin:16px 0; line-height:1.65 }\n  a { color:#a5dce5 }\n  .note { border-left:3px solid #83cfb3; padding-left:14px; margin-top:20px }\n  @media(max-width:800px) { body{padding:16px} .comparison{grid-template-columns:1fr} }\n\u003c/style>\n\u003ch1>Sunnyvale 벽 보정 시안\u003c/h1>\n\u003cp>원본과 창 아래에 작은 불투명 면을 더한 시안입니다. 엔진과 시점을 바꾸거나 주황색 표식을 켜서 벽 뒤 물체가 보이는지 비교할 수 있습니다.\u003c/p>\n\u003cdiv class=\"controls\">\n  \u003clabel>엔진 \u003cselect id=\"engine\">\u003coption value=\"three\">Three.js\u003c/option>\u003coption value=\"playcanvas\">PlayCanvas\u003c/option>\u003c/select>\u003c/label>\n  \u003clabel>시점 \u003cselect id=\"view\">\u003coption value=\"center\">기준 시점\u003c/option>\u003coption value=\"left\">왼쪽 50cm\u003c/option>\u003coption value=\"right\">오른쪽 50cm\u003c/option>\u003coption value=\"near\">앞쪽 40cm\u003c/option>\u003c/select>\u003c/label>\n  \u003clabel>\u003cinput id=\"marker\" type=\"checkbox\" checked>벽 뒤 표식 표시\u003c/label>\n\u003c/div>\n\u003cdiv class=\"comparison\">\n  \u003cfigure>\u003cfigcaption>원본\u003c/figcaption>\u003ca id=\"original-link\">\u003cimg id=\"original\" alt=\"선택한 엔진과 시점의 원본 벽\" width=\"1280\" height=\"800\">\u003c/a>\u003c/figure>\n  \u003cfigure>\u003cfigcaption>국소 보정 시안\u003c/figcaption>\u003ca id=\"patch-link\">\u003cimg id=\"patch\" alt=\"같은 엔진과 시점의 보정 벽\" width=\"1280\" height=\"800\">\u003c/a>\u003c/figure>\n\u003c/div>\n\u003coutput id=\"result\" aria-live=\"polite\">\u003c/output>\n\u003cp class=\"note\">고정된 네 시점에서 표식 가림을 확인한 시안입니다. 벽 무늬가 부드러워지고, 주변 벽 색에서 추정한 부분이 있습니다. 실제 보행·다른 시선·시대 전환·iPhone에서는 아직 검증하지 않았으며 정식 자산에 반영하지 않았습니다.\u003c/p>\n\u003cp>\u003ca href=\"README.html\">시험 조건과 재현 방법\u003c/a> · \u003ca href=\"captures.json\">촬영 원본 상태\u003c/a> · \u003ca href=\"image-differences.json\">영상 차이 수치\u003c/a>\u003c/p>\n\u003cscript>\n  const positions = { center:[-14.24,2.15,-11.09], left:[-14.24,2.15,-10.59], right:[-14.24,2.15,-11.59], near:[-14.64,2.15,-11.09] };\n  const mae = { three:{center:33.588,left:31.190,right:31.853,near:34.699}, playcanvas:{center:38.434,left:35.792,right:36.516,near:38.916} };\n  function update() {\n    const engine = document.getElementById('engine').value;\n    const view = document.getElementById('view').value;\n    const marker = document.getElementById('marker').checked;\n    for (const mode of ['original','patch']) {\n      const file = `wall-repair-${engine}-${view}-${mode}${marker ? '-marker' : ''}.png`;\n      document.getElementById(mode).src = file;\n      document.getElementById(`${mode}-link`).href = file;\n    }\n    document.getElementById('result').textContent = `카메라 eye [${positions[view].join(', ')}]m · pitch −20° / yaw 90° · 1280×800` + (marker ? `\\n표식 추가 전후의 해당 영상 영역 RGB 평균 절대 차이: 원본 ${mae[engine][view].toFixed(3)}, 보정 0.000. 이 값은 불투명도나 화질 점수가 아닙니다.` : '\\n표식 없는 원본과 보정 외관을 비교합니다.');\n  }\n  for (const id of ['engine','view','marker']) document.getElementById(id).addEventListener('change',update);\n  update();\n\u003c/script>\n\u003c/html>\n"</script><script src="../../../../../../site-access.js"></script></body></html>
