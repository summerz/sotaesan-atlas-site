:1120px;margin:auto;border-top:1px solid var(--line);padding:24px;font-size:14px;color:var(--muted)}.intro{max-width:750px;font-size:21px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:32px 0}.button{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);text-decoration:none;border-radius:4px;padding:11px 22px;font-weight:600}.button.secondary{background:transparent;color:var(--green)}.summary{border-left:4px solid var(--green);padding:4px 24px;margin:38px 0;font-size:19px}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.resource{border:1px solid var(--line);padding:22px}.resource h3{margin:0 0 10px}.resource p{font-size:16px;margin:0;color:var(--muted)}.local-file{color:var(--muted)}.meta{color:var(--muted);font-size:14px}.toc{border:1px solid var(--line);padding:16px 24px;margin:28px 0;font-size:15px}.toc>ul{margin:0}.toc li{margin:4px 0}li{margin:8px 0}.downloads{margin:0 0 30px}.measurements ul{padding-left:24px}@media(max-width:650px){body{font-size:16px}main{padding:30px 18px 50px}h1{font-size:29px}h2{font-size:23px}.intro{font-size:19px}.resources{grid-template-columns:1fr}header{padding:16px 18px}table{min-width:680px}.actions{gap:10px}.button{padding:9px 16px}}@media print{header,footer,.downloads{display:none}main{max-width:none;padding:0}body{font-size:11pt}h1{font-size:24pt}h2{font-size:18pt}table{font-size:9pt}.table-scroll{overflow:visible}a{color:inherit}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/index.html\">직접 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">상세 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"CONTENT-LIFECYCLE.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"_1\">장소 정보·콘텐츠 수명 시험\u003c/h1>\n\u003cp>2026-10-02. 구역 로딩과 시대 전환에 핫스팟·설명 패널을 연결했다. Three.js BVH·Rapier와 PlayCanvas Ammo에서 아래 기능을 확인했다. \u003ca href=\"measurements/2026-10-02/content-lifecycle.json\">브라우저 JSON\u003c/a>, \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">재현 경로 (원본 저장소 파일)\u003c/span>. 측정 릴리스는 \u003ccode>local-4d5905679d2e-6a26beb04091\u003c/code>이며 엔진 속도 비교는 아니다.\u003c/p>\n\u003ch2 id=\"_2\">데이터와 동작\u003c/h2>\n\u003cp>핫스팟은 월드 JSON의 위치·시대·최대 거리·\u003ccode>contentId\u003c/code>로 정의한다. 분할 장면에서는 \u003ccode>chunkId\u003c/code>로 소유 구역을 지정한다. 엔진 객체를 콘텐츠 데이터에 저장하지 않는다. 구역이 준비됐고 시대가 맞을 때 사용할 수 있으며, 실제 버튼 표시는 거리·화면 투영·충돌 메시의 가림 판정도 통과해야 한다. 검사 JSON의 \u003ccode>available\u003c/code>만으로 화면에 보인다고 판단하지 않는다.\u003c/p>\n\u003cp>설명은 콘텐츠 JSON에서 읽고 표현 종류·확신 수준·출처와 이미지를 패널에 표시한다. 시험 자료는 \u003ccode>illustrative\u003c/code>·\u003ccode>not-applicable\u003c/code>로 표시한다. 문자열은 \u003ccode>textContent\u003c/code>로 출력한다. 역사 자료의 정확성과 출처 검수 자체를 시험한 것은 아니다.\u003c/p>\n\u003cp>패널이 열리면 일반 이동을 막는다. 닫기·Esc·시대 전환·장면 변경 시 패널 상태와 이미지 URL을 정리한다. 닫은 뒤 키 이동은 다시 가능하며 마우스 잠금은 사용자가 화면을 클릭해 다시 얻는다. 이미지 요청 실패 시 설명·출처와 실패 안내를 유지한다.\u003c/p>\n\u003ch2 id=\"_3\">확인 결과\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>확인 항목\u003c/th>\n\u003cth>BVH\u003c/th>\n\u003cth>Rapier\u003c/th>\n\u003cth>Ammo\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>시작 구역 정보 표시·먼 구역 정보 숨김\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>설명·출처·이미지 표시\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>패널 중 이동 차단·Esc 후 이미지 URL 정리\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>닫은 뒤 끝 구역까지 이동·이전 구역 정보 제거\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>새 구역 설명 열기·장면 변경 시 이전 패널 정리\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>시대별 정보 교체·전환 시 패널 정리\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>벽 뒤 버튼 가림·거리 밖 버튼 숨김\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>이미지 실패 안내·다시 열어 이미지 복구\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>브라우저 경로의 JS 예외는 없었다. 이미지 실패 시험에서는 의도적으로 네트워크 오류를 발생시켰다. 콘솔에 아무 오류도 없었다는 뜻은 아니다.\u003c/p>\n\u003cp>\u003ca href=\"measurements/2026-10-02/content-three-custom-bvh-capsule.png\">Three.js 패널\u003c/a>, \u003ca href=\"measurements/2026-10-02/content-playcanvas-ammo-dynamic-capsule.png\">PlayCanvas 패널\u003c/a>. PlayCanvas 캡처는 이미지 표시를 기다린 뒤 최종 릴리스 \u003ccode>local-4d5905679d2e-f6ec268ff18a\u003c/code>에서 다시 저장했다. 캡처의 상주 구역은 촬영 시점에 따라 달라 같은 렌더링 조건 비교용이 아니다.\u003c/p>\n\u003cp>최종 릴리스에서 PlayCanvas의 구역 왕복·설명 이미지, Three.js BVH의 패널 중 이동 차단·닫은 뒤 이동 복귀, Rapier의 최초 선택 로딩을 추가 확인했다. \u003ca href=\"measurements/2026-10-02/final-capabilities-sanity.json\">최종 확인 JSON\u003c/a>. 전체 기능 경로의 근거는 위의 별도 측정 JSON이며 최종 확인은 이 세 경로에 한정한다.\u003c/p>\n\u003ch2 id=\"_4\">범위와 제한\u003c/h2>\n\u003cul>\n\u003cli>패널 중 일반 이동이 막혀서 사용자가 패널을 연 채 소유 구역 밖으로 이동하는 경로는 발생하지 않는다. 구역 준비 상태 변경에 따른 사용 가능 판정은 공통 단위 검사로, 장면·시대 변경의 패널 정리는 실제 브라우저로 확인했다. 향후 자동 이동·멀티플레이 이동을 붙이면 별도 경로 검사가 필요하다.\u003c/li>\n\u003cli>가림은 충돌 메시를 기준으로 한다. Gaussian 영상의 작은 틈과 투명도, 원본의 비침을 픽셀 단위로 판별하지 않는다. 콘텐츠 판정과 촬영 자산의 품질 문제는 별도 검수 대상이다.\u003c/li>\n\u003cli>모바일 터치·스크린리더 사용성·대량 핫스팟·실제 역사 콘텐츠 검수는 아직 확인하지 않았다.\u003c/li>\n\u003cli>분할 생성기는 기존 \u003ccode>stream.json\u003c/code>의 핫스팟을 보존한다. 경계를 바꾸면 소유 구역과 위치를 다시 검토해야 하며 잘못된 참조는 월드 검증에서 거부한다.\u003c/li>\n\u003c/ul>\u003c/main>\u003cfooter>테스트 기간 2026-10-02~04 · 기존 측정 기록을 정리한 자료입니다. 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
