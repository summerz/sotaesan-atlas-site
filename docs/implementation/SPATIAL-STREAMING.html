<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>공간 분할·선택 로딩 시험 · Sotaesan Atlas</title><style>body{background:#f6f4ec;color:#173c33;font-family:system-ui,sans-serif}</style></head><body><noscript>자료를 보려면 브라우저에서 JavaScript를 허용해 주세요.</noscript><script type="application/json" id="site-page">"\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>공간 분할·선택 로딩 시험 · Sotaesan Atlas\u003c/title>\u003cstyle>\n:root{color-scheme:light;--paper:#f6f4ec;--ink:#173c33;--green:#137466;--muted:#546960;--line:#cdd6cd}\n*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:\"Apple SD Gothic Neo\",\"Noto Sans KR\",system-ui,sans-serif;font-size:17px;line-height:1.75}\na{color:var(--green);text-underline-offset:4px}header{border-bottom:1px solid var(--line);padding:20px max(24px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}header>a{font-weight:700;text-decoration:none}nav{display:flex;gap:20px;font-size:15px;flex-wrap:wrap}main{max-width:1120px;margin:auto;padding:44px 24px 70px}h1,h2,h3{line-height:1.45;word-break:keep-all;letter-spacing:-.025em}h1{font-size:36px;margin:0 0 28px}h2{font-size:26px;margin:44px 0 20px;border-top:1px solid var(--line);padding-top:28px}h3{font-size:21px;margin-top:28px}p{word-break:keep-all}table{border-collapse:collapse;width:100%;font-size:15px;margin:22px 0}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{border-bottom:2px solid var(--ink);background:#e9eee5}pre{overflow:auto;background:#e9eee5;padding:20px;font-size:14px;line-height:1.6}code{font-size:.9em;overflow-wrap:anywhere}img{max-width:100%;height:auto}.table-scroll{overflow-x:auto}footer{max-width:1120px;margin:auto;border-top:1px solid var(--line);padding:24px;font-size:14px;color:var(--muted)}.intro{max-width:750px;font-size:21px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:32px 0}.button{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);text-decoration:none;border-radius:4px;padding:11px 22px;font-weight:600}.button.secondary{background:transparent;color:var(--green)}.summary{border-left:4px solid var(--green);padding:4px 24px;margin:38px 0;font-size:19px}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.resource{border:1px solid var(--line);padding:22px}.resource h3{margin:0 0 10px}.resource p{font-size:16px;margin:0;color:var(--muted)}.local-file{color:var(--muted)}.meta{color:var(--muted);font-size:14px}.toc{border:1px solid var(--line);padding:16px 24px;margin:28px 0;font-size:15px}.toc>ul{margin:0}.toc li{margin:4px 0}li{margin:8px 0}.downloads{margin:0 0 30px}.measurements ul{padding-left:24px}@media(max-width:650px){body{font-size:16px}main{padding:30px 18px 50px}h1{font-size:29px}h2{font-size:23px}.intro{font-size:19px}.resources{grid-template-columns:1fr}header{padding:16px 18px}table{min-width:680px}.actions{gap:10px}.button{padding:9px 16px}}@media print{header,footer,.downloads{display:none}main{max-width:none;padding:0}body{font-size:11pt}h1{font-size:24pt}h2{font-size:18pt}table{font-size:9pt}.table-scroll{overflow:visible}a{color:inherit}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/index.html\">직접 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">상세 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"SPATIAL-STREAMING.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"_1\">공간 분할·선택 로딩 시험\u003c/h1>\n\u003cp>2026-10-02. 같은 Knock Hall 마스터를 실제로 나눈 다섯 SOG를 두 앱에서 사용했다. 시작 시 전체 SOG를 요청하지 않고, 이동에 따라 구역 파일을 로드하고 렌더러 자원을 해제하는 동작을 확인했다. 이 단계는 데스크톱의 기능 검증이며 엔진 성능 순위는 정하지 않는다.\u003c/p>\n\u003cp>2026-10-03 후속: \u003ca href=\"FAR-LOD.html\">원거리 저해상도 표현\u003c/a>을 추가했다. 아래 최초 65.4% 절감과 브라우저 기록은 원거리 생략 단계의 결과다. 현재는 저해상도 포함 약 54.2% 절감이며 교체 순간 선명도 변화가 남는다.\u003c/p>\n\u003ch2 id=\"_2\">분할 자료와 최초 로딩량\u003c/h2>\n\u003cp>\u003ccode>scripts/make-spatial-chunks.py\u003c/code>가 900,000개 원본 레코드를 Gaussian 중심의 X 좌표로 4 m씩 나눈다. 각 레코드는 인코딩 전에 한 구역에만 들어간다. SH0으로 다시 인코딩한 결과와 해시는 \u003ca href=\"../../shared/source/spatial-chunks.json\">분할 메타데이터\u003c/a>에 있다. 기존 런타임 \u003ccode>current.sog\u003c/code>도 SH0이다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>구역\u003c/th>\n\u003cth style=\"text-align: right;\">X 범위(m)\u003c/th>\n\u003cth style=\"text-align: right;\">Gaussian 수\u003c/th>\n\u003cth style=\"text-align: right;\">SOG 크기(B)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>0\u003c/td>\n\u003ctd style=\"text-align: right;\">0–4\u003c/td>\n\u003ctd style=\"text-align: right;\">69,967\u003c/td>\n\u003ctd style=\"text-align: right;\">931,680\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd style=\"text-align: right;\">4–8\u003c/td>\n\u003ctd style=\"text-align: right;\">231,735\u003c/td>\n\u003ctd style=\"text-align: right;\">3,060,137\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd style=\"text-align: right;\">8–12\u003c/td>\n\u003ctd style=\"text-align: right;\">267,979\u003c/td>\n\u003ctd style=\"text-align: right;\">3,541,172\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd style=\"text-align: right;\">12–16\u003c/td>\n\u003ctd style=\"text-align: right;\">215,380\u003c/td>\n\u003ctd style=\"text-align: right;\">2,836,047\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd style=\"text-align: right;\">16–20\u003c/td>\n\u003ctd style=\"text-align: right;\">114,939\u003c/td>\n\u003ctd style=\"text-align: right;\">1,510,967\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>합계\u003c/td>\n\u003ctd style=\"text-align: right;\">0–20\u003c/td>\n\u003ctd style=\"text-align: right;\">900,000\u003c/td>\n\u003ctd style=\"text-align: right;\">11,880,003\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>시작 위치 X=3에서는 구역 0·1만 준비한다. \u003cstrong>301,702점, 3,991,817 B\u003c/strong>로 분할본 전체의 33.5% 점 수·33.6% 파일 크기다. 기존 단일 SOG 11,543,748 B와 비교하면 \u003cstrong>최초 SOG 파일 크기를 약 65.4% 줄였다\u003c/strong>. HTML·JS·물리 엔진·JSON·충돌 메시까지 합한 페이지 전송량이나 GPU 메모리 감소율은 아니다. 전체 분할본은 개별 압축 때문에 단일 파일보다 약 2.9% 크다.\u003c/p>\n\u003cp>Gaussian의 중심은 중복되지 않지만 타원체의 범위는 경계를 넘을 수 있다. 재인코딩의 양자화와 압축도 있으므로 원본과 픽셀이 완전히 같다는 의미는 아니다.\u003c/p>\n\u003ch2 id=\"_3\">실행 정책\u003c/h2>\n\u003cul>\n\u003cli>공통 \u003ccode>SpatialStreamer\u003c/code>가 요청·준비·실패·해제 상태와 예산을 관리한다. 엔진별 어댑터가 실제 Splat 생성·표시·해제를 맡는다.\u003c/li>\n\u003cli>로드 거리 1.5 m, 해제 거리 2.5 m, 상주 예산 최대 3구역·750,000점이다. 로딩 중인 구역도 예산에 예약하며 해독을 한 번에 하나씩 수행한다.\u003c/li>\n\u003cli>구역 경계에 캡슐이 닿기 전에 필요한 구역이 준비돼야 이동할 수 있다. 지연 때 수평 이동을 막고 중력 처리는 유지한다.\u003c/li>\n\u003cli>멀어진 구역은 실제 렌더러 객체를 정리한다. 이미 진행 중인 SDK 해독은 취소하지 못하므로 늦은 결과가 오면 표시하지 않고 해제한다.\u003c/li>\n\u003cli>실패는 자동 반복 요청하지 않는다. 사용자가 \u003ccode>구역 로딩 재시도\u003c/code>로 다시 요청한다.\u003c/li>\n\u003cli>전체 공통 충돌 메시 24삼각형·1,052 B는 유지한다. 구역별 충돌 메시의 로드·해제까지 구현한 시험은 아니다.\u003c/li>\n\u003cli>설정 검증은 연속된 X 구역과 공통 Y/Z 범위를 요구한다. 해제 거리 안의 구역들이 예산을 초과하는 설정은 거부해 경계에서 영구 대기하는 구성 오류를 막는다. 임의 모양의 공간 분할이나 LRU 스케줄러는 지원하지 않는다.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"_4\">브라우저 확인\u003c/h2>\n\u003cp>Playwright MCP의 headed Chromium에서 앱을 하나씩 실행했다. 릴리스 \u003ccode>local-4d5905679d2e-cbfaf693149e\u003c/code>, 화면 1200×863·DPR 1.5. \u003ca href=\"measurements/2026-10-02/spatial-streaming.json\">전체 JSON\u003c/a>, \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">정상 경로 (원본 저장소 파일)\u003c/span>, \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">실패 주입 경로 (원본 저장소 파일)\u003c/span>.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>구성\u003c/th>\n\u003cth>시작 준비\u003c/th>\n\u003cth>경로 중 최대 예약\u003c/th>\n\u003cth>끝 구역 이동→시작 복귀\u003c/th>\n\u003cth style=\"text-align: right;\">로드/해제 횟수\u003c/th>\n\u003cth>낙하 복구 / JS 예외\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Three.js + BVH\u003c/td>\n\u003ctd>0·1 / 301,702점\u003c/td>\n\u003ctd>2구역 / 499,714점\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd style=\"text-align: right;\">9 / 7\u003c/td>\n\u003ctd>0 / 0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Three.js + Rapier\u003c/td>\n\u003ctd>동일\u003c/td>\n\u003ctd>동일\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd style=\"text-align: right;\">8 / 6\u003c/td>\n\u003ctd>0 / 0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PlayCanvas + Ammo\u003c/td>\n\u003ctd>동일\u003c/td>\n\u003ctd>동일\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd style=\"text-align: right;\">8 / 6\u003c/td>\n\u003ctd>0 / 0\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>세 구성 모두 전체 \u003ccode>current.sog\u003c/code> 요청 없이 이동과 복귀가 됐다. 로드 횟수 차이는 시간과 위치에 따른 해제·재요청 차이이며 성능 우열의 근거가 아니다. \u003ccode>requestedBytes\u003c/code>는 논리적 파일 요청 크기의 합이다. 브라우저 캐시 재사용을 포함한 실제 네트워크 전송량과 다르다.\u003c/p>\n\u003cp>BVH·Ammo에서는 구역 2의 응답 지연 중 경계 정지, 응답 후 이동 재개, 요청 실패 후 자동 재시도 없음·수동 복구, 로딩 중 시작점 복귀 후 늦은 구역 결과 폐기를 확인했다. Rapier는 정상 경로와 공통 상태 관리 단위 검사를 통과했지만 이 실패 주입 브라우저 시험은 별도로 하지 않았다.\u003c/p>\n\u003cp>추가로 Three.js BVH에서 전체 경로를 세 번 왕복했다. 각 복귀 후 \u003ccode>renderer.info.memory\u003c/code>는 geometry 2개·texture 10개로 유지됐고 상주 구역은 0·1로 돌아왔다. \u003ca href=\"measurements/2026-10-02/spatial-resource-cycles.json\">자원 수 기록\u003c/a>. GPU 바이트·프로세스 RAM을 측정한 결과가 아니며 PlayCanvas의 동등한 GPU 자원 수는 확보하지 않았다.\u003c/p>\n\u003cp>최종 릴리스 \u003ccode>local-4d5905679d2e-f6ec268ff18a\u003c/code>에서 \u003ccode>pnpm check\u003c/code>를 통과했다. 15개 자산의 크기·해시, 54개 자동 검사, 타입 검사와 두 앱 빌드·배포 목록 검증을 포함한다. 이후 headed Chromium으로 세 구성의 최초 선택 로딩과 PlayCanvas 왕복, BVH 패널 입력 복귀를 추가 확인했다. \u003ca href=\"measurements/2026-10-02/final-capabilities-sanity.json\">최종 확인 JSON\u003c/a>. 최종 확인에서 실패 주입과 전체 콘텐츠 경로를 모두 다시 실행한 것은 아니다.\u003c/p>\n\u003ch2 id=\"_5\">아직 남은 핵심 제한\u003c/h2>\n\u003cp>이 문서의 초기 시험에서는 로드하지 않은 먼 구역이 보이지 않았다. 현재는 \u003ca href=\"FAR-LOD.html\">저해상도 표현으로 유지\u003c/a>하지만 정밀 자산 교체 순간의 선명도 변화와 경계 품질 검수가 남아 있다. 엔진 고유 LOD 기능을 비교한 결과도 아니다.\u003c/p>\n\u003cp>이 시험은 작은 공통 충돌 바닥 위의 현재 장면만 지원한다. 분할과 시대 전환의 결합, 실제 복잡한 충돌 메시 분할, iPhone에서 분할 장면의 준비·이동·장시간 유지, 큰 야외 공간의 배경 유지가 남아 있다. 데스크톱의 성공을 모바일 안전 한도로 사용하지 않는다.\u003c/p>\n\u003ch2 id=\"_6\">직접 확인\u003c/h2>\n\u003cp>\u003ccode>./dev.sh --preview both\u003c/code> 후 장면 메뉴에서 \u003ccode>구역별 로딩 · 분할 시험\u003c/code>을 선택한다. \u003ca href=\"http://127.0.0.1:5173/?scene=stream&amp;controller=bvh\">Three.js BVH\u003c/a>, \u003ca href=\"http://127.0.0.1:5173/?scene=stream&amp;controller=rapier\">Rapier\u003c/a>, \u003ca href=\"http://127.0.0.1:5174/?scene=stream\">PlayCanvas\u003c/a>.\u003c/p>\n\u003cp>마우스를 잠그지 않아도 D로 오른쪽 구역까지, A로 시작 구역까지 이동할 수 있다. 상단 구역 상태가 바뀌는지, 경계에서 바닥을 잃지 않는지 확인한다. 현재 먼 구역은 저해상도로 유지된다. 이동 중 건물의 선명도가 바뀌는 정도도 확인한다.\u003c/p>\u003c/main>\u003cfooter>테스트 기간 2026-10-02~04 · 기존 측정 기록을 정리한 자료입니다. 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
