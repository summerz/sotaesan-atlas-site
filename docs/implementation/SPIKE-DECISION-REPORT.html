<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>3D 공간 스파이크 결과 보고서: 엔진 비교와 선택 · Sotaesan Atlas</title><style>body{background:#f6f4ec;color:#173c33;font-family:system-ui,sans-serif}</style></head><body><noscript>자료를 보려면 브라우저에서 JavaScript를 허용해 주세요.</noscript><script type="application/json" id="site-page">"\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>3D 공간 스파이크 결과 보고서: 엔진 비교와 선택 · Sotaesan Atlas\u003c/title>\u003cstyle>\n:root{color-scheme:light;--paper:#f6f4ec;--ink:#173c33;--green:#137466;--muted:#546960;--line:#cdd6cd}\n*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:\"Apple SD Gothic Neo\",\"Noto Sans KR\",system-ui,sans-serif;font-size:17px;line-height:1.75}\na{color:var(--green);text-underline-offset:4px}header{border-bottom:1px solid var(--line);padding:20px max(24px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}header>a{font-weight:700;text-decoration:none}nav{display:flex;gap:20px;font-size:15px;flex-wrap:wrap}main{max-width:1120px;margin:auto;padding:44px 24px 70px}h1,h2,h3{line-height:1.45;word-break:keep-all;letter-spacing:-.025em}h1{font-size:36px;margin:0 0 28px}h2{font-size:26px;margin:44px 0 20px;border-top:1px solid var(--line);padding-top:28px}h3{font-size:21px;margin-top:28px}p{word-break:keep-all}table{border-collapse:collapse;width:100%;font-size:15px;margin:22px 0}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{border-bottom:2px solid var(--ink);background:#e9eee5}pre{overflow:auto;background:#e9eee5;padding:20px;font-size:14px;line-height:1.6}code{font-size:.9em;overflow-wrap:anywhere}img{max-width:100%;height:auto}.table-scroll{overflow-x:auto}footer{max-width:1120px;margin:auto;border-top:1px solid var(--line);padding:24px;font-size:14px;color:var(--muted)}.intro{max-width:750px;font-size:21px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:32px 0}.button{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);text-decoration:none;border-radius:4px;padding:11px 22px;font-weight:600}.button.secondary{background:transparent;color:var(--green)}.summary{border-left:4px solid var(--green);padding:4px 24px;margin:38px 0;font-size:19px}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.resource{border:1px solid var(--line);padding:22px}.resource h3{margin:0 0 10px}.resource p{font-size:16px;margin:0;color:var(--muted)}.local-file{color:var(--muted)}.meta{color:var(--muted);font-size:14px}.toc{border:1px solid var(--line);padding:16px 24px;margin:28px 0;font-size:15px}.toc>ul{margin:0}.toc li{margin:4px 0}li{margin:8px 0}.downloads{margin:0 0 30px}.measurements ul{padding-left:24px}@media(max-width:650px){body{font-size:16px}main{padding:30px 18px 50px}h1{font-size:29px}h2{font-size:23px}.intro{font-size:19px}.resources{grid-template-columns:1fr}header{padding:16px 18px}table{min-width:680px}.actions{gap:10px}.button{padding:9px 16px}}@media print{header,footer,.downloads{display:none}main{max-width:none;padding:0}body{font-size:11pt}h1{font-size:24pt}h2{font-size:18pt}table{font-size:9pt}.table-scroll{overflow:visible}a{color:inherit}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/index.html\">직접 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">상세 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"SPIKE-DECISION-REPORT.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"3d\">3D 공간 스파이크 결과 보고서: 엔진 비교와 선택\u003c/h1>\n\u003cp>작성일: 2026-10-04 · 테스트 기간: 2026-10-02~04 · 대상: 이 저장소의 로컬 스파이크\u003c/p>\n\u003cp>발표 자료: \u003ca href=\"SPIKE-DECISION-PRESENTATION.html\">HTML\u003c/a> · \u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF 13장\u003c/a>. HTML은 방향키로 페이지를 넘길 수 있으며, 전체 보기와 인쇄도 지원한다.\u003c/p>\n\u003ch2 id=\"_1\">먼저 알아두면 좋은 프로젝트 배경\u003c/h2>\n\u003cp>이 프로젝트는 \u003cstrong>원불교 대종사 십상과 관련 성지를 웹의 가상 공간에서 둘러보고 이해할 수 있게 하는 것\u003c/strong>을 목표로 한다. 성지를 촬영한 사진을 가우시안 스플랫(Gaussian Splat)으로 변환해 공간의 모습을 담고, 웹 브라우저에서 그 안을 걸으며 역사·교법·장소 설명을 읽는 방식을 검토하고 있다. 현재 공간에 과거의 건물이나 구조물을 3D 모델로 더하고, 시대를 바꿔 살펴보는 경험도 염두에 두고 있다.\u003c/p>\n\u003ch3 id=\"_2\">왜 먼저 작은 기술 시험을 했나\u003c/h3>\n\u003cp>실제 성지를 촬영하고 콘텐츠를 제작하기 전에, 이 방식이 웹에서 가능한지부터 확인할 필요가 있었다. 사진으로 만든 공간을 화면에 띄우는 것뿐 아니라 바닥과 벽에 맞춰 걷기, 설명 열기, 시대 전환, 대형 장면의 로딩과 모바일 실행이 함께 동작해야 하기 때문이다. 이를 작은 실행 앱으로 만들어 확인하는 사전 기술 시험을 ‘스파이크’라고 부른다.\u003c/p>\n\u003cp>이번에는 같은 장면과 기능을 PlayCanvas와 Three.js로 구현하고 비교했다. 결과를 바탕으로 어떤 구성을 우선 검토할지, 실제 성지 제작에 들어가기 전에 무엇을 더 확인해야 할지 판단하려는 작업이다.\u003c/p>\n\u003ch3 id=\"_3\">특정 플랫폼에 되도록 묶이지 않는 구성\u003c/h3>\n\u003cp>콘텐츠를 특정 서비스의 편집기나 호스팅에만 남기지 않고, \u003cstrong>엔진이나 배포처가 바뀌어도 공간 자산과 설명 데이터를 계속 활용할 수 있게 하는 것\u003c/strong>이 설계 목표다. 두 앱이 같은 가우시안 스플랫·GLB 파일과 공통 \u003ccode>world.json\u003c/code>을 읽도록 구성했다. PlayCanvas도 호스팅 Editor 대신 Engine을 코드로 사용한다. 실행 앱은 정적 웹 파일로 빌드하며, 현재 공유 사이트는 GitHub Pages에 올려 두었다.\u003c/p>\n\u003cp>이는 의존성을 줄이려는 방향과 이번 시험에서 확인한 구성이다. 엔진별 표시·이동 코드는 따로 필요하며, 어떤 플랫폼으로든 수정 없이 옮길 수 있음을 검증한 결과는 아니다.\u003c/p>\n\u003ch3 id=\"_4\">화면에 나오는 두 시험용 공간은 어디서 왔나\u003c/h3>\n\u003cp>\u003cstrong>실제 성지를 촬영한 자료 대신, 인터넷에서 내려받을 수 있는 공개 가우시안 스플랫 샘플 두 개를 골라 사용했다.\u003c/strong> 대종사 십상과 관련된 장소를 보여주는 자료가 아니라 엔진과 기능을 시험하기 위한 공간이다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>시험용 원본\u003c/th>\n\u003cth>제작자·다운로드 출처\u003c/th>\n\u003cth>이번 시험에서 사용한 방식\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Knock Community Hall\u003c/td>\n\u003ctd>SteveB(scbenoit) · \u003ca href=\"https://superspl.at/scene/0ff2e6dc\">SuperSplat 공개 장면\u003c/a>\u003c/td>\n\u003ctd>점 수를 줄여 기본 공간으로 사용하고, 시대 전환·구역 로딩 시험 장면을 만들었다.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sunnyvale Heritage Park Museum\u003c/td>\n\u003ctd>Damjan Cvetkov Dimitrov(zeitgeistarchivescans) · \u003ca href=\"https://superspl.at/scene/d5d397aa\">SuperSplat 공개 장면\u003c/a>, \u003ca href=\"https://code.playcanvas.com/examples_data/example_sunnyvale/sunnyvale.sog\">PlayCanvas 예제의 SOG 파일\u003c/a>\u003c/td>\n\u003ctd>대형 원본의 로딩·보행·벽 비침을 확인하고, 분할·시대 전환 시험에도 사용했다.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>사이트의 여러 장면은 이 두 원본을 가공하거나 설정을 달리한 것이다. ‘과거 보기’의 건물·벽과 장소 설명도 기능 확인용으로 만든 시험 데이터이며 실제 역사 복원 결과가 아니다. 두 원본의 제작자와 다운로드 출처는 위 표에 정리했다. Sunnyvale 파일과 변환·이용 조건은 \u003ca href=\"SECOND-SCENE.html\">두 번째 장면 기록\u003c/a>에 남겼다.\u003c/p>\n\u003ch3 id=\"_5\">이번 결과로 판단할 수 있는 범위\u003c/h3>\n\u003cp>이번 스파이크는 \u003cstrong>이미 만들어진 가우시안 스플랫을 웹에서 표시하고 공간 탐색 기능을 결합하는 단계\u003c/strong>를 시험했다. 현장 촬영, 사진에서 가우시안 스플랫을 생성하는 과정, 실제 역사 공간 복원은 포함하지 않았다. 따라서 아래 결과는 웹 실행 기술을 선택하기 위한 근거이며, 전체 제작 과정의 품질·비용이나 완성된 서비스의 성능을 검증한 결과는 아니다.\u003c/p>\n\u003ch2 id=\"1\">1. 검토 결과 요약\u003c/h2>\n\u003cp>\u003cstrong>이번 테스트에서는 PlayCanvas + Ammo를 우선 후보로 추천한다.\u003c/strong> 같은 Sunnyvale 원본을 데스크톱에서 열었을 때 앱이 준비될 때까지 걸린 시간이 가장 짧았고, iPhone 11에서도 대형 원본의 준비 완료를 두 차례 확인했다. 핵심 기능은 세 구성 모두 구현하고 확인했으므로, 기능 지원 여부보다 로딩 성능의 차이가 선택에 더 큰 영향을 준다. 이번 스파이크 범위에서의 추천이며, 최종 엔진 선택이나 전체 서비스의 성능을 보장하는 결론은 아니다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>비교 항목\u003c/th>\n\u003cth>테스트 결과\u003c/th>\n\u003cth>선택 시 고려할 점\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>데스크톱 원본 로딩\u003c/td>\n\u003ctd>캐시 초기화(cold) 중앙값 BVH 2.784초 / Rapier 3.009초 / Ammo 1.560초\u003c/td>\n\u003ctd>현재 구성에서는 PlayCanvas가 유리\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>iPhone 대형 원본\u003c/td>\n\u003ctd>Ammo 준비 완료 2회, BVH 준비 완료 안 됨, Rapier 별도 테스트 안 함\u003c/td>\n\u003ctd>모바일에서도 원본을 열어야 한다면 PlayCanvas를 선택할 근거가 더 많음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>시대 전환·분할 로딩·설명·오류 복구\u003c/td>\n\u003ctd>데스크톱 세 구성 모두 통과\u003c/td>\n\u003ctd>이 기능의 지원 여부로 엔진을 제외할 이유는 없음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>축소·분할한 모바일 장면\u003c/td>\n\u003ctd>세 구성 모두 준비·이동·데이터 해제·다시 로딩 통과\u003c/td>\n\u003ctd>Three.js도 장면 데이터를 조정하면 모바일에서 사용할 수 있음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>벽 비침\u003c/td>\n\u003ctd>두 렌더러 모두 벽 뒤의 시험용 표시가 보임\u003c/td>\n\u003ctd>엔진을 바꾸는 것만으로 해결된다고 보기 어려움\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>제작·운영 비용\u003c/td>\n\u003ctd>변경 작업은 정리했으나 작업 시간과 요금은 측정하지 않음\u003c/td>\n\u003ctd>비용 순위나 총사업비를 산출할 수 없음\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Three.js + Spark + BVH도 대안으로 남겨둘 수 있다. 축소본을 여는 데 성공했어도 iPhone에서 대형 SH3 원본을 열지 못한 문제는 남아 있다. 기존 Three.js 시스템과의 연동이 중요하고 모바일용 데이터의 축소나 SH 조정이 가능하다면 선택이 달라질 수 있다. 다만 연동의 이점과 실제 작업 비용은 이번 테스트에서 측정하지 않았다.\u003c/p>\n\u003cp>Rapier를 기본 구성으로 바꿔야 할 근거는 아직 부족하다. 일부 Node 테스트에서는 벽이나 계단의 처리 비용이 낮았지만, 다른 구간과 준비 비용에서는 그렇지 않았다. 현재 Rapier 구성에는 가림 처리와 디버깅에 쓰는 BVH도 남아 있어 물리 라이브러리만 따로 비교한 결과는 아니다.\u003c/p>\n\u003ch2 id=\"2\">2. 비교 대상과 테스트 환경\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>구성·조건\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Three.js BVH\u003c/td>\n\u003ctd>Three.js 0.186.1 + Spark 2.2.0 + three-mesh-bvh 0.9.15\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Three.js Rapier\u003c/td>\n\u003ctd>위 렌더링 구성 + Rapier3D compat 0.21.0, BVH도 유지\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PlayCanvas Ammo\u003c/td>\n\u003ctd>PlayCanvas Engine 2.22.6 + Ammo, Engine을 코드로 사용하고 호스팅 Editor는 사용하지 않음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>데스크톱\u003c/td>\n\u003ctd>Apple M4 Pro, 브라우저 창을 띄운 Chromium 154(headed), ANGLE Metal 하드웨어 GPU, 앱 하나·테스트 탭 하나\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>로딩·안정성 테스트 화면\u003c/td>\n\u003ctd>1200×863 CSS px, 기기 DPR 2, 앱 DPR 상한 1.5, 탭이 화면에 보이고 포커스가 있는지 확인\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>iPhone\u003c/td>\n\u003ctd>실제 iPhone 11, 기기에서 조회한 iOS 27.0.1 / 24A446, Safari, Apple GPU\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>iPhone 초기 비교 화면\u003c/td>\n\u003ctd>375×616 CSS px, DPR 2, 앱 상한 1.5, 화면에는 표시되지만 \u003ccode>hasFocus=false\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sunnyvale 원본\u003c/td>\n\u003ctd>3,999,361점, SH3 SOG 58,072,500바이트, 원본 충돌 데이터 337,680삼각형\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hall 공통 장면\u003c/td>\n\u003ctd>현재 900,000점 / 과거 701,370점, 수동으로 만든 충돌용 프록시 24삼각형\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>장면이나 빌드 버전, 통계 집계 범위가 다른 결과는 합산하지 않았다. 로딩 시간은 앱에 준비 완료 표시가 나올 때까지 측정했으며, GPU가 첫 화면을 그리는 시점과는 다르다. 모바일의 합성 TouchEvent 테스트는 앱의 입력 처리를 확인한 것으로, 실제 손가락 조작의 사용성을 검증한 결과는 아니다. 모든 수치는 이번 로컬 테스트 환경에서 측정한 값이다.\u003c/p>\n\u003ch2 id=\"3\">3. 데스크톱 로딩 시간과 전송량\u003c/h2>\n\u003cp>Sunnyvale 원본으로 캐시 초기화(cold)와 캐시 유지(warm) 조건에서 구성별로 각각 3회, 총 18회 측정했다. 아래 표는 각 3회의 중앙값이다. cold에서는 HTTP 브라우저 캐시만 초기화했다. 프로세스·OS·DNS·GPU 캐시는 초기화하지 않았다. 요청을 가로채지 않았으며, 페이지와 워커(worker)의 HTTP 요청을 함께 집계했다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>지표\u003c/th>\n\u003cth style=\"text-align: right;\">Three.js BVH\u003c/th>\n\u003cth style=\"text-align: right;\">Three.js Rapier\u003c/th>\n\u003cth style=\"text-align: right;\">PlayCanvas Ammo\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>캐시 초기화 후 준비 시간(cold, ms)\u003c/td>\n\u003ctd style=\"text-align: right;\">2,784.2\u003c/td>\n\u003ctd style=\"text-align: right;\">3,008.5\u003c/td>\n\u003ctd style=\"text-align: right;\">1,559.9\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>캐시 초기화 후 준비 시간 범위(ms)\u003c/td>\n\u003ctd style=\"text-align: right;\">2,600.6~2,888.4\u003c/td>\n\u003ctd style=\"text-align: right;\">2,883.5~3,235.3\u003c/td>\n\u003ctd style=\"text-align: right;\">1,497.2~1,569.5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>캐시 유지 시 준비 시간(warm, ms)\u003c/td>\n\u003ctd style=\"text-align: right;\">1,742.0\u003c/td>\n\u003ctd style=\"text-align: right;\">2,021.4\u003c/td>\n\u003ctd style=\"text-align: right;\">766.9\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>캐시 초기화 후 HTTP 전송량(MB)\u003c/td>\n\u003ctd style=\"text-align: right;\">65.34\u003c/td>\n\u003ctd style=\"text-align: right;\">66.98\u003c/td>\n\u003ctd style=\"text-align: right;\">65.58\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>캐시 유지 시 HTTP 전송량(바이트)\u003c/td>\n\u003ctd style=\"text-align: right;\">1,120\u003c/td>\n\u003ctd style=\"text-align: right;\">1,299\u003c/td>\n\u003ctd style=\"text-align: right;\">1,374\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>MB는 1,000,000바이트 기준이다. localhost의 preview 빌드에서 측정했으므로 원격 CDN이나 모바일 회선의 로딩 시간을 예측하는 데 사용할 수 없다. 현재 구현 전체를 비교한 결과이며, 렌더러나 물리 라이브러리 하나의 영향만 분리한 값도 아니다.\u003c/p>\n\u003cp>Hall에서 시대를 연속 20왕복 전환했다. 각 방향의 첫 표본을 제외한 19회 중앙값은 다음과 같다. 클릭 요청부터 \u003ccode>switchDone\u003c/code>까지 측정했으며, GPU가 첫 화면을 표시할 때까지의 시간은 아니다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>전환 방향\u003c/th>\n\u003cth style=\"text-align: right;\">BVH\u003c/th>\n\u003cth style=\"text-align: right;\">Rapier\u003c/th>\n\u003cth style=\"text-align: right;\">Ammo\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>과거로(ms)\u003c/td>\n\u003ctd style=\"text-align: right;\">166.3\u003c/td>\n\u003ctd style=\"text-align: right;\">166.6\u003c/td>\n\u003ctd style=\"text-align: right;\">99.1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>현재로(ms)\u003c/td>\n\u003ctd style=\"text-align: right;\">194.0\u003c/td>\n\u003ctd style=\"text-align: right;\">192.7\u003c/td>\n\u003ctd style=\"text-align: right;\">114.3\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>근거: \u003ca href=\"LOADING-MEMORY-COMPARISON.html\">로딩·메모리 비교\u003c/a>, \u003ca href=\"measurements/2026-10-02/loading-browser.json\">로딩 원본 JSON\u003c/a>, \u003ca href=\"measurements/2026-10-02/era-memory-browser.json\">시대 전환 원본 JSON\u003c/a>.\u003c/p>\n\u003ch2 id=\"4\">4. 메모리, 이동 성능, 안정성\u003c/h2>\n\u003ch3 id=\"_6\">메모리 측정 범위\u003c/h3>\n\u003cp>Sunnyvale을 캐시 유지(warm) 상태에서 3회 실행한 결과의 중앙값이다. 안정화 시간을 두고 GC를 실행한 뒤 측정했으며, 메인 스레드와 워커를 나눠 기록했다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>측정값(MB)\u003c/th>\n\u003cth style=\"text-align: right;\">BVH\u003c/th>\n\u003cth style=\"text-align: right;\">Rapier\u003c/th>\n\u003cth style=\"text-align: right;\">Ammo\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>메인 JS 힙 \u003ccode>usedSize\u003c/code>\u003c/td>\n\u003ctd style=\"text-align: right;\">7.43\u003c/td>\n\u003ctd style=\"text-align: right;\">12.34\u003c/td>\n\u003ctd style=\"text-align: right;\">8.46\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>메인 \u003ccode>backingStorageSize\u003c/code>\u003c/td>\n\u003ctd style=\"text-align: right;\">269.19\u003c/td>\n\u003ctd style=\"text-align: right;\">279.71\u003c/td>\n\u003ctd style=\"text-align: right;\">79.40\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>워커 JS 힙 합계\u003c/td>\n\u003ctd style=\"text-align: right;\">1.46\u003c/td>\n\u003ctd style=\"text-align: right;\">1.46\u003c/td>\n\u003ctd style=\"text-align: right;\">0.30\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>워커 수\u003c/td>\n\u003ctd style=\"text-align: right;\">3\u003c/td>\n\u003ctd style=\"text-align: right;\">3\u003c/td>\n\u003ctd style=\"text-align: right;\">1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>워커 backing storage\u003c/td>\n\u003ctd style=\"text-align: right;\">각 약 0.053\u003c/td>\n\u003ctd style=\"text-align: right;\">각 약 0.053\u003c/td>\n\u003ctd style=\"text-align: right;\">84.19\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>공유 버퍼가 중복으로 집계될 수 있으므로 backing storage를 합산한 값을 실제 RAM 사용량으로 볼 수 없다. GPU/VRAM, 전체 프로세스 RAM, iPhone 메모리도 측정하지 않아 전체 메모리 사용량의 우열은 판단을 보류한다.\u003c/p>\n\u003ch3 id=\"_7\">이동 처리 비용과 프레임 간격\u003c/h3>\n\u003cp>데스크톱 브라우저에서 정지 상태와 외벽을 향해 전진하는 상태를 각각 30초씩 3회 측정했다. 세 구성의 총 실행 횟수는 18회다. 계측한 처리 시간의 p95를 반복별로 구한 뒤 중앙값을 계산하면 0.1~0.6ms 범위였다. Three.js는 앱의 보행 step, PlayCanvas는 엔진의 rigidbody system을 측정한다. 측정 범위와 벽에 닿는 위치가 달라 물리 엔진의 순위를 매길 수는 없다.\u003c/p>\n\u003cp>같은 테스트에서 측정한 전체 프레임 간격은 아래와 같다. 30초 구간마다 구한 p95의 3회 중앙값이며, 렌더링·물리·앱 실행이 모두 포함된다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>데스크톱 Sunnyvale 프레임 간격 p95(ms)\u003c/th>\n\u003cth style=\"text-align: right;\">BVH\u003c/th>\n\u003cth style=\"text-align: right;\">Rapier\u003c/th>\n\u003cth style=\"text-align: right;\">Ammo\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>시작점에서 정지\u003c/td>\n\u003ctd style=\"text-align: right;\">50.5\u003c/td>\n\u003ctd style=\"text-align: right;\">50.3\u003c/td>\n\u003ctd style=\"text-align: right;\">33.8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>외벽을 향해 전진\u003c/td>\n\u003ctd style=\"text-align: right;\">49.3\u003c/td>\n\u003ctd style=\"text-align: right;\">116.7\u003c/td>\n\u003ctd style=\"text-align: right;\">33.7\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>이번 조건에서는 PlayCanvas의 프레임 간격이 더 일정했다. 카메라와 접촉 위치, 처리 범위가 같지 않고 CPU와 GPU의 실행 시간을 나눠 분석하지 않아 차이의 원인은 확인하지 못했다. 작은 Hall 장면의 안정성 테스트 수치와는 따로 해석해야 한다.\u003c/p>\n\u003cp>별도 Node 60Hz 테스트의 p95 중앙값은 BVH/Rapier 각각 시작점(spawn) 0.0072/0.0393ms, 외벽 0.2963/0.1876ms, 계단 0.3140/0.1121ms였다. 구간에 따라 더 빠른 구성이 달랐다. 렌더링과 네트워크를 제외한 계산 테스트이므로 모바일 성능을 예측하는 데 사용할 수 없다.\u003c/p>\n\u003cp>추가로 현관 마루의 바닥을 보정한 뒤에는 세 구성 모두 왕복 이동, 정지, 난간 충돌 테스트를 통과했다. 원본 충돌 데이터에서 비어 있던 부분을 작은 공통 바닥으로 채운 결과다. Rapier의 계단 이동 차이는 남아 있으며, 분할·시대 장면에서 Rapier와 iPhone을 다시 검증한 결과는 아니다. 이전 문서에 기록한 벤치 왕복 이동 실패와 이 추가 테스트의 결과를 구분해야 한다.\u003c/p>\n\u003ch3 id=\"10\">약 10분간의 안정성 테스트\u003c/h3>\n\u003cp>Hall에서 구성별로 1회씩, 20×30초 구간 동안 시대 전환과 패널·충돌 표시 조작을 테스트했다. 세 구성 모두 앱 예외, unhandled rejection, 앱 진단 오류, WebGL context lost가 확인되지 않았다. 프레임 간격 p95는 세 구성 모두 17.4ms였다. PlayCanvas에는 favicon 404 메시지가 별도로 있어 콘솔 메시지가 전혀 없었다고 볼 수는 없다.\u003c/p>\n\u003cp>이 결과는 작은 Hall 장면에 한정된다. Sunnyvale 대형 원본이나 모바일의 장시간 안정성, 강제로 WebGL 컨텍스트를 잃은 뒤의 복구, 메모리 누수 여부는 검증하지 않았다.\u003c/p>\n\u003cp>근거: \u003ca href=\"PHYSICS-COST-COMPARISON.html\">이동 처리 비용\u003c/a>, \u003ca href=\"measurements/2026-10-02/physics-node.json\">Node 원본\u003c/a>, \u003ca href=\"PORCH-WALKMESH-REPAIR.html\">현관 바닥 보정\u003c/a>, \u003ca href=\"STABILITY-COMPARISON.html\">안정성 비교\u003c/a>, \u003ca href=\"measurements/2026-10-02/stability-browser.json\">안정성 원본\u003c/a>.\u003c/p>\n\u003ch2 id=\"5-iphone\">5. iPhone 테스트 결과\u003c/h2>\n\u003ch3 id=\"_8\">대형 원본과 비교용 데이터\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>구성·데이터\u003c/th>\n\u003cth>결과\u003c/th>\n\u003cth>해석 시 주의할 점\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>PlayCanvas Ammo / Sunnyvale 원본 SH3\u003c/td>\n\u003ctd>두 차례 준비 완료\u003c/td>\n\u003ctd>실제 iPhone에서 원본 로딩에 성공했으나 같은 조건으로 반복 측정한 시간 비교는 아님\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Three.js BVH / 같은 원본 SH3\u003c/td>\n\u003ctd>준비 완료 안 됨\u003c/td>\n\u003ctd>추가 진단에서 다운로드는 2.250초에 끝났으나 73.030초까지 디코딩·준비 완료를 확인하지 못함\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Three.js Rapier / 같은 대형 원본\u003c/td>\n\u003ctd>별도 테스트 안 함\u003c/td>\n\u003ctd>BVH의 실패를 Rapier에서 측정한 실패로 기록하지 않음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Three.js BVH / 같은 점 수 SH0\u003c/td>\n\u003ctd>준비 47.320초, 디코딩 43.412초\u003c/td>\n\u003ctd>고차 SH를 제거한 비교용 데이터는 성공했으나 원본 SH3 문제는 남아 있음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>축소 900,000점 SH0 분할 / 세 구성\u003c/td>\n\u003ctd>준비·이동·데이터 해제·다시 로딩 통과\u003c/td>\n\u003ctd>품질과 입력 조건이 다른 기능 테스트\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>PlayCanvas의 두 실행에서 앱 준비 완료 표시는 약 14.97초와 19.11초에 나왔다. 캐시와 실행 조건을 맞춘 반복 비교가 아니므로 BVH의 비교용 데이터와 몇 배 빠른지 계산하지 않는다. 첫 실행의 탐색 프레임 기록에는 약 1.57초 지연도 있었다. 로딩 성공만으로 탐색이 부드럽다고 판단할 수는 없다.\u003c/p>\n\u003cp>대형 원본이 열리지 않은 원인은 아직 확인하지 못했다. 고차 SH 처리와 메모리 할당이 조사 대상이지만, 메모리 부족(OOM)이나 특정 SDK의 결함으로 단정할 수는 없다. 다운로드가 끝났어도 데이터 디코딩과 앱 준비까지 끝난 것은 아니다. 추가 테스트에서 900,000점 단일 축소본의 준비 완료를 확인한 시각은 48.501초였지만, 정확히 그때 준비됐다는 뜻은 아니므로 로딩 시간으로 사용하지 않는다.\u003c/p>\n\u003ch3 id=\"hall\">작은 Hall 장면에서 정지 상태의 프레임 간격\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>지표\u003c/th>\n\u003cth style=\"text-align: right;\">BVH\u003c/th>\n\u003cth style=\"text-align: right;\">Rapier\u003c/th>\n\u003cth style=\"text-align: right;\">Ammo\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>30초×3회 통합 p95(ms)\u003c/td>\n\u003ctd style=\"text-align: right;\">65\u003c/td>\n\u003ctd style=\"text-align: right;\">78\u003c/td>\n\u003ctd style=\"text-align: right;\">52\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>프레임 수\u003c/td>\n\u003ctd style=\"text-align: right;\">1,509\u003c/td>\n\u003ctd style=\"text-align: right;\">1,540\u003c/td>\n\u003ctd style=\"text-align: right;\">2,242\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>온도·배터리·실행 순서·캐시를 통제하지 않았고 \u003ccode>hasFocus=false\u003c/code>였다. 이번 조건에서는 PlayCanvas의 정지 상태 프레임 간격이 짧았다. 초기 이동 테스트는 바닥 밖으로 떨어지거나 구성별 복구 방식이 달라 정상 보행 성능 비교에서 제외했다. 이후 데스크톱에서 확인한 복구 기능의 결과를 iPhone 성능 재측정 결과와 섞지 않는다.\u003c/p>\n\u003cp>근거: \u003ca href=\"MOBILE-COMPARISON.html\">모바일 비교\u003c/a>, \u003ca href=\"measurements/2026-10-02/ios-browser.json\">원본\u003c/a>, \u003ca href=\"measurements/2026-10-02/ios-loading-observations.json\">로딩 기록\u003c/a>, \u003ca href=\"MOBILE-DECODER-CONTROLS.html\">디코딩 비교 테스트\u003c/a>, \u003ca href=\"measurements/2026-10-02/ios-decoder-controls.json\">비교 테스트 원본\u003c/a>.\u003c/p>\n\u003ch2 id=\"6\">6. 핵심 기능과 장면 분할 로딩\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>확인 항목\u003c/th>\n\u003cth>BVH\u003c/th>\n\u003cth>Rapier\u003c/th>\n\u003cth>Ammo\u003c/th>\n\u003cth>테스트 조건\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>시대별 화면·충돌 데이터 교체, 겹칠 때 안전한 위치로 이동\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>데스크톱, 시대별로 설정한 가상 벽\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>전환 실패 → 이전 시대 복구 → 재시도\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>데스크톱에서 의도적으로 오류 발생\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>구역별 상세 화면·충돌 데이터 함께 로딩·해제·다시 로딩\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>Sunnyvale 축소 SH0, 데스크톱·iPhone\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>시대별 설명, 전환 시 이전 패널 정리\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>Sunnyvale 추가 데스크톱 테스트\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sunnyvale 분할 로딩 + 시대 전환 + 설명 연동\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>통과\u003c/td>\n\u003ctd>추가 데스크톱 테스트, iPhone 재검증은 아님\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Sunnyvale을 900,000점 SH0로 다시 인코딩한 뒤 X축 방향으로 6개 구역으로 나눴다. 원본 3,999,361점 SH3와는 시각 품질이 다르다.\u003c/p>\n\u003cul>\n\u003cli>시작 시 불러오는 데이터는 8.72MB, 축소·분할한 전체 데이터는 18.39MB다. 약 52.6% 감소는 같은 축소·분할 데이터 전체를 기준으로 계산했다. 58.07MB 원본과 같은 품질을 유지하면서 줄인 수치가 아니다.\u003c/li>\n\u003cli>테스트한 경로에서는 상세 구역을 최대 2개 유지했고, 원거리 표현을 포함한 논리적 상주 점 수는 최대 448,028점이었다. 원거리 표현 30,003점은 화면에서 숨긴 구역도 메모리에 남는다. 시작 시 실제 표시 점 수는 434,093점이다. 이 점 수를 RAM 절감량으로 환산하지 않는다.\u003c/li>\n\u003cli>충돌 데이터를 나누면서 원본 면은 유지했다. 경계에서 중복된 면 때문에 삼각형은 337,680→344,098개로 약 1.90% 늘었으며, 새 바닥을 추가한 것은 아니다.\u003c/li>\n\u003cli>정상 동작과 오류 상황을 테스트한 9개 원본 기록은 모두 \u003ccode>passed:true\u003c/code>다. iPhone에서는 합성 이벤트로 입력했으며, 프레임 p95나 실제 RAM 사용량, 장시간 탐색 성능을 측정한 결과는 아니다.\u003c/li>\n\u003cli>추가 데스크톱 연동 테스트에서 PlayCanvas의 \u003ccode>1 splats lost due to sortKey overflow\u003c/code> 경고가 7회 있었다. 시각 품질에 영향을 줄 가능성이 있어 확인이 필요한 항목으로 남긴다.\u003c/li>\n\u003c/ul>\n\u003cp>과거 장면은 현재 촬영한 SOG에서 가상 벽과 설명을 바꿔 테스트했다. 실제 과거 건물이나 시대별 바닥, 역사 자료를 제작하고 검증한 결과는 아니다.\u003c/p>\n\u003cp>근거: \u003ca href=\"CRITICAL-CAPABILITIES.html\">핵심 기능\u003c/a>, \u003ca href=\"PAIRED-SPATIAL-STREAMING.html\">화면·충돌 데이터 함께 분할하기\u003c/a>, \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">9개 원본 기록 (원본 저장소 파일)\u003c/span>, \u003ca href=\"SUNNYVALE-ERA-INTEGRATION.html\">Sunnyvale 시대 전환·설명 연동\u003c/a>.\u003c/p>\n\u003ch2 id=\"7\">7. 벽 비침: 두 렌더러에서 확인한 품질 문제\u003c/h2>\n\u003cp>두 앱에서 카메라 위치와 방향을 같게 맞췄을 때, 원본 SOG의 벽 뒤에 둔 불투명 주황색 표시가 벽을 통해 보였다. 선택한 픽셀의 시선 방향에서 충돌 벽까지의 거리는 1.644~1.809m로, 카메라의 근거리 표시 한계(near)인 0.05m보다 충분히 멀었다. 이 조건에서 나타난 현상을 단순히 카메라 근접 영역이 잘린 결과로 설명하기는 어렵다.\u003c/p>\n\u003cp>사용자가 처음 본 빨간 박스와 위치 JSON은 남아 있지 않다. 당시 화면을 정확히 재현했는지, 어두운 형태가 실제 가구인지 판단하지 않는다. 두 앱에서 같은 현상이 보였다는 사실만으로 SOG 원본의 문제인지, 특정 렌더러의 문제인지 단정할 수도 없다.\u003c/p>\n\u003cp>벽 일부에 불투명 GLB 면을 덧댄 테스트에서는 고정된 4시점×2엔진의 시험용 표시 영역 차이가 0이었다. 해당 영역을 가릴 수 있음을 확인한 것이다. 이어 이동·시대 전환·근접 시점의 화면 76장을 저장했다. 벽 가까이에서 아래를 보면 보정 면의 범위와 질감 경계가 드러났고, 표시로 향하는 시선이 보정 면의 위쪽을 벗어났다. 부분 보정은 가능했지만 완성된 보정 데이터로 보기는 어렵다.\u003c/p>\n\u003cp>벽을 제대로 가리는지는 두 렌더러 모두 확인해야 할 품질 문제다. 엔진 선택과 별도로 촬영 데이터와 보정 면을 제작하고 검수해야 한다. 이번 보고서에서는 여기까지 확인한 결과로 판단하며, 추가 보정을 완료 조건으로 삼지 않는다.\u003c/p>\n\u003cp>근거: \u003ca href=\"SUNNYVALE-WALL-AUDIT.html\">벽 비침 조사\u003c/a>, \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">고정 시점 원본 (원본 저장소 파일)\u003c/span>, \u003ca href=\"measurements/2026-10-04/wall-audit/walking-probes/README.html\">이동·시대 전환·근접 시점 기록\u003c/a>, \u003ca href=\"measurements/2026-10-04/wall-audit/walking-probes/index.html\">이미지 갤러리\u003c/a>.\u003c/p>\n\u003ch2 id=\"8\">8. 제작·변경 작업과 비용\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>작업\u003c/th>\n\u003cth>확인한 구현 방식\u003c/th>\n\u003cth>아직 측정하지 않은 비용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>장면 데이터 교체\u003c/td>\n\u003ctd>SOG/GLB + 매니페스트·해시·좌표·충돌 데이터 정합 검사\u003c/td>\n\u003ctd>촬영·정합·품질 검수 시간\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>구역 분할·LOD\u003c/td>\n\u003ctd>공통 Python 생성기 + 엔진별 생성·해제\u003c/td>\n\u003ctd>경계 검수, 다른 장소에도 적용할 수 있도록 확장, 변경분만 제작\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>시대·설명 작성\u003c/td>\n\u003ctd>작성용 JSON → 공통 생성·검사 → 두 엔진에 적용\u003c/td>\n\u003ctd>실제 역사 자료·건물·충돌 데이터 제작 시간\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>이동·벽 보정\u003c/td>\n\u003ctd>공통 충돌·화면 데이터 + 각 이동 제어기 검증\u003c/td>\n\u003ctd>실제 치수 확인·모바일 검수 시간\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>배포\u003c/td>\n\u003ctd>양쪽 빌드 결과에 공용 데이터 전체 복사\u003c/td>\n\u003ctd>저장·전송 요금과 서비스 이용량\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>Sunnyvale 데이터 18개를 생성하는 데 걸린 80.325초는 프로그램의 변환 시간이다. 사람이 제작하거나 검수한 시간이 아니다. 실행 중 필요한 데이터만 불러오면 요청량은 줄지만, 현재 배포 방식에서 저장 용량까지 줄어드는 것은 아니다. 이번 구현에서는 PlayCanvas Editor를 사용하지 않으므로 Editor 사용료를 필수 비용으로 포함하지 않는다.\u003c/p>\n\u003cp>근거: \u003ca href=\"AUTHORING-COST.html\">제작·변경 작업과 의존성\u003c/a>.\u003c/p>\n\u003ch2 id=\"9\">9. 엔진 선택에 반영할 사항\u003c/h2>\n\u003col>\n\u003cli>대형 원본을 모바일에서도 열고 초기 로딩 시간을 줄이는 것이 중요하다면 PlayCanvas + Ammo를 우선 검토한다. 이번 테스트에서 가장 직접적으로 확인한 장점이다.\u003c/li>\n\u003cli>기존 Three.js 시스템과의 연동이 중요하고 데이터 축소나 SH 조정이 가능하다면 Three.js + BVH를 대안으로 검토한다. 원본 SH3의 모바일 로딩 문제와 시각 품질 변화도 함께 고려해야 한다.\u003c/li>\n\u003cli>현재 결과만으로 Rapier를 기본 구성으로 채택하지는 않는다. 특정 이동 기능이 필요할 때 검토할 후보로 남겨둔다.\u003c/li>\n\u003cli>벽 비침, 실제 시대별 데이터, 모바일 사용성, 제작 시간은 공통으로 남은 검토 항목이다. 스파이크에서 모든 문제를 수정하지 않아도 후보 선택은 가능하다.\u003c/li>\n\u003c/ol>\n\u003cp>이 자료는 후보를 고르는 데 사용한다. 전체 RAM·GPU 메모리, 실제 손가락 조작, Android, 대형 장면의 모바일 장시간 안정성, 전체 제작·운영비는 아직 판단할 수 없다. 해당 항목을 검증 완료로 표시하거나 가중 점수로 환산하지 않는다.\u003c/p>\n\u003ch2 id=\"10_1\">10. 근거 자료와 빌드 버전\u003c/h2>\n\u003cp>아래 짧은 식별자는 모두 \u003ccode>local-4d5905679d2e-\u003c/code> 뒤의 값이다. 빌드 버전이 다른 수치를 같은 빌드에서 측정한 결과처럼 합산하지 않았다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>테스트 기록\u003c/th>\n\u003cth>주요 빌드 식별자\u003c/th>\n\u003cth>근거 자료\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>10-02 원본 로딩·메모리\u003c/td>\n\u003ctd>\u003ccode>5135b39646a7\u003c/code>\u003c/td>\n\u003ctd>18회 로딩, Hall 연속 전환\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10-02 안정성·초기 iPhone\u003c/td>\n\u003ctd>\u003ccode>6df18be3ac38\u003c/code>\u003c/td>\n\u003ctd>Hall 약 10분, 정지 상태 프레임·대형 원본 기록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10-02 오류 대응·디코딩 비교\u003c/td>\n\u003ctd>\u003ccode>882e63d01db8\u003c/code>\u003c/td>\n\u003ctd>데스크톱 복구 기능, iPhone SH 비교\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10-03 화면·충돌 데이터 함께 분할\u003c/td>\n\u003ctd>\u003ccode>ee9a19b94a78\u003c/code>\u003c/td>\n\u003ctd>데스크톱·iPhone 9개 기록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10-03 Sunnyvale 시대 전환·설명 연동\u003c/td>\n\u003ctd>\u003ccode>89a5df9eff9e\u003c/code>\u003c/td>\n\u003ctd>추가 데스크톱 기능 테스트, 이전 처리 비용 표본과 구분\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10-03~04 벽 조사·부분 보정\u003c/td>\n\u003ctd>각 원본 JSON 참조\u003c/td>\n\u003ctd>카메라와 world 응답을 바꾼 화면 테스트, 로딩 성능 표본에서 제외\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>이 보고서와 발표 자료는 기존 테스트 기록을 정리한 것이다. 작성 과정에서 앱 소스를 수정하거나 성능을 다시 측정하지 않았다.\u003c/p>\u003c/main>\u003cfooter>테스트 기간 2026-10-02~04 · 기존 측정 기록을 정리한 자료입니다. 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
