<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>두 번째 장면: Sunnyvale Museum 벽 비교 · Sotaesan Atlas</title><style>body{background:#f6f4ec;color:#173c33;font-family:system-ui,sans-serif}</style></head><body><noscript>자료를 보려면 브라우저에서 JavaScript를 허용해 주세요.</noscript><script type="application/json" id="site-page">"\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>두 번째 장면: Sunnyvale Museum 벽 비교 · Sotaesan Atlas\u003c/title>\u003cstyle>\n:root{color-scheme:light;--paper:#f6f4ec;--ink:#173c33;--green:#137466;--muted:#546960;--line:#cdd6cd}\n*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:\"Apple SD Gothic Neo\",\"Noto Sans KR\",system-ui,sans-serif;font-size:17px;line-height:1.75}\na{color:var(--green);text-underline-offset:4px}header{border-bottom:1px solid var(--line);padding:20px max(24px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}header>a{font-weight:700;text-decoration:none}nav{display:flex;gap:20px;font-size:15px;flex-wrap:wrap}main{max-width:1120px;margin:auto;padding:44px 24px 70px}h1,h2,h3{line-height:1.45;word-break:keep-all;letter-spacing:-.025em}h1{font-size:36px;margin:0 0 28px}h2{font-size:26px;margin:44px 0 20px;border-top:1px solid var(--line);padding-top:28px}h3{font-size:21px;margin-top:28px}p{word-break:keep-all}table{border-collapse:collapse;width:100%;font-size:15px;margin:22px 0}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{border-bottom:2px solid var(--ink);background:#e9eee5}pre{overflow:auto;background:#e9eee5;padding:20px;font-size:14px;line-height:1.6}code{font-size:.9em;overflow-wrap:anywhere}img{max-width:100%;height:auto}.table-scroll{overflow-x:auto}footer{max-width:1120px;margin:auto;border-top:1px solid var(--line);padding:24px;font-size:14px;color:var(--muted)}.intro{max-width:750px;font-size:21px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:32px 0}.button{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);text-decoration:none;border-radius:4px;padding:11px 22px;font-weight:600}.button.secondary{background:transparent;color:var(--green)}.summary{border-left:4px solid var(--green);padding:4px 24px;margin:38px 0;font-size:19px}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.resource{border:1px solid var(--line);padding:22px}.resource h3{margin:0 0 10px}.resource p{font-size:16px;margin:0;color:var(--muted)}.local-file{color:var(--muted)}.meta{color:var(--muted);font-size:14px}.toc{border:1px solid var(--line);padding:16px 24px;margin:28px 0;font-size:15px}.toc>ul{margin:0}.toc li{margin:4px 0}li{margin:8px 0}.downloads{margin:0 0 30px}.measurements ul{padding-left:24px}@media(max-width:650px){body{font-size:16px}main{padding:30px 18px 50px}h1{font-size:29px}h2{font-size:23px}.intro{font-size:19px}.resources{grid-template-columns:1fr}header{padding:16px 18px}table{min-width:680px}.actions{gap:10px}.button{padding:9px 16px}}@media print{header,footer,.downloads{display:none}main{max-width:none;padding:0}body{font-size:11pt}h1{font-size:24pt}h2{font-size:18pt}table{font-size:9pt}.table-scroll{overflow:visible}a{color:inherit}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/index.html\">직접 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">상세 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"SECOND-SCENE.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"sunnyvale-museum\">두 번째 장면: Sunnyvale Museum 벽 비교\u003c/h1>\n\u003ch2 id=\"_1\">목적과 출처\u003c/h2>\n\u003cp>기존 Knock Hall 한 장면에서만 관찰한 벽 근접 비침을 다른 촬영 데이터로 확인한다. 새 장면은 \u003cstrong>Sunnyvale Heritage Park Museum\u003c/strong>, 제작자는 \u003cstrong>Damjan Cvetkov Dimitrov (zeitgeistarchivescans)\u003c/strong>다.\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"https://superspl.at/scene/d5d397aa\">장면 원본과 제작자\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://github.com/playcanvas/engine/blob/main/examples/src/examples/gaussian-splatting/first-person.example.mjs\">PlayCanvas 공식 1인칭 보행 예제\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://code.playcanvas.com/examples_data/example_sunnyvale/sunnyvale.sog\">배포 SOG\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://code.playcanvas.com/examples_data/example_sunnyvale/sunnyvale.glb\">함께 배포된 충돌 GLB\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>SOG 내부 \u003ccode>license.txt\u003c/code>는 제작자 표시를 요구하는 \u003ca href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0\u003c/a>을 명시한다. 위 제작자와 출처를 기록한다.\u003c/p>\n\u003ch2 id=\"_2\">실행과 확인\u003c/h2>\n\u003cp>현재 실행 중인 서버에서 다음 주소를 연다. 상단 \u003ccode>장면\u003c/code> 메뉴로도 선택할 수 있다. 장면을 바꾸면 페이지가 다시 로드된다.\u003c/p>\n\u003cul>\n\u003cli>Three.js: \u003ca href=\"http://127.0.0.1:5173/?scene=sunnyvale\">http://127.0.0.1:5173/?scene=sunnyvale\u003c/a>\u003c/li>\n\u003cli>PlayCanvas: \u003ca href=\"http://127.0.0.1:5174/?scene=sunnyvale\">http://127.0.0.1:5174/?scene=sunnyvale\u003c/a>\u003c/li>\n\u003cli>기존 장면: 각 주소의 \u003ccode>?scene=hall\u003c/code> 또는 쿼리가 없는 기본 주소\u003c/li>\n\u003c/ul>\n\u003cp>서버가 종료된 경우 \u003ccode>./dev.sh --preview both\u003c/code>로 실행한다. 코드 변경 후 다시 실행할 때는 \u003ccode>pnpm build:spikes\u003c/code>로 빌드한다.\u003c/p>\n\u003cp>같은 창 크기로 한 앱씩 확인한다. 이번에는 기존 비교 경로와 JSON 측정을 반복할 필요가 없다.\u003c/p>\n\u003col>\n\u003cli>로드가 끝나면 벽을 멀리서 바라본다. 처음부터 구멍이나 배경 비침이 있는지 확인한다.\u003c/li>\n\u003cli>벽에 가까이 걸어가 충돌로 멈추는 지점에서 확인한다. 접근하면서 비침이 생기는지, 벽을 통과하는지 구분한다.\u003c/li>\n\u003cli>그 상태에서 옆으로 이동하고 시선을 돌린다. 비침이 벽의 같은 위치에 남는지, 시선에 따라 바뀌는지 확인한다.\u003c/li>\n\u003cli>다른 앱에서 같은 벽과 비슷한 위치를 확인한다. \u003ccode>R\u003c/code> 또는 \u003ccode>시작점으로\u003c/code>로 복귀할 수 있다.\u003c/li>\n\u003c/ol>\n\u003cp>비침이 보이면 장면·벽 위치·거리·충돌 여부를 적고 화면을 남긴다. 수동 이동은 정확히 같은 카메라 위치를 보장하지 않으므로 스크린샷 차이만으로 엔진 문제를 확정하지 않는다.\u003c/p>\n\u003ch3 id=\"_3\">충돌 면과 문제 위치 기록\u003c/h3>\n\u003cp>두 앱에 \u003ccode>충돌 면 보기\u003c/code>와 \u003ccode>위치 JSON 저장\u003c/code>을 추가했다. \u003ccode>Esc\u003c/code>로 마우스를 해제하고 버튼을 누른다.\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>충돌 면 보기\u003c/code>: 촬영 장면과 표시 오브젝트를 숨기고 충돌 삼각형을 청록색 선으로 표시한다. Three.js는 보행 BVH가 사용하는 변환 완료 메시를 그대로 표시한다. PlayCanvas는 물리에 연결한 GLB의 렌더 메시를 같은 변환으로 표시한다. 시점을 유지한 채 \u003ccode>촬영 장면 보기\u003c/code>로 돌아올 수 있다. 이 표시는 시각 비교를 위한 것으로 물리 계산을 바꾸지 않는다.\u003c/li>\n\u003cli>\u003ccode>위치 JSON 저장\u003c/code>: 앱 이름, 월드/레이어, 릴리스, 창 크기, 발·눈 위치, 시선, 속도, 보행 설정, 실제 적용 경사 제한, 자산 해시와 변환을 저장한다. 파일 이름은 \u003ccode>three-location-시간.json\u003c/code> 또는 \u003ccode>playcanvas-location-시간.json\u003c/code>이다.\u003c/li>\n\u003cli>비교 경로 재생과 시대 전환을 시작하면 충돌 면 표시를 끈다. 재생 중에는 위치 기록과 충돌 표시 버튼이 비활성화된다. 성능 측정은 새로고침한 뒤 충돌 표시를 사용하기 전에 진행한다. 표시를 한 번 켜면 진단 렌더 자원이 메모리에 남는다.\u003c/li>\n\u003c/ul>\n\u003cp>문제 위치에서 촬영 화면과 충돌 화면을 각각 캡처하고 JSON을 함께 남긴다. 벤치 뒤로 떨어지는 경우 넘어가기 전과 떨어진 후의 위치를 각각 기록한다. 막힌 곳에서 \u003ccode>R\u003c/code> 또는 \u003ccode>시작점으로\u003c/code>로 복귀할 수 있다.\u003c/p>\n\u003ch3 id=\"_4\">사용자 관찰과 보행 구현의 차이\u003c/h3>\n\u003cp>사용자는 건물 통과가 전반적으로 개선됐지만 다음 현상이 남았다고 보고했다.\u003c/p>\n\u003col>\n\u003cli>현관 창문 아래 벽에 다른 형상이 겹쳐 보인다. 두 앱의 같은 벽에서 보이며, 벽 뒤 가구라는 해석은 아직 확인되지 않았다. 공통 SOG 데이터, 시점과 벽 정합을 조사해야 한다. 충돌 메시를 표시한다고 Splat 불투명도가 수정되지는 않는다.\u003c/li>\n\u003cli>현관 벤치를 넘어가면 약간 아래로 떨어지고 되돌아오지 못한다. 두 앱의 같은 구간에서 발생한다. 충돌 표면의 높이 차이·빈 부분과 보행 처리를 위치 기록으로 확인해야 한다. 원인과 수정 여부는 아직 확정하지 않았다.\u003c/li>\n\u003cli>앞 계단을 올라가는 경로가 앱마다 다르다. 같은 GLB를 읽지만 보행 처리가 같지 않다.\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>보행 처리\u003c/th>\n\u003cth>Three.js\u003c/th>\n\u003cth>PlayCanvas\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>충돌 표면\u003c/td>\n\u003ctd>공통 GLB를 월드 좌표로 구워 만든 BVH\u003c/td>\n\u003ctd>공통 GLB로 만든 Ammo 정적 메시\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>플레이어\u003c/td>\n\u003ctd>직접 구현한 캡슐 침투 해소·속도 보정\u003c/td>\n\u003ctd>질량 75의 동적 캡슐, 마찰 0.8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>maxSlopeDeg: 35\u003c/code>\u003c/td>\n\u003ctd>가파른 위쪽 접촉을 수평 벽으로 처리\u003c/td>\n\u003ctd>설정을 적용하지 않음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>일정 높이의 계단을 자동으로 넘는 처리\u003c/td>\n\u003ctd>최대 20cm, 앞쪽 착지 면과 캡슐 이동 공간 확인\u003c/td>\n\u003ctd>없음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>입력 없이 서 있을 때\u003c/td>\n\u003ctd>지지가 유지되면 위치와 속도를 고정\u003c/td>\n\u003ctd>동적 캡슐의 중력·접촉·마찰 계산 유지\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>복귀\u003c/td>\n\u003ctd>미해결 침투·시작 높이보다 10 m 아래면 최근 지지 위치로 복귀, 수동 R\u003c/td>\n\u003ctd>수동 R\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>현재 계단 반응을 엔진 자체의 보행 성능 차이로 판정하면 안 된다. 공통 캡슐 크기와 이동 속도만 맞춘 상태다. 실제 탐방 보행을 평가하려면 계단 높이, 경사 제한, 지면 추종, 작은 낙차와 막힌 구간의 복귀 정책을 정하고 양쪽 구현에서 적용해야 한다. 이번 진단 기능 추가에서는 보행 처리와 충돌 자산을 변경하지 않았다.\u003c/p>\n\u003ch2 id=\"_5\">데이터와 연결 방식\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>기존 Knock Hall\u003c/th>\n\u003cth>추가 Sunnyvale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Gaussian 수\u003c/td>\n\u003ctd>900,000\u003c/td>\n\u003ctd>3,999,361\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SOG 처리\u003c/td>\n\u003ctd>축소 후 SH 0으로 변환\u003c/td>\n\u003ctd>배포 SOG 그대로 사용, 포함된 SH 유지\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>충돌 메시\u003c/td>\n\u003ctd>수동 상자 프록시 24삼각형\u003c/td>\n\u003ctd>장면과 함께 배포된 메시 337,680삼각형\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>장면 기능\u003c/td>\n\u003ctd>보행, 정보, 현재·과거, 비교 경로\u003c/td>\n\u003ctd>보행과 벽 근접 확인\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>추가 장면은 더 크고 시선에 따른 색 표현 데이터도 다르다. 기존 장면과의 FPS 차이를 엔진 성능 차이로 해석하지 않는다. 기존 측정 결과에 새 장면 결과를 섞지 않는다. Sunnyvale에는 실제 과거 자료나 장소 설명을 추가하지 않았으며 과거 버튼과 경로 재생 버튼을 표시하지 않는다.\u003c/p>\n\u003cp>\u003cstrong>SOG에만 Z축 180° 회전\u003c/strong>을 적용하고 충돌 GLB는 회전 없이 사용한다. 기존 장면의 X축 회전과 별도로 \u003ccode>shared/public/world/sunnyvale.json\u003c/code>에 기록했다. 시작 발 위치는 \u003ccode>[0, 0.17, 0]\u003c/code>, 눈높이는 1.6이다. 회전하지 않은 충돌 메시의 시작점 지면 높이는 약 0.107이다. 단위는 공식 예제의 사용 방식을 따르며 실측 축척을 검증한 것은 아니다.\u003c/p>\n\u003ch3 id=\"_6\">건물 통과 오류 수정\u003c/h3>\n\u003cp>최초 설정은 공식 예제의 공통 부모 회전 설정을 따라 두 파일에 같은 Z축 180° 회전을 적용했다. 사용자가 두 앱에서 시작점 왼쪽 건물을 통과한다고 보고한 뒤, 실제 다운로드한 파일을 대조했다. SOG 좌표를 디코딩해 회전한 점들과 GLB의 원래 정점을 투영해 비교하면 건물 외곽이 같은 방향에 놓인다. GLB 자체는 이미 Y-up이며 정점 Y 범위는 약 -1.825–26.377이다. GLB를 다시 뒤집으면 건물 대부분이 지면 아래로 이동한다. 두 파일의 회전을 같게 해야 한다는 전제가 잘못됐다.\u003c/p>\n\u003cp>기존 접지 테스트는 뒤집힌 메시의 일부 표면에도 접지할 수 있어 이 오류를 잡지 못했다. 실제 설정의 변환을 읽도록 테스트를 수정하고 왼쪽 건물 벽의 시선 차단·보행 차단 검증을 추가했다. 기존 회전에서는 새 벽 테스트가 실패했고, 충돌 메시의 회전을 제거한 뒤 통과했다. 벽 확인 구간은 \u003ccode>z=-12\u003c/code>, \u003ccode>x=-8\u003c/code>에서 왼쪽으로 접근하는 경로다. 눈높이 1의 광선은 벽의 \u003ccode>x≈-10.50\u003c/code>에서 교차하고, 보행 캡슐은 \u003ccode>x≈-10.27\u003c/code>에서 멈춘다. 이는 제공된 메시의 해당 벽을 검증한 결과이며 모든 벽의 촬영 데이터 정합을 보장하지 않는다.\u003c/p>\n\u003cp>충돌 GLB의 Draco 압축은 다운로드 후 한 번 해제했다. 정점 위치와 삼각형을 보존하고 런타임에서는 두 앱이 같은 일반 GLB를 읽는다. 추가적인 메시 단순화는 하지 않았다. 제공된 메시가 모든 촬영 벽에 정확히 맞는지는 화면에서 확인해야 한다. 충돌 메시의 삼각형 수가 많다고 Splat 벽의 불투명도가 보장되는 것은 아니다.\u003c/p>\n\u003ch3 id=\"_7\">계단 걸림과 정지 중 미끄러짐 수정\u003c/h3>\n\u003cp>사용자가 저장한 네 위치로 실제 Sunnyvale 충돌 메시에서 재현했다. 단위는 m이며 좌표는 발 위치다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>위치 기록\u003c/th>\n\u003cth>발 위치 (x, y, z)\u003c/th>\n\u003cth>사용자 관찰\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>three-location-1790927201617.json\u003c/code>\u003c/td>\n\u003ctd>(-10.21335, 0.03604, -14.29915)\u003c/td>\n\u003ctd>앞 계단에서 걸림\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>three-location-1790927263156.json\u003c/code>\u003c/td>\n\u003ctd>(-10.94912, 0.39106, -14.17821)\u003c/td>\n\u003ctd>좌우로 움직이면 일부 올라감\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>three-location-1790927340840.json\u003c/code>\u003c/td>\n\u003ctd>(-13.66356, 0.53731, -21.88231)\u003c/td>\n\u003ctd>정지 중 천천히 미끄러짐\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>three-location-1790927372749.json\u003c/code>\u003c/td>\n\u003ctd>(-13.59994, -0.21628, -22.25220)\u003c/td>\n\u003ctd>이후 아래로 떨어짐\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>수정 전에는 세 번째 위치에서 입력 없이 40초를 계산하면 네 번째 위치 근처까지 미끄러지고 약 75cm 내려갔다. 경사진 삼각형에 매 프레임 중력을 적용하고 침투를 해소하면서 수평 이동도 생겼다. Three.js 보행기는 입력이 없고 아래의 지지가 확인되는 경우 위치와 속도를 유지하도록 수정했다. 지지가 없으면 계속 낙하하며 기존 낙하 복귀 테스트도 유지한다.\u003c/p>\n\u003cp>앞 계단에는 약 49°의 짧은 면이 있어 35° 경사 제한으로 정면 접근이 막혔다. Three.js에 최대 20cm 턱 오르기를 추가했다. 막힌 이동에서만 시도하며, 앞쪽의 걸을 수 있는 면, 상승·전진 공간, 착지 후 충돌과 실제 이동을 확인한다. 연속 급경사, 높은 턱과 낮은 천장은 계속 차단한다.\u003c/p>\n\u003cp>실제 네 위치에서 40초 정지 후 이동량 2mm 미만을 확인했다. 첫 계단 위치에서 좌우 조작 없이 정면으로 1초 이동하면 60fps와 20fps 모두 현관 바닥 높이(약 0.57m)에 도달했다. 15cm 턱 통과, 30cm 턱 차단, 낮은 천장 차단과 기존 벽·급경사·낙하 복귀를 포함한 Three.js 테스트 12개가 통과했다. 브라우저에서의 이동감 확인은 별도로 필요하다.\u003c/p>\n\u003cp>이번 수정은 Three.js 보행기에 적용했다. PlayCanvas의 동적 캡슐과 보행 방식은 여전히 다르므로 계단 경로·정지 동작 차이만으로 엔진 품질을 비교할 수 없다. 벤치를 넘은 모든 경로의 복귀와 벽 비침까지 해결했다는 의미는 아니다.\u003c/p>\n\u003ch3 id=\"_8\">창문 아래 벽 비침 조사\u003c/h3>\n\u003cp>사용자의 \u003ccode>playcanvas-location-1790928086895.json\u003c/code>과 촬영 화면·충돌 선 화면 두 장을 대조했다. 발 위치는 \u003ccode>[-14.24447, 0.55009, -11.09019]\u003c/code>, 눈 위치는 \u003ccode>[-14.24447, 2.15009, -11.09019]\u003c/code>다. 사용자는 Three.js에서도 같은 위치에 같은 형상이 겹쳐 보인다고 확인했다. 형상이 벽 뒤 가구인지는 아직 확인되지 않았다.\u003c/p>\n\u003cp>저장된 카메라 위치·방향·화면 비율과 앱의 70° 시야각으로 빨간 박스 영역에 CPU BVH 광선 225개를 검사했다. 박스 경계는 캡처에서 추정했으며 실제 브라우저 픽셀 검사는 아니다. 모든 표본에서 충돌 면을 만났고 거리는 약 2.16~6.90m였다. 카메라의 near clip은 0.05m이므로 이 시점의 증상을 근접 클리핑만으로 설명하기 어렵다. 이 결과가 모든 표본의 충돌 면이 촬영 화면의 벽과 정확히 일치한다거나 영역 전체에 구멍이 없음을 보장하지는 않는다. 검사 결과는 \u003ccode>artifacts/browser-test-2026-10-02/sunnyvale-wall-ray-check.json\u003c/code>에 기록했다.\u003c/p>\n\u003cp>두 앱의 일반 화면에는 SOG만 표시하고 충돌 GLB를 불투명한 벽으로 그리지 않는다. 따라서 충돌 면은 이동을 막지만 SOG 뒤 형상을 가리는 렌더링 면은 아니다. 충돌 선 화면도 뒤쪽 선까지 표시하므로 비침 여부를 직접 판정할 수 없다.\u003c/p>\n\u003cp>설치된 렌더러 소스에서 PlayCanvas GSplat의 기본 설정은 premultiplied alpha blending과 \u003ccode>depthWrite: false\u003c/code>, Spark도 기본적으로 투명도·premultiplied alpha를 사용하고 \u003ccode>depthWrite: false\u003c/code>임을 확인했다. 이는 Gaussian 합성을 위한 설정이며 해당 값 자체를 오류로 판정하지 않는다. 앱에는 벽 불투명도를 별도로 낮추는 설정이 없다.\u003c/p>\n\u003cp>현재 우선 조사 대상은 공통 SOG에 남은 불필요한 Gaussian 형상이나 벽의 부족한 불투명도·재구성 품질이다. 양쪽의 같은 위치에서 보인다는 사용자 관찰과 일치하지만 원인 확정은 아니다. 충돌 메시 수정이나 카메라 near clip 변경으로 이 증상이 해결됐다고 보고하지 않는다.\u003c/p>\n\u003cp>다음 확인은 동일 시점에서 원본 SOG의 해당 벽과 겹친 Gaussian을 구분하는 것이다. 불필요한 형상이 확인되면 자산을 편집한 별도 버전으로 양쪽에 동일하게 적용해 비교한다. 불투명한 차폐 메시가 필요하다면 실제 벽에 맞춘 메시와 창문·출입구 처리가 필요하다. 현재 충돌 메시 전체를 그대로 불투명하게 그리거나 \u003ccode>depthWrite\u003c/code>만 켜는 변경은 적용하지 않았다. 벽 비침은 아직 해결되지 않았다.\u003c/p>\n\u003ch2 id=\"_9\">파일 크기와 해시\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>파일\u003c/th>\n\u003cth style=\"text-align: right;\">크기(B)\u003c/th>\n\u003cth>SHA-256\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>배포 및 런타임 \u003ccode>sunnyvale.sog\u003c/code>\u003c/td>\n\u003ctd style=\"text-align: right;\">58,072,500\u003c/td>\n\u003ctd>\u003ccode>604ede4a3ff5e3ece784a7c3b11dcbc3f6c05b1e9f73f460997e6a145bc3b05e\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>배포 \u003ccode>sunnyvale.glb\u003c/code> (Draco)\u003c/td>\n\u003ctd style=\"text-align: right;\">561,328\u003c/td>\n\u003ctd>\u003ccode>61ad08e21da8c18d1cd2718097f95ec7f32a03a3fb7c26e6df8507684079b10d\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>런타임 \u003ccode>sunnyvale-collision.glb\u003c/code>\u003c/td>\n\u003ctd style=\"text-align: right;\">6,180,504\u003c/td>\n\u003ctd>\u003ccode>16b841224ce95e214917d98e551d815abc3eb6440979c26f8def958f6f046e22\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>런타임 두 파일은 합계 약 64.3 MB다. 렌더링·물리 메모리는 파일 크기보다 커질 수 있으며 아직 브라우저에서 측정하지 않았다. 최신 런타임 해시는 \u003ccode>shared/public/world/assets.json\u003c/code>에서 확인한다.\u003c/p>\n\u003ch2 id=\"_10\">재현\u003c/h2>\n\u003cp>저장소 루트에서 의존성을 설치한 뒤 실행한다. 변환 스크립트는 이 예제의 단일 충돌 메시를 위한 것이다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">curl --fail --location https://code.playcanvas.com/examples_data/example_sunnyvale/sunnyvale.sog --output shared/public/assets/sunnyvale.sog\ncurl --fail --location https://code.playcanvas.com/examples_data/example_sunnyvale/sunnyvale.glb --output /private/tmp/atlas-sunnyvale-compressed.glb\nnode scripts/decode-collision.mjs /private/tmp/atlas-sunnyvale-compressed.glb shared/public/assets/sunnyvale-collision.glb\nrm /private/tmp/atlas-sunnyvale-compressed.glb\npython3 scripts/update-asset-manifest.py\npnpm check\n\u003c/code>\u003c/pre>\n\u003cp>원격 파일이 교체되면 위 해시와 달라질 수 있다. 그 경우 새 자료로 구분해 기록한다.\u003c/p>\n\u003ch2 id=\"_11\">검증 결과와 남은 확인\u003c/h2>\n\u003cp>\u003ccode>pnpm check\u003c/code>가 통과했다. 자산 크기·해시, 공용 데이터, 장면 선택, Three.js의 새 메시 로드·접지·왼쪽 벽 차단 테스트, 타입 검사, 두 앱의 프로덕션 빌드와 릴리스 산출물 검사를 포함한다. 5173·5174의 새 장면 JSON 응답도 HTTP 200으로 확인했다.\u003c/p>\n\u003cp>PlayCanvas 앱에 포함된 Ammo WASM도 Node에서 같은 충돌 메시와 캡슐 크기·질량·마찰로 별도 검증했다. 같은 벽으로 5초간 이동 입력을 주었을 때 발 위치 \u003ccode>x≈-10.25\u003c/code>, \u003ccode>y≈-0.073\u003c/code>, \u003ccode>z≈-11.99\u003c/code>에서 막혔다. 이는 물리 엔진의 해당 벽 차단 검증이며 PlayCanvas 앱의 브라우저 실행 검증은 아니다.\u003c/p>\n\u003cp>실제 브라우저에서의 벽 비침, PlayCanvas의 새 메시 보행, 시각 정합과 반응 속도는 사용자 확인이 남아 있다. 자동 테스트 통과가 화면 품질을 보장하지 않는다.\u003c/p>\n\u003cp>새 장면에서 문제가 줄어들면 기존 촬영 데이터나 수동 충돌 프록시를 먼저 조사할 근거가 생긴다. 두 장면에서 계속 보이면 충돌 정합, 카메라 거리·클리핑, Splat 렌더러 설정을 함께 조사한다. 어느 결과도 단독으로 원인을 확정하지는 않는다.\u003c/p>\u003c/main>\u003cfooter>테스트 기간 2026-10-02~04 · 기존 측정 기록을 정리한 자료입니다. 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
