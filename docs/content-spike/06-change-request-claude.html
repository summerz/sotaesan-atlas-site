ng-top:24px}.archive>summary{cursor:pointer;font-size:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"06-change-request-claude.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"6-claude\">6라운드: 변경 요청 — 모바일 비중 축소 (Claude 영향 분석)\u003c/h1>\n\u003cul>\n\u003cli>작성일: 2026-10-14\u003c/li>\n\u003cli>작성: Claude Fable 5.1\u003c/li>\n\u003cli>대상: \u003ca href=\"FINAL.html\">FINAL.md\u003c/a> (v1, 같은 날 확정)\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"0\">0. 사용자 변경 요청 (원문 요지)\u003c/h2>\n\u003cblockquote>\n\u003cp>iPhone 테스트는 하되 대폭 줄이고, iPhone 결과가 최종 결과에 영향을 끼치지 않게 하라. 시험 중인 iPhone은 출시 7년 된 기기(iPhone 11)이고, 모바일이 주요 디바이스가 아닐 확률이 높아졌다. 결론이 바뀔 수 있으니 전면 재작성할지 수정할지도 판단하라.\u003c/p>\n\u003c/blockquote>\n\u003cp>이것은 측정으로 도출된 사실이 아니라 \u003cstrong>사용자의 제품 방향 결정\u003c/strong>이다. 날짜와 함께 기록하고 근거를 요구하지 않는다.\u003c/p>\n\u003ch2 id=\"1-final-v1-iphone\">1. FINAL v1에서 iPhone이 들어간 자리\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>위치\u003c/th>\n\u003cth>현재 문안\u003c/th>\n\u003cth>성격\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>§1 정의\u003c/td>\n\u003ctd>\"기기 예산\"을 확인하는 기술 시험\u003c/td>\n\u003ctd>정의의 일부\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>§3 듣기 통과 기준\u003c/td>\n\u003ctd>\"대상 iPhone에서 재생 조작·거부·음소거·복귀 각각 실행\"\u003c/td>\n\u003ctd>\u003cstrong>합격 게이트\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>§3 연출 통과 기준\u003c/td>\n\u003ctd>\"실패 주입 7종을 데스크톱·iPhone 각 3회\"\u003c/td>\n\u003ctd>\u003cstrong>합격 게이트\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>§4 결합·기기·실패 검증\u003c/td>\n\u003ctd>6개 구성 × 데스크톱/iPhone × 3회, 2–3인일\u003c/td>\n\u003ctd>비용의 약 절반이 iPhone\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>§5 성능 합격선\u003c/td>\n\u003ctd>p95 ≤ 50ms (iPhone), 증가 ≤ 5ms\u003c/td>\n\u003ctd>\u003cstrong>합격선이 iPhone 기준\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>§6 중단 규칙\u003c/td>\n\u003ctd>합격선 미달 시 축 보류\u003c/td>\n\u003ctd>iPhone 결과가 축을 보류시킬 수 있음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>§7\u003c/td>\n\u003ctd>\"iPhone 한 대 통과는 다른 기기 통과가 아니다\"\u003c/td>\n\u003ctd>한계 서술\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>§2 엔진 전제\u003c/td>\n\u003ctd>PlayCanvas + Ammo\u003c/td>\n\u003ctd>기술 스파이크의 추천 근거가 주로 iPhone 로딩이었음\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"2\">2. 결론이 바뀌는가\u003c/h2>\n\u003cp>\u003cstrong>네 축, 범위, 데이터 계약, 비용 분리, 중단 규칙의 구조는 바뀌지 않는다.\u003c/strong> 바뀌는 것은 다음 셋이다.\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>합격 게이트가 데스크톱으로 옮겨간다.\u003c/strong> 성능 합격선·실패 주입·자동재생 정책의 판정 기기는 데스크톱(하드웨어 GPU 확인, headed)이다. iPhone은 \u003cstrong>참고 측정\u003c/strong>으로 격하되어 통과/보류 판정에 쓰지 않는다.\u003c/li>\n\u003cli>\u003cstrong>iPhone 측정은 최소 구성으로 줄인다.\u003c/strong> 6개 구성 × 3회가 아니라 \u003cstrong>모두 off와 모두 on 두 구성 × 1회\u003c/strong>, 손가락 조작 없이 기존 bridge 경로로 수집한다. 산출물은 \"열리는가, 프레임 p95, heap\"뿐이다. 기기가 7년 된 iPhone 11이므로 결과를 모바일 일반으로 해석하지 않는다는 문장을 붙인다.\u003c/li>\n\u003cli>\u003cstrong>엔진 전제의 근거가 약해진다.\u003c/strong> 기술 스파이크가 PlayCanvas를 추천한 주된 이유는 iPhone에서 대형 원본을 연 것이었다. 데스크톱만 보면 세 구성의 기능은 모두 통과였고 로딩 차이는 작았다. 이 스파이크는 PlayCanvas로 계속하되(계약은 엔진 중립이고 전환 비용이 이 단계의 목적이 아니다), \u003cstrong>엔진 재검토 항목을 다음 단계로 명시\u003c/strong>한다.\u003c/li>\n\u003c/ol>\n\u003cp>따라서 \u003cstrong>재작성이 아니라 수정\u003c/strong>이 맞다고 판단한다. 수정 범위는 §1·§3·§4·§5·§6·§7의 iPhone 관련 문장과 §2 엔진 전제의 단서다. 변경 전 FINAL v1은 \u003ccode>FINAL-v1.md\u003c/code>로 보존한다.\u003c/p>\n\u003ch2 id=\"3\">3. 제안하는 수정 문안\u003c/h2>\n\u003ch3 id=\"1\">§1 정의\u003c/h3>\n\u003cp>\"기기 예산\" → \"데스크톱 기기 예산\". 뒤에 추가: \"모바일은 참고 측정이며 판정에 쓰지 않는다(2026-10-14 사용자 결정: 모바일이 주요 기기가 아닐 가능성이 높음, 시험 기기는 iPhone 11).\"\u003c/p>\n\u003ch3 id=\"3_1\">§3 듣기\u003c/h3>\n\u003cp>\"대상 iPhone에서\" → \"데스크톱 브라우저에서\". 자동재생 정책은 데스크톱 Chrome의 사용자 제스처 요구로 시험한다. iPhone 재생 거부는 참고 측정에서 한 번 확인한다.\u003c/p>\n\u003ch3 id=\"3_2\">§3 연출\u003c/h3>\n\u003cp>\"데스크톱·iPhone 각 3회\" → \"데스크톱 3회\". iPhone은 모두 on 구성에서 레일 1회 재생·건너뛰기 1회만 참고 기록.\u003c/p>\n\u003ch3 id=\"4\">§4 결합·기기·실패 검증\u003c/h3>\n\u003cp>\"6개 구성 × 데스크톱/iPhone × 3회\" → \"6개 구성 × 데스크톱 × 3회. iPhone은 모두 off·모두 on 두 구성 × 1회 참고 측정(열림 여부, 프레임 p95, heap)\". 추정 인일 2–3 → \u003cstrong>1.5–2.5\u003c/strong>. 총계 11–20 → \u003cstrong>10.5–19.5\u003c/strong>, 왕복 포함 11.5–21.5.\u003c/p>\n\u003ch3 id=\"5\">§5 성능 합격선\u003c/h3>\n\u003cul>\n\u003cli>데스크톱(하드웨어 GPU 확인, headed, 고정 viewport·DPR): 활성 탐색 전체 프레임 간격 \u003cstrong>p95 ≤ 33ms\u003c/strong>, 기준 실행 대비 증가 \u003cstrong>≤ 5ms\u003c/strong>. 33ms는 잠정이며 기준 실행(모두 off) 측정 후 확정한다. 기존 데스크톱 Ammo 측정(정지 p95 33.8ms)이 있으므로 기준 실행이 이미 33ms를 넘으면 절대선은 기준 실행 값으로 대체하고 증가량만 판정한다.\u003c/li>\n\u003cli>iPhone: 합격선 없음. 수치만 기록.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"6\">§6 중단 규칙\u003c/h3>\n\u003cp>\"어느 축이든 합격선을 넘지 못하면\" → \"어느 축이든 \u003cstrong>데스크톱\u003c/strong> 합격선을 넘지 못하면\". 추가: \"iPhone 참고 측정은 축을 보류시키지 않는다. 다만 iPhone에서 장면이 열리지 않는 축은 그 사실을 기록한다.\"\u003c/p>\n\u003ch3 id=\"7\">§7\u003c/h3>\n\u003cp>\"iPhone 한 대 통과는 다른 기기 통과가 아니다\" → \"iPhone 11 참고 측정은 모바일 일반의 성능이나 사용성을 대표하지 않는다.\"\u003c/p>\n\u003ch3 id=\"2_1\">§2 엔진 전제에 추가\u003c/h3>\n\u003cp>\"기술 스파이크의 PlayCanvas 추천은 iPhone 대형 원본 로딩에 크게 의존했다. 모바일 비중이 낮아졌으므로 엔진 선택은 데스크톱 기준으로 다음 단계에서 재검토한다. 이 스파이크의 계약과 자산은 엔진 중립으로 유지한다.\"\u003c/p>\n\u003ch2 id=\"4-codex\">4. Codex에 묻는 것\u003c/h2>\n\u003col>\n\u003cli>재작성이 아니라 수정이라는 판단에 동의하는가. 반대라면 어떤 결론이 바뀌는지 명시하라.\u003c/li>\n\u003cli>데스크톱 합격선 33ms/5ms 제안에 대한 의견. 저장소의 데스크톱 측정값과 대조하라.\u003c/li>\n\u003cli>iPhone 참고 측정의 최소 범위(두 구성 × 1회)가 \"대폭 축소\"와 \"결과에 영향 없음\"을 동시에 만족하는가. 더 줄이거나 다르게 자를 곳이 있는가.\u003c/li>\n\u003cli>엔진 재검토를 다음 단계로 미루는 것이 맞는가, 아니면 이 스파이크 안에서 Three.js 병행이 필요한가.\u003c/li>\n\u003cli>인일 조정(1.5–2.5, 총 10.5–19.5)이 타당한가.\u003c/li>\n\u003c/ol>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
