e:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"04-consensus-draft.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"4\">4라운드: 합의안 초안\u003c/h1>\n\u003cul>\n\u003cli>작성일: 2026-10-14\u003c/li>\n\u003cli>작성: Claude Fable 5.1. \u003ccode>03-codex-counter.md\u003c/code>의 \"남은 이견\" 5개에 대한 Claude의 결정을 포함한다.\u003c/li>\n\u003cli>상태: Codex 최종 검토 대기. 검토 후 \u003ccode>FINAL.md\u003c/code>로 확정한다.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"0-claude\">0. 남은 이견에 대한 Claude의 결정\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>결정\u003c/th>\n\u003cth>이유\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>플래그와 원인 귀속\u003c/td>\n\u003ctd>\u003cstrong>Codex 안 수용.\u003c/strong> 기기별 6개 구성(모두 off, 축 단독 4, 모두 on), 각 3회, 순서 교차\u003c/td>\n\u003ctd>단독 비용 귀속과 결합 상호작용은 다른 질문이다. 16개 조합이 아닌 6개면 비용이 작다\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>하늘 자산 확인 수준\u003c/td>\n\u003ctd>\u003cstrong>Codex 안 수용.\u003c/strong> \"하늘 영상의 존재는 확인, 제거 가능한 점 집합과 경계 보존은 미확인\"으로 기록\u003c/td>\n\u003ctd>Claude가 직접 본 캡처(\u003ccode>ios-playcanvas-sunnyvale.png\u003c/code>)도 존재까지만 보여준다. Knock Hall 축소본은 하늘이 검게 비어 있어 하늘 축의 대역이 될 수 없다\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>레일 작업량\u003c/td>\n\u003ctd>\u003cstrong>Codex 안 수용.\u003c/strong> 한정 구역 사전 로딩 방식, 축 2–4인일. \"3–5보다 싸다\"는 단정 철회\u003c/td>\n\u003ctd>재사용 가능한 코드가 있다는 것과 새 상태 소유권 비용이 작다는 것은 다르다\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>정지와 왕복 인물\u003c/td>\n\u003ctd>\u003cstrong>Codex 안 수용.\u003c/strong> 정지 1–2구 기본, 짧은 평탄 구간 왕복은 +1–2인일 선택\u003c/td>\n\u003ctd>왕복은 바닥 조회·경계·시대 전환 복귀를 추가로 시험하므로 별도 항목이 맞다\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>합격선과 중단 단위\u003c/td>\n\u003ctd>\u003cstrong>Codex 안 수용.\u003c/strong> 수치 한도를 측정 전에 고정하고, 결과는 통과/실패 후 대체/보류/미시험 4단계로 기록. 한 축이라도 촬영 전제를 바꾸면 즉시 촬영 계획에 전달\u003c/td>\n\u003ctd>\"두 축 보류\" 규칙은 실측 근거가 없는 운영 규칙이었다\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"1\">1. 이 단계의 정의\u003c/h2>\n\u003cp>\u003cstrong>콘텐츠 스파이크\u003c/strong>: 대역 공개 장면 위에서 네 가지 표현 수단의 실현 가능성, 비용, 기기 예산, 데이터 계약을 확인하는 기술 시험. 십상 이해나 학습 효과를 검증하는 단계가 아니다. 그 평가는 실제 성지 데이터와 검수된 콘텐츠가 준비된 다음 단계에서 설계한다(Codex 1라운드 질문 5의 평가 설계를 그때 출발점으로 쓴다).\u003c/p>\n\u003ch2 id=\"2\">2. 전제\u003c/h2>\n\u003cul>\n\u003cli>대역: \u003ccode>sunnyvale-era\u003c/code> 변형 한 가지, 자산 해시 고정 (\u003ccode>sunnyvale.sog\u003c/code> SHA-256 \u003ccode>604ede4a…\u003c/code>). 하늘 축을 위해 Sunnyvale을 쓰는 이유는 원본 캡처에 하늘 표현이 있기 때문이다. 제거 가능 여부는 이 시험에서 확인한다.\u003c/li>\n\u003cli>두 번째 장면: 기존 Knock Hall 변형. 실내이므로 하늘 분리의 이전은 검증하지 못하며 그렇게 기록한다.\u003c/li>\n\u003cli>엔진: PlayCanvas + Ammo 한 구성. 스파이크 보고서의 우선 후보를 일정 가정으로 쓴 것이며 최종 선택이 아니다.\u003c/li>\n\u003cli>콘텐츠 데이터: 실제 십상 사실 3개와 출처를 대본으로 준비해 얹는다. 학습 증명이 아니라 텍스트·음성·자막·출처·표현 구분이 같은 내용을 전달하는지 확인하는 시험 데이터다. 화면에 \"기술 시험용 대역\" 표시를 상시 띄운다.\u003c/li>\n\u003cli>제외: 안개·강수·주야간, 동행 캐릭터·길 찾기·대화, 타임랩스, 과거 창 셰이더, 다중 컷 연출, 초심자 평가, 새 촬영, 새 공개 장면 탐색(하늘 축 실패 시에만 상한 내 조사).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"3\">3. 네 축\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>축\u003c/th>\n\u003cth>이번 범위\u003c/th>\n\u003cth>통과 기준 (측정 전 고정)\u003c/th>\n\u003cth style=\"text-align: right;\">추정 인일\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>듣기\u003c/td>\n\u003ctd>위치 기반 환경음 2–3개, 선택 재생 내레이션 1개, 동일 자막, 음소거, 패널 유지\u003c/td>\n\u003ctd>음소거·음원 실패·재생 거부·백그라운드 복귀 각각에서 동일 자막·패널 접근 가능. 복귀 후 의도하지 않은 소리 0건\u003c/td>\n\u003ctd style=\"text-align: right;\">2–3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연출\u003c/td>\n\u003ctd>진입 트리거 → 짧은 레일 1개 → 자막 → 복귀. 건너뛰기 가능. 레일이 보는 구역을 고정하고 시작 전 사전 로딩·유지\u003c/td>\n\u003ctd>필요 구역 ID·시대 고정, 미준비면 레일 시작 금지. 실패 주입 7종(재생 중 시대 변경, 구역 로딩 실패, 음원 실패, 연속 진입, 건너뛰기, 백그라운드 복귀, 장면 변경 직후 늦은 응답) 데스크톱·iPhone 각 3회에서 잠금 잔류·중복 재생·늦은 응답 적용 0건\u003c/td>\n\u003ctd style=\"text-align: right;\">2–4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>하늘\u003c/td>\n\u003ctd>제한 시야의 하늘 스플랫 분리 시도 + 스카이박스 1종\u003c/td>\n\u003ctd>고정 8시점(열린 하늘, 가지, 지붕, 분할 경계 포함) 제거 전후 비교. 지붕·줄기 소실, 새 구멍, 이전 하늘 잔존 0건. 가장자리 번짐은 사전 승인 예시와 대조. 상한 도달 시 실패 보고도 유효 산출물\u003c/td>\n\u003ctd style=\"text-align: right;\">1–2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>인물\u003c/td>\n\u003ctd>정지 잔상 1–2구, 바닥 배치, 시대 전환 복구, \"상징 표현\" 표지, 조명 이질감 캡처\u003c/td>\n\u003ctd>지정 바닥에서 발 기준점 오차 5cm 이내, 관통 0건. 밝은·어두운 배경 지정 시점 캡처. 외관 승인 예시 없으면 기술 표시 성공과 외관 판정을 분리\u003c/td>\n\u003ctd style=\"text-align: right;\">1–2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>(선택) 왕복 인물\u003c/td>\n\u003ctd>짧은 평탄 구간 고정 왕복\u003c/td>\n\u003ctd>전 구간 관통·경로 이탈 0건, 시대 전환 중 복귀\u003c/td>\n\u003ctd style=\"text-align: right;\">+1–2\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"4_1\">4. 공통 작업\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>작업\u003c/th>\n\u003cth>산출물\u003c/th>\n\u003cth style=\"text-align: right;\">추정 인일\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>사실·표현 검수\u003c/td>\n\u003ctd>사실 3개·출처·해설문·대역·상징 표시. 교무/해설자 1인의 역할은 정확성·표현 적절성 검수로 한정\u003c/td>\n\u003ctd style=\"text-align: right;\">1–2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>최소 공통 계약·계측\u003c/td>\n\u003ctd>축 플래그(off = 자산 미로딩·재생 중지·자원 해제), \u003ccode>world.ts\u003c/code> 계약 최소 확장과 참조 검증, 상태 소유권 규칙(\u003ccode>syncInput\u003c/code> 확장), 작업시간·자산·실행 조건 기록 양식\u003c/td>\n\u003ctd style=\"text-align: right;\">1–2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>결합·기기·실패 검증\u003c/td>\n\u003ctd>6개 구성 × 데스크톱/iPhone × 3회. 전체 프레임 간격과 물리 시간, 메인/worker heap과 backing storage 분리 기록. 결합 구성만 실패하면 하나씩 빼서 좁힘\u003c/td>\n\u003ctd style=\"text-align: right;\">2–3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>두 번째 장면 이전·결과 정리\u003c/td>\n\u003ctd>Knock Hall 변형에 데이터 재배치, 사실 문장 1개 변경. 축별 코드 diff·데이터 변경·재저작 시간 기록. 축별 통과/실패 후 대체/보류/미시험 보고\u003c/td>\n\u003ctd style=\"text-align: right;\">1–2\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>총계: 정지 인물 기준 11–20인일 (추정). 왕복 포함 12–22. 새 공개 장면이 필요해지면 +3.5–7.\u003c/strong> 1인일은 8시간 실작업이며 승인·섭외·기계 처리 대기는 별도. 실측 견적이 아니라 첫 회차 기록으로 갱신할 계획 범위다.\u003c/p>\n\u003ch2 id=\"5\">5. 성능 합격선 (잠정, 측정 전 확정)\u003c/h2>\n\u003cul>\n\u003cli>활성 탐색의 전체 프레임 간격 p95 ≤ 50ms (iPhone, 고정 빌드·자산·viewport·캐시 조건).\u003c/li>\n\u003cli>동일 조건의 기준 실행 대비 증가 ≤ 5ms.\u003c/li>\n\u003cli>로딩, 레일 재생, 수동 탐색 통계를 분리. 3회 각각 판정.\u003c/li>\n\u003cli>이 숫자는 Codex 제안이며 기존 장면이 충족했다는 진술이 아니다. 받아들이지 않으면 대체 한도를 측정 전에 정한다. JS heap만으로 전체 메모리 안전성을 판정하지 않는다.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"6\">6. 중단·전달 규칙\u003c/h2>\n\u003cul>\n\u003cli>어느 축이든 합격선을 넘지 못하면 그 축은 보류하고 다른 축을 계속한다. 레일 실패 후 트리거+자막은 \"실패 후 대체\"로 기록하며 레일 축 통과가 아니다.\u003c/li>\n\u003cli>어느 축이든 촬영 전제(하늘 포함 여부, 인물 배치 공간, 연출 동선, 스카이박스용 하늘 자료)를 바꾸면 즉시 촬영 계획 체크리스트에 전달한다. 두 번째 실패를 기다리지 않는다.\u003c/li>\n\u003cli>두 번째 장면 이전에서 콘텐츠별 앱 코드 수정이 필요하면 \"선언형\" 주장을 철회하고 수정 범위를 기록한다.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"7\">7. 실제 성지로 옮길 때 재사용과 재저작\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>재사용 (설정·코드)\u003c/th>\n\u003cth>재저작 (장소별)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>축 플래그, 상태 소유권, 자막·음소거·건너뛰기 경로, 기록 양식\u003c/td>\n\u003ctd>스플랫·충돌 정합(기준점·단위·방향·시선 높이)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>스카이박스 설정 방식\u003c/td>\n\u003ctd>하늘 분리 작업 자체, 수목·건물 경계\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>레일·트리거·구역 사전 로딩 계약\u003c/td>\n\u003ctd>레일 경로, 필요 구역, 걷기 가능 구역·금지 경계·복귀점\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>인물 배치·표지 계약\u003c/td>\n\u003ctd>인물 위치·외관·표현 승인\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>콘텐츠 데이터 스키마\u003c/td>\n\u003ctd>사실·출처·해설문·검수\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>촬영·SfM·학습 파이프라인과 실제 역사 복원 비용은 이 단계에서 산정하지 않는다. 후속 촬영 계획에는 스카이박스용 하늘 자료 확보와 경계 재구성 입력 확보를 별도 항목으로 둔다(제안이며 검증된 촬영법이 아니다).\u003c/p>\n\u003ch2 id=\"8\">8. 실행 순서\u003c/h2>\n\u003col>\n\u003cli>사실 3개·출처·대본, 성능 합격선, 외관 승인 예시, 고정 시점 8개 확정 (공통 1–2)\u003c/li>\n\u003cli>공통 계약·플래그·기록 양식 (공통 1–2)\u003c/li>\n\u003cli>네 축 구현과 단독 시험 (6–11). 하늘 축은 상한에서 중단\u003c/li>\n\u003cli>결합·기기·실패 검증 (공통 2–3)\u003c/li>\n\u003cli>두 번째 장면 이전, 결과 정리, 촬영 계획 전달 (공통 1–2)\u003c/li>\n\u003c/ol>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
