-size:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"01-codex-critique.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"1-codex\">1라운드: Codex 반박\u003c/h1>\n\u003cul>\n\u003cli>작성일: 2026-10-14\u003c/li>\n\u003cli>모델: Codex (GPT-5 기반, 세션 지침 기준)\u003c/li>\n\u003cli>검토 대상: \u003ccode>docs/content-spike/00-initial.md\u003c/code>의 동결 초안\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"0\">0. 판정: 이대로 착수하면 콘텐츠가 아니라 효과 네 개를 검증한다\u003c/h2>\n\u003cp>초안의 네 축을 콘텐츠 스파이크의 필수 범위로 승인해서는 안 된다. 무엇을 이해시킬지 정하기 전에 들을 것·바뀌는 것·볼 것·만날 것을 채웠다. 이 구성으로 성공해도 “효과를 붙인 대역 공간이 작동한다”는 결론만 남는다. 십상 이해, 공간 매체의 필요성, 실제 성지 제작 가능성은 각각 다른 검증이다.\u003c/p>\n\u003cp>특히 “기술은 충분히 검증됐다 → 네 축을 붙인다 → 실제 촬영 데이터에 그대로 옮긴다”는 논리가 성립하지 않는다. 기술 보고서는 엔진의 \u003cstrong>우선 후보를 고를 근거\u003c/strong>를 제공했지, 새로운 콘텐츠의 성능 여유나 임의 장소로의 이식성을 보증하지 않았다. \u003ca href=\"../implementation/SPIKE-DECISION-REPORT.html\">근거: \u003ccode>docs/implementation/SPIKE-DECISION-REPORT.md\u003c/code> §1·§9\u003c/a>\u003c/p>\n\u003cp>검토의 구분은 다음과 같다. 저장소에서 확인한 동작·수치는 근거 경로를 붙인다. 사용자 반응, 미래 장애, 비용처럼 저장소에서 입증되지 않은 예측은 \u003cstrong>추정\u003c/strong>으로 표시한다. 아래 대안과 합격선은 기존 합의가 아니라 이번 검토의 제안이다. 모든 일수는 \u003cstrong>추정 인일\u003c/strong>이며 1인일은 8시간이다. 기존 코드를 아는 개발자와 콘텐츠 작성·검수자의 작업량을 뜻한다. 자료가 확보된 작은 장면 하나를 전제하며, 섭외·승인 대기와 현장 촬영·학습 기간은 포함하지 않는다. 항목별 대안 비용은 서로 겹치므로 합산하지 않고, 마지막 일정표만 하나의 묶음으로 본다.\u003c/p>\n\u003ch2 id=\"1\">1. 출발 전제부터 틀렸다\u003c/h2>\n\u003ch3 id=\"11\">1.1 “기술 스파이크 종료”와 “콘텐츠 추가 위험 해소”는 다르다\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>초안이 확대 해석한 전제\u003c/th>\n\u003cth>저장소가 실제로 입증한 범위\u003c/th>\n\u003cth>반박\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>모바일까지 충분히 검증\u003c/td>\n\u003ctd>iPhone 11의 Sunnyvale 원본 준비 완료는 약 14.97초·19.11초의 서로 통제되지 않은 두 관측. 첫 탐색에는 약 1.57초 지연도 있었다\u003c/td>\n\u003ctd>“열린다”는 “추가 효과를 켜고 쓸 만하다”가 아니다\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>분할로 대형 장면 문제 해결\u003c/td>\n\u003ctd>3,999,361점 SH3 원본을 900,000점 SH0로 바꾼 시험. 시작 8.72MB와 전체 18.39MB의 비교\u003c/td>\n\u003ctd>원본 품질을 유지한 최적화나 임의 성지의 자산 예산이 아니다\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>보행 처리 비용이 작으니 여유가 있다\u003c/td>\n\u003ctd>데스크톱 Ammo의 전체 프레임 간격 p95는 정지 33.8ms. 작은 Hall의 iPhone 통합 p95는 52ms. 물리 처리 시간과 전체 프레임은 별도 통계\u003c/td>\n\u003ctd>서로 다른 장면·조건의 값으로 추가 효과 예산을 산출할 수 없다\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>장시간·모바일·시대·설명이 함께 검증\u003c/td>\n\u003ctd>약 10분 안정성은 작은 Hall의 제한된 실행. Sunnyvale 분할+시대+설명 후속 검증은 데스크톱. 모바일 분할 입력은 합성 이벤트\u003c/td>\n\u003ctd>새로운 조합의 실제 손가락 사용·장시간 탐색·복귀는 다시 시험해야 한다\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>수치와 제한의 근거는 \u003ca href=\"../implementation/SPIKE-DECISION-REPORT.html\">\u003ccode>docs/implementation/SPIKE-DECISION-REPORT.md\u003c/code> §2–6\u003c/a>이다. 이는 PlayCanvas 추천을 뒤집자는 뜻이 아니다. \u003cstrong>엔진 선택을 끝낸 것과 기능 조합의 위험을 끝낸 것을 혼동하지 말라는 뜻\u003c/strong>이다.\u003c/p>\n\u003cp>이전 문서의 실패도 무조건 끌어오면 안 된다. \u003ccode>AUTHORING-COST.md\u003c/code>에는 벤치 부근 왕복 실패가 남아 있지만, 최종 보고서 §4는 현관 보정 후 세 구성의 통과를 기록한다. 따라서 이를 현행 미해결 실패로 공격하지 않는다. 남은 문제는 그 수리가 모든 장소·시대·모바일 경로에 일반화되었다는 근거가 없다는 점이다. \u003ca href=\"../implementation/AUTHORING-COST.html\">근거: \u003ccode>docs/implementation/AUTHORING-COST.md\u003c/code>\u003c/a>, \u003ca href=\"../implementation/SPIKE-DECISION-REPORT.html\">\u003ccode>docs/implementation/SPIKE-DECISION-REPORT.md\u003c/code>\u003c/a>\u003c/p>\n\u003ch3 id=\"12\">1.2 콘텐츠의 빈자리를 연출이 대신하고 있다\u003c/h3>\n\u003cp>초기 기획은 역사·교법·기록, 실제 장소, 사용자 경험을 분리했고, 스플랫을 서비스의 정의로 삼지 말라고 했다. 또한 일반 웹페이지나 영상보다 가치가 있는지, 장소 간 관계를 이해하는지, 정보와 이동이 서로 방해하는지를 묻는다. 초안은 이 질문 대신 감각적 구성의 완결성을 목표로 삼았다. \u003ca href=\"../init/03_service_mvp_and_roadmap.html\">근거: \u003ccode>docs/init/03_service_mvp_and_roadmap.md\u003c/code> §2·§6·§7\u003c/a>\u003c/p>\n\u003cp>현재 \u003ccode>content.json\u003c/code>의 10개 항목은 모두 \u003ccode>representation: illustrative\u003c/code>, \u003ccode>confidence: not-applicable\u003c/code>인 시험 설명이다. 일부 시대 설명은 \u003ccode>sources: []\u003c/code>다. 이를 결함이라고 하는 것이 아니다. \u003cstrong>실제 십상 콘텐츠의 자료 조사·해석·검수를 아직 대체하지 않았다는 명확한 증거\u003c/strong>다. \u003ca href=\"../../shared/public/world/content.json\">근거: \u003ccode>shared/public/world/content.json\u003c/code>\u003c/a>\u003c/p>\n\u003cp>대역 공간 사용 제약은 받아들인다. 그러나 실제 촬영을 못 한다는 이유로 실제 문헌에 근거한 설명, 학습 목표, 표현 구분까지 미룰 이유는 없다. 자료를 확보하지 못했다면 “콘텐츠 경험 검증”이 아니라 “연출 기술 시험”이라고 범위를 낮춰야 한다.\u003c/p>\n\u003ch3 id=\"13-worldjson\">1.3 “world.json으로 선언”은 이미 있는 능력이 아니다\u003c/h3>\n\u003cp>현재 \u003ccode>WorldObject\u003c/code>는 \u003ccode>splat | gltf\u003c/code>, \u003ccode>Asset.kind\u003c/code>는 \u003ccode>splat | gltf | image\u003c/code>다. \u003ccode>Layer\u003c/code>는 \u003ccode>current | historical\u003c/code> 두 가지다. 음원, 재생 정책, 내레이션 자막, 진입 이벤트, 연출 취소, NPC 경로, 날씨 상태 계약은 없다. \u003ccode>SCENES\u003c/code>와 \u003ccode>selectedScene\u003c/code>도 장면 목록을 코드에 열거한다. 새 장면 파일을 두는 것만으로 자동 등록되는 구조가 아니다. \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">근거: \u003ccode>shared/src/world.ts\u003c/code>의 해당 타입·함수 (원본 저장소 파일)\u003c/span>\u003c/p>\n\u003cp>따라서 “코드 수정 없는 재사용”은 앞으로 구현하고 반증 시험할 목표이지, 기존 규약을 살짝 확장하는 것으로 확보된 전제가 아니다. 범용 연출 플랫폼까지 먼저 만들면 실험하려던 콘텐츠보다 플랫폼 작업이 커질 위험이 있다(\u003cstrong>추정\u003c/strong>). 대안은 한 가지 콘텐츠 흐름만 구현한 뒤 두 번째 장면에서 그 계약의 경계를 확인하는 것이다. 계약·검증기 최소 확장 \u003cstrong>추정 2–3인일\u003c/strong>, 두 번째 장면 이전·수정 반복 \u003cstrong>추정 1–2인일\u003c/strong>을 별도로 잡아야 한다.\u003c/p>\n\u003ch2 id=\"2-8\">2. 초안 8절의 여섯 질문에 대한 답\u003c/h2>\n\u003ch3 id=\"1_1\">질문 1. 네 축 선택이 맞는가? 무엇을 빼고 넣어야 하는가?\u003c/h3>\n\u003cp>\u003cstrong>답: 맞지 않는다. 필수 네 축을 폐기하고, 출처 있는 설명과 사용자 이해 검증을 중심에 놓아라. 날씨와 동행 NPC는 우선 제외한다. 강제 카메라 연출도 필요성이 확인될 때만 붙인다.\u003c/strong>\u003c/p>\n\u003cp>“공간 음향+위치 내레이션”부터 서로 다른 변수다. 바닷소리가 장소감을 주는지와 설명 음성이 사건을 이해시키는지는 같은 시험이 아니다. “가장 싸고 몰입 효과가 크다”는 제작 시간이나 사용자 비교 근거가 저장소에 없다. “잔상은 이질감이 적다”도 근거 없는 추정이다. 초안은 가설을 결론처럼 썼다.\u003c/p>\n\u003cp>GLB를 배치하는 것과 동행 캐릭터를 만드는 것도 다르다. PlayCanvas 앱의 GLB 경로는 컨테이너를 인스턴스화하고 월드 변환을 적용한다. 이것만으로 보행 애니메이션, 바닥 추종, 길 찾기, 정지·재출발, 시대 교체 때 NPC 위치 복구가 검증되지는 않는다. 엔진이 이를 지원하지 않는다는 뜻이 아니라 \u003cstrong>이 프로젝트가 아직 확인하지 않았다는 뜻\u003c/strong>이다. \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">근거: \u003ccode>apps/spike-playcanvas/src/main.ts\u003c/code>의 GLB 생성·시대 전환 경로 (원본 저장소 파일)\u003c/span>, \u003ca href=\"../implementation/AUTHORING-COST.html\">\u003ccode>docs/implementation/AUTHORING-COST.md\u003c/code>\u003c/a>\u003c/p>\n\u003cp>카메라 연출은 더 구체적인 함정이 있다. \u003ccode>RouteBenchmark\u003c/code>의 \u003ccode>begin/pose/end\u003c/code>는 이미 카메라 경로 재생, 물리 정지, 시선·속도 복원을 한다. “레일은 처음부터 만들어야 한다”는 반박은 틀리다. 그러나 같은 앱의 \u003ccode>update\u003c/code>에서 \u003ccode>stream.update(feet)\u003c/code>는 \u003ccode>!replaying\u003c/code> 분기 안에 있고, 스트리밍 기준도 카메라가 아니라 플레이어 발이다. 재생 중 핫스팟은 숨긴다. 이를 그대로 연출에 쓰면 다른 구역으로 이동한 카메라에 필요한 장면을 준비하지 못할 위험이 있다(\u003cstrong>추정\u003c/strong>). 현재 재생 기능은 서사 연출의 로딩·취소·자막·복귀 계약을 입증하지 않는다. \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">근거: \u003ccode>apps/spike-playcanvas/src/main.ts\u003c/code>의 \u003ccode>RouteBenchmark\u003c/code> 설정과 \u003ccode>app.on('update')\u003c/code> (원본 저장소 파일)\u003c/span>\u003c/p>\n\u003cp>권장 대안은 다음과 같다. 비용은 모두 \u003cstrong>추정\u003c/strong>이다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>구성\u003c/th>\n\u003cth>이번에 검증할 질문\u003c/th>\n\u003cth style=\"text-align: right;\">추가 작업량\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>십상 하나, 사실 주장 3개, 출처와 표현 종류가 있는 정지 지점 2–3개\u003c/td>\n\u003ctd>무엇을 이해시킬 것인가? 어떤 부분은 재구성인가?\u003c/td>\n\u003ctd style=\"text-align: right;\">자료·대본·검수 1–2인일, 자료 확보 전제\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>기존 패널 유지, 선택 재생 내레이션과 동일 내용 자막\u003c/td>\n\u003ctd>음성을 빼도 정보가 남는가? 설명을 다시 찾을 수 있는가?\u003c/td>\n\u003ctd style=\"text-align: right;\">구현·임시 음원·정리 2–3인일\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>사용자 주도 이동과 다음 지점 안내\u003c/td>\n\u003ctd>사건 설명에 이 위치·방향·거리 관계가 실제로 필요한가?\u003c/td>\n\u003ctd style=\"text-align: right;\">배치·안내 1–2인일\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>같은 사실·이미지·설명을 담은 단순 페이지 대조군\u003c/td>\n\u003ctd>공간 탐색이 추가한 가치가 있는가?\u003c/td>\n\u003ctd style=\"text-align: right;\">제작 1–2인일, 평가 비용 별도\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>필요가 입증된 짧은 레일 하나만 후속 추가\u003c/td>\n\u003ctd>자동 시선 유도가 이해를 개선하는가?\u003c/td>\n\u003ctd style=\"text-align: right;\">취소·실패·스트리밍 포함 3–5인일\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>날씨와 NPC를 제외하는 추가 구현비는 \u003cstrong>0인일\u003c/strong>이다. 이것은 기능을 줄여 멋을 포기하는 결정이 아니라, 실패 원인을 구분할 수 있게 실험 변수를 줄이는 결정이다. 네 효과를 동시에 켜고 만족도를 물으면 무엇이 도움이 됐는지 판단할 수 없다.\u003c/p>\n\u003ch3 id=\"2-sunnyvale\">질문 2. Sunnyvale로 시작해야 하는가? 처음부터 성지 유사 장면을 찾아야 하는가?\u003c/h3>\n\u003cp>\u003cstrong>답: 런타임 회귀 시험에는 Sunnyvale을 쓰되, 십상 경험의 대표 대역으로 승인해서는 안 된다. 새 장면 탐색도 ‘분위기가 비슷한가’가 아니라 필요한 공간 관계를 시험할 수 있는가로 제한해야 한다.\u003c/strong>\u003c/p>\n\u003cp>먼저 어느 Sunnyvale인지 고정해야 한다. \u003ccode>sunnyvale.json\u003c/code>은 \u003ccode>hotspots: []\u003c/code>, \u003ccode>benchmarkRoute: []\u003c/code>인 원본 벽 비교 장면이다. \u003ccode>sunnyvale-era.json\u003c/code>은 분할 데이터에 가상 벽과 설명을 합친 별도 장면이다. “기존 Sunnyvale에 시대·분할·측정이 있으니 사용”이라고만 쓰면 원본의 시각 품질, 축소본의 로딩, 후속 장면의 기능을 한 장면의 능력처럼 섞는다. \u003ca href=\"../../shared/public/world/sunnyvale.json\">근거: \u003ccode>shared/public/world/sunnyvale.json\u003c/code>\u003c/a>, \u003ca href=\"../../shared/public/world/sunnyvale-era.json\">\u003ccode>shared/public/world/sunnyvale-era.json\u003c/code>\u003c/a>, \u003ca href=\"../implementation/SPIKE-DECISION-REPORT.html\">\u003ccode>docs/implementation/SPIKE-DECISION-REPORT.md\u003c/code> §5–6\u003c/a>\u003c/p>\n\u003cp>박물관 외관이 성지와 덜 닮았다는 것은 부차적이다. 방언 공사를 설명하려면 어떤 지형 변화와 사람의 행위를 연결할 것인지 먼저 정해야 한다. 그 관계가 없는 공간에서 날씨와 사람만 추가해도 장소 기반 이해가 검증되지는 않는다. 반대로 전통 건축이 보이는 공개 장면도 그 관계가 없으면 더 비싼 장식일 뿐이다(\u003cstrong>추정\u003c/strong>).\u003c/p>\n\u003cp>대안은 두 시험을 분리하는 것이다.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>기능 시험:\u003c/strong> 자산 해시·축소 조건·장면 ID를 고정한 Sunnyvale 한 변형으로 입력, 소리 정리, 구역 경계, 복귀를 검증한다. 고정·기준 실행 비용 \u003cstrong>추정 0.5–1인일\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>의미 시험:\u003c/strong> 검수된 글·사진·도식으로 사건과 장소의 관계를 먼저 설명한다. 실제 장소가 아닌 배경에는 항상 “기술 시험용 대역”을 표시하고, 실제 성지의 장소감은 평가 항목에서 제외한다. 콘텐츠 초안과 도식 비용 \u003cstrong>추정 1–2인일\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>새 대역 도입 조건:\u003c/strong> 위 관계를 시험할 수 없다는 구체적 사유가 있을 때만 후보 조사에 \u003cstrong>추정 0.5–1인일\u003c/strong>을 상한으로 둔다. 적합 후보의 정합·충돌·축소·라이선스 기록·기준 시험은 별도로 \u003cstrong>추정 3–6인일\u003c/strong>. 상한 내 후보가 없으면 더 찾지 말고 검증 범위를 낮춘다.\u003c/li>\n\u003c/ul>\n\u003cp>초안의 “네 축을 다 붙인 후 분위기 때문에 판단이 안 되면 교체”는 순서가 거꾸로다. \u003cstrong>어떤 판단을 대역에서 할 수 있는지 먼저 정해야 한다.\u003c/strong>\u003c/p>\n\u003ch3 id=\"3\">질문 3. 과거를 보는 창과 타임랩스를 제외하는 것이 맞는가?\u003c/h3>\n\u003cp>\u003cstrong>답: 창 셰이더와 연속 타임랩스는 제외하되, 사건에 필요한 전후 비교까지 제외해서는 안 된다.\u003c/strong>\u003c/p>\n\u003cp>초안의 “중간 단계를 여러 장 끼우는 문제”는 과소평가다. 현재 데이터 계약은 현재/과거 두 층이고, Sunnyvale 시대 JSON의 과거 스플랫 객체도 현재와 같은 \u003ccode>assetId\u003c/code>를 사용한다. 가상 벽이 달라지는 시험이지 실제 지형의 변천 자료가 아니다. \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">근거: \u003ccode>shared/src/world.ts\u003c/code>의 \u003ccode>Layer\u003c/code>·\u003ccode>streamingChunks\u003c/code> (원본 저장소 파일)\u003c/span>, \u003ca href=\"../../shared/public/world/sunnyvale-era.json\">\u003ccode>shared/public/world/sunnyvale-era.json\u003c/code>\u003c/a>, \u003ca href=\"../implementation/SUNNYVALE-ERA-INTEGRATION.html\">\u003ccode>docs/implementation/SUNNYVALE-ERA-INTEGRATION.md\u003c/code>\u003c/a>\u003c/p>\n\u003cp>타임랩스에는 중간 상태의 역사적 근거, 표현의 시간 단위, 지형·충돌 변화, 관찰자 위치의 유효성, 자산 교체 정책이 필요하다. 문헌에 없는 중간 모습을 연속 영상으로 보여주면 확정된 역사처럼 받아들일 위험이 있다(\u003cstrong>추정\u003c/strong>). “실제 자료와 상징 표현을 구분하라”는 기존 원칙을 더 어렵게 만드는 기능이다. \u003ca href=\"../init/03_service_mvp_and_roadmap.html\">근거: \u003ccode>docs/init/03_service_mvp_and_roadmap.md\u003c/code> §4\u003c/a>, \u003ca href=\"../implementation/WALKMESH-AUTHORING.html\">\u003ccode>docs/implementation/WALKMESH-AUTHORING.md\u003c/code>\u003c/a>\u003c/p>\n\u003cp>과거 창은 두 레이어의 동시 표시·마스킹과 깊이·정렬을 별도로 검증해야 한다. 현재 결과만으로 상주량이 정확히 두 배라고 단정할 수는 없지만, 추가 자산과 렌더링 비용이 생길 위험은 있다(\u003cstrong>추정\u003c/strong>). 기존 전체 시대 전환의 통과로 창 효과의 성능을 대체할 수 없다.\u003c/p>\n\u003cp>대안은 출처 있는 전후 이미지·지도 두 장과 변화 지점 설명부터 시작하는 것이다(\u003cstrong>추정 1–2인일\u003c/strong>, 자료 확보 전제). 그것으로 부족하다는 관찰이 나올 때만 핵심 구조물 GLB 하나를 비교한다(\u003cstrong>추정 2–4인일\u003c/strong>, 단순 모형·검수 포함). 렌즈 효과를 꼭 비교해야 한다면 제한된 장면의 별도 기술 시험에 \u003cstrong>추정 3–5인일\u003c/strong>을 잡되, 실제 역사 복원 제작비는 포함하지 않는다. 사건 설명의 핵심이 지형 변화라면 날씨보다 이 비교가 먼저다.\u003c/p>\n\u003ch3 id=\"4\">질문 4. 한계가 분명한 날씨 축에 시험 가치가 있는가?\u003c/h3>\n\u003cp>\u003cstrong>답: 현재 콘텐츠 스파이크의 필수 축으로는 가치가 입증되지 않았다. 목표 문장부터 잘못됐다.\u003c/strong>\u003c/p>\n\u003cp>“재조명 불가라는 한계를 실측으로 확정”하는 것은 성공 기준이 아니다. 한 장면에서 특정 구현이 실패했다고 스플랫 재조명의 보편적 불가능을 증명할 수 없다. 저장소 보고서는 해당 콘텐츠용 재조명 방법들을 비교하지 않았다. 그러므로 초안의 “불가”는 현 구현에서 지원·검증하지 않았다는 수준으로 낮춰야 한다.\u003c/p>\n\u003cp>더 나쁜 점은 하늘 제거·구름·안개·비·색보정을 한 축으로 묶었다는 것이다. 수목·처마 경계의 제거 품질, 촬영된 그림자와 새 하늘의 불일치, 비와 지면의 접촉, 투명 표현의 순서는 서로 다른 실패다(\u003cstrong>추정\u003c/strong>). 정적인 벽도 여러 시점에서 품질을 확인해야 했다는 저장소 경험을 무시한다. 기존 벽 비침은 일부 네 시점의 불투명 패치로 가려졌지만, 뒤이은 이동·시대 전환·근접 화면 76장 검토에서는 경계와 질감 문제가 남았다. 이것은 날씨 실패의 직접 증거는 아니며, \u003cstrong>한 장의 좋아 보이는 캡처로 합격시켜서는 안 된다는 근거\u003c/strong>다. \u003ca href=\"../implementation/SPIKE-DECISION-REPORT.html\">근거: \u003ccode>docs/implementation/SPIKE-DECISION-REPORT.md\u003c/code> §7\u003c/a>\u003c/p>\n\u003cp>권장안은 날씨 구현 \u003cstrong>0인일\u003c/strong>, 제외다. “하늘을 바라보는 행위가 이 사건의 이해에 필요하다”는 검수된 대본과 평가 질문이 있을 때만, 맑은 하늘 한 상태의 작은 교체 시험에 \u003cstrong>추정 1–2인일\u003c/strong>을 허용한다. 고정 경로의 정면·측면·수목/건물 경계와 실제 iPhone 프레임을 원본과 비교한다. 비·안개·주야간까지 묶는다면 자산 정리와 통합에 \u003cstrong>추정 4–8인일 이상\u003c/strong>을 별도 편성해야 하며, 이 범위도 일반적 재조명 가능/불가능의 판정은 아니다.\u003c/p>\n\u003ch3 id=\"5\">질문 5. 성공 기준이 측정 가능한가? 외부 평가자 기준은 현실적인가?\u003c/h3>\n\u003cp>\u003cstrong>답: 현재 네 기준은 모두 합격 판정에 부족하다. 특히 전문가 한 명의 ‘이해했다’는 응답은 학습 효과의 증거가 아니다.\u003c/strong>\u003c/p>\n\u003cp>교무·해설자는 정확성과 표현 적절성을 검수할 수 있다. 이미 내용을 아는 사람이 이 경험 때문에 새롭게 이해했는지는 별개다. 반대로 일반 이용자의 재미·이해 자기평가가 높아도 역사적 오해를 배웠을 수 있다(\u003cstrong>추정\u003c/strong>). 정확성 검수와 대상 이용자 평가를 분리해야 한다.\u003c/p>\n\u003cp>아래는 \u003cstrong>새로 제안하는 잠정 합격선이며, 수치의 타당성은 추정\u003c/strong>이다. 첫 회차 전에 고정하고 결과를 본 뒤 유리하게 바꾸지 않는다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>평가 대상\u003c/th>\n\u003cth>관찰·기록 방법\u003c/th>\n\u003cth>잠정 판정\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>자료 정확성\u003c/td>\n\u003ctd>사실 주장 3개마다 출처·표현 종류·검수 의견 기록. 교무/해설자 1인의 역할을 승인 범위와 함께 명시\u003c/td>\n\u003ctd>미해결 중대 사실 오류 0개. 전문가 1인의 검토를 교단 전체 승인으로 표현하지 않음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>비전문가 이해\u003c/td>\n\u003ctd>목표 이용자에 맞는 초심자 8명. 사전 지식 기록 후 단순 페이지 4명, 공간판 4명으로 나눠 동일 내용·최대 이용 시간을 제공. 자유 회상과 장소 관계 질문을 사전 채점표로 평가\u003c/td>\n\u003ctd>공간판 4명 중 3명 이상이 핵심 사실 3개 중 2개와 선정한 공간 관계를 설명. 작은 표본이므로 일반적 교육 효과나 통계적 우월성을 주장하지 않음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>표현 오인\u003c/td>\n\u003ctd>실제 촬영/문헌 기반 복원/추정/상징 중 해당 표현을 구분하게 하고, 대역을 실제 성지로 인식했는지 질문\u003c/td>\n\u003ctd>중대한 오인 1건이라도 나오면 표시·대본을 수정한 뒤 재시험. ‘감동했다’로 상쇄하지 않음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>공간의 추가 가치\u003c/td>\n\u003ctd>두 집단의 오답·도움 요청·중도 이탈·소요 시간 비교. 내용량 차이는 없애기\u003c/td>\n\u003ctd>페이지보다 나아진 공간 이해의 사례가 없고 탐색 부담만 늘면, 효과를 추가하지 말고 공간판 가설을 재검토\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>독립 사용\u003c/td>\n\u003ctd>진행자가 도와주지 않고 시작→지점 탐색→설명 확인→출처 찾기→종료 수행. 도움 준 시점도 기록\u003c/td>\n\u003ctd>공간판 4명 중 3명 이상 완료. 소리 없이도 같은 핵심 정보 접근 가능\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>선언적 이전\u003c/td>\n\u003ctd>두 번째 장면에서 위치·크기·구역 경계를 바꿔 재배치하고 설명 하나 수정 후 재생성. 코드 diff와 수작업 시간 기록\u003c/td>\n\u003ctd>콘텐츠별 앱 코드 수정 없음, 출처·소유 구역 참조 누락 없음. 실패하면 ‘완전 선언형’ 주장을 철회\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>모바일\u003c/td>\n\u003ctd>고정 빌드·자산으로 iPhone 실기기 손가락 조작 10분×3회. 최초 유효 화면, 구역 전환, 취소, 배경 전환 후 복귀, 좌표·낙하 복구 기록\u003c/td>\n\u003ctd>충돌·낙하·복구 반복·입력 잠금 잔류 0건. 잠정 목표: 유효 화면 10초 이내, 활성 탐색 프레임 간격 p95 50ms 이하, 500ms 초과 정지 0건. 기존 결과가 충족했다는 뜻 아님\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>제작비\u003c/td>\n\u003ctd>공통 구현·자료 조사·대본·음원·장면 배치·충돌 수정·기기 시험·수정 재작업을 분리\u003c/td>\n\u003ctd>각 작업의 실제 인시와 기계 처리 시간, 대기 시간, 산출물 버전이 연결되어야 함. 첫 장면 총시간을 다음 성지 단가로 복사하지 않음\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>모바일의 네트워크·캐시 조건, 온도·배터리·화면 크기·DPR·가시성을 기록하고, 로딩·의도된 정지와 활성 탐색 통계를 분리해야 한다. 첫 유효 화면도 앱의 \u003ccode>ready\u003c/code> 표시와 구분한다. iPhone 한 대 통과는 Android나 모든 iPhone 통과가 아니다. 해당 제한은 이미 측정 문서가 명시했다. \u003ca href=\"../implementation/MOBILE-COMPARISON.html\">근거: \u003ccode>docs/implementation/MOBILE-COMPARISON.md\u003c/code>\u003c/a>, \u003ca href=\"../implementation/MOBILE-STREAMING-ERA.html\">\u003ccode>docs/implementation/MOBILE-STREAMING-ERA.md\u003c/code>\u003c/a>, \u003ca href=\"../implementation/SPIKE-DECISION-REPORT.html\">\u003ccode>docs/implementation/SPIKE-DECISION-REPORT.md\u003c/code> §2·§5\u003c/a>\u003c/p>\n\u003cp>평가 설계·진행·분석은 \u003cstrong>추정 2–3인일\u003c/strong>, 전문가 검수·수정은 \u003cstrong>추정 1–2인일\u003c/strong>, 기기·실패 경로 시험은 \u003cstrong>추정 2–3인일\u003c/strong>이다. 참여자 모집과 전문가 일정 대기는 별도다. 8명 모집이 불가능하면 형성 평가의 사례 수를 줄이되, 성공 기준을 만족한 것처럼 바꾸지 말고 미검증 범위를 남긴다.\u003c/p>\n\u003ch3 id=\"6\">질문 6. 실제 성지로 옮길 때 어떤 가정이 깨지는가?\u003c/h3>\n\u003cp>\u003cstrong>답: 파일 경로만 바꾸면 되는 부분보다 다시 저작·검수할 부분이 더 많을 가능성이 있다(추정). ‘그대로 이식’은 폐기하고, 무엇을 재사용하고 무엇을 다시 만드는지 분리해야 한다.\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>깨질 가정\u003c/th>\n\u003cth>저장소 근거\u003c/th>\n\u003cth>대안과 비용 — 모두 추정\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>스플랫과 충돌에 같은 변환을 주면 된다\u003c/td>\n\u003ctd>Sunnyvale은 스플랫 Z축 180도 회전, 충돌은 별도 기준. 정합 수정 경험이 있음. \u003ccode>SECOND-SCENE.md\u003c/code>, \u003ccode>sunnyvale.json\u003c/code>\u003c/td>\n\u003ctd>새 장면마다 기준점·단위·방향·시선 높이 검수 1–2인일\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>기존 바닥으로 NPC와 연출까지 이동 가능\u003c/td>\n\u003ctd>현관 수리는 특정 구역 보정이고, 실제 시대별 바닥은 별도 작성 과제. \u003ccode>SPIKE-DECISION-REPORT.md\u003c/code> §4·§9, \u003ccode>WALKMESH-AUTHORING.md\u003c/code>\u003c/td>\n\u003ctd>작은 구역 한 곳의 보행·금지 경계·연출 복귀점 제작 2–4인일. 성지 전체 견적 아님\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>분할 생성기는 장소를 가리지 않는다\u003c/td>\n\u003ctd>Hall과 Sunnyvale의 X축 분할 생성기는 범용 지형 저작기가 아님. 경계 변경 후 콘텐츠 소유권도 자동 재배치되지 않음. \u003ccode>AUTHORING-COST.md\u003c/code>\u003c/td>\n\u003ctd>두 번째 장면에서 경계·핫스팟 재배치 1–2인일. 임의 지형용 생성기 개편은 별도 산정\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>과거 자산이 들어오면 기존 시대 전환에 끝난다\u003c/td>\n\u003ctd>\u003ccode>sunnyvale-era.json\u003c/code>은 같은 현재 스플랫을 과거에 재사용. 실제 과거 지형·건축물 검증 아님\u003c/td>\n\u003ctd>핵심 전후 관계 하나의 도식·단순 GLB 시험 2–4인일. 학술 복원 전체 비용은 산정 불가\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>모바일 안전 예산이 확보됐다\u003c/td>\n\u003ctd>900k SH0는 품질을 바꾼 기능 시험. 논리적 상주 점 수는 실제 RAM/VRAM이 아님. \u003ccode>SPIKE-DECISION-REPORT.md\u003c/code> §3·§6\u003c/td>\n\u003ctd>실제 새 자산의 품질·로딩·기기 예산 반복 2–4인일, 초과 시 범위 축소\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>촬영 후 파일만 들어오면 된다\u003c/td>\n\u003ctd>초기 기술 계획은 촬영·SfM·학습을 제외했고 실제 프로젝트용 별도 파이프라인을 요구. \u003ccode>01_tech_spike_playcanvas.md\u003c/code>, \u003ccode>02_tech_spike_threejs.md\u003c/code>\u003c/td>\n\u003ctd>촬영·허용 범위·자료·정합 체크리스트와 작은 파일럿 견적 조사 1–2인일. 현장 생산 자체는 현재 근거로 견적 확정 불가\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>효과의 의미와 자료 권한도 이전된다\u003c/td>\n\u003ctd>표현·확신·출처는 콘텐츠별 데이터이고 현재 값은 시험용. Sunnyvale SOG의 CC BY 기록은 새 음원·인물·사료의 근거가 아님\u003c/td>\n\u003ctd>사용할 자산별 출처·사용 조건·표현 승인 목록 0.5–1인일. 미확보 자료는 대체하거나 제외\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>표의 근거 파일: \u003ca href=\"../implementation/SECOND-SCENE.html\">\u003ccode>docs/implementation/SECOND-SCENE.md\u003c/code>\u003c/a>, \u003ca href=\"../../shared/public/world/sunnyvale.json\">\u003ccode>shared/public/world/sunnyvale.json\u003c/code>\u003c/a>, \u003ca href=\"../implementation/WALKMESH-AUTHORING.html\">\u003ccode>docs/implementation/WALKMESH-AUTHORING.md\u003c/code>\u003c/a>, \u003ca href=\"../implementation/AUTHORING-COST.html\">\u003ccode>docs/implementation/AUTHORING-COST.md\u003c/code>\u003c/a>, \u003ca href=\"../init/01_tech_spike_playcanvas.html\">\u003ccode>docs/init/01_tech_spike_playcanvas.md\u003c/code>\u003c/a>, \u003ca href=\"../init/02_tech_spike_threejs.html\">\u003ccode>docs/init/02_tech_spike_threejs.md\u003c/code>\u003c/a>, \u003ca href=\"../../shared/public/world/content.json\">\u003ccode>shared/public/world/content.json\u003c/code>\u003c/a>.\u003c/p>\n\u003cp>이전 시험의 합격은 “두 번째 대역에서도 계약이 작동했다”까지다. 실제 성지의 촬영 품질, 장소감, 문화적 적절성까지 통과한 것은 아니다. 실제 장소가 없다는 제약은 이 한계를 없애 주지 않는다.\u003c/p>\n\u003ch2 id=\"3_1\">3. 초안이 묻지 않은 문제\u003c/h2>\n\u003ch3 id=\"31\">3.1 누구에게 어떤 이해를 주려는가?\u003c/h3>\n\u003cp>초안은 이용자가 교도인지, 처음 접하는 사람인지, 현장 방문 전 해설이 필요한 사람인지 정하지 않았다. 초기 기획이 서비스 성격을 열어 놓은 것은 근거 없이 모두를 대상으로 해도 된다는 뜻이 아니다. 같은 공간이 순례·역사 교육·아카이브에 모두 같은 성공 기준을 가질 수는 없다. \u003ca href=\"../init/03_service_mvp_and_roadmap.html\">근거: \u003ccode>docs/init/03_service_mvp_and_roadmap.md\u003c/code> §1·§7\u003c/a>\u003c/p>\n\u003cp>권장 결정은 이번 시험의 일차 대상을 “해당 십상을 잘 모르는 성인”처럼 하나로 제한하고, 5분 후 답할 질문 세 개를 먼저 쓰는 것이다. 대상 선정과 질문 작성 \u003cstrong>추정 0.5–1인일\u003c/strong>. 이는 실제 사용자가 그 집단이라는 사실 주장이 아니라 실험 범위를 고정하는 제안이다.\u003c/p>\n\u003ch3 id=\"32\">3.2 음성이 패널을 대체하면 출처와 불확실성은 어디에 남는가?\u003c/h3>\n\u003cp>기존 패널은 설명·이미지뿐 아니라 \u003ccode>representation\u003c/code>, \u003ccode>confidence\u003c/code>, \u003ccode>sources\u003c/code>를 전달한다. 이미지 실패에도 설명과 출처는 남는다. 패널을 없애고 소리만 남기면 이 정보 전달 경로를 새로 설계해야 한다. \u003ca href=\"../implementation/CONTENT-LIFECYCLE.html\">근거: \u003ccode>docs/implementation/CONTENT-LIFECYCLE.md\u003c/code>\u003c/a>, \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">\u003ccode>shared/src/world.ts\u003c/code>의 \u003ccode>Content\u003c/code> (원본 저장소 파일)\u003c/span>\u003c/p>\n\u003cp>잔상·염불·인물 대사는 단순 분위기 자산이 아니다. 이용자가 실제 당시의 행위나 발언으로 받아들일 위험, 특정 연출을 부적절하게 느낄 위험은 \u003cstrong>추정\u003c/strong>이며 저장소에는 이를 검수한 기록이 없다. 인물과 발언의 출처, 창작 여부, 검수 책임자를 정하지 않은 상태에서 “이질감”만 평가하면 중요한 위험을 놓친다.\u003c/p>\n\u003cp>대안은 패널을 남기고 모든 음성에 동일 문장 자막·출처 접근·상징 표현 표지를 제공하는 것이다. 기존 패널을 활용한 추가 표시·검수 \u003cstrong>추정 1–2인일\u003c/strong>. 출처 없는 실제 인물의 대사를 만드는 대신 중립적인 해설문을 쓴다.\u003c/p>\n\u003ch3 id=\"33\">3.3 정상 종료가 아닌 취소·실패의 주인은 누구인가?\u003c/h3>\n\u003cp>\u003ccode>syncInput\u003c/code>은 현재 패널·시대 전환·벤치마크·장면 사용 가능 상태를 묶어 입력을 막는다. 새 레일·음성·NPC를 별도로 붙이면 어떤 상태가 입력과 카메라를 소유하는지 결정해야 한다. “입력 잠금 재사용”만으로 완료되지 않는다. \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">근거: \u003ccode>apps/spike-playcanvas/src/main.ts\u003c/code>의 \u003ccode>syncInput\u003c/code>, \u003ccode>onSwitch\u003c/code>, \u003ccode>returnToSpawn\u003c/code> (원본 저장소 파일)\u003c/span>\u003c/p>\n\u003cp>특히 기존 설명 패널 시험은 패널 중 이동이 막혀 소유 구역 밖으로 나가는 경로가 발생하지 않았다고 명시한다. 자동 이동을 붙이면 바로 그 미검증 경로가 열린다. \u003ca href=\"../implementation/CONTENT-LIFECYCLE.html\">근거: \u003ccode>docs/implementation/CONTENT-LIFECYCLE.md\u003c/code>의 범위와 제한\u003c/a>\u003c/p>\n\u003cp>필수 실패 사례는 재생 중 시대 변경, 다음 구역 로딩 실패, 음원 실패, 연속 진입, 건너뛰기, 장면 변경 직후 늦게 끝난 요청, 백그라운드 후 복귀다. 중복 재생이나 잠금 잔류가 생길 수 있다는 것은 \u003cstrong>추정\u003c/strong>이며, 실제로 이미 발생했다고 주장하지 않는다. 상태 소유권·취소·자원 정리 구현과 실패 주입 시험에 \u003cstrong>추정 2–3인일\u003c/strong>을 둔다. 레일을 제외하면 시험 조합도 줄어든다.\u003c/p>\n\u003ch3 id=\"34\">3.4 듣지 못하거나 자동 카메라를 원하지 않는 사람은 제외하는가?\u003c/h3>\n\u003cp>모바일 기록에는 큰 패널과 WASD 중심 안내가 남아 있고, 실제 손가락 조작·스크린리더 사용성은 통과 범위가 아니다. 그러므로 새 내레이션과 강제 카메라를 기본값으로 정할 사용성 근거도 없다. \u003ca href=\"../implementation/MOBILE-COMPARISON.html\">근거: \u003ccode>docs/implementation/MOBILE-COMPARISON.md\u003c/code>\u003c/a>, \u003ca href=\"../implementation/CONTENT-LIFECYCLE.html\">\u003ccode>docs/implementation/CONTENT-LIFECYCLE.md\u003c/code>\u003c/a>\u003c/p>\n\u003cp>자동 시점 이동의 불편, 소리를 켤 수 없는 환경에서의 정보 누락은 \u003cstrong>추정 위험\u003c/strong>이다. 자막·음소거·건너뛰기·수동 탐색 경로를 처음부터 같은 핵심 정보에 연결하고 실제로 시험해야 한다. 최소 대체 조작과 표시 \u003cstrong>추정 1–2인일\u003c/strong>, 광범위한 접근성 적합성 판정은 이 비용과 시험 범위에 포함하지 않는다.\u003c/p>\n\u003ch3 id=\"35\">3.5 공통 구현비와 장소별 제작비를 어떻게 분리하는가?\u003c/h3>\n\u003cp>초안은 축별 시간을 기록하면 실제 성지 견적에 쓸 수 있다고 한다. 그러나 첫 구현의 타입·로더·상태 관리 비용과 두 번째 장소의 배치·검수 비용은 다르다. 보고서의 18개 파일 변환 80.325초는 기계 처리 시간이지 저작 인건비가 아니다. 현재 문서도 실제 장소 한 구역의 제작·수정 인시가 없다고 명시한다. \u003ca href=\"../implementation/SPIKE-DECISION-REPORT.html\">근거: \u003ccode>docs/implementation/SPIKE-DECISION-REPORT.md\u003c/code> §8\u003c/a>, \u003ca href=\"../implementation/AUTHORING-COST.html\">\u003ccode>docs/implementation/AUTHORING-COST.md\u003c/code>\u003c/a>\u003c/p>\n\u003cp>대안은 첫 장면 구현 뒤 두 번째 장면에 이전하고, 사실 문장 하나와 지점 하나를 변경하여 재생성·검수까지 되풀이하는 것이다. 기록 양식 준비 \u003cstrong>추정 0.5인일\u003c/strong>, 작은 이전·수정 리허설 \u003cstrong>추정 1–2인일\u003c/strong>. 그렇게 얻은 값도 실제 촬영·역사 복원 단가가 아니라 소규모 콘텐츠 배치의 표본이다.\u003c/p>\n\u003ch3 id=\"36\">3.6 어떤 결과면 공간 경험을 줄이거나 포기하는가?\u003c/h3>\n\u003cp>초안에는 중단 기준이 없다. 네 축을 구현하고 전문가가 좋다고 하면 다음 단계로 가는 구조다. 실패해도 더 닮은 장면, 더 좋은 음원, 더 정교한 NPC가 필요하다고 해석하면 가설을 반증할 수 없다.\u003c/p>\n\u003cp>권장 중단 조건은 세 가지다. 자료 검수 없이 효과 제작에 들어가지 않는다. 대조 페이지와 비교해 공간 관계 이해의 이득이 관찰되지 않으면 다음 연출 축을 추가하지 않는다. 실제 손가락 조작과 실패 복귀가 통과하지 않으면 시각 효과를 추가하지 않는다. 판정 회의와 결과 기록 \u003cstrong>추정 0.5–1인일\u003c/strong>. 이는 프로젝트 폐기가 아니라 다음 투자의 근거를 요구하는 문턱이다.\u003c/p>\n\u003ch2 id=\"4_1\">4. 대체 실행 순서와 예산\u003c/h2>\n\u003cp>네 축을 병렬로 만드는 일정 대신 아래의 작은 검증 순서를 권한다. 모든 비용은 \u003cstrong>추정 인일\u003c/strong>이며 위 항목별 비용을 다시 더하지 않는다. 대본·자료·검수자를 확보할 수 있고, 기존 두 장면과 단순 내레이션을 쓰며, 새 촬영·고급 캐릭터·날씨·레일은 만들지 않는 조건이다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>순서\u003c/th>\n\u003cth>작업과 산출물\u003c/th>\n\u003cth style=\"text-align: right;\">추정 작업량\u003c/th>\n\u003cth>다음 단계로 가는 조건\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>대상 이용자, 사건 하나, 사실 3개, 출처·표현 구분, 평가 질문 확정\u003c/td>\n\u003ctd style=\"text-align: right;\">1–2인일\u003c/td>\n\u003ctd>출처·검수 책임 확보. 없으면 기술 데모로 범위 하향\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>동일 정보의 단순 페이지와 공간판 대본·지점 구성\u003c/td>\n\u003ctd style=\"text-align: right;\">2–3인일\u003c/td>\n\u003ctd>공간에서만 시험할 관계를 한 문장으로 설명 가능\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>기존 패널+선택 음성+자막, 필요한 최소 데이터 계약·검증\u003c/td>\n\u003ctd style=\"text-align: right;\">2–3인일\u003c/td>\n\u003ctd>소리 없이도 동일 정보, 출처 접근 가능\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>취소·실패·구역 정리, 고정 장면의 iPhone 실제 입력 시험\u003c/td>\n\u003ctd style=\"text-align: right;\">2–3인일\u003c/td>\n\u003ctd>반복 잠금·낙하·지연 기준 실패 해결 또는 범위 축소\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>두 번째 기존 장면 이전과 콘텐츠 수정 리허설\u003c/td>\n\u003ctd style=\"text-align: right;\">1–2인일\u003c/td>\n\u003ctd>코드와 데이터 변경량·공통비/장소별 비용 분리\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>전문가 검수·수정, 초심자 4+4명 형성 평가 준비·진행\u003c/td>\n\u003ctd style=\"text-align: right;\">2–3인일\u003c/td>\n\u003ctd>정확성·오인·이해·독립 사용 결과 보존\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>결과 분석, 필요한 재시험, 다음 투자 또는 중단 판정\u003c/td>\n\u003ctd style=\"text-align: right;\">2–3인일\u003c/td>\n\u003ctd>미검증 항목과 다음 효과가 해결할 문제를 명시\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>합계\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>네 효과 구현이 아닌 콘텐츠 가설 검증 한 묶음\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003cstrong>12–19인일\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>섭외·승인 대기, 현장 생산, 대규모 재작업 제외\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>작업량을 캘린더 12–19일로 약속해서는 안 된다. 역할 가용성과 승인 대기가 따로 있다. 기존 \u003ccode>AUTHORING-COST.md\u003c/code>가 인시를 제공하지 않으므로 이 숫자 역시 실측 견적이 아니다. 첫 회차 기록으로 갱신할 계획용 범위다.\u003c/p>\n\u003ch2 id=\"5_1\">5. 최종 반박\u003c/h2>\n\u003cp>지금 비싼 것은 효과 하나의 구현보다 \u003cstrong>잘못된 질문에 통과 판정을 내리는 일\u003c/strong>이다. 네 축은 이해를 검증하기 위한 최소 조건이 아니며, 각각 새로운 상태·자산·검수·기기 조합을 만든다. 현재의 대역 장면으로 실제 성지 이해와 완전한 이식성을 확인할 수 있다는 기대도 과하다.\u003c/p>\n\u003cp>먼저 출처 있는 이야기 하나와 공간 관계 하나를 정하고, 단순 페이지보다 무엇을 더 전달했는지 반증 가능하게 시험하라. 그 결과가 없으면 날씨·동행 캐릭터·레일은 콘텐츠 스파이크의 성과가 아니라 기능 시연 목록이다. 다음 투자 순서는 \u003cstrong>자료와 학습 목표 → 최소 표현 → 실패·기기 검증 → 이용자 관찰 → 필요한 효과 하나\u003c/strong>여야 한다.\u003c/p>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
