120px;margin:auto;border-top:1px solid var(--line);padding:24px;font-size:14px;color:var(--muted)}.intro{max-width:750px;font-size:21px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:32px 0}.button{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);text-decoration:none;border-radius:4px;padding:11px 22px;font-weight:600}.button.secondary{background:transparent;color:var(--green)}.summary{border-left:4px solid var(--green);padding:4px 24px;margin:38px 0;font-size:19px}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.resource{border:1px solid var(--line);padding:22px}.resource h3{margin:0 0 10px}.resource p{font-size:16px;margin:0;color:var(--muted)}.local-file{color:var(--muted)}.meta{color:var(--muted);font-size:14px}.toc{border:1px solid var(--line);padding:16px 24px;margin:28px 0;font-size:15px}.toc>ul{margin:0}.toc li{margin:4px 0}li{margin:8px 0}.downloads{margin:0 0 30px}.measurements ul{padding-left:24px}@media(max-width:650px){body{font-size:16px}main{padding:30px 18px 50px}h1{font-size:29px}h2{font-size:23px}.intro{font-size:19px}.resources{grid-template-columns:1fr}header{padding:16px 18px}table{min-width:680px}.actions{gap:10px}.button{padding:9px 16px}}@media print{header,footer,.downloads{display:none}main{max-width:none;padding:0}body{font-size:11pt}h1{font-size:24pt}h2{font-size:18pt}table{font-size:9pt}.table-scroll{overflow:visible}a{color:inherit}}\n\n:focus-visible{outline:3px solid var(--green);outline-offset:5px}.trial-steps{padding-left:26px;max-width:780px}.trial-steps li{padding-left:8px;margin:18px 0}.trial-steps strong{display:block}.controls{display:grid;grid-template-columns:160px 1fr;gap:10px 24px;max-width:780px}.controls dt{font-weight:600}.controls dd{margin:0}.archive{margin-top:52px;border-top:1px solid var(--line);padding-top:24px}.archive>summary{cursor:pointer;font-size:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"ASSETS.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"_1\">콘텐츠 스파이크 임시 자산\u003c/h1>\n\u003cp>모두 기술 시험용 임시 자산이다. 공개 대역 장면(Sunnyvale 박물관 스플랫)에서 만든 것이며 실제 유산 자료는 없다. 로컬에서만 생성했고 내려받은 자료는 없다. 근거: \u003ca href=\"FINAL.html\">FINAL.md\u003c/a> §2, §3(듣기·하늘 행).\u003c/p>\n\u003cp>재생성: 저장소 루트에서 \u003ccode>python3 scripts/make-content-spike-assets.py [audio|sky|all]\u003c/code> (ffmpeg, macOS \u003ccode>say\u003c/code>, \u003ccode>npx splat-transform\u003c/code> 필요). \u003ccode>sky\u003c/code>는 파티션 \u003ccode>shared/source/content-spike-assets.json\u003c/code>과 \u003ccode>shared/public/world/assets.json\u003c/code>도 갱신한다.\u003c/p>\n\u003ch2 id=\"_2\">자산 목록\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>파일\u003c/th>\n\u003cth>내용\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>ambient-wind\u003c/td>\n\u003ctd>\u003ccode>assets/ambient-wind.mp3\u003c/code>\u003c/td>\n\u003ctd>20 s 루프, 모노 44.1 kHz 96 kbps. brown noise, lowpass 700 Hz, highpass 60 Hz, 0.15 Hz tremolo(깊이 0.6). 피크 약 -7.8 dBFS\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ambient-birds\u003c/td>\n\u003ctd>\u003ccode>assets/ambient-birds.mp3\u003c/code>\u003c/td>\n\u003ctd>20 s 루프. 파이썬으로 합성한 2~5 kHz 사인 스윕 지저귐(불규칙 간격)과 아주 작은 pink noise. 피크 약 -10.3 dBFS\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ambient-water\u003c/td>\n\u003ctd>\u003ccode>assets/ambient-water.mp3\u003c/code>\u003c/td>\n\u003ctd>20 s 루프. 백색 잡음 대역통과(600 Hz~6 kHz, 중심 2.5 kHz), 7 Hz tremolo(깊이 0.25). 피크 약 -9.8 dBFS\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>narration-stop-1\u003c/td>\n\u003ctd>\u003ccode>assets/narration-stop-1.mp3\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>say -v Yuna\u003c/code> 낭독, 모노 44.1 kHz 96 kbps, 길이 10.27 s\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>sunny-strip-{0..5}-{detail,far}-nosky\u003c/td>\n\u003ctd>\u003ccode>assets/sunny-strip-N-{detail,far}-nosky.sog\u003c/code>\u003c/td>\n\u003ctd>하늘 제거 변형 12개\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>루프 처리: 22 s를 생성한 뒤 앞 2 s에 꼬리(20~22 s)를 qsin 곡선 교차 페이드로 겹쳐 20 s로 만든다. 끝 샘플이 처음 샘플로 이어져 경계 클릭이 없도록 한 것이다(청취 확인은 하지 않았다).\u003c/p>\n\u003cp>내레이션 문장(한 글자도 바꾸지 않음):\u003c/p>\n\u003cblockquote>\n\u003cp>임시 문장입니다. 이 지점은 지금의 모습을 촬영한 자리라고 가정합니다. 실제 서비스에서는 장소의 현재 모습에 대한 설명이 이 자리에 들어갑니다.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"_3\">라이선스\u003c/h2>\n\u003cp>오디오 4개는 직접 합성·생성했으며 제3자 자료가 없다. Sunnyvale에서 파생한 스플랫 변형은 원본의 CC BY 4.0 표기를 그대로 따른다: Damjan Cvetkov Dimitrov / zeitgeistarchivescans (\u003ca href=\"../implementation/SECOND-SCENE.html\">SECOND-SCENE.md\u003c/a> 참조).\u003c/p>\n\u003ch2 id=\"_4\">하늘 제거\u003c/h2>\n\u003cp>입력은 \u003ccode>sunny-strip-N-{detail,far}.sog\u003c/code>(월드 좌표, Y 위, 미터 단위, 원본은 수정하지 않음). 도구는 \u003ccode>splat-transform\u003c/code> 3.7.0이고 SOG에서 SOG로 다시 인코딩했다.\u003c/p>\n\u003ch3 id=\"detail-r\">분포 분석(detail, 원점 거리 r 기준)\u003c/h3>\n\u003cp>CSV로 내려 반경 구간별로 파란 정도(B-R&gt;0.12), 로그 스케일 평균, y&gt;25 비율을 봤다. 모든 strip에서 r&lt;80 m는 작은 가우시안(로그 스케일 -3 근처)이고 파랗지 않다(0~15%). r&gt;=100~120 m부터는 개수가 수십~수백 개로 줄고 크기가 크며(로그 스케일 +0.5~+3) 파란 비율과 y&gt;25 비율이 높다. 즉 하늘로 보이는 가우시안은 원점에서 멀리 있는 소수의 큰 점이다. 예외로 strip 5(x 24~400)와 0(x -547~-24)은 80~200 m에도 수천 개가 있고 일부는 지형일 수 있다.\u003c/p>\n\u003ch3 id=\"_5\">시도한 후보\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>후보\u003c/th>\n\u003cth>옵션\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>\u003ccode>-S 0,0,0,80\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B (선택)\u003c/td>\n\u003ctd>\u003ccode>-S 0,0,0,100\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>\u003ccode>-S 0,0,0,120\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>\u003ccode>-S 0,0,0,200 -B -600,-130,-400,500,60,700\u003c/code> (구 + 높이 60 m 상한)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch3 id=\"detail-far-strip-05\">남은 개수(detail / far, strip 0~5 순)\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>후보\u003c/th>\n\u003cth>detail\u003c/th>\n\u003cth>far\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>원본\u003c/td>\n\u003ctd>116614 150946 278922 139103 46075 168340\u003c/td>\n\u003ctd>3888 5032 9298 4637 1536 5612\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>115405 150878 278863 139044 45999 163967\u003c/td>\n\u003ctd>3845 5030 9295 4635 1534 5471\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>B (선택)\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>115512 150900 278889 139072 46045 165954\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>3849 5030 9295 4636 1535 5533\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C\u003c/td>\n\u003ctd>115629 150908 278895 139084 46054 166307\u003c/td>\n\u003ctd>3855 5030 9295 4636 1535 5542\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D\u003c/td>\n\u003ctd>115879 150929 278909 139094 46066 167705\u003c/td>\n\u003ctd>3864 5032 9295 4637 1536 5591\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>선택 B의 제거량(detail): strip 0 -1102, 1 -46, 2 -33, 3 -31, 4 -30, 5 -2386. far: -39, -2, -3, -1, -1, -79.\u003c/p>\n\u003ch3 id=\"_6\">선택 근거\u003c/h3>\n\u003cp>A는 80~100 m 구간의 큰 가우시안(건물·수목 가능성)까지 자를 위험이 크고 C·D는 로그 스케일 +0.5 이상 큰 파란 점이 시작되는 100~120 m 사이를 남겨 하늘 잔존이 더 크다. 100 m는 보행 영역(x -24~24, z≈0)에서 충분히 멀어 수관·야자(15~20 m)·지붕·가까운 지면을 보존하며, 분포상 큰 파란 점이 시작되는 지점이다. 선택은 개수와 위치 분석만으로 했다.\u003c/p>\n\u003ch2 id=\"_7\">한계\u003c/h2>\n\u003cul>\n\u003cli>시각 품질은 아직 확인하지 않았다. 브라우저·화면 비교를 하지 않았다.\u003c/li>\n\u003cli>구 필터는 색·불투명도를 보지 않고 거리만 본다. 100 m 안의 하늘색 가우시안(나뭇가지 사이 틈 등)은 남는다. 100 m 밖의 먼 지형·건물은 사라질 수 있다(특히 strip 5와 0에서 각각 약 2400개, 1100개 제거). 새 구멍이나 지평선 근처 빈 곳이 생길 수 있다.\u003c/li>\n\u003cli>따라서 FINAL.md 하늘 행의 합격선(보존물 소실·새 구멍·잔존 0건) 충족 여부는 미판정이다.\u003c/li>\n\u003cli>오디오는 청취 확인을 하지 않았다. 레벨은 \u003ccode>volumedetect\u003c/code> 수치만 봤다.\u003c/li>\n\u003c/ul>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
