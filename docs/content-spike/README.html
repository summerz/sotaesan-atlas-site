aude-rebuttal.html\">02-claude-rebuttal.md\u003c/a>\u003c/td>\n\u003ctd>Claude\u003c/td>\n\u003ctd>재반박과 수용 항목\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>\u003ca href=\"03-codex-counter.html\">03-codex-counter.md\u003c/a>\u003c/td>\n\u003ctd>Codex\u003c/td>\n\u003ctd>재반박에 대한 응답\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>\u003ca href=\"04-consensus-draft.html\">04-consensus-draft.md\u003c/a>\u003c/td>\n\u003ctd>Claude\u003c/td>\n\u003ctd>합의안 초안\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>\u003ca href=\"05-codex-final-review.html\">05-codex-final-review.md\u003c/a>\u003c/td>\n\u003ctd>Codex\u003c/td>\n\u003ctd>합의안 검토, 잔여 이견\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F1\u003c/td>\n\u003ctd>\u003ca href=\"FINAL-v1.html\">FINAL-v1.md\u003c/a>\u003c/td>\n\u003ctd>공동\u003c/td>\n\u003ctd>최종안 v1. 05의 조건부 승인 조건 6개를 모두 반영. 보존\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>\u003ca href=\"06-change-request-claude.html\">06-change-request-claude.md\u003c/a>\u003c/td>\n\u003ctd>Claude\u003c/td>\n\u003ctd>사용자 변경 요청(모바일 비중 축소) 영향 분석, 수정 vs 재작성 판단\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>\u003ca href=\"07-codex-response.html\">07-codex-response.md\u003c/a>\u003c/td>\n\u003ctd>Codex\u003c/td>\n\u003ctd>변경 요청 응답. 수정으로 합의, 합격선 40ms, 엔진 근거 정정\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F2\u003c/td>\n\u003ctd>\u003ca href=\"FINAL.html\">FINAL.md\u003c/a>\u003c/td>\n\u003ctd>공동\u003c/td>\n\u003ctd>\u003cstrong>최종안 v2 (현행)\u003c/strong>. 데스크톱 판정, iPhone 참고 측정. 2026-10-16 임시 문장 대체 반영\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A\u003c/td>\n\u003ctd>\u003ca href=\"ASSETS.html\">ASSETS.md\u003c/a>\u003c/td>\n\u003ctd>Claude\u003c/td>\n\u003ctd>이 스파이크용 공개·합성 자산과 출처\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>R1\u003c/td>\n\u003ctd>\u003ca href=\"RESULTS-01.html\">RESULTS-01.md\u003c/a>\u003c/td>\n\u003ctd>Claude\u003c/td>\n\u003ctd>1차 기능 확인 결과, 관찰된 문제, 미시험 항목. 근거는 \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">evidence/ (원본 저장소 파일)\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>R2\u003c/td>\n\u003ctd>\u003ca href=\"RESULTS-02-sky.html\">RESULTS-02-sky.md\u003c/a>\u003c/td>\n\u003ctd>Claude\u003c/td>\n\u003ctd>하늘 고정 8시점 비교. 지평선 틈 해소, 현관 건물 반투명 노출로 기준 미충족\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>진행 방식: Codex는 Orca 터미널의 TUI 세션에서 실행했다. 1라운드는 처음 GPT-5.6-Terra로 시작했다가 사용자가 모델을 GPT-6-Astra로 바꾼 뒤 중단하고 같은 프롬프트로 다시 실행했다. 각 라운드의 프롬프트는 저장소 문서를 근거로 인용하고 근거 없는 주장은 추정으로 표시하도록 요구했다.\u003c/p>\n\u003cp>결과 요약: 초안의 네 축(듣기·연출·하늘·인물)은 유지하되 범위를 줄였다. Codex가 1라운드에서 요구한 초심자 A/B 학습 평가는 3라운드에서 철회됐고, 이 단계는 표현 수단의 기술 시험으로 확정했다. 추정 총 작업량은 11–20인일이었다.\u003c/p>\n\u003cp>변경(같은 날): 사용자가 iPhone 11(출시 7년)이 주요 기기가 아닐 가능성이 높다고 판단해 모바일 시험 축소와 비판정을 요청했다. 양측 모두 전면 재작성이 아닌 수정으로 판단했다. v2에서 판정 기기는 데스크톱(p95 ≤ 40ms, 증가 ≤ 5ms), iPhone은 두 구성 × 1회 참고 측정이다. Codex는 Claude의 \"엔진 추천은 주로 iPhone 근거\"라는 해석을 보고서의 데스크톱 로딩 수치로 정정했고 PlayCanvas 우선 후보는 유지됐다. 추정 총 작업량은 10.5–19.5인일이다.\u003c/p>\n\u003cp>변경(2026-10-16): 사용자가 실제 십상 사실 3개 대신 임시 문장을 쓰기로 결정했다. 콘텐츠 데이터는 흐름(안내문 → 정지 지점 2–3곳 → 임시 출처 → 시대 전환 전후 변경)을 보여주는 임시 대본으로 바꾸고, 사실 조사와 교무 검수를 제외했다. 실제 출처와의 연결 확인은 이 단계에서 빠진다. 사용자 결정이라 Codex와 재토론하지 않고 Claude가 FINAL §2·§4·§8을 수정했다. 추정 총 작업량은 10–18.5인일이다.\u003c/p>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
