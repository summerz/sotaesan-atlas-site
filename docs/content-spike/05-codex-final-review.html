idth:1120px;margin:auto;border-top:1px solid var(--line);padding:24px;font-size:14px;color:var(--muted)}.intro{max-width:750px;font-size:21px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:32px 0}.button{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);text-decoration:none;border-radius:4px;padding:11px 22px;font-weight:600}.button.secondary{background:transparent;color:var(--green)}.summary{border-left:4px solid var(--green);padding:4px 24px;margin:38px 0;font-size:19px}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.resource{border:1px solid var(--line);padding:22px}.resource h3{margin:0 0 10px}.resource p{font-size:16px;margin:0;color:var(--muted)}.local-file{color:var(--muted)}.meta{color:var(--muted);font-size:14px}.toc{border:1px solid var(--line);padding:16px 24px;margin:28px 0;font-size:15px}.toc>ul{margin:0}.toc li{margin:4px 0}li{margin:8px 0}.downloads{margin:0 0 30px}.measurements ul{padding-left:24px}@media(max-width:650px){body{font-size:16px}main{padding:30px 18px 50px}h1{font-size:29px}h2{font-size:23px}.intro{font-size:19px}.resources{grid-template-columns:1fr}header{padding:16px 18px}table{min-width:680px}.actions{gap:10px}.button{padding:9px 16px}}@media print{header,footer,.downloads{display:none}main{max-width:none;padding:0}body{font-size:11pt}h1{font-size:24pt}h2{font-size:18pt}table{font-size:9pt}.table-scroll{overflow:visible}a{color:inherit}}\n\n:focus-visible{outline:3px solid var(--green);outline-offset:5px}.trial-steps{padding-left:26px;max-width:780px}.trial-steps li{padding-left:8px;margin:18px 0}.trial-steps strong{display:block}.controls{display:grid;grid-template-columns:160px 1fr;gap:10px 24px;max-width:780px}.controls dt{font-weight:600}.controls dd{margin:0}.archive{margin-top:52px;border-top:1px solid var(--line);padding-top:24px}.archive>summary{cursor:pointer;font-size:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"05-codex-final-review.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"5-codex\">5라운드: Codex 최종 검토\u003c/h1>\n\u003cul>\n\u003cli>작성일: 2026-10-14\u003c/li>\n\u003cli>모델: GPT-6-Astra high\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"_1\">판정: 조건부 승인\u003c/h2>\n\u003cp>\u003ca href=\"04-consensus-draft.html\">04 합의안\u003c/a>은 방향과 주요 수치를 정확히 반영했다. 아래 문구 보완 후 FINAL로 확정해도 된다. 새 과제나 재견적 요구가 아니라 \u003ca href=\"03-codex-counter.html\">03\u003c/a>의 범위·판정 조건 복원이다.\u003c/p>\n\u003ch2 id=\"_2\">정확히 반영된 항목\u003c/h2>\n\u003cul>\n\u003cli>인일: 축별 2–3/2–4/1–2/1–2, 공통 5–9, 총 11–20, 왕복 포함 12–22, 새 장면 +3.5–7 모두 일치한다.\u003c/li>\n\u003cli>합격선: p95 50ms·증가 5ms의 잠정성, 각 3회 판정, 프레임/물리 시간·메모리 통계 분리가 유지됐다.\u003c/li>\n\u003cli>실패 목록: 시대 변경·구역 로딩 실패·음원 실패·연속 진입·건너뛰기·백그라운드 복귀와 늦은 응답이 모두 있다. 7종 표기는 누락도 왜곡도 아니다.\u003c/li>\n\u003cli>재사용/재저작 표: 스카이박스 설정과 하늘 분리, 레일 계약과 경로·복귀점, 인물 계약과 외관 승인 등을 올바르게 분리했다. Hall에서 하늘 분리 이전을 검증하지 못한다는 제한도 유지됐다.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"final\">FINAL 반영 조건 — 수정 문안\u003c/h2>\n\u003col>\n\u003cli>\n\u003cp>\u003cstrong>04 §2 자산 고정 범위.\u003c/strong> 원본 해시만 적으면 분할 장면의 식별이 불충분하다. 다음으로 보완한다. “원본 해시는 출처 식별용이다. 실행에 사용하는 \u003ccode>sunnyvale-era\u003c/code>의 분할·LOD·충돌 및 추가 자산 해시와 빌드를 함께 고정한다.” (03 §1·§3·§4 질문 2)\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>04 §4 예산 조건.\u003c/strong> 숫자는 맞지만 전제와 추가비 승인 조건이 빠졌다. 총계 뒤에 추가한다. “이용 조건이 확인된 간단한 음원·인물 자산, 자료·검수자 확보를 전제로 하며 새 고품질 모델 제작은 제외한다. 축별 비용은 구현·단독 시험, 공통비는 횡단 작업으로 중복 계산하지 않는다. 새 장면 +3.5–7인일은 조사 0.5–1과 준비 3–6이며 복잡한 하늘 제거 비용은 제외한다. 상한을 승인받지 못하면 해당 축을 보류한다. 촬영 제약 전달은 이번 범위지만 후속 촬영 체크리스트 협의 0.5–1인일은 별도다.” (03 §4 질문 3·4)\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>04 §3 복구 판정.\u003c/strong> 실패 목록은 유지하고 연출 기준 뒤에 추가한다. “취소·복구 완료 후 수동 입력·카메라·음성·활성 구역·시대가 사전 정의 상태인지 확인한다. 구역 준비 대기의 타임아웃과 자막·수동 탐색 대체 경로를 정의한다. 요청 시작을 준비 완료로 세지 않으며 사전 로딩 시간도 사용자 대기 비용에 포함한다.” (03 §2.4·§4 질문 5)\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>04 §3 시각 합격선.\u003c/strong> ‘이전 하늘 잔존 0건’은 03의 ‘뚜렷한 잔존’보다 엄격해졌다. 하늘 기준을 보완한다. “고정 8시점과 경로에서 비교한다. 보존할 지붕·줄기 소실, 새 구멍, 이전 하늘의 뚜렷한 잔존은 0건이다. 기존 결함과 새 결함을 구분하고 미세 번짐은 사전 승인 예시·지정 판단자로 판정한다.” 왕복 행에는 “전 구간 발 기준점 오차 5cm 이내”를 추가한다. (03 §4 질문 5)\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>04 §4·§5 측정 조건.\u003c/strong> 다음을 추가한다. “기기별 동일 경로·빌드·자산·viewport·캐시 조건으로 비교하며 켜고 끈 직후 heap을 cold 실행과 비교하지 않는다. 증가 5ms는 전체 프레임 간격 p95의 증가량이다. 축 보류 시 통과한 축의 결합 구성으로 줄인다.” (03 §4 질문 2·5)\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>\u003cstrong>04 §1·§7 해석 한계.\u003c/strong> §1의 후속 평가 설명 뒤에 “과제·비교 조건·표본을 다시 설계하며 01의 8명을 확정 기준으로 승계하지 않는다”를 추가한다. §7 첫 열 제목은 “재사용 후보(이전 시험으로 확인)”로 바꾸고 “공통 구현비와 장소별 재저작 인시를 분리하며, 실패·미시험 축은 이전 성공으로 세지 않는다”를 덧붙인다. (03 §2.1·§4 질문 4·5)\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cp>이 보완을 반영하면 기존 합의와 일치한다. 추가 논쟁이나 새 기능 조건은 없다.\u003c/p>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
