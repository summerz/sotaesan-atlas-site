120px;margin:auto;border-top:1px solid var(--line);padding:24px;font-size:14px;color:var(--muted)}.intro{max-width:750px;font-size:21px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:32px 0}.button{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);text-decoration:none;border-radius:4px;padding:11px 22px;font-weight:600}.button.secondary{background:transparent;color:var(--green)}.summary{border-left:4px solid var(--green);padding:4px 24px;margin:38px 0;font-size:19px}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.resource{border:1px solid var(--line);padding:22px}.resource h3{margin:0 0 10px}.resource p{font-size:16px;margin:0;color:var(--muted)}.local-file{color:var(--muted)}.meta{color:var(--muted);font-size:14px}.toc{border:1px solid var(--line);padding:16px 24px;margin:28px 0;font-size:15px}.toc>ul{margin:0}.toc li{margin:4px 0}li{margin:8px 0}.downloads{margin:0 0 30px}.measurements ul{padding-left:24px}@media(max-width:650px){body{font-size:16px}main{padding:30px 18px 50px}h1{font-size:29px}h2{font-size:23px}.intro{font-size:19px}.resources{grid-template-columns:1fr}header{padding:16px 18px}table{min-width:680px}.actions{gap:10px}.button{padding:9px 16px}}@media print{header,footer,.downloads{display:none}main{max-width:none;padding:0}body{font-size:11pt}h1{font-size:24pt}h2{font-size:18pt}table{font-size:9pt}.table-scroll{overflow:visible}a{color:inherit}}\n\n.button{font:inherit;cursor:pointer}.button:disabled{opacity:.5;cursor:not-allowed}:focus-visible{outline:3px solid var(--green);outline-offset:5px}.trial-steps{padding-left:26px;max-width:780px}.trial-steps li{padding-left:8px;margin:18px 0}.trial-steps strong{display:block}.controls{display:grid;grid-template-columns:160px 1fr;gap:10px 24px;max-width:780px}.controls dt{font-weight:600}.controls dd{margin:0}.archive{margin-top:52px;border-top:1px solid var(--line);padding-top:24px}.archive>summary{cursor:pointer;font-size:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"03-codex-counter.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"3-codex\">3라운드: Codex 응답\u003c/h1>\n\u003cul>\n\u003cli>작성일: 2026-10-14\u003c/li>\n\u003cli>모델: GPT-6-Astra high (사용자가 지정한 터미널 상태줄 기준)\u003c/li>\n\u003cli>대상: \u003ca href=\"02-claude-rebuttal.html\">02-claude-rebuttal.md\u003c/a>\u003c/li>\n\u003cli>근거 범위: 저장소 문서·코드·기존 로컬 자산·측정 기록·스크린샷. 새 실행 성능 측정이나 자산 다운로드는 하지 않았다. 아래 비용은 모두 \u003cstrong>추정 인일\u003c/strong>, 수치형 합격선은 별도 표시한 \u003cstrong>제안\u003c/strong>이지 기존 측정 결과가 아니다.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"0\">0. 결론: 평가 단계의 재정의는 철회한다\u003c/h2>\n\u003cp>02의 핵심 반론이 맞다. \u003cstrong>이번 단계는 대역 공간에서 표현 수단의 실현 가능성·비용·기기 예산·데이터 계약을 확인하는 기술 시험으로 둔다.\u003c/strong> 네 축을 초심자 A/B 평가로 대체하라는 01의 요구는 철회한다. 학습 효과의 입증을 이번 구현의 선행 조건으로 삼지 않는다.\u003c/p>\n\u003cp>다만 네 축을 각각 구현할 수 있다는 것, 함께 안정적으로 실행된다는 것, 다른 장소에서 저렴하게 다시 만들 수 있다는 것은 서로 다른 판정이다. 이 구분과 비용의 불확실성은 유지한다. 기술 스파이크 보고서도 현장 촬영·스플랫 생성·실제 역사 복원을 제외했고 전체 제작 비용을 검증하지 않았다고 명시한다. \u003ca href=\"../implementation/SPIKE-DECISION-REPORT.html\">근거: \u003ccode>docs/implementation/SPIKE-DECISION-REPORT.md\u003c/code> 서두·§8\u003c/a>\u003c/p>\n\u003ch2 id=\"1-02-1\">1. 02 §1의 수용 항목 확인\u003c/h2>\n\u003cp>\u003cstrong>02 §1의 14개 수용 항목 전부를 그대로 확인한다.\u003c/strong> 성능 재측정, 선언형 이전의 검증 목표화, \u003ccode>sunnyvale-era\u003c/code> 고정, 기존 전후 비교 유지, 재조명 표현 정정, 전문가 역할 제한, 재사용/재저작 구분, 패널·자막·출처·상징 표시, 상태 소유권과 실패 시험, 대체 조작, 비용 분리, 축별 중단, 잔상 인물로 축소, 레일의 스트리밍 준비를 합의된 출발점으로 둔다. 이 절에서는 재논쟁하지 않는다.\u003c/p>\n\u003ch2 id=\"2-02-2\">2. 02 §2의 네 가지 거부에 대한 판정\u003c/h2>\n\u003ch3 id=\"21-44\">2.1 네 축을 초심자 4+4명 대조 평가로 교체하라는 요구 — \u003cstrong>철회\u003c/strong>\u003c/h3>\n\u003cp>01 질문 2와 질문 5는 \u003cstrong>그대로는 양립하지 않는다.\u003c/strong> 질문 2에서 대역으로 실제 성지 이해를 검증할 수 없다고 제한해 놓고, 질문 5와 실행 순서에서 그 대역의 초심자 평가를 다음 투자 조건으로 요구했다. 측정 대상을 바꿔 놓고도 그 차이를 명시하지 않은 내 오류다. 특히 01 §3.6의 “공간 관계 이해의 이득이 없으면 다음 연출 축을 추가하지 않는다”는 문턱은 이번 기술 시험에서 삭제한다. \u003ca href=\"01-codex-critique.html\">당시 주장: \u003ccode>01-codex-critique.md\u003c/code> 질문 2·질문 5·§3.6·§4\u003c/a>\u003c/p>\n\u003cp>정확한 구분은 다음과 같다.\u003c/p>\n\u003cul>\n\u003cli>대역에서도 사실 문장의 이해, 출처 찾기, 자막 접근, 조작 가능성은 관찰할 수 있다. 따라서 “대역에서는 어떤 학습 효과도 잴 수 없다”는 일반명제까지 동의하지는 않는다. 01의 표현도 그렇게 읽히는 범위에서는 수정한다.\u003c/li>\n\u003cli>그러나 다른 장소의 공간 관계를 실제 성지의 관계처럼 시험하여 \u003cstrong>실제 성지에서의 장소 기반 이해·진정성·공간판의 교육적 추가 가치\u003c/strong>를 입증할 수는 없다. 그 일반화에는 별도의 근거가 필요하다.\u003c/li>\n\u003cli>이번에는 앞의 이용자 관찰조차 필수 A/B로 요구하지 않는다. 기술 기능 시험과 사실·표현 검수를 한다. 실제 성지의 콘텐츠와 공간이 준비된 뒤 학습 평가의 과제·비교 조건·표본을 다시 설계한다. 8명이라는 숫자도 후속 단계의 확정 기준으로 넘기지 않는다.\u003c/li>\n\u003c/ul>\n\u003cp>따라서 이번 일정에서 모집과 대조 페이지를 뺀다. 후속 학습 평가 계획 수립은 \u003cstrong>추정 0.5–1인일\u003c/strong>, 실제 모집·진행은 별도 산정한다. 이번 견적에 중복 포함하지 않는다.\u003c/p>\n\u003ch3 id=\"22-npc-0\">2.2 날씨·NPC에 0인일을 배정해 제외하라는 요구 — \u003cstrong>수정\u003c/strong>\u003c/h3>\n\u003cp>\u003cstrong>하늘 교체 1종의 제한된 실험과 정지 잔상 인물은 포함한다.\u003c/strong> 안개·강수·주야간·동행·길 찾기를 제외한 수정 범위에 01의 일괄 제외를 그대로 적용할 이유는 없다. 실패 결과도 촬영·후속 제작 계획의 입력이 될 수 있다.\u003c/p>\n\u003cp>다만 “정지 또는 고정 왕복”은 동등한 작업이 아니다. 정지 인물은 배치면 정합을 시험하지만, 왕복 인물은 시간에 따른 위치 갱신·바닥 조회·경계·시대 전환 중 복귀까지 시험한다. 기존 바닥조차 벤치 부근 복귀 실패와 벽 비침이 남아 있어 “고정 경로라서 바닥 문제가 없다”고 가정할 수 없다. \u003ca href=\"../implementation/SUNNYVALE-ERA-INTEGRATION.html\">근거: \u003ccode>docs/implementation/SUNNYVALE-ERA-INTEGRATION.md\u003c/code> 남은 한계\u003c/a>\u003c/p>\n\u003cp>기본은 \u003cstrong>정지 1–2구\u003c/strong>, 왕복은 별도 선택으로 둔다. 하늘은 \u003cstrong>추정 1–2인일의 제거·교체 타당성 시험\u003c/strong>, 정지 인물은 \u003cstrong>추정 1–2인일\u003c/strong>, 단순 왕복 추가는 \u003cstrong>추정 1–2인일\u003c/strong>이다. 하늘의 이 숫자는 깔끔한 분리 성공을 보장하는 납품 견적이 아니라 중단 가능한 실험 상한이다. 축별 플래그에 대한 판단은 §4 질문 2에 답한다.\u003c/p>\n\u003ch3 id=\"23\">2.3 콘텐츠의 빈자리를 연출이 대신한다는 비판 — \u003cstrong>수정\u003c/strong>\u003c/h3>\n\u003cp>실제 사실 3개와 출처를 대본에 넣고, 대역임을 상시 표시하며, 결과를 기술 시험으로만 보고한다면 이 비판을 수정안 전체에 계속 적용하지 않겠다. 이제 대본은 학습 효과의 증명이 아니라 \u003cstrong>텍스트·음성·자막·출처·표현 구분이 같은 내용을 전달하는지 확인하는 시험 데이터\u003c/strong>다.\u003c/p>\n\u003cp>유지하는 한계는 하나다. 대본이 들어갔다는 이유로 실제 십상 체험이 검증됐다고 결론내려서는 안 된다. 특히 \u003ccode>sunnyvale-era\u003c/code>의 과거는 실제 역사 복원이 아니라 현재 스캔 재사용과 가상 벽·설명 변경이다. \u003ca href=\"../../shared/public/world/sunnyvale-era.json\">근거: \u003ccode>shared/public/world/sunnyvale-era.json\u003c/code>\u003c/a>, \u003ca href=\"../implementation/SUNNYVALE-ERA-INTEGRATION.html\">\u003ccode>docs/implementation/SUNNYVALE-ERA-INTEGRATION.md\u003c/code>\u003c/a>\u003c/p>\n\u003cp>사실·출처·해설문·상징 표지와 검수에 \u003cstrong>추정 1–2인일\u003c/strong>을 공통비로 둔다. 자료와 검수자를 이미 확보한다는 조건이며, 새로운 역사 조사나 창작 대사의 정당화까지 포함하지 않는다.\u003c/p>\n\u003ch3 id=\"24\">2.4 카메라 레일은 필요성이 입증될 때만 만들라는 요구 — \u003cstrong>수정\u003c/strong>\u003c/h3>\n\u003cp>짧은 레일 하나의 기술 시험은 포함한다. 콘텐츠 효과를 먼저 입증하라는 조건은 철회한다. 다만 \u003cstrong>\u003ccode>RouteBenchmark\u003c/code>가 있으므로 반드시 3–5인일보다 싸다는 비용 단정은 받아들이지 않는다.\u003c/strong> 01도 이 코드의 존재를 알고 제시한 추정이었다.\u003c/p>\n\u003cp>현재 \u003ccode>RouteBenchmark\u003c/code>는 경로 재생의 기반이다. 앱의 \u003ccode>begin\u003c/code>/\u003ccode>end\u003c/code>는 물리를 멈추고 시선·속도를 저장·복구하며, \u003ccode>syncInput\u003c/code>은 벤치마크·패널·시대 전환 등을 묶어 입력을 차단한다. 그러나 업데이트 루프의 \u003ccode>stream.update(feet)\u003c/code>는 \u003cstrong>\u003ccode>!replaying\u003c/code> 분기 안\u003c/strong>에 있다. 단순히 “레일 중에도 발 기준으로 계속 갱신한다”보다 정확히는, 기존 경로에서는 재생 중 그 갱신을 하지 않는다. 먼 시점으로 이동한다고 필요한 구역이 자동 준비되지는 않는다. \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">근거: \u003ccode>shared/src/benchmark.ts\u003c/code> (원본 저장소 파일)\u003c/span>, \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">\u003ccode>apps/spike-playcanvas/src/main.ts\u003c/code>의 \u003ccode>syncInput\u003c/code>, 벤치마크 콜백, 업데이트 루프 (원본 저장소 파일)\u003c/span>\u003c/p>\n\u003cp>이번에는 레일이 보는 구역을 좁히고 \u003cstrong>필요 구역을 사전 로딩·유지한 뒤 시작\u003c/strong>하는 쪽으로 비용을 제한한다. 범용 카메라 추종 스트리밍은 제외한다. 이 조건의 축 구현·단독 확인은 \u003cstrong>추정 2–4인일\u003c/strong>로 수정한다. 여러 축과 모바일에서의 실패 조합 검증은 공통비에 별도로 둔다. 사전 로딩이 예산을 넘으면 레일을 줄이거나 보류하며, 사전 로딩 시간도 사용자 대기 비용에서 빼지 않는다.\u003c/p>\n\u003ch2 id=\"3-sunnyvale\">3. Sunnyvale 하늘 스플랫 사실 확인\u003c/h2>\n\u003cp>\u003cstrong>판정: SOG 렌더링에 하늘 표현이 포함된다는 강한 간접 근거가 있다. 다만 Gaussian 단위로 하늘 점을 식별하거나 분리 가능성을 확인하지는 못했다. “제거 가능한 하늘 스플랫 집합이 확인됐다”는 확정 판정은 하지 않는다.\u003c/strong>\u003c/p>\n\u003cp>확인한 근거는 다음과 같다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>확인 대상\u003c/th>\n\u003cth>확인 결과\u003c/th>\n\u003cth>증명하지 못하는 것\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>로컬 \u003ccode>shared/public/assets/sunnyvale.sog\u003c/code>와 \u003ccode>shared/public/world/assets.json\u003c/code>\u003c/td>\n\u003ctd>로컬 SHA-256이 매니페스트 및 \u003ccode>SECOND-SCENE.md\u003c/code>의 \u003ccode>604ede4a3ff5e3ece784a7c3b11dcbc3f6c05b1e9f73f460997e6a145bc3b05e\u003c/code>와 일치. 매니페스트는 58,072,500바이트·3,999,361점을 기록\u003c/td>\n\u003ctd>해시와 점 수는 하늘의 의미 분류를 제공하지 않음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>기존 원본 iPhone 캡처\u003c/td>\n\u003ctd>야자수 위 하늘색 영역이 보임\u003c/td>\n\u003ctd>전체 하늘의 커버리지, 하늘 점의 개수·위치·분리 품질\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>기존 \u003ccode>sunnyvale-era\u003c/code> 및 paired-stream 데스크톱 캡처\u003c/td>\n\u003ctd>나뭇가지·지붕 주변에 푸른 하늘 표현이 보임. \u003ccode>ammo-era\u003c/code>는 시작점에서 \u003ccode>sunny-strip-2\u003c/code>·\u003ccode>3\u003c/code>을 표시한 화면\u003c/td>\n\u003ctd>다른 모든 구역·시점에서도 같은 품질인지, 제거 후 경계가 보존되는지\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>렌더링 코드·장면 데이터\u003c/td>\n\u003ctd>PlayCanvas 카메라 clear color는 어두운 \u003ccode>(0.015, 0.022, 0.035)\u003c/code>. 해당 앱 코드와 장면에 별도 하늘 배경 설정이 없고, 일반 화면의 충돌 GLB는 불투명 배경으로 그리지 않음\u003c/td>\n\u003ctd>현재 코드만으로 과거 측정 빌드 전체를 재현·검증했다는 주장\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>기존 SOG ZIP 항목 목록\u003c/td>\n\u003ctd>\u003ccode>means_*\u003c/code>, \u003ccode>quats\u003c/code>, \u003ccode>scales\u003c/code>, \u003ccode>sh0\u003c/code>, \u003ccode>shN_*\u003c/code>의 WebP와 메타데이터·라이선스가 있음. 별도 이름의 하늘 마스크 파일은 없음\u003c/td>\n\u003ctd>파일명이 없다고 의미적 분리 자체가 불가능하다는 주장\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>근거 파일: \u003ca href=\"../../shared/public/world/assets.json\">\u003ccode>shared/public/world/assets.json\u003c/code>\u003c/a>, \u003ca href=\"../implementation/SECOND-SCENE.html\">\u003ccode>docs/implementation/SECOND-SCENE.md\u003c/code> 자산 검증·렌더링 조사\u003c/a>, \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">\u003ccode>apps/spike-playcanvas/src/main.ts\u003c/code> (원본 저장소 파일)\u003c/span>, \u003ca href=\"../../shared/public/world/sunnyvale.json\">\u003ccode>shared/public/world/sunnyvale.json\u003c/code>\u003c/a>, \u003ca href=\"../../shared/public/world/sunnyvale-era.json\">\u003ccode>shared/public/world/sunnyvale-era.json\u003c/code>\u003c/a>, \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">\u003ccode>shared/src/style.css\u003c/code> (원본 저장소 파일)\u003c/span>.\u003c/p>\n\u003cp>직접 열어 본 캡처와 대응 기록:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"../implementation/measurements/2026-10-02/ios-playcanvas-sunnyvale.png\">원본 iPhone PlayCanvas 캡처\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"../implementation/measurements/2026-10-03/sunnyvale-era/ammo-era.png\">\u003ccode>sunnyvale-era\u003c/code> 캡처\u003c/a>와 \u003ca href=\"../implementation/measurements/2026-10-03/sunnyvale-era/ammo-era.json\">측정 JSON\u003c/a>. JSON의 장면은 \u003ccode>sunnyvale-streaming-era\u003c/code>, 빌드는 \u003ccode>local-4d5905679d2e-89a5df9eff9e\u003c/code>다.\u003c/li>\n\u003cli>\u003ca href=\"../implementation/measurements/2026-10-03/paired-stream/ammo-desktop.png\">paired-stream 캡처\u003c/a>와 \u003ca href=\"../implementation/measurements/2026-10-03/paired-stream/ammo-desktop.json\">측정 JSON\u003c/a>.\u003c/li>\n\u003c/ul>\n\u003cp>별도 하늘 배경이 없는 구성에서 보이는 하늘색 영상은 SOG 쪽의 표현이라는 \u003cstrong>추정이 강하게 지지된다\u003c/strong>. 그러나 이번 확인은 이미지·코드·자산 식별의 대조이지 Gaussian 의미 분류나 제거 실험이 아니다. 원본의 해시 일치를 축소·분할본 모든 파일의 동일성 검증으로 바꾸어 말하지도 않는다. 원본과 분할본의 차이는 \u003ca href=\"../implementation/PAIRED-SPATIAL-STREAMING.html\">화면·충돌 분할 기록\u003c/a>에 명시되어 있다.\u003c/p>\n\u003cp>따라서 02 §5의 “열어 보면 확정”은 \u003cstrong>하늘처럼 보이는 영상의 존재\u003c/strong>에는 충분하지만, 이번 축에 필요한 \u003cstrong>제거 대상·경계·작업량\u003c/strong>까지 확정하지 못한다. 지금 근거만으로 새 장면을 찾을 이유는 없다. 먼저 Sunnyvale에서 한정 시야의 분리 시험을 하고, 가지·지붕이 보존되는지 확인하자. 비용은 하늘 축의 \u003cstrong>추정 1–2인일에 포함\u003c/strong>한다. 실패하면 기록하고 보류한다. 별도 실외 장면 탐색·준비는 §4 질문 4의 추가비를 승인한 경우에만 진행한다.\u003c/p>\n\u003ch2 id=\"4-02-6\">4. 02 §6의 다섯 질문에 대한 답\u003c/h2>\n\u003ch3 id=\"1-ab\">질문 1. 대역에서 학습 효과를 못 잰다는 입장과 초심자 A/B 요구는 어떻게 양립하는가?\u003c/h3>\n\u003cp>\u003cstrong>01에 쓴 형태로는 양립하지 않는다. 필수 A/B 요구를 철회하고, 측정 불가능하다는 주장도 실제 성지의 장소 기반 효과로 한정한다.\u003c/strong> 대역 텍스트의 이해도 관찰과 실제 장소의 공간적 추가 가치 검증은 다른 질문이다. 이번에는 네 축의 기술 시험을 하고, 후속 실제 콘텐츠 단계에서 이용자 평가를 다시 설계한다. §2.1의 정정으로 답을 확정한다.\u003c/p>\n\u003ch3 id=\"2\">질문 2. 플래그로 분리하면 원인을 구분 못 한다는 반박은 유지되는가?\u003c/h3>\n\u003cp>\u003cstrong>단독 효과의 귀속에 대한 반박은 철회한다. “귀속 문제는 사라진다”는 전체 결론에는 조건이 남는다.\u003c/strong> 동일 조건에서 기준 실행과 축 하나만 켠 실행을 비교하면 그 축을 추가한 비용은 구분할 수 있다. 네 효과를 한꺼번에 켜고 만족도를 묻는다는 01의 전제는 수정안에 해당하지 않는다.\u003c/p>\n\u003cp>다만 상호작용은 별도다. 예컨대 음성 재생 중 레일 건너뛰기와 시대 전환이 겹치는 상태, 인물·스카이박스·구역 사전 로딩이 함께 상주하는 비용은 단독 실행으로 배제되지 않는다. \u003cstrong>그런 실패가 실제 발생했다는 말이 아니라 추정 위험\u003c/strong>이다. 기존 \u003ccode>syncInput\u003c/code>과 시대 복구 코드가 이미 여러 상태를 결합하므로 이를 무시할 근거도 없다. \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">근거: \u003ccode>apps/spike-playcanvas/src/main.ts\u003c/code> (원본 저장소 파일)\u003c/span>\u003c/p>\n\u003cp>최소 시험은 기기별 \u003cstrong>모두 off + 각 축 단독 4개 + 모두 on = 6개 구성\u003c/strong>으로 제안한다. 축이 보류되면 통과한 축의 결합 구성으로 줄인다. 동일 경로·빌드·자산·viewport·캐시 조건으로 각 3회 측정하고 실행 순서를 교차한다. 결합 구성만 실패하면 하나씩 빼는 추가 시험으로 좁힌다. 처음부터 16개 조합 전부를 요구하지 않는다.\u003c/p>\n\u003cp>또한 로딩·메모리를 비교할 때 off는 “안 보임”만이 아니라 \u003cstrong>해당 자산 미로딩·재생 중지·자원 해제\u003c/strong>를 뜻해야 한다. 켜고 끈 직후의 heap을 cold 실행과 비교하지 않는다. 전체 프레임 간격과 물리 처리 시간, 메인/worker heap과 backing storage를 분리한다. 기존 측정에서도 서로 다른 통계와 GPU 메모리를 혼동하지 말라고 제한했다. \u003ca href=\"../implementation/LOADING-MEMORY-COMPARISON.html\">근거: \u003ccode>docs/implementation/LOADING-MEMORY-COMPARISON.md\u003c/code>\u003c/a>, \u003ca href=\"../implementation/PHYSICS-COST-COMPARISON.html\">\u003ccode>docs/implementation/PHYSICS-COST-COMPARISON.md\u003c/code>\u003c/a>\u003c/p>\n\u003cp>이 결합·실패 시험은 아래 공통 검증비 \u003cstrong>추정 2–3인일\u003c/strong>에 포함한다. GPU/물리 RAM의 안전 예산까지 확정했다는 결론은 이 시험으로 내리지 않는다.\u003c/p>\n\u003ch3 id=\"3-1\">질문 3. 하늘 교체 1종도 제외하는가? 실제 촬영 범위는 어떻게 정하는가?\u003c/h3>\n\u003cp>\u003cstrong>제외하지 않는다.\u003c/strong> Sunnyvale의 제한된 시야에서 제거 전후와 스카이박스 한 종류를 비교하는 타당성 시험으로 포함한다. 시점 전체의 깔끔한 하늘 교체나 범용 하늘 분리기를 약속하지 않는다.\u003c/p>\n\u003cp>단, “하늘 교체 성공 → 실제 촬영 때 하늘을 빼도 된다”는 결론도 성립하지 않는다. 이번 저장소는 촬영·재구성 과정을 시험하지 않았고, Sunnyvale의 재구성 조건을 실제 성지에 그대로 적용할 근거가 없다. \u003ca href=\"../implementation/SPIKE-DECISION-REPORT.html\">근거: \u003ccode>docs/implementation/SPIKE-DECISION-REPORT.md\u003c/code> 이번 결과로 판단할 수 있는 범위\u003c/a>\u003c/p>\n\u003cp>후속 촬영 계획에는 \u003cstrong>스카이박스용 하늘 자료 확보\u003c/strong>와 \u003cstrong>건물·수목 경계가 재구성에 필요한 입력을 확보하는 일\u003c/strong>을 별도 항목으로 남기자. 원본 보존과 소구역 촬영·재구성 후 마스킹 전후 비교를 제안한다. 이것은 검증된 촬영법이 아니라 \u003cstrong>제안\u003c/strong>이다. 이번 결과는 편집 가능 구간·실패 경계·작업량을 제공할 뿐, 촬영자와 재구성 담당자의 결정을 대신하지 않는다. 해당 체크리스트 협의는 \u003cstrong>추정 0.5–1인일\u003c/strong>, 현장 촬영·재구성 시험은 별도 견적이며 이번 총액 밖이다.\u003c/p>\n\u003ch3 id=\"4-1219\">질문 4. 수정된 네 축의 인일과 총액은? 기존 12–19인일과 비교하면?\u003c/h3>\n\u003cp>아래는 \u003cstrong>PlayCanvas + Ammo 한 구성\u003c/strong>, 기존 \u003ccode>sunnyvale-era\u003c/code>와 기존 두 번째 장면, 이용 조건이 확인된 간단한 음원·인물 자산, 자료·검수자 확보를 전제로 한 \u003cstrong>추정\u003c/strong>이다. 1인일은 8시간의 실작업이며 승인·섭외·기계 처리 대기는 별도다. 엔진 선택은 보고서의 우선 후보를 일정 가정으로 채택한 것이지 최종 선택이 확정됐다는 뜻이 아니다. \u003ca href=\"../implementation/SPIKE-DECISION-REPORT.html\">근거: \u003ccode>docs/implementation/SPIKE-DECISION-REPORT.md\u003c/code> §1\u003c/a>\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>축\u003c/th>\n\u003cth>이번 산출물·비용 경계\u003c/th>\n\u003cth style=\"text-align: right;\">추정 인일\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>듣기\u003c/td>\n\u003ctd>환경음 2–3개, 선택 내레이션 1개, 동일 자막·음소거·실패 시 대체. 기존 패널 사용. 축 단독 시험 포함\u003c/td>\n\u003ctd style=\"text-align: right;\">2–3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연출\u003c/td>\n\u003ctd>진입 트리거, 짧은 레일 1개, 자막·건너뛰기·복귀, 한정 구역 사전 로딩·유지, 축 단독 시험. 범용 카메라 추종 스트리밍 제외\u003c/td>\n\u003ctd style=\"text-align: right;\">2–4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>하늘\u003c/td>\n\u003ctd>제한 구간의 하늘 분리 시도, 스카이박스 1종, 경계 전후 캡처. \u003cstrong>상한 도달 시 실패 보고도 유효 산출물\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align: right;\">1–2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>인물\u003c/td>\n\u003ctd>정지 잔상 1–2구, 바닥 배치, 시대 전환 복구, 상징 표지, 조명 이질감 비교. 새 고품질 모델 제작 제외\u003c/td>\n\u003ctd style=\"text-align: right;\">1–2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>네 축 소계\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>정지 인물 기준\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003cstrong>6–11\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>축별 시간을 더한 것만으로 시험을 끝낼 수 없으므로 다음을 따로 더한다. 같은 작업을 두 번 세지 않도록 축 행에는 해당 기능 구현·단독 시험만, 공통 행에는 횡단 작업만 둔다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>공통 작업\u003c/th>\n\u003cth>산출물\u003c/th>\n\u003cth style=\"text-align: right;\">추정 인일\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>사실·표현 검수\u003c/td>\n\u003ctd>사실 3개와 출처, 해설문, 대역·상징 표시 검수. 이용자 학습 평가 제외\u003c/td>\n\u003ctd style=\"text-align: right;\">1–2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>최소 공통 계약·계측\u003c/td>\n\u003ctd>축 플래그, 참조 검증, 상태 소유권 규칙, 작업시간·자산·실행 조건 기록. 각 축의 기능 구현은 위 표\u003c/td>\n\u003ctd style=\"text-align: right;\">1–2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>결합·기기·실패 검증\u003c/td>\n\u003ctd>데스크톱/iPhone 비교, 6종 실패 및 늦은 응답 확인, 취소·해제 회귀 확인, 제한된 수정·재시험\u003c/td>\n\u003ctd style=\"text-align: right;\">2–3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>두 번째 장면 이전·결과 정리\u003c/td>\n\u003ctd>데이터 재배치·사실 문장 변경, 코드 diff·재저작 시간 기록, 축별 통과/보류·제한 보고\u003c/td>\n\u003ctd style=\"text-align: right;\">1–2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>공통 소계\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003cstrong>5–9\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>총계\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>네 축 + 공통, 정지 인물 기준\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003cstrong>11–20인일\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>고정 왕복까지 요구하면 \u003cstrong>추정 +1–2인일, 총 12–22인일\u003c/strong>이다. 이는 짧고 평탄한 검증 구간의 왕복으로 한정한다. 임의 경사·계단·구역 간 이동·길 찾기로 넓어지면 이 추가비로 약속하지 않는다. 별도 공개 실외 장면이 필요하면 02의 조사 0.5–1과 정합·충돌·기준 시험 3–6을 합친 \u003cstrong>추정 +3.5–7인일\u003c/strong>이 든다. 이는 새 장면 준비비이며 복잡한 하늘 제거 비용까지 포함하지 않는다. 상한을 승인하지 않으면 그 축을 보류한다.\u003c/p>\n\u003cp>\u003cstrong>기존 12–19인일보다 명백히 싸다고 말할 근거는 없다.\u003c/strong> 정지 인물 기준 새 범위는 하한이 1인일 낮고 상한이 1인일 높으며 대부분 겹친다. 더구나 산출물이 다르다.\u003c/p>\n\u003cul>\n\u003cli>기존 12–19는 단순 페이지·초심자 평가·분석을 포함하고 날씨·인물·새 레일을 제외한 \u003cstrong>콘텐츠 가설 검증안\u003c/strong>이었다.\u003c/li>\n\u003cli>새 11–20은 그 평가를 빼고 하늘·인물·레일·결합 검증을 넣은 \u003cstrong>표현 기술 시험안\u003c/strong>이다.\u003c/li>\n\u003cli>이전 표는 묶음 추정이므로 대조 페이지와 모집 관련 숫자를 기계적으로 빼서 확정 절감액을 만들 수 없다. 새 견적 역시 실측이 아니다. 저장소에도 실제 장면 저작 인시가 충분히 없다. \u003ca href=\"01-codex-critique.html\">근거: \u003ccode>01-codex-critique.md\u003c/code> §4\u003c/a>, \u003ca href=\"../implementation/AUTHORING-COST.html\">\u003ccode>docs/implementation/AUTHORING-COST.md\u003c/code>\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>두 번째 장면이 실내 Hall이면 계약·자막·레일·인물 배치의 이전은 시험할 수 있지만 \u003cstrong>실외 하늘 제거의 재저작 단가\u003c/strong>는 검증하지 못한다. 스카이박스 설정의 이전과 하늘 분리 작업의 이전을 별도 결과로 적어야 한다. 첫 장면에서 하늘 분리에 실패했다면 두 번째 장면에 “이전 성공”을 꾸며 넣지 않는다.\u003c/p>\n\u003ch3 id=\"5\">질문 5. 여전히 측정 불가능하거나 반증 불가능한 기준이 있는가?\u003c/h3>\n\u003cp>있다. 방향은 좋아졌지만 \u003cstrong>측정값을 기록하는 것과 합격선을 정하는 것은 다르다.\u003c/strong> 아래 조건을 고정하면 대부분은 반증 가능한 시험이 된다. 추가 서류 작업을 위한 별도 과제가 아니라 위 계약·계측 및 검증 비용에 포함하는 제안이다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>02의 표현\u003c/th>\n\u003cth>남은 빈칸\u003c/th>\n\u003cth>이번 시험용 보완 제안\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>“기록된 한도”, “p95 증가량 기록”\u003c/td>\n\u003ctd>한도·구간·반복·절대 성능 조건이 없음. 느린 기준 실행보다 조금만 느려져도 통과할 수 있음\u003c/td>\n\u003ctd>실행 전에 절대선과 증가 한도를 둘 다 고정. \u003cstrong>잠정 제안:\u003c/strong> 활성 탐색의 전체 프레임 간격 p95 ≤50ms, 동일 조건 기준 대비 증가 ≤5ms. 3회 각각 판정하고 로딩/레일/수동 탐색을 분리. 수치 합의 전에는 성능 합격을 선언하지 않음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>“하늘 경계 결함 허용치 내”\u003c/td>\n\u003ctd>결함 정의·시점·허용치가 없음\u003c/td>\n\u003ctd>열린 하늘·가지·지붕·분할 경계를 포함한 고정 8시점과 경로를 선정. 제거 전후 동일 시점 비교. \u003cstrong>제안:\u003c/strong> 보존해야 할 지붕·줄기 소실, 새 구멍, 이전 하늘의 뚜렷한 잔존은 0건. 미세 가장자리 번짐은 사전 승인한 예시와 대조. 원본의 기존 결함과 새 결함을 분리하고 판단자를 지정\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>“조명 이질감 캡처 비교”\u003c/td>\n\u003ctd>비교는 산출물이지 성공 기준이 아님\u003c/td>\n\u003ctd>적어도 밝은 배경·어두운 배경의 지정 시점에서 캡처. 상징 인물의 허용 외관 예시를 먼저 승인. 미승인 시 기술 표시 성공/외관 판정 보류를 분리. 실제로 자연스럽거나 종교적으로 적절하다는 결론은 내리지 않음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>“바닥 추종”\u003c/td>\n\u003ctd>정지/왕복의 시험 대상이 다름\u003c/td>\n\u003ctd>정지는 발 기준점과 지정 배치면의 정합, 왕복은 지정 경로 전 구간의 간격·관통·시대 변경을 확인. \u003cstrong>잠정 제안:\u003c/strong> 지정 바닥에서 발 기준점 오차 5cm 이내, 관통·경로 이탈 0건. 임의 지형 지원으로 일반화하지 않음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>“모바일 자동재생 정책 통과”\u003c/td>\n\u003ctd>어떤 기기·사용자 동작·실패를 뜻하는지 없음\u003c/td>\n\u003ctd>대상 iPhone에서 사용자 재생 조작, 재생 거부/음원 실패, 음소거, 백그라운드 복귀를 각각 실행. 재생되지 않아도 동일 자막·패널 접근, 복귀 후 의도하지 않은 소리 0건. 모든 모바일 브라우저 정책 준수로 확대하지 않음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>“실패 주입 6종 모두 잠금 잔류 0”\u003c/td>\n\u003ctd>관찰 시점·복귀 상태·중복 이벤트 기준이 없음\u003c/td>\n\u003ctd>주입별 데스크톱/iPhone 각 3회. 취소·복구 완료 후 수동 입력, 카메라, 음성, 활성 구역·시대가 사전 정의 상태인지 기록. 잠금 잔류·중복 재생·폐기 장면의 늦은 응답 적용 0건. 구역 준비 대기에도 타임아웃과 대체 동작 정의\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>“재생 중 필요한 구역 준비”\u003c/td>\n\u003ctd>필요한 구역 집합·ready 의미가 없음\u003c/td>\n\u003ctd>경로의 필요 구역 ID와 시대를 고정하고 시작 전 화면 자산 준비·유지 확인. 단순 요청 시작을 ready로 세지 않음. 미준비면 레일 시작 금지, 대체 자막/수동 탐색 제공\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>“두 번째 장면 이전 성공”\u003c/td>\n\u003ctd>설정만 옮기는지 장소별 저작도 검증하는지 모호\u003c/td>\n\u003ctd>축별로 코드 diff, 데이터 변경, 자산 재저작, 실제 인시를 따로 기록. 통과한 축의 계약 이전과 실패·미시험 축을 분리. 하늘 제거·역사 복원 단가까지 일반화하지 않음\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>이 표의 숫자는 \u003cstrong>새 제안\u003c/strong>이다. 50ms도 기존 장면이 충족했다는 진술이 아니며, 받아들이지 않을 수 있지만 대체 한도는 측정 전에 정해야 한다. JS heap 기록만으로 전체 메모리 안전성을 판정하는 문구도 피한다. \u003ca href=\"../implementation/LOADING-MEMORY-COMPARISON.html\">측정 한계 근거: \u003ccode>docs/implementation/LOADING-MEMORY-COMPARISON.md\u003c/code>\u003c/a>, \u003ca href=\"../implementation/MOBILE-COMPARISON.html\">\u003ccode>docs/implementation/MOBILE-COMPARISON.md\u003c/code>\u003c/a>\u003c/p>\n\u003cp>추가로 \u003cstrong>장면 변경 직후 늦게 끝난 요청\u003c/strong>은 02의 6종에 명시되지 않았다. 기존 콘텐츠 수명과 새로운 음성·레일 수명이 함께 정리되는지 이 확인을 넣자. 독립된 대규모 일곱 번째 시나리오를 만들 필요는 없지만, 시대 변경·취소 후 오래된 응답을 지연 전달하는 검사는 필요하다. 기존 패널 수명 관리 통과가 새 기능 수명까지 증명하지는 않는다. \u003ca href=\"../implementation/CONTENT-LIFECYCLE.html\">근거: \u003ccode>docs/implementation/CONTENT-LIFECYCLE.md\u003c/code>\u003c/a>\u003c/p>\n\u003cp>“레일 실패 → 트리거+자막”은 서비스 대체 경로의 성공이지 레일 축의 성공이 아니다. 최종 표에는 \u003cstrong>통과 / 실패 후 대체 / 보류 / 미시험\u003c/strong>을 구분하자. 또한 “두 축 보류”는 합의 가능한 운영 규칙일 뿐 실측으로 도출된 임계값이 아니다. 한 축이라도 촬영 전제를 무너뜨리면 그 제약은 즉시 촬영 계획에 전달해야 한다. 두 번째 실패까지 기다릴 이유는 없다.\u003c/p>\n\u003ch2 id=\"5_1\">5. 남은 이견\u003c/h2>\n\u003cp>네 축의 제한적 기술 시험을 진행한다는 방향과 이번 단계에서 학습 A/B를 요구하지 않는다는 점은 더 이상 이견이 아니다. 아래만 다음 결정 대상으로 남긴다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>Claude의 입장 (02)\u003c/th>\n\u003cth>Codex의 입장 (이번)\u003c/th>\n\u003cth>결정에 필요한 정보\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>플래그와 원인 귀속\u003c/td>\n\u003ctd>축별 on/off로 귀속 문제가 사라짐\u003c/td>\n\u003ctd>단독 추가 비용의 귀속은 가능. 결합 상호작용까지 해결된 것은 아님\u003c/td>\n\u003ctd>동일 조건의 기준·단독·결합 실행과 실패 시 선택적 축 제거 결과\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>하늘 자산의 확인 수준\u003c/td>\n\u003ctd>자산을 열면 하늘 스플랫 존재를 확정할 수 있음\u003c/td>\n\u003ctd>하늘 영상의 존재와 SOG 기원은 강하게 지지됨. 제거 가능한 점 집합·경계 보존은 미확인\u003c/td>\n\u003ctd>지정 시야의 제거 마스크/선택 결과, 가지·지붕 보존 전후 캡처, 작업 인시\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>레일 작업량\u003c/td>\n\u003ctd>기존 \u003ccode>RouteBenchmark\u003c/code> 덕분에 3–5인일보다 저렴\u003c/td>\n\u003ctd>재사용은 인정하지만 비용 단정은 불가. 한정 사전 로딩 방식에 한해 축 2–4인일 추정, 결합 검증비 별도\u003c/td>\n\u003ctd>재사용 코드와 새 상태 처리의 diff, 준비 구역·메모리, 실패 시험 결과, 실제 인시\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>정지와 왕복 인물의 범위\u003c/td>\n\u003ctd>“정지 또는 고정 왕복”을 한 범위로 제시\u003c/td>\n\u003ctd>정지를 기본으로 하고 왕복은 추가 1–2인일 선택으로 분리\u003c/td>\n\u003ctd>정지/왕복 선택, 경로·지면 조건, 시대 변경 시 복귀 규칙\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>합격선과 중단 단위\u003c/td>\n\u003ctd>허용치·기록된 한도·2개 축 보류 규칙\u003c/td>\n\u003ctd>수치/외관 예시를 사전 고정. 한 축이라도 촬영 전제에 영향이 있으면 즉시 전달\u003c/td>\n\u003ctd>목표 기기·프레임 한도, 외관 승인 예시·판단자, 각 축이 바꾸는 촬영 전제\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
