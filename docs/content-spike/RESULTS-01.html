sor:pointer;font-size:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"RESULTS-01.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"1\">콘텐츠 스파이크 1차 결과 (기능 확인)\u003c/h1>\n\u003cul>\n\u003cli>작성일: 2026-10-16\u003c/li>\n\u003cli>대상 계획: \u003ca href=\"FINAL.html\">FINAL.md\u003c/a> v2 §8의 1–3단계(준비·계약·축 구현)와 4단계 중 기능 확인 일부\u003c/li>\n\u003cli>환경: PlayCanvas 2.22.6 트랙, 장면 \u003ccode>sunnyvale-content\u003c/code>, Playwright headed Chromium, Apple M4 Pro 하드웨어 GPU, viewport 1200×863, DPR 1\u003c/li>\n\u003cli>빌드: 커밋 전 작업 트리(\u003ccode>release: unversioned\u003c/code>). 자산 목록은 \u003ca href=\"ASSETS.html\">ASSETS.md\u003c/a>\u003c/li>\n\u003cli>근거: \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">evidence/ (원본 저장소 파일)\u003c/span>의 스크린샷과 앱의 '위치 JSON 저장' 원본\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>이 문서는 기능 확인이다. 성능 판정·하늘 8시점 판정·iPhone 참고 측정은 아직 하지 않았다.\u003c/strong> 각 실패 주입은 1회씩만 수행했으며, 계획의 \"데스크톱 각 3회\"를 충족하지 않는다.\u003c/p>\n\u003ch2 id=\"1_1\">1. 구현 범위\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>축\u003c/th>\n\u003cth>구현\u003c/th>\n\u003cth>위치\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>공통 계약\u003c/td>\n\u003ctd>장면 데이터의 선택 필드(배너, 환경음, 내레이션, 인물, 연출, 하늘), \u003ccode>?axes=\u003c/code> 축 선택(미지정 시 전부, \u003ccode>none\u003c/code> 시 없음), 자막·건너뛰기·음소거 UI, 좌측 패널 접기\u003c/td>\n\u003ctd>\u003ccode>shared/src/world.ts\u003c/code>, \u003ccode>shared/src/ui.ts\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>듣기\u003c/td>\n\u003ctd>위치 환경음 3개(바람·새·물, 물은 현재 시대만), 정지 지점 1의 내레이션 1개(합성 음성 10.27초), 문장 단위 자막, 음원 실패 시 자막만 표시\u003c/td>\n\u003ctd>\u003ccode>apps/spike-playcanvas/src/content-audio.ts\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연출\u003c/td>\n\u003ctd>진입 트리거 → 8초 레일 → 자막 → 복귀. 구역 미준비 시 트리거 안에서 대기, 건너뛰기 버튼·Esc, 시대 전환·탭 숨김 시 취소\u003c/td>\n\u003ctd>\u003ccode>apps/spike-playcanvas/src/content-cue.ts\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>하늘\u003c/td>\n\u003ctd>원점 반경 100m 밖 스플랫을 제거한 스트립 12개 + 그라데이션 돔\u003c/td>\n\u003ctd>\u003ccode>apps/spike-playcanvas/src/content-sky.ts\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>인물\u003c/td>\n\u003ctd>정지 반투명 인물 2구(fig-1 양 시대, fig-2 과거 시대만), \"상징 표현\" 표지\u003c/td>\n\u003ctd>\u003ccode>apps/spike-playcanvas/src/content-figures.ts\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>콘텐츠 문장은 사용자 결정(2026-10-16)대로 흐름만 보여주는 임시 문장이다.\u003c/p>\n\u003ch2 id=\"2\">2. 확인 결과\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>축\u003c/th>\n\u003cth>항목\u003c/th>\n\u003cth>결과\u003c/th>\n\u003cth>근거\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>공통\u003c/td>\n\u003ctd>장면 로드 시 콘솔 오류\u003c/td>\n\u003ctd>없음(favicon 404 제외)\u003c/td>\n\u003ctd>01\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>공통\u003c/td>\n\u003ctd>\u003ccode>axes=none\u003c/code>에서 mp3·하늘 제거 스트립 요청\u003c/td>\n\u003ctd>0건\u003c/td>\n\u003ctd>state-axes-none\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>공통\u003c/td>\n\u003ctd>\u003ccode>axes=sky\u003c/code>에서 요청\u003c/td>\n\u003ctd>하늘 제거 스트립만\u003c/td>\n\u003ctd>state-axes-sky\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>공통\u003c/td>\n\u003ctd>640px 이하 패널 기본 접힘·펼침\u003c/td>\n\u003ctd>동작\u003c/td>\n\u003ctd>04, 05\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>듣기\u003c/td>\n\u003ctd>내레이션 재생 + 자막\u003c/td>\n\u003ctd>\u003ccode>playing\u003c/code>, 자막 순차 표시\u003c/td>\n\u003ctd>state-narration-ok\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>듣기\u003c/td>\n\u003ctd>mp3 요청 차단 시\u003c/td>\n\u003ctd>\u003ccode>captions-only\u003c/code>로 같은 자막 표시, 패널 유지\u003c/td>\n\u003ctd>state-narration-blocked\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>듣기\u003c/td>\n\u003ctd>패널 닫기\u003c/td>\n\u003ctd>자막 사라짐\u003c/td>\n\u003ctd>관찰\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>듣기\u003c/td>\n\u003ctd>과거 시대 전환\u003c/td>\n\u003ctd>물소리만 꺼짐\u003c/td>\n\u003ctd>state-historical\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연출\u003c/td>\n\u003ctd>구역 미준비 진입\u003c/td>\n\u003ctd>\u003ccode>not-ready\u003c/code> 1건 기록 후 대기, 준비되자 시작\u003c/td>\n\u003ctd>state-after-cue\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연출\u003c/td>\n\u003ctd>정상 재생\u003c/td>\n\u003ctd>8초 후 \u003ccode>completed\u003c/code>, 이동 복구\u003c/td>\n\u003ctd>06, state-after-cue\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연출\u003c/td>\n\u003ctd>재생 중 시대 변경\u003c/td>\n\u003ctd>취소 후 전환, 잠금 잔류 없음\u003c/td>\n\u003ctd>관찰 1회\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연출\u003c/td>\n\u003ctd>건너뛰기 버튼 / Esc\u003c/td>\n\u003ctd>둘 다 종료, 잠금 잔류 없음\u003c/td>\n\u003ctd>관찰 각 1회\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연출\u003c/td>\n\u003ctd>연속 진입(재생 중 재시작)\u003c/td>\n\u003ctd>\u003ccode>blocked:active\u003c/code>, 중복 재생 없음\u003c/td>\n\u003ctd>관찰 1회\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연출\u003c/td>\n\u003ctd>재생 중 R(위치 초기화)\u003c/td>\n\u003ctd>무시됨\u003c/td>\n\u003ctd>관찰 1회\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연출\u003c/td>\n\u003ctd>백그라운드 전환\u003c/td>\n\u003ctd>합성 \u003ccode>visibilitychange\u003c/code>로 \u003ccode>cancelled:hidden\u003c/code>, 잠금 잔류 없음\u003c/td>\n\u003ctd>관찰 1회\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>하늘\u003c/td>\n\u003ctd>제거 전후 시작 시점\u003c/td>\n\u003ctd>짙은 하늘 스플랫이 밝은 돔으로 바뀜\u003c/td>\n\u003ctd>01, 02\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>인물\u003c/td>\n\u003ctd>과거 시대에 fig-2 표시\u003c/td>\n\u003ctd>표시, 표지 핫스팟 활성\u003c/td>\n\u003ctd>07, state-historical-2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>인물\u003c/td>\n\u003ctd>바닥 발 기준점 오차\u003c/td>\n\u003ctd>fig-2 0.003m(지정 바닥 기준)\u003c/td>\n\u003ctd>배치 조정 기록\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"3\">3. 관찰된 문제\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>인물이 밝은 배경에서 거의 보이지 않는다.\u003c/strong> 불투명도 0.35의 흰 반투명 형상이라 새 하늘 돔 앞에서 윤곽이 사라진다(10, 11 비교). 외관 승인 예시가 없으므로 기술 표시 성공과 외관 판정을 분리한다. 색·불투명도·외곽선 중 무엇을 바꿀지는 승인 예시를 정한 뒤 결정한다.\u003c/li>\n\u003cli>\u003cstrong>밝은 하늘에서 floater가 도드라진다.\u003c/strong> 원래 짙은 하늘에 묻혀 있던 흩날리는 잎 스플랫이 밝은 돔 앞에서 점으로 보인다. 하늘 제거가 만든 새 결함이 아니라 기존 결함이 드러난 것으로 분류한다.\u003c/li>\n\u003cli>\u003cstrong>지평선 아래로 돔 색이 비친다.\u003c/strong> 반경 100m 밖 지면까지 제거돼 화면 오른쪽 아래에 틈이 생긴다. 제거 반경 또는 높이 조건을 바꾸거나 돔 하단을 지면색으로 칠하는 방안이 있다. 계획의 \"새 구멍 0건\"에 걸리므로 8시점 판정 전에 처리해야 한다. → 2차에서 돔 하단 색으로 해소했다(\u003ca href=\"RESULTS-02-sky.html\">RESULTS-02-sky.md\u003c/a>).\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"4\">4. 아직 하지 않은 것\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth>계획 위치\u003c/th>\n\u003cth>비고\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>실패 주입 중 구역 로딩 실패, 연출 중 음원 실패, 장면 변경 직후 늦은 응답\u003c/td>\n\u003ctd>§3 연출\u003c/td>\n\u003ctd>미시험\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>실패 주입 7종 각 3회\u003c/td>\n\u003ctd>§3 연출\u003c/td>\n\u003ctd>위 표는 각 1회\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>듣기의 음소거·백그라운드 복귀 후 의도하지 않은 소리\u003c/td>\n\u003ctd>§3 듣기\u003c/td>\n\u003ctd>음소거 버튼은 제스처 처리에만 썼고 무음 여부는 측정하지 않음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>성능 6구성 × 3회\u003c/td>\n\u003ctd>§4, §5\u003c/td>\n\u003ctd>미측정. 판정 불가\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>하늘 고정 8시점 비교\u003c/td>\n\u003ctd>§3 하늘\u003c/td>\n\u003ctd>2차에서 수행(\u003ca href=\"RESULTS-02-sky.html\">RESULTS-02-sky.md\u003c/a>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>인물 밝은·어두운 배경 지정 시점 캡처, 관통 확인\u003c/td>\n\u003ctd>§3 인물\u003c/td>\n\u003ctd>외관 승인 예시 필요\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>iPhone 참고 측정 2회\u003c/td>\n\u003ctd>§4\u003c/td>\n\u003ctd>미측정\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>두 번째 장면(Knock Hall) 이전\u003c/td>\n\u003ctd>§4\u003c/td>\n\u003ctd>미착수\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"5\">5. 다음 단계\u003c/h2>\n\u003col>\n\u003cli>지평선 틈을 고치고 하늘 8시점을 고정해 비교한다.\u003c/li>\n\u003cli>인물 외관 승인 예시를 정한 뒤 표시 방식을 조정한다.\u003c/li>\n\u003cli>남은 실패 주입 3종을 구현하고 7종을 각 3회 반복한다.\u003c/li>\n\u003cli>6구성 × 3회 성능을 측정하고 기준 실행으로 합격선을 확정한다.\u003c/li>\n\u003cli>iPhone 참고 측정 2회, Knock Hall 이전.\u003c/li>\n\u003c/ol>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
