pointer;font-size:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"00-initial.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"v0\">콘텐츠 스파이크 초안 (v0, 동결)\u003c/h1>\n\u003cul>\n\u003cli>작성일: 2026-10-14\u003c/li>\n\u003cli>작성자: Claude (Fable 5.1), 사용자 대화 기반\u003c/li>\n\u003cli>상태: 초안. 이 문서는 수정하지 않고 보존한다. 토론 결과는 \u003ccode>FINAL.md\u003c/code>에 반영한다.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"1\">1. 이 단계의 정의\u003c/h2>\n\u003cp>기술 스파이크(엔진 비교, 보행, 시대 전환, 로딩, 모바일)는 충분히 검증됐다. 다음 단계는 \u003cstrong>콘텐츠 스파이크\u003c/strong>다. 게임 제작 용어로는 수직 슬라이스(vertical slice)에 가깝다. 십상 중 한 장면을 골라 \"기술이 돌아가는가\"가 아니라 \"경험이 성립하는가\"를 확인한다.\u003c/p>\n\u003cp>여전히 기술 시험이다. 차이는 측정 대상이 프레임·메모리가 아니라 다음 질문이라는 점이다.\u003c/p>\n\u003cul>\n\u003cli>이용자가 이 공간에서 무엇을 보고, 듣고, 바꾸고, 만나는가.\u003c/li>\n\u003cli>그 경험이 십상 한 장면의 이해로 이어지는가.\u003c/li>\n\u003cli>실제 성지 촬영 데이터가 들어오면 같은 구성을 그대로 옮길 수 있는가.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"2\">2. 전제와 제약\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>실제 십상 장소를 지금 시험 공간으로 쓸 수 없다.\u003c/strong> 인터넷에 공개된 가우시안 스플랫 장면을 대역(stand-in)으로 쓴다. 지금까지 쓴 Knock Community Hall, Sunnyvale Heritage Park Museum도 공개 자료다. 필요하면 더 적합한 공개 장면을 추가로 가져온다. 내부 기술 시험 용도이며 라이선스와 제작자 표기는 기존 방식대로 기록한다.\u003c/li>\n\u003cli>나중에 실제 장소를 촬영해 같은 구성을 입힌다. 따라서 \u003cstrong>장면 데이터에 종속되지 않는 구성\u003c/strong>(world.json 수준의 선언, 공통 자산 규약)이어야 한다.\u003c/li>\n\u003cli>엔진은 스파이크 결과 보고서의 추천대로 PlayCanvas + Ammo를 1순위로 두되, 콘텐츠 스파이크에서 반드시 두 엔진을 병행할 필요는 없다.\u003c/li>\n\u003cli>제외: 로그인, 백엔드, 멀티유저, 음성 대화 AI, VR, 운영 에디터.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"3\">3. 사용자가 제시한 세 가지 예시와 판단\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>예시\u003c/th>\n\u003cth>판단\u003c/th>\n\u003cth>비용·한계\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>3D 모델이 공간을 돌아다니고 상호작용한다\u003c/td>\n\u003ctd>가능. GLB 배치·핫스팟이 이미 있다\u003c/td>\n\u003ctd>스플랫은 조명이 구워져 있어 캐릭터 조명을 장면 색감에 맞춰야 \"떠 보이지\" 않는다. 경로 추종과 바닥 추종이 추가 작업\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>날씨를 바꾼다 (하늘 스플랫 제거, 하늘 칠하기, 구름, 비)\u003c/td>\n\u003ctd>부분 가능\u003c/td>\n\u003ctd>하늘 스플랫 제거 + 스카이박스 + 안개 + 비 입자 + 색보정까지는 현실적. 스플랫 자체의 재조명은 불가. 젖은 바닥, 그림자 변화, 밤의 실제 광원은 포기. 밤은 전체 어둡게 + 가짜 광원\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>특정 공간에 오면 연출이 발생한다 (컷 전환, 감상)\u003c/td>\n\u003ctd>가능. 시대 전환 + 입력 차단이 이미 검증됨\u003c/td>\n\u003ctd>카메라 레일, 입력 잠금, 자막, 복귀가 한 세트. 연출 중 로딩 실패 복구가 필요\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"4\">4. 추가 아이디어 (십상 매핑 포함)\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>공간 음향과 위치 내레이션\u003c/strong> — 바닷소리, 새소리, 염불이 위치에 따라 바뀌고 특정 지점에서 해설이 재생된다. 비용 대비 몰입 효과가 가장 크다. 2D 핫스팟 패널을 대체할 수 있다.\u003c/li>\n\u003cli>\u003cstrong>과거를 보는 창\u003c/strong> — 현재 스플랫 위에 과거 스플랫을 손전등·렌즈 모양으로만 보여준다. 전체 시대 전환보다 \"같은 자리에 무엇이 있었는가\"를 직관적으로 전달한다. 두 스플랫 레이어 마스킹 셰이더 시험이 필요하다.\u003c/li>\n\u003cli>\u003cstrong>타임랩스 전환\u003c/strong> — 영산방언상의 방언 공사처럼 바다가 논이 되는 과정을 제자리에서 본다. 시대 전환의 중간 단계를 여러 장 끼우는 문제다.\u003c/li>\n\u003cli>\u003cstrong>하늘 보기 상호작용\u003c/strong> — 관천기의상. 하늘을 올려다보면 구름이 느려지고 소태산의 의문이 자막으로 뜬다. 날씨 시스템과 기반을 공유한다.\u003c/li>\n\u003cli>\u003cstrong>동행 캐릭터\u003c/strong> — 따라오며 말을 거는 해설자. 걷는 NPC의 상위 버전. 경로 추종과 대화 트리거가 추가된다.\u003c/li>\n\u003cli>\u003cstrong>잔상 인물\u003c/strong> — 당시 사람들을 반투명 실루엣으로 둔다. 정밀 캐릭터 제작 없이 \"여기에 사람이 있었다\"를 전달하고 스플랫과 이질감이 적다.\u003c/li>\n\u003cli>\u003cstrong>발자취 따라 걷기\u003c/strong> — 바닥의 발자국·빛의 길로 십상 순서를 안내한다. 자유 탐색에서 길을 잃는 문제를 해결한다.\u003c/li>\n\u003cli>\u003cstrong>물건 상호작용\u003c/strong> — 경전, 편지, 돌 같은 소품을 집어 들거나 가까이 보면 기억이 재생된다. 핫스팟을 사물로 바꾼 형태.\u003c/li>\n\u003cli>\u003cstrong>시점 전환\u003c/strong> — 하늘로 올라가 성지 전체를 조감하고 다른 성지로 건너간다. 영광·변산·익산 네트워크의 뼈대.\u003c/li>\n\u003cli>\u003cstrong>스플랫 흩어짐 전환\u003c/strong> — 장면 전환 때 스플랫이 입자처럼 흩어졌다 모인다. 기억 회상 연출. 스플랫 매체 고유의 표현.\u003c/li>\n\u003cli>\u003cstrong>등불 남기기\u003c/strong> — 서원·기도를 등불로 띄운다. 백엔드가 필요하므로 지금은 로컬 저장으로만 감을 본다.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"5\">5. 초안의 추천\u003c/h2>\n\u003cp>십상 한 장면을 정하고 그 안에서 \u003cstrong>네 가지만\u003c/strong> 시험한다. \"볼 것, 들을 것, 바뀌는 것, 만나는 것\"이 모두 들어가는 조합이다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>축\u003c/th>\n\u003cth>시험 항목\u003c/th>\n\u003cth>왜 이것부터\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>들을 것\u003c/td>\n\u003ctd>공간 음향 + 위치 내레이션\u003c/td>\n\u003ctd>가장 싸고 몰입 효과가 크다. 핫스팟 패널 대체 가능성 확인\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>바뀌는 것\u003c/td>\n\u003ctd>진입 연출 (트리거 → 카메라 레일 → 자막 → 복귀)\u003c/td>\n\u003ctd>시대 전환·입력 차단 자산을 재사용. 연출 중 실패 복구 검증\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>볼 것\u003c/td>\n\u003ctd>하늘·날씨 (하늘 스플랫 제거, 스카이박스, 비·안개)\u003c/td>\n\u003ctd>스플랫의 재조명 불가라는 한계를 실측으로 확정\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>만날 것\u003c/td>\n\u003ctd>동행 캐릭터 또는 잔상 인물 중 하나\u003c/td>\n\u003ctd>스플랫 안의 캐릭터 이질감과 바닥 추종 비용 확인\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>대상 장면 후보: 시간 변화가 뚜렷한 영산(방언 공사) 또는 대각터.\u003c/p>\n\u003ch2 id=\"6\">6. 대역 공간 선택\u003c/h2>\n\u003ch3 id=\"_1\">요구 조건\u003c/h3>\n\u003cul>\n\u003cli>실외이고 하늘이 포함된다 (날씨·하늘 시험).\u003c/li>\n\u003cli>걸을 수 있는 평지와 몇 개의 구조물이 있다 (연출 트리거, 캐릭터 경로).\u003c/li>\n\u003cli>가능하면 물·들판·낮은 산 같은 자연 지형이 있다 (영산 대역으로서의 유사성).\u003c/li>\n\u003cli>충돌 메시를 만들 수 있을 정도로 바닥이 분명하다.\u003c/li>\n\u003cli>라이선스가 CC BY 등 표기만으로 내부 사용이 가능하다.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"_2\">후보\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>후보\u003c/th>\n\u003cth>장점\u003c/th>\n\u003cth>단점\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Sunnyvale Heritage Park Museum (기존)\u003c/td>\n\u003ctd>충돌 GLB, 시대·분할 장면, 측정 기준이 이미 있다. 실외, 현관, 건물\u003c/td>\n\u003ctd>도시 공원 박물관이라 성지 분위기와 거리가 있다. 하늘 품질 미확인\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Knock Community Hall (기존)\u003c/td>\n\u003ctd>작고 빠르다\u003c/td>\n\u003ctd>실내 중심. 하늘·날씨 시험에 부적합\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>새 공개 장면 (SuperSplat 등에서 탐색)\u003c/td>\n\u003ctd>들판·물·사찰·전통 건축 등 성지와 유사한 분위기 선택 가능\u003c/td>\n\u003ctd>충돌 메시·정합·측정 기준을 새로 만든다. 품질과 라이선스가 들쭉날쭉\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>초안의 입장: \u003cstrong>1차는 Sunnyvale로 시작\u003c/strong>해 네 축을 붙이고, 그 과정에서 \"분위기 차이 때문에 판단이 안 되는 항목\"이 드러나면 그 항목에 한해 새 공개 장면을 구한다. 처음부터 새 장면을 찾는 데 시간을 쓰지 않는다.\u003c/p>\n\u003ch2 id=\"7\">7. 성공 기준 (초안)\u003c/h2>\n\u003cul>\n\u003cli>네 축 모두 world.json 수준의 선언으로 추가되고, 장면 데이터를 바꿔도 코드 수정 없이 재사용된다.\u003c/li>\n\u003cli>모바일(iPhone)에서 네 축을 켠 상태로 장면이 열리고 걷기가 유지된다.\u003c/li>\n\u003cli>외부 평가자(교무·해설자 1인 이상)가 \"십상 한 장면을 이해했다\"고 답한다.\u003c/li>\n\u003cli>각 축의 비용(작업 시간, 자산 제작 시간)이 기록되어 실제 성지 제작 견적에 쓰인다.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"8\">8. 토론에 부치는 질문\u003c/h2>\n\u003col>\n\u003cli>네 축 선택이 맞는가. 빠진 것이나 빼야 할 것이 있는가.\u003c/li>\n\u003cli>대역 공간을 Sunnyvale로 시작하는 것이 맞는가. 처음부터 성지 유사 장면을 찾아야 하는가.\u003c/li>\n\u003cli>\"과거를 보는 창\"과 \"타임랩스\"를 이번에 넣지 않는 것이 맞는가.\u003c/li>\n\u003cli>날씨 축은 한계가 분명한데 시험 가치가 있는가.\u003c/li>\n\u003cli>성공 기준이 측정 가능한가. 외부 평가자 기준이 현실적인가.\u003c/li>\n\u003cli>실제 성지로 옮길 때 깨질 가정은 무엇인가.\u003c/li>\n\u003c/ol>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
