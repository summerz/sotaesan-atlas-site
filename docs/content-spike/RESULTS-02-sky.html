ow-x:auto}footer{max-width:1120px;margin:auto;border-top:1px solid var(--line);padding:24px;font-size:14px;color:var(--muted)}.intro{max-width:750px;font-size:21px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:32px 0}.button{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);text-decoration:none;border-radius:4px;padding:11px 22px;font-weight:600}.button.secondary{background:transparent;color:var(--green)}.summary{border-left:4px solid var(--green);padding:4px 24px;margin:38px 0;font-size:19px}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.resource{border:1px solid var(--line);padding:22px}.resource h3{margin:0 0 10px}.resource p{font-size:16px;margin:0;color:var(--muted)}.local-file{color:var(--muted)}.meta{color:var(--muted);font-size:14px}.toc{border:1px solid var(--line);padding:16px 24px;margin:28px 0;font-size:15px}.toc>ul{margin:0}.toc li{margin:4px 0}li{margin:8px 0}.downloads{margin:0 0 30px}.measurements ul{padding-left:24px}@media(max-width:650px){body{font-size:16px}main{padding:30px 18px 50px}h1{font-size:29px}h2{font-size:23px}.intro{font-size:19px}.resources{grid-template-columns:1fr}header{padding:16px 18px}table{min-width:680px}.actions{gap:10px}.button{padding:9px 16px}}@media print{header,footer,.downloads{display:none}main{max-width:none;padding:0}body{font-size:11pt}h1{font-size:24pt}h2{font-size:18pt}table{font-size:9pt}.table-scroll{overflow:visible}a{color:inherit}}\n\n.button{font:inherit;cursor:pointer}.button:disabled{opacity:.5;cursor:not-allowed}:focus-visible{outline:3px solid var(--green);outline-offset:5px}.trial-steps{padding-left:26px;max-width:780px}.trial-steps li{padding-left:8px;margin:18px 0}.trial-steps strong{display:block}.controls{display:grid;grid-template-columns:160px 1fr;gap:10px 24px;max-width:780px}.controls dt{font-weight:600}.controls dd{margin:0}.archive{margin-top:52px;border-top:1px solid var(--line);padding-top:24px}.archive>summary{cursor:pointer;font-size:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"RESULTS-02-sky.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"2-8\">콘텐츠 스파이크 2차 결과: 하늘 고정 8시점 비교\u003c/h1>\n\u003cul>\n\u003cli>작성일: 2026-10-16\u003c/li>\n\u003cli>대상 계획: \u003ca href=\"FINAL.html\">FINAL.md\u003c/a> §3 하늘 행\u003c/li>\n\u003cli>환경: PlayCanvas 2.22.6, 장면 \u003ccode>sunnyvale-content\u003c/code>, Playwright headed Chromium, \u003ccode>ANGLE Metal Renderer: Apple M4 Pro\u003c/code>(하드웨어 GPU), 창 1200×863, DPR 2\u003c/li>\n\u003cli>비교 조건: 같은 시점에서 \u003ccode>?axes=none\u003c/code>(원본 스트립)과 \u003ccode>?axes=sky\u003c/code>(반경 100m 밖 제거 스트립 + 돔)\u003c/li>\n\u003cli>시점 고정 방법: 시험 브라우저에서 \u003ccode>sunnyvale-content.json\u003c/code> 응답의 \u003ccode>spawn\u003c/code> 위치·회전만 바꿨다. 소스 파일은 바꾸지 않았다. 요청 가로채기를 썼으므로 이 실행으로 로딩 비용을 판정하지 않는다.\u003c/li>\n\u003cli>근거: \u003cspan class=\"local-file\" title=\"원본 개발 저장소의 파일\">evidence/sky8/ (원본 저장소 파일)\u003c/span>의 비교 이미지. 왼쪽이 원본, 오른쪽이 하늘 교체\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"1\">1. 이번 회차 수정\u003c/h2>\n\u003cp>1차 결과의 \"지평선 아래로 돔 색이 비친다\" 문제를 돔 쪽에서 고쳤다. 돔의 눈높이 아래를 어두운 녹회색(0.27, 0.30, 0.25)으로 칠했다. 제거된 먼 스플랫은 반경 100m 밖 약 3,600개(상세 90만 개 중)였고, 대부분 수평선 위 0–15° 사이의 회색 배경이었다. 자산을 다시 만들지 않았다.\u003c/p>\n\u003ch2 id=\"2\">2. 시점과 결과\u003c/h2>\n\u003cp>시점은 \u003ccode>[pitch, yaw, roll]\u003c/code>이고 단위는 도다. yaw 0은 −Z 방향이다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>시점\u003c/th>\n\u003cth>위치\u003c/th>\n\u003cth>회전\u003c/th>\n\u003cth>대상\u003c/th>\n\u003cth>결과\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>v1 열린 하늘\u003c/td>\n\u003ctd>[0, 0.17, 0]\u003c/td>\n\u003ctd>[25, 0, 0]\u003c/td>\n\u003ctd>광장 위 하늘, 왼쪽 2층 현관 건물\u003c/td>\n\u003ctd>\u003cstrong>결함\u003c/strong>. 현관 건물이 반투명해져 형태가 흐려짐\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>v2 가지\u003c/td>\n\u003ctd>[0, 0.17, 0]\u003c/td>\n\u003ctd>[20, 25, 0]\u003c/td>\n\u003ctd>앙상한 나무 가지, 현관 건물\u003c/td>\n\u003ctd>\u003cstrong>결함\u003c/strong>. 가지는 보존. 현관 건물이 반투명, 앞쪽 floater 다수\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>v3 지붕\u003c/td>\n\u003ctd>[0, 0.17, 0]\u003c/td>\n\u003ctd>[8, 15, 0]\u003c/td>\n\u003ctd>흰 지붕 집, 현관 건물\u003c/td>\n\u003ctd>\u003cstrong>결함\u003c/strong>. 흰 지붕 보존. 현관 건물 반투명\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>v4 야자\u003c/td>\n\u003ctd>[3.1, 0.17, −1.4]\u003c/td>\n\u003ctd>[30, −15, 0]\u003c/td>\n\u003ctd>야자 줄기·잎\u003c/td>\n\u003ctd>줄기·잎 보존. floater 드러남\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>v5 구역 경계 12m\u003c/td>\n\u003ctd>[11, 0.17, −1.5]\u003c/td>\n\u003ctd>[10, −90, 0]\u003c/td>\n\u003ctd>오른쪽 끝 관목\u003c/td>\n\u003ctd>관목 보존. 원본도 촬영 범위 끝이라 잡음이 많음. floater 드러남\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>v6 구역 경계 0m\u003c/td>\n\u003ctd>[3.1, 0.17, −1.4]\u003c/td>\n\u003ctd>[10, 90, 0]\u003c/td>\n\u003ctd>왼쪽 촬영 범위 밖\u003c/td>\n\u003ctd>원본·교체 모두 판별 불가. 원본이 이미 잡음뿐인 영역\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>v7 오른쪽 낮은 시야\u003c/td>\n\u003ctd>[0, 0.17, 0]\u003c/td>\n\u003ctd>[0, −45, 0]\u003c/td>\n\u003ctd>1차에서 틈이 보였던 곳\u003c/td>\n\u003ctd>틈 해소. 눈높이 아래가 어두운 띠로 덮임\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>v8 뒤쪽\u003c/td>\n\u003ctd>[0, 0.17, 0]\u003c/td>\n\u003ctd>[15, 180, 0]\u003c/td>\n\u003ctd>지붕 집, 가로등, 큰 나무\u003c/td>\n\u003ctd>지붕·가로등·가지 보존. floater 드러남\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>계획의 판정 항목별 정리다.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>보존할 지붕·줄기 소실\u003c/strong>: 3건(v1–v3, 같은 현관 건물). 스플랫이 지워진 것이 아니다. 반투명한 건물 스플랫 뒤를 막던 어두운 원거리 스플랫이 사라져 밝은 돔이 비친다. 원인은 기존 재구성 결함이지만 보이는 결과는 건물 소실에 가깝다.\u003c/li>\n\u003cli>\u003cstrong>새 구멍\u003c/strong>: 0건. 1차의 지평선 틈은 v7에서 해소됐다.\u003c/li>\n\u003cli>\u003cstrong>이전 하늘의 뚜렷한 잔존\u003c/strong>: 0건. 원본의 짙은 파란 얼룩은 8시점 모두에서 사라졌다.\u003c/li>\n\u003cli>\u003cstrong>기존 결함이 드러남\u003c/strong>: 흩날리는 잎 floater가 8시점 모두에서 밝은 하늘 앞에 보인다.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"3\">3. 판정\u003c/h2>\n\u003cp>현재 방식(반경 제거 + 단색 그라데이션 돔)으로는 하늘 축의 통과 기준을 충족하지 못한다. 막는 항목은 현관 건물의 반투명 노출이다. 미세 번짐이 아니라서 승인 예시 없이도 결함으로 본다. 최종 판정은 지정 판단자가 비교 이미지로 확인한다.\u003c/p>\n\u003cp>이 결과는 대역 장면의 성질에 크게 좌우된다. Sunnyvale 장면은 하늘과 먼 배경이 거의 재구성되지 않아 짙은 스플랫이 배경을 대신하고 있었다. 실제 성지 촬영에서 하늘 영역을 따로 분리하는 비용은 이 결과로 추정할 수 없다.\u003c/p>\n\u003ch2 id=\"4\">4. 다음 선택지\u003c/h2>\n\u003col>\n\u003cli>하늘 축을 \"실패 보고\"로 닫는다. 계획 §3은 상한 도달 시 실패 보고도 유효 산출물로 인정한다. 추가 비용이 없다.\u003c/li>\n\u003cli>돔을 어둡게 해 원본 분위기에 가깝게 맞춘다. 반투명 노출은 줄지만 하늘 교체의 의미가 약해진다. 0.1인일 미만이다.\u003c/li>\n\u003cli>현관 건물 주변에만 원거리 스플랫을 남기는 영역 예외를 둔다. 장면 전용 수작업이라 실제 성지로 옮길 수 없다. 0.5인일 정도다.\u003c/li>\n\u003cli>floater 제거 필터(\u003ccode>splat-transform -F\u003c/code>)를 먼저 시험한다. 잎과 가지를 함께 지울 위험이 있다. 0.5인일 정도다.\u003c/li>\n\u003c/ol>\n\u003cp>추천은 1이다. 2–4는 이 대역 장면의 결함을 손보는 일이고, 실제 성지로 옮길 수 있는 지식이 적다.\u003c/p>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
