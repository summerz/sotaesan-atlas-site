;border-top:1px solid var(--line);padding-top:24px}.archive>summary{cursor:pointer;font-size:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"02-claude-rebuttal.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"2-claude\">2라운드: Claude 재반박\u003c/h1>\n\u003cul>\n\u003cli>작성일: 2026-10-14\u003c/li>\n\u003cli>모델: Claude Fable 5.1\u003c/li>\n\u003cli>대상: \u003ccode>01-codex-critique.md\u003c/code>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"0\">0. 판정 요약\u003c/h2>\n\u003cp>Codex의 반박은 두 종류로 나뉜다. 하나는 초안의 느슨한 전제와 측정 불가능한 기준을 지적한 것으로, 대부분 \u003cstrong>수용\u003c/strong>한다. 다른 하나는 이 단계를 \"초심자 학습 효과 검증\"으로 재정의한 것으로, \u003cstrong>거부\u003c/strong>한다. 거부 근거는 Codex 자신의 논리다. Codex는 2절 질문 2에서 대역 공간으로는 십상 이해를 검증할 수 없다고 했다. 그 말이 맞다면 대역 공간에서 초심자 8명의 이해도를 재는 것도 의미가 없다. 대역 단계에서 검증 가능한 것은 \u003cstrong>표현 수단의 실현 가능성, 비용, 기기 예산, 데이터 계약\u003c/strong>이다. 초안은 이를 \"여전히 기술 시험\"이라고 썼고 그 정의는 유지한다.\u003c/p>\n\u003ch2 id=\"1\">1. 수용하는 항목\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Codex 지적\u003c/th>\n\u003cth>수용 내용\u003c/th>\n\u003cth>반영\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1.1 기술 스파이크 종료 ≠ 추가 효과의 성능 여유 확보\u003c/td>\n\u003ctd>맞다. 각 축을 켠 상태의 프레임·메모리·로딩을 다시 잰다\u003c/td>\n\u003ctd>축마다 on/off 플래그를 두고 기준 실행과 차이를 기록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1.3 world.json 선언은 아직 없는 능력\u003c/td>\n\u003ctd>맞다. \u003ccode>world.ts\u003c/code>의 \u003ccode>WorldObject\u003c/code>는 \u003ccode>splat\\|gltf\u003c/code>뿐이다\u003c/td>\n\u003ctd>\"코드 수정 없는 재사용\"을 전제가 아닌 \u003cstrong>검증 목표\u003c/strong>로 바꾸고, 두 번째 기존 장면 이전 리허설을 넣는다\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>질문 2 어느 Sunnyvale인지 고정\u003c/td>\n\u003ctd>맞다. \u003ccode>sunnyvale.json\u003c/code>과 \u003ccode>sunnyvale-era.json\u003c/code>은 다른 장면이다\u003c/td>\n\u003ctd>기능 시험은 \u003ccode>sunnyvale-era\u003c/code>(분할·시대 포함) 한 변형, 자산 해시 고정\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>질문 3 타임랩스·창 셰이더 제외, 전후 비교는 유지\u003c/td>\n\u003ctd>맞다\u003c/td>\n\u003ctd>기존 두 층 시대 전환을 전후 비교로 쓴다. 새 셰이더 없음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>질문 4 \"재조명 불가 확정\"은 성공 기준이 아님\u003c/td>\n\u003ctd>맞다. 표현을 \"이 구현에서 미지원\"으로 낮춘다\u003c/td>\n\u003ctd>날씨를 하늘 교체·안개·강수·색보정으로 분해하고 각각 통과/실패를 따로 기록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>질문 5 전문가 1인 \"이해했다\"는 학습 증거가 아님\u003c/td>\n\u003ctd>맞다\u003c/td>\n\u003ctd>전문가 역할을 \u003cstrong>정확성·표현 적절성 검수\u003c/strong>로 한정\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>질문 6 \"그대로 이식\"은 과장\u003c/td>\n\u003ctd>맞다\u003c/td>\n\u003ctd>재사용 항목과 재저작 항목을 표로 분리해 최종안에 넣는다\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3.2 음성이 출처·표현 구분 정보를 지우면 안 됨\u003c/td>\n\u003ctd>맞다\u003c/td>\n\u003ctd>패널 유지. 모든 음성에 동일 자막, 출처 접근, 상징 표현 표지\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3.3 취소·실패의 상태 소유권\u003c/td>\n\u003ctd>맞다. \u003ccode>syncInput\u003c/code>에 새 상태를 끼워 넣는 설계가 필요하다\u003c/td>\n\u003ctd>실패 주입 목록(재생 중 시대 변경, 구역 로딩 실패, 음원 실패, 연속 진입, 건너뛰기, 백그라운드 복귀)을 시험 항목으로 명시\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3.4 자막·음소거·건너뛰기·수동 경로\u003c/td>\n\u003ctd>맞다. 싸고 필수다\u003c/td>\n\u003ctd>기본 포함\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3.5 공통 구현비와 장소별 제작비 분리\u003c/td>\n\u003ctd>맞다\u003c/td>\n\u003ctd>기록 양식을 먼저 만들고 두 번째 장면 이전에서 분리 측정\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3.6 중단 기준 부재\u003c/td>\n\u003ctd>맞다\u003c/td>\n\u003ctd>축별 중단 기준을 둔다 (아래 4절)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>동행 캐릭터는 GLB 배치와 다르다\u003c/td>\n\u003ctd>맞다\u003c/td>\n\u003ctd>1차는 경로 추종 없는 \u003cstrong>잔상 인물(정지 또는 고정 왕복)\u003c/strong>. 동행·길 찾기는 제외\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>RouteBenchmark\u003c/code>가 이미 카메라 레일을 한다\u003c/td>\n\u003ctd>맞고 유용하다. 단 재생 중 스트리밍이 발 기준이라는 지적은 실제 위험\u003c/td>\n\u003ctd>레일 중 카메라 기준 스트리밍 또는 재생 전 사전 로딩을 시험 항목으로 추가\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch2 id=\"2\">2. 거부하는 항목\u003c/h2>\n\u003ch3 id=\"21-44\">2.1 \"네 축 폐기, 초심자 4+4명 대조 평가로 교체\"\u003c/h3>\n\u003cp>거부한다. 이유는 셋이다.\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>대역 공간에서는 학습 효과를 잴 수 없다.\u003c/strong> Codex 질문 2의 답과 모순된다. 박물관 대역에서 \"방언 공사를 이해했는가\"를 묻는 실험은 Codex가 직접 \"더 비싼 장식\"이라 부른 것과 같은 범주다.\u003c/li>\n\u003cli>\u003cstrong>사용자의 요구와 다르다.\u003c/strong> 사용자는 \"이 공간에서 무엇을 할 수 있는가\"를 실제 촬영 전에 알고 싶다고 했다. 실제 성지를 촬영한 뒤 \"그때 가서 날씨가 되는지 보자\"는 것이 더 비싸다. 수단의 실현 가능성과 비용을 먼저 알아야 촬영 범위(하늘 포함 여부, 인물 배치 공간, 연출 동선)를 정할 수 있다. 이것이 대역 단계의 존재 이유다.\u003c/li>\n\u003cli>\u003cstrong>A/B 설계 자체가 이 단계의 비용 구조에 맞지 않는다.\u003c/strong> 모집·진행·분석 2–3인일에 대조 페이지 1–2인일을 더하면 Codex 추정으로도 4–5인일이 \"지금 답할 수 없는 질문\"에 들어간다. 그 질문은 실제 성지 데이터와 검수된 콘텐츠가 있을 때 물어야 한다.\u003c/li>\n\u003c/ol>\n\u003cp>대안: 학습 평가 설계(Codex 질문 5의 표)는 \u003cstrong>다음 단계(실제 성지 1차 촬영 후) 문서로 보존\u003c/strong>한다. 지금은 버리지 않고 미룬다.\u003c/p>\n\u003ch3 id=\"22-npc-0\">2.2 \"날씨와 NPC 0인일, 제외\"\u003c/h3>\n\u003cp>거부한다. 두 축은 사용자가 명시적으로 제시한 시험 대상이다. 다만 Codex의 분해 요구는 받아들여 범위를 줄인다.\u003c/p>\n\u003cul>\n\u003cli>날씨: 비·안개·주야간 묶음(Codex 추정 4–8인일)을 하지 않는다. \u003cstrong>하늘 스플랫 제거 + 스카이박스 교체 한 상태\u003c/strong>만 한다(Codex 추정 1–2인일과 같은 범위). 통과 기준은 고정 경로의 정면·측면·수목/건물 경계 캡처를 원본과 비교하는 것이다. 이것이 통과하면 안개·강수는 다음 회차.\u003c/li>\n\u003cli>인물: 동행 NPC를 하지 않는다. \u003cstrong>잔상 인물 1–2구를 고정 위치 또는 고정 왕복으로\u003c/strong> 둔다. 측정 대상은 스플랫 안의 조명 이질감(캡처 비교), 바닥 추종, 시대 전환 때 위치 복구다.\u003c/li>\n\u003c/ul>\n\u003cp>Codex는 \"네 효과를 동시에 켜고 만족도를 물으면 원인을 구분할 수 없다\"고 했다. 맞다. 하지만 이 단계는 만족도를 묻지 않는다. 축마다 플래그로 켜고 끄며 프레임·메모리·로딩·작업 시간을 따로 잰다. 이 설계이면 귀속 문제는 사라진다.\u003c/p>\n\u003ch3 id=\"23\">2.3 \"콘텐츠의 빈자리를 연출이 대신한다\"\u003c/h3>\n\u003cp>절반만 받아들인다. 실제 십상 사실 3개와 출처를 \u003cstrong>대본 수준으로\u003c/strong> 준비해 대역에 얹는 것은 싸고(Codex 추정 1–2인일) 자막·패널·표현 구분 시험에 실제 텍스트가 필요하므로 한다. 그러나 이것을 \"콘텐츠 경험 검증\"이라고 부르지 않는다. 대역에 \"기술 시험용 대역\" 표시를 항상 띄우고, 사실 텍스트는 표현 경로의 시험 데이터로 쓴다.\u003c/p>\n\u003ch3 id=\"24\">2.4 카메라 레일 \"필요성이 입증될 때만\"\u003c/h3>\n\u003cp>거부한다. 진입 연출은 사용자가 제시한 세 번째 예시이고, \u003ccode>RouteBenchmark\u003c/code>가 이미 있으므로 Codex 추정 3–5인일보다 싸다. 대신 Codex가 찾은 스트리밍 기준(발 vs 카메라) 문제와 상태 소유권을 \u003cstrong>이 축의 통과 기준\u003c/strong>으로 삼는다. 레일은 짧게 하나, 건너뛰기 가능, 자막 포함.\u003c/p>\n\u003ch2 id=\"3\">3. 수정된 네 축\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>축\u003c/th>\n\u003cth>1차 범위 (이번)\u003c/th>\n\u003cth>보류 (다음 회차)\u003c/th>\n\u003cth>통과 기준\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>듣기\u003c/td>\n\u003ctd>위치 기반 환경음 2–3개 + 선택 재생 내레이션 1개 + 동일 자막. 패널 유지\u003c/td>\n\u003ctd>공간 음향 정밀 감쇠, 다중 음원 믹스\u003c/td>\n\u003ctd>음소거 상태에서 동일 정보 접근. 음원 실패 시 자막만으로 진행. 모바일 자동재생 정책 통과\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>연출\u003c/td>\n\u003ctd>진입 트리거 → 짧은 레일 1개 → 자막 → 복귀. 건너뛰기 가능\u003c/td>\n\u003ctd>다중 컷, 분기\u003c/td>\n\u003ctd>실패 주입 6종 모두 잠금 잔류 0. 재생 중 필요한 구역이 준비됨\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>하늘\u003c/td>\n\u003ctd>하늘 스플랫 제거 + 스카이박스 1종\u003c/td>\n\u003ctd>안개, 강수, 주야간\u003c/td>\n\u003ctd>고정 경로 캡처에서 경계 결함 허용치 내. 프레임 p95 증가량 기록\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>인물\u003c/td>\n\u003ctd>잔상 인물 1–2구, 고정 또는 고정 왕복\u003c/td>\n\u003ctd>동행, 길 찾기, 대화\u003c/td>\n\u003ctd>바닥 추종, 시대 전환 복구, 조명 이질감 캡처 비교. 인물 표현에 \"상징 표현\" 표지\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>공통: 축마다 on/off 플래그. 기준 실행(모두 off) 대비 프레임 간격·JS heap·로딩 시간·전송량을 데스크톱과 iPhone에서 기록. 작업 시간은 공통 구현과 장면별 배치로 나눠 기록.\u003c/p>\n\u003ch2 id=\"4\">4. 중단 기준 (축별)\u003c/h2>\n\u003cul>\n\u003cli>어느 축이든 iPhone에서 기준 실행 대비 프레임 p95가 기록된 한도를 넘거나 장면이 열리지 않으면 그 축은 보류하고 다른 축을 계속한다.\u003c/li>\n\u003cli>연출 축의 실패 주입에서 잠금 잔류나 중복 재생이 해결되지 않으면 레일을 빼고 트리거+자막만 남긴다.\u003c/li>\n\u003cli>두 번째 장면 이전에서 콘텐츠별 앱 코드 수정이 필요하면 \"선언형\" 주장을 철회하고 수정 범위를 기록한다.\u003c/li>\n\u003cli>네 축 중 두 개 이상이 보류되면 실제 성지 촬영 계획에 그 제약을 먼저 반영하고 다음 회차를 설계한다.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"5\">5. 대역 공간\u003c/h2>\n\u003cp>Codex의 \"어떤 판단을 대역에서 할 수 있는지 먼저 정하라\"를 받아들인다. 이번 대역에서 하는 판단은 위 네 축의 기술 통과 여부와 비용뿐이다. 장소감·분위기는 판단하지 않는다.\u003c/p>\n\u003cul>\n\u003cli>1차: \u003ccode>sunnyvale-era\u003c/code> 변형, 자산 해시 고정. 하늘 축을 위해 \u003cstrong>Sunnyvale SOG에 하늘 스플랫이 실제로 포함되는지 먼저 확인\u003c/strong>한다. 이것은 추정이 아니라 자산을 열어 보면 확정되는 사실이다.\u003c/li>\n\u003cli>하늘이 없거나 제거 경계 시험이 불가능하면 그 축에 한해 공개 실외 장면을 찾는다. 후보 조사 상한 0.5–1인일, 정합·충돌·기준 시험 3–6인일은 Codex 추정을 그대로 받는다. 상한 안에 없으면 하늘 축을 보류한다.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"6-codex\">6. Codex에 되묻는 질문\u003c/h2>\n\u003col>\n\u003cli>대역에서 학습 효과를 잴 수 없다는 질문 2의 입장과 초심자 A/B를 요구하는 질문 5의 입장은 어떻게 양립하는가.\u003c/li>\n\u003cli>플래그로 축을 분리 측정하면 \"동시에 켜서 원인을 구분 못 한다\"는 반박은 유지되는가.\u003c/li>\n\u003cli>하늘 축을 \"하늘 교체 1종\"으로 줄인 범위에서도 제외를 유지하는가. 유지한다면 실제 촬영 범위(하늘 포함 여부)를 어떻게 정하는가.\u003c/li>\n\u003cli>수정된 네 축의 총 작업량 추정을 Codex 기준으로 다시 내 달라. 비교 기준은 Codex 4절의 12–19인일이다.\u003c/li>\n\u003cli>수정안에서 여전히 측정 불가능하거나 반증 불가능한 기준이 남아 있는가.\u003c/li>\n\u003c/ol>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
