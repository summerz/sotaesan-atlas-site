%;height:auto}.table-scroll{overflow-x:auto}footer{max-width:1120px;margin:auto;border-top:1px solid var(--line);padding:24px;font-size:14px;color:var(--muted)}.intro{max-width:750px;font-size:21px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:32px 0}.button{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);text-decoration:none;border-radius:4px;padding:11px 22px;font-weight:600}.button.secondary{background:transparent;color:var(--green)}.summary{border-left:4px solid var(--green);padding:4px 24px;margin:38px 0;font-size:19px}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.resource{border:1px solid var(--line);padding:22px}.resource h3{margin:0 0 10px}.resource p{font-size:16px;margin:0;color:var(--muted)}.local-file{color:var(--muted)}.meta{color:var(--muted);font-size:14px}.toc{border:1px solid var(--line);padding:16px 24px;margin:28px 0;font-size:15px}.toc>ul{margin:0}.toc li{margin:4px 0}li{margin:8px 0}.downloads{margin:0 0 30px}.measurements ul{padding-left:24px}@media(max-width:650px){body{font-size:16px}main{padding:30px 18px 50px}h1{font-size:29px}h2{font-size:23px}.intro{font-size:19px}.resources{grid-template-columns:1fr}header{padding:16px 18px}table{min-width:680px}.actions{gap:10px}.button{padding:9px 16px}}@media print{header,footer,.downloads{display:none}main{max-width:none;padding:0}body{font-size:11pt}h1{font-size:24pt}h2{font-size:18pt}table{font-size:9pt}.table-scroll{overflow:visible}a{color:inherit}}\n\n:focus-visible{outline:3px solid var(--green);outline-offset:5px}.trial-steps{padding-left:26px;max-width:780px}.trial-steps li{padding-left:8px;margin:18px 0}.trial-steps strong{display:block}.controls{display:grid;grid-template-columns:160px 1fr;gap:10px 24px;max-width:780px}.controls dt{font-weight:600}.controls dd{margin:0}.archive{margin-top:52px;border-top:1px solid var(--line);padding-top:24px}.archive>summary{cursor:pointer;font-size:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"01_tech_spike_playcanvas.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"a-playcanvas-engine\">십상 디지털 공간 프로젝트 — 기술 스파이크 A: PlayCanvas Engine\u003c/h1>\n\u003cul>\n\u003cli>문서 상태: Draft v0.1\u003c/li>\n\u003cli>작성일: 2026-09-28\u003c/li>\n\u003cli>목적: Gaussian Splat 기반 웹 공간의 기술 가능성 검증\u003c/li>\n\u003cli>비교 대상: \u003ccode>기술 스파이크 B — Three.js\u003c/code>\u003c/li>\n\u003cli>원칙: 실제 성지 촬영/3DGS 생성은 본 스파이크의 테스트 범위에서 제외하되, 실제 프로젝트의 제작 파이프라인에는 포함한다.\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2 id=\"1\">1. 스파이크의 목적\u003c/h2>\n\u003cp>이 스파이크는 원불교 대종사 십상 및 관련 성지를 디지털 공간에서 경험하게 하는 서비스의 \u003cstrong>런타임 기술 가능성\u003c/strong>을 검증한다.\u003c/p>\n\u003cp>현 단계에서 검증하려는 것은 다음과 같다.\u003c/p>\n\u003col>\n\u003cli>기존 Gaussian Splat 파일을 웹에서 안정적으로 표시할 수 있는가.\u003c/li>\n\u003cli>Splat과 GLB 메시를 하나의 가상 공간에 함께 배치할 수 있는가.\u003c/li>\n\u003cli>사용자가 공간을 걷거나 둘러볼 수 있는가.\u003c/li>\n\u003cli>보이지 않는 Collision Mesh를 이용해 바닥·벽 등의 이동 제약을 구현할 수 있는가.\u003c/li>\n\u003cli>특정 위치에 역사·교법·성지 정보 등을 담는 Hotspot을 배치할 수 있는가.\u003c/li>\n\u003cli>데스크톱과 모바일 브라우저에서 서비스 가능한 성능이 나오는가.\u003c/li>\n\u003cli>PlayCanvas의 클라우드 호스팅에 의존하지 않고 독자 호스팅할 수 있는가.\u003c/li>\n\u003cli>장기적으로 엔진을 교체해도 핵심 자산과 월드 데이터가 남도록 구성할 수 있는가.\u003c/li>\n\u003c/ol>\n\u003cp>본 스파이크의 핵심 질문은 \"PlayCanvas가 좋은 엔진인가?\"가 아니라 다음이다.\u003c/p>\n\u003cblockquote>\n\u003cp>Gaussian Splat을 실제 공간의 시각 레이어로 사용하고, 그 위에 GLB·Collision·Hotspot 등의 논리 레이어를 결합한 웹 공간을 현실적인 개발 비용으로 만들 수 있는가?\u003c/p>\n\u003c/blockquote>\n\u003chr />\n\u003ch2 id=\"2\">2. 의도적으로 제외하는 범위\u003c/h2>\n\u003ch3 id=\"_1\">기술 스파이크에서 제외\u003c/h3>\n\u003cul>\n\u003cli>현장 촬영\u003c/li>\n\u003cli>영상 프레임 추출\u003c/li>\n\u003cli>카메라 Pose 추정\u003c/li>\n\u003cli>COLMAP / SfM 처리\u003c/li>\n\u003cli>3D Gaussian Splat 학습\u003c/li>\n\u003cli>실제 성지의 정밀 3D 복원\u003c/li>\n\u003cli>로그인/회원\u003c/li>\n\u003cli>데이터베이스\u003c/li>\n\u003cli>CMS\u003c/li>\n\u003cli>멀티유저\u003c/li>\n\u003cli>음성 대화\u003c/li>\n\u003cli>아바타\u003c/li>\n\u003cli>WebXR/VR의 본격 구현\u003c/li>\n\u003cli>운영용 월드 에디터 개발\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"_2\">실제 프로젝트에서는 필요\u003c/h3>\n\u003cp>실제 성지를 제작할 때에는 별도의 제작 파이프라인이 필요하다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">현장 촬영\n  ↓\n촬영 데이터 정리\n  ↓\n카메라 Pose / SfM\n  ↓\n3D Gaussian Splat 생성\n  ↓\nSplat 정리·편집\n  ↓\n웹용 압축/LOD 변환\n  ↓\n서비스 월드에 배치\n\u003c/code>\u003c/pre>\n\u003cp>촬영과 3DGS 생성은 웹 서비스 런타임 개발과 성격이 다르므로, 실제 프로젝트에서는 별도 담당자 또는 별도 제작 워크플로로 분리하는 것을 기본 전제로 한다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"3\">3. 테스트 자산 원칙\u003c/h2>\n\u003cp>기술 검증을 위해 성지를 직접 촬영할 필요는 없다.\u003c/p>\n\u003ch3 id=\"splat\">Splat\u003c/h3>\n\u003cul>\n\u003cli>PlayCanvas/SuperSplat 또는 다른 프로젝트가 테스트용으로 공개한 샘플 사용\u003c/li>\n\u003cli>또는 라이선스가 명확한 PLY/SPZ/SOG 샘플 사용\u003c/li>\n\u003cli>가능하면 실내가 아닌 \u003cstrong>지형·건물·외부 공간이 포함된 장면\u003c/strong>을 우선 선택\u003c/li>\n\u003cli>원본/라이선스 정보를 \u003ccode>assets/README.md\u003c/code>에 기록\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"glb\">GLB\u003c/h3>\n\u003cp>Splat 위에 합성할 테스트용 GLB 1~3개를 준비한다.\u003c/p>\n\u003cp>예:\u003c/p>\n\u003cul>\n\u003cli>작은 건물\u003c/li>\n\u003cli>담장 또는 구조물\u003c/li>\n\u003cli>안내 오브젝트\u003c/li>\n\u003c/ul>\n\u003cp>GLB는 역사 복원 모델일 필요가 없다. 이번 단계에서는 \u003cstrong>Splat과 Mesh의 좌표 정합·depth·조명 차이·성능\u003c/strong>을 검증하는 것이 목적이다.\u003c/p>\n\u003ch3 id=\"_3\">동일 자산 원칙\u003c/h3>\n\u003cp>가능하면 Three.js 스파이크에서도 동일한 Splat과 동일한 GLB를 사용한다. 엔진별 결과를 비교하려면 입력 조건이 같아야 한다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"4\">4. 권장 기술 구성\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">TypeScript\nVite\nPlayCanvas Engine\nPlayCanvas GSplat\nSplatTransform\nSuperSplat (필요 시 Splat 편집/변환)\nGLB / glTF\nworld.json\n정적 웹 호스팅\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"playcanvas-editor\">PlayCanvas Editor 사용\u003c/h3>\n\u003cp>스파이크에서는 PlayCanvas Editor를 \u003cstrong>선택적으로 적극 활용\u003c/strong>한다.\u003c/p>\n\u003cp>Editor를 이용해 다음 작업을 빠르게 검증할 수 있다.\u003c/p>\n\u003cul>\n\u003cli>Splat 배치\u003c/li>\n\u003cli>GLB 배치\u003c/li>\n\u003cli>Camera\u003c/li>\n\u003cli>Collision\u003c/li>\n\u003cli>Light\u003c/li>\n\u003cli>Audio\u003c/li>\n\u003cli>Hotspot 역할을 하는 Entity\u003c/li>\n\u003cli>Script 부착\u003c/li>\n\u003cli>좌표·회전·Scale 조정\u003c/li>\n\u003c/ul>\n\u003cp>단, Editor 내부 Scene 데이터만을 프로젝트의 원본 데이터로 삼지 않는다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"5\">5. 자산 저장 원칙\u003c/h2>\n\u003cp>장기적인 플랫폼 종속 방지를 위해 원본과 런타임 파일을 분리한다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">/assets\n  /source\n    sample-master.ply\n    sample-glb-source/\n  /runtime\n    scene.sog\n    scene.spz\n    historical-object.glb\n    collision.glb\n\n/world\n  world.json\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"canonical-asset\">Canonical Asset 권장\u003c/h3>\n\u003cul>\n\u003cli>Gaussian Splat 원본/교환: \u003ccode>PLY\u003c/code>\u003c/li>\n\u003cli>웹 런타임: \u003ccode>SOG\u003c/code>, 필요 시 \u003ccode>Streamed SOG\u003c/code> 또는 \u003ccode>SPZ\u003c/code>\u003c/li>\n\u003cli>Mesh: \u003ccode>GLB\u003c/code>\u003c/li>\n\u003cli>월드 구조: 자체 정의 \u003ccode>world.json\u003c/code>\u003c/li>\n\u003cli>이미지: WebP/JPEG/PNG\u003c/li>\n\u003cli>음성: AAC/MP3/Opus 등 서비스 정책에 맞게 선택\u003c/li>\n\u003c/ul>\n\u003cp>PlayCanvas 전용 포맷만을 유일한 원본으로 보존하지 않는다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"6-worldjson\">6. 최소 world.json 초안\u003c/h2>\n\u003cp>엔진을 교체할 가능성을 고려해 월드의 핵심 정보는 자체 포맷으로 관리한다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{\n  &quot;schemaVersion&quot;: 1,\n  &quot;id&quot;: &quot;spike-sample-world&quot;,\n  &quot;title&quot;: &quot;Gaussian Splat Technical Spike&quot;,\n  &quot;objects&quot;: [\n    {\n      &quot;id&quot;: &quot;present-world&quot;,\n      &quot;type&quot;: &quot;splat&quot;,\n      &quot;src&quot;: &quot;/assets/runtime/scene.sog&quot;,\n      &quot;position&quot;: [0, 0, 0],\n      &quot;rotation&quot;: [0, 0, 0],\n      &quot;scale&quot;: [1, 1, 1]\n    },\n    {\n      &quot;id&quot;: &quot;historical-object&quot;,\n      &quot;type&quot;: &quot;gltf&quot;,\n      &quot;src&quot;: &quot;/assets/runtime/historical-object.glb&quot;,\n      &quot;position&quot;: [5, 0, -4],\n      &quot;rotation&quot;: [0, 0, 0],\n      &quot;scale&quot;: [1, 1, 1]\n    },\n    {\n      &quot;id&quot;: &quot;info-01&quot;,\n      &quot;type&quot;: &quot;hotspot&quot;,\n      &quot;position&quot;: [2, 1.5, -2],\n      &quot;contentId&quot;: &quot;sample-info&quot;\n    }\n  ],\n  &quot;spawn&quot;: {\n    &quot;position&quot;: [0, 1.7, 3],\n    &quot;rotation&quot;: [0, 180, 0]\n  }\n}\n\u003c/code>\u003c/pre>\n\u003cp>PlayCanvas Scene을 이 데이터로 생성하는 adapter를 두는 것이 이상적이다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">world.json\n   ↓\nPlayCanvas World Adapter\n   ↓\nPlayCanvas Scene\n\u003c/code>\u003c/pre>\n\u003chr />\n\u003ch2 id=\"7\">7. 구현 단계\u003c/h2>\n\u003ch3 id=\"spike-a-1-splat\">Spike A-1 — Splat 표시\u003c/h3>\n\u003cp>목표:\u003c/p>\n\u003cul>\n\u003cli>브라우저에서 Splat 로딩\u003c/li>\n\u003cli>Orbit camera 또는 자유 카메라\u003c/li>\n\u003cli>FPS 표시\u003c/li>\n\u003cli>로딩 상태 표시\u003c/li>\n\u003cli>resize 대응\u003c/li>\n\u003c/ul>\n\u003cp>완료 조건:\u003c/p>\n\u003cul>\n\u003cli>데스크톱 브라우저에서 정상 표시\u003c/li>\n\u003cli>iPhone/Android에서도 장면이 표시됨\u003c/li>\n\u003cli>콘솔에 치명적 오류 없음\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch3 id=\"spike-a-2-splat-glb\">Spike A-2 — Splat + GLB 혼합\u003c/h3>\n\u003cp>목표:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">PlayCanvas Scene\n├─ Gaussian Splat\n└─ GLB Mesh\n\u003c/code>\u003c/pre>\n\u003cp>검증:\u003c/p>\n\u003cul>\n\u003cli>동일 카메라/좌표계에서 정상 렌더링\u003c/li>\n\u003cli>Mesh가 Splat 앞뒤에 있을 때 depth 관계\u003c/li>\n\u003cli>GLB의 PBR 재질과 Splat의 촬영 조명 간 이질감\u003c/li>\n\u003cli>GLB 위치/회전/scale 조정 난이도\u003c/li>\n\u003cli>2~3개의 GLB를 추가했을 때 성능 변화\u003c/li>\n\u003c/ul>\n\u003cp>완료 조건:\u003c/p>\n\u003cul>\n\u003cli>Splat과 GLB가 한 Scene에서 자연스럽게 표시\u003c/li>\n\u003cli>좌표를 수치로 저장하고 재로드 가능\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch3 id=\"spike-a-3-1\">Spike A-3 — 1인칭 공간 이동\u003c/h3>\n\u003cp>목표:\u003c/p>\n\u003cul>\n\u003cli>WASD\u003c/li>\n\u003cli>마우스 look\u003c/li>\n\u003cli>모바일 touch\u003c/li>\n\u003cli>기본 gravity\u003c/li>\n\u003cli>spawn point\u003c/li>\n\u003c/ul>\n\u003cp>이 단계에서는 완전한 게임 캐릭터 컨트롤러보다 \u003cstrong>공간 체험에 필요한 최소 이동감\u003c/strong>을 검증한다.\u003c/p>\n\u003chr />\n\u003ch3 id=\"spike-a-4-collision\">Spike A-4 — Collision\u003c/h3>\n\u003cp>Splat 자체를 물리 Geometry로 취급하지 않는다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">보이는 세계\n├─ Gaussian Splat\n└─ GLB\n\n보이지 않는 세계\n└─ collision.glb\n\u003c/code>\u003c/pre>\n\u003cp>검증:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>splat-transform\u003c/code> 등으로 생성한 collision mesh 사용 가능성\u003c/li>\n\u003cli>바닥 판정\u003c/li>\n\u003cli>벽 통과 방지\u003c/li>\n\u003cli>계단/경사면의 체감\u003c/li>\n\u003cli>Collision Mesh 단순화 수준에 따른 성능\u003c/li>\n\u003c/ul>\n\u003cp>완료 조건:\u003c/p>\n\u003cul>\n\u003cli>사용자가 바닥에서 안정적으로 이동\u003c/li>\n\u003cli>테스트 영역의 주요 벽을 통과하지 않음\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch3 id=\"spike-a-5-hotspot\">Spike A-5 — Hotspot\u003c/h3>\n\u003cp>최소 기능:\u003c/p>\n\u003cul>\n\u003cli>특정 위치 또는 특정 Object와 연결\u003c/li>\n\u003cli>접근 거리 기반 활성화\u003c/li>\n\u003cli>클릭/탭\u003c/li>\n\u003cli>제목\u003c/li>\n\u003cli>짧은 설명\u003c/li>\n\u003cli>이미지 1개\u003c/li>\n\u003cli>닫기\u003c/li>\n\u003c/ul>\n\u003cp>예:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">사용자\n  ↓ 2m 이내 접근\nHotspot 활성화\n  ↓\n&quot;이 장소에 대한 설명 보기&quot;\n\u003c/code>\u003c/pre>\n\u003cp>Hotspot 콘텐츠와 3D 좌표는 별도 데이터로 저장한다.\u003c/p>\n\u003chr />\n\u003ch3 id=\"spike-a-6\">Spike A-6 — 현재/과거 레이어 개념 테스트\u003c/h3>\n\u003cp>실제 역사 복원은 하지 않는다.\u003c/p>\n\u003cp>테스트 GLB를 이용해 다음 개념만 확인한다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">CURRENT\nSplat 100%\nGLB hidden\n\nHISTORICAL\n특정 현재 영역 숨김 또는 별도 편집 Splat\nGLB visible\n\u003c/code>\u003c/pre>\n\u003cp>첫 스파이크에서는 런타임 Splat 마스킹보다 다음 방식을 우선한다.\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>current.sog\u003c/code>\u003c/li>\n\u003cli>\u003ccode>historical-base.sog\u003c/code> — 특정 구조물을 미리 제거한 버전\u003c/li>\n\u003cli>\u003ccode>historical-object.glb\u003c/code>\u003c/li>\n\u003c/ul>\n\u003cp>목표는 \u003cstrong>한 공간에서 현재 Splat과 과거 Mesh 레이어를 전환할 수 있는가\u003c/strong>의 확인이다.\u003c/p>\n\u003chr />\n\u003ch3 id=\"spike-a-7\">Spike A-7 — 독자 호스팅\u003c/h3>\n\u003cp>PlayCanvas Hosting을 사용하지 않는 배포를 반드시 한 번 수행한다.\u003c/p>\n\u003cp>예:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">Vite build / PlayCanvas export\n        ↓\nCloudflare Pages / GitHub Pages / Nginx\n        ↓\nSplat·GLB는 CDN/Object Storage\n\u003c/code>\u003c/pre>\n\u003cp>검증:\u003c/p>\n\u003cul>\n\u003cli>PlayCanvas 서버 없이 실행\u003c/li>\n\u003cli>CORS\u003c/li>\n\u003cli>Range/캐시 정책\u003c/li>\n\u003cli>HTTPS\u003c/li>\n\u003cli>asset base URL 분리\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2 id=\"8-playcanvas-editor\">8. PlayCanvas Editor 검증 항목\u003c/h2>\n\u003cp>기술 스파이크에서는 Engine뿐 아니라 Editor가 실제 제작 비용을 얼마나 줄이는지도 측정한다.\u003c/p>\n\u003ch3 id=\"_4\">확인할 기능\u003c/h3>\n\u003cul>\n\u003cli>Scene hierarchy\u003c/li>\n\u003cli>Transform gizmo\u003c/li>\n\u003cli>Inspector\u003c/li>\n\u003cli>GLB import\u003c/li>\n\u003cli>GSplat 배치\u003c/li>\n\u003cli>Collision component\u003c/li>\n\u003cli>Camera\u003c/li>\n\u003cli>Audio\u003c/li>\n\u003cli>Script\u003c/li>\n\u003cli>Hotspot용 Entity\u003c/li>\n\u003cli>Preview/Launch\u003c/li>\n\u003cli>self-host build/export\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"_5\">중요한 질문\u003c/h3>\n\u003cblockquote>\n\u003cp>십상 프로젝트에서 실제 월드 제작자가 사용하는 기능은 PlayCanvas Editor 전체 기능 중 몇 %인가?\u003c/p>\n\u003c/blockquote>\n\u003cp>사용 기능을 기록해두면 향후 Three.js용 자체 World Composer를 만들지 판단할 때 매우 중요한 자료가 된다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"9\">9. 비교 측정 항목\u003c/h2>\n\u003cp>Three.js 스파이크와 동일한 양식으로 측정한다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth style=\"text-align: right;\">Desktop\u003c/th>\n\u003cth style=\"text-align: right;\">iPhone\u003c/th>\n\u003cth style=\"text-align: right;\">Android\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>최초 화면 표시 시간\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>전체 초기 다운로드\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>평균 FPS\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>최저 FPS\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GPU/메모리 이상 여부\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Splat+GLB depth\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1인칭 이동\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Collision 안정성\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hotspot UX\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>개발 난이도\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>추가 기록:\u003c/p>\n\u003cul>\n\u003cli>브라우저\u003c/li>\n\u003cli>OS\u003c/li>\n\u003cli>기기명\u003c/li>\n\u003cli>Splat Gaussian 수\u003c/li>\n\u003cli>런타임 파일 크기\u003c/li>\n\u003cli>GLB polygon 수\u003c/li>\n\u003cli>네트워크 상태\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2 id=\"10\">10. 성공 기준\u003c/h2>\n\u003cp>다음 조건을 대부분 충족하면 PlayCanvas Track은 \"계속 검토할 가치 있음\"으로 판단한다.\u003c/p>\n\u003col>\n\u003cli>Splat + GLB 혼합 렌더링 정상\u003c/li>\n\u003cli>모바일 포함 주요 브라우저 동작\u003c/li>\n\u003cli>1인칭 이동과 Collision 구현 가능\u003c/li>\n\u003cli>Hotspot과 일반 웹 UI 결합 가능\u003c/li>\n\u003cli>독자 호스팅 가능\u003c/li>\n\u003cli>asset/runtime 구조를 우리 저장소에서 관리 가능\u003c/li>\n\u003cli>Editor가 실제 제작 시간을 의미 있게 절약\u003c/li>\n\u003cli>PlayCanvas 서비스가 없어져도 원본 자산과 서비스 코드를 이전할 수 있는 구조 확보\u003c/li>\n\u003c/ol>\n\u003chr />\n\u003ch2 id=\"11\">11. 예상 위험\u003c/h2>\n\u003ch3 id=\"editor\">Editor 종속\u003c/h3>\n\u003cp>PlayCanvas Editor는 제작 효율이 높지만, 제작 워크플로가 클라우드 서비스에 의존할 수 있다.\u003c/p>\n\u003cp>대응:\u003c/p>\n\u003cul>\n\u003cli>PLY/GLB/world.json 별도 보관\u003c/li>\n\u003cli>PlayCanvas Scene을 유일한 원본으로 취급하지 않음\u003c/li>\n\u003cli>필요한 Editor 기능을 목록화\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"sog\">SOG 종속\u003c/h3>\n\u003cp>SOG는 웹 런타임에 유리하지만 canonical source로 사용하지 않는다.\u003c/p>\n\u003cp>대응:\u003c/p>\n\u003cul>\n\u003cli>PLY master 보존\u003c/li>\n\u003cli>필요 시 SPZ/GLB/다른 런타임 형식 재생성\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"splat-glb\">Splat과 GLB의 시각적 이질감\u003c/h3>\n\u003cp>Splat에는 촬영 당시 조명이 baked 되어 있고 GLB는 실시간 조명을 사용한다.\u003c/p>\n\u003cp>대응:\u003c/p>\n\u003cul>\n\u003cli>GLB 조명/톤/재질 조절\u003c/li>\n\u003cli>필요 시 baked lighting 또는 stylized treatment 테스트\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"_6\">큰 공간\u003c/h3>\n\u003cp>성지 규모가 커질 경우 단일 Splat은 모바일에서 부담이 될 수 있다.\u003c/p>\n\u003cp>대응:\u003c/p>\n\u003cul>\n\u003cli>SOG\u003c/li>\n\u003cli>Streamed SOG\u003c/li>\n\u003cli>LOD\u003c/li>\n\u003cli>공간 분할\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2 id=\"12\">12. 실제 프로젝트 단계에서 추가될 제작 파이프라인\u003c/h2>\n\u003cp>기술 스파이크가 성공한 뒤 실제 성지를 대상으로 할 때 추가한다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">촬영 계획\n↓\n현장 촬영\n↓\n프레임/카메라 Pose\n↓\n3DGS 생성\n↓\nSuperSplat 등에서 cleanup\n↓\nPLY master 보존\n↓\nSOG/Streamed SOG 변환\n↓\nCollision 생성/수정\n↓\n월드에 배치\n\u003c/code>\u003c/pre>\n\u003cp>이 과정은 웹 런타임 개발과 분리해서 관리한다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"13\">13. 스파이크 결과물\u003c/h2>\n\u003cp>최종적으로 다음 파일을 남긴다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">/playcanvas-spike\n  /src\n  /public/assets\n  /world/world.json\n  README.md\n  PERFORMANCE.md\n  ASSET-LICENSES.md\n\u003c/code>\u003c/pre>\n\u003cp>그리고 브라우저에서 볼 수 있는 독자 호스팅 URL 1개.\u003c/p>\n\u003chr />\n\u003ch2 id=\"14\">14. 판단 시점\u003c/h2>\n\u003cp>PlayCanvas 스파이크 후 다음 중 하나로 판단한다.\u003c/p>\n\u003ch3 id=\"continue\">Continue\u003c/h3>\n\u003cul>\n\u003cli>Splat/GLB/모바일 성능 만족\u003c/li>\n\u003cli>Editor가 제작 효율을 크게 높임\u003c/li>\n\u003cli>독자 호스팅 및 자체 데이터 관리에 문제 없음\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"compare\">Compare\u003c/h3>\n\u003cul>\n\u003cli>기능은 만족하지만 Editor/Scene 종속 우려\u003c/li>\n\u003cli>커스텀 UI와 월드 구조가 복잡해질 가능성\u003c/li>\n\u003cli>Three.js에서 더 단순하게 구현될 가능성\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"stop\">Stop\u003c/h3>\n\u003cul>\n\u003cli>모바일 성능 부적합\u003c/li>\n\u003cli>Splat+Mesh 혼합 품질 문제\u003c/li>\n\u003cli>프로젝트에 필요한 커스터마이징이 과도하게 어려움\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2 id=\"15\">15. 참고 자료\u003c/h2>\n\u003cp>공식 자료 중심.\u003c/p>\n\u003cul>\n\u003cli>PlayCanvas Engine: https://github.com/playcanvas/engine\u003c/li>\n\u003cli>PlayCanvas Engine manual: https://developer.playcanvas.com/user-manual/engine/\u003c/li>\n\u003cli>Gaussian Splat formats: https://developer.playcanvas.com/user-manual/gaussian-splatting/formats/\u003c/li>\n\u003cli>Streamed SOG: https://developer.playcanvas.com/user-manual/gaussian-splatting/formats/streamed-sog/\u003c/li>\n\u003cli>SplatTransform Collision: https://developer.playcanvas.com/user-manual/splat-transform/collision/\u003c/li>\n\u003cli>SuperSplat: https://developer.playcanvas.com/user-manual/gaussian-splatting/editing/supersplat/\u003c/li>\n\u003cli>Self-hosting: https://developer.playcanvas.com/user-manual/editor/publishing/web/self-hosting/\u003c/li>\n\u003c/ul>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
