gin:0}.archive{margin-top:52px;border-top:1px solid var(--line);padding-top:24px}.archive>summary{cursor:pointer;font-size:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"03_service_mvp_and_roadmap.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"mvp\">십상 디지털 공간 프로젝트 — 서비스 MVP와 발전 방향\u003c/h1>\n\u003cul>\n\u003cli>문서 상태: Concept / Roadmap v0.1\u003c/li>\n\u003cli>작성일: 2026-09-28\u003c/li>\n\u003cli>대상: 원불교 대종사 십상과 관련 성지를 디지털 공간에서 경험하게 하는 서비스\u003c/li>\n\u003cli>주의: 현재 단계에서는 서비스의 최종 성격을 하나로 고정하지 않는다.\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2 id=\"1\">1. 프로젝트의 출발점\u003c/h2>\n\u003cp>이 프로젝트는 원불교 대종사 십상과 관련 성지를 디지털 환경에서 경험할 수 있도록 하는 것을 출발점으로 한다.\u003c/p>\n\u003cp>다만 같은 기술과 콘텐츠를 사용하더라도 \u003cstrong>어디에 강조점을 두느냐에 따라 프로젝트의 성격은 크게 달라질 수 있다.\u003c/strong>\u003c/p>\n\u003cp>예:\u003c/p>\n\u003cul>\n\u003cli>디지털 성지순례\u003c/li>\n\u003cli>몰입형 역사 체험\u003c/li>\n\u003cli>원불교 교육 서비스\u003c/li>\n\u003cli>디지털 아카이브\u003c/li>\n\u003cli>성지 해설 서비스\u003c/li>\n\u003cli>온라인 공동체 공간\u003c/li>\n\u003cli>수행·명상 공간\u003c/li>\n\u003cli>문화유산/종교문화 체험\u003c/li>\n\u003cli>역사적 공간 복원\u003c/li>\n\u003c/ul>\n\u003cp>현재는 이 중 하나를 성급하게 확정하지 않는다.\u003c/p>\n\u003cp>첫 기술 테스트와 한 장소의 Pilot을 통해 어떤 경험이 실제로 가치가 있는지 확인한 뒤 프로젝트의 중심 성격을 결정한다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"2\">2. 현재 프로젝트 가설\u003c/h2>\n\u003cp>기술과 콘텐츠를 다음처럼 세 레이어로 구분한다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">역사·교법·기록\n       │\n       ▼\nSemantic / Content Layer\n\n현재 실제 성지\n       │\n       ▼\nSpatial / Reality Layer\n\n사용자의 이동·탐색·대화\n       │\n       ▼\nExperience Layer\n\u003c/code>\u003c/pre>\n\u003cp>Gaussian Splat은 \u003cstrong>Spatial Layer를 효율적으로 확보하는 방법 중 하나\u003c/strong>이다.\u003c/p>\n\u003cp>따라서 프로젝트를 \"Gaussian Splat 서비스\"로 정의하지 않는다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"3\">3. 핵심 표현 방식\u003c/h2>\n\u003ch3 id=\"_1\">현재 존재하는 공간\u003c/h3>\n\u003cp>현존 성지는 실제 촬영을 통해 Gaussian Splat으로 기록하는 방식을 우선 검토한다.\u003c/p>\n\u003cp>장점:\u003c/p>\n\u003cul>\n\u003cli>사실적인 공간감\u003c/li>\n\u003cli>모든 건축/지형을 Blender에서 재제작할 필요 감소\u003c/li>\n\u003cli>비교적 빠른 현장 기록\u003c/li>\n\u003cli>실제 성지의 현재 모습을 보존하는 아카이브 역할 가능\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"_2\">과거에 존재했지만 현재는 사라진 요소\u003c/h3>\n\u003cp>다음 방식으로 별도 제작한다.\u003c/p>\n\u003cul>\n\u003cli>GLB / glTF\u003c/li>\n\u003cli>Blender 모델\u003c/li>\n\u003cli>역사 자료 기반 3D reconstruction\u003c/li>\n\u003cli>필요한 경우 제한적인 AI 보조 제작\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"scene\">하나의 Scene에서 결합\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">하나의 World\n\n├─ Current Reality\n│   └─ Gaussian Splat\n│\n├─ Historical Reconstruction\n│   └─ GLB\n│\n├─ Physics\n│   └─ Collision / Navmesh\n│\n└─ Meaning\n    ├─ Hotspot\n    ├─ Narrative\n    ├─ Source\n    └─ Interaction\n\u003c/code>\u003c/pre>\n\u003cp>이 구조를 기본 모델로 한다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"4\">4. 중요한 원칙: 사실과 재구성의 구분\u003c/h2>\n\u003cp>역사·종교 콘텐츠를 다룰 때 사실적 기록과 시각적 재구성을 구분한다.\u003c/p>\n\u003cp>예:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">A. 현존 상태를 직접 촬영\nB. 문헌/사진으로 형태가 확인되는 복원\nC. 일부 자료를 토대로 한 추정 복원\nD. 분위기 전달을 위한 상징적/연출적 표현\n\u003c/code>\u003c/pre>\n\u003cp>사용자에게 이 차이를 숨기지 않는다.\u003c/p>\n\u003cp>향후 콘텐츠 데이터는 다음과 같은 메타데이터를 가질 수 있다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{\n  &quot;representation&quot;: &quot;historical-reconstruction&quot;,\n  &quot;confidence&quot;: &quot;medium&quot;,\n  &quot;sources&quot;: [\n    &quot;source-001&quot;,\n    &quot;source-004&quot;\n  ]\n}\n\u003c/code>\u003c/pre>\n\u003cp>AI로 생성한 장면이 역사적 사실처럼 인식되는 것을 방지한다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"5\">5. 기술 테스트 단계\u003c/h2>\n\u003cp>현재 단계에서는 \u003cstrong>성지를 촬영하지 않는다.\u003c/strong>\u003c/p>\n\u003cp>기존에 사용할 수 있는 라이선스 명확한 Gaussian Splat 파일을 이용해 웹 런타임을 먼저 검증한다.\u003c/p>\n\u003cp>두 개의 Track을 병행 가능한 형태로 설계한다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">Track A\nPlayCanvas Engine\n\nTrack B\nThree.js + Spark\n\u003c/code>\u003c/pre>\n\u003cp>같은 Splat/GLB/Collision을 사용하여 비교한다.\u003c/p>\n\u003ch3 id=\"_3\">기술 스파이크 공통 범위\u003c/h3>\n\u003cul>\n\u003cli>Gaussian Splat 표시\u003c/li>\n\u003cli>GLB 동시 배치\u003c/li>\n\u003cli>1인칭 또는 공간 탐색\u003c/li>\n\u003cli>Collision\u003c/li>\n\u003cli>Hotspot\u003c/li>\n\u003cli>간단한 현재/과거 레이어 전환\u003c/li>\n\u003cli>Desktop\u003c/li>\n\u003cli>iPhone\u003c/li>\n\u003cli>Android\u003c/li>\n\u003cli>독자 호스팅\u003c/li>\n\u003cli>성능 측정\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"_4\">제외\u003c/h3>\n\u003cul>\n\u003cli>실제 현장 촬영\u003c/li>\n\u003cli>3DGS 학습\u003c/li>\n\u003cli>회원\u003c/li>\n\u003cli>멀티유저\u003c/li>\n\u003cli>음성\u003c/li>\n\u003cli>CMS\u003c/li>\n\u003cli>실제 역사 복원\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2 id=\"6-pilot-mvp\">6. Pilot MVP — 한 장소\u003c/h2>\n\u003cp>기술 테스트 후 첫 실제 MVP는 \u003cstrong>성지 한 장소\u003c/strong>만 대상으로 한다.\u003c/p>\n\u003cp>한 장소조차 충분한 난도가 있으므로, 십상 전체나 여러 성지를 동시에 진행하지 않는다.\u003c/p>\n\u003ch3 id=\"mvp_1\">MVP 목적\u003c/h3>\n\u003cblockquote>\n\u003cp>실제 성지 하나를 디지털 공간으로 만들었을 때, 사용자가 장소성을 느끼며 정보를 경험할 수 있는가?\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"mvp_2\">MVP 권장 기능\u003c/h3>\n\u003ch4 id=\"_5\">필수\u003c/h4>\n\u003cul>\n\u003cli>실제 장소 촬영\u003c/li>\n\u003cli>3DGS 생성\u003c/li>\n\u003cli>Splat cleanup\u003c/li>\n\u003cli>웹 로딩\u003c/li>\n\u003cli>데스크톱/모바일 이동\u003c/li>\n\u003cli>Collision\u003c/li>\n\u003cli>Spawn point\u003c/li>\n\u003cli>2~5개의 Hotspot\u003c/li>\n\u003cli>텍스트\u003c/li>\n\u003cli>이미지\u003c/li>\n\u003cli>간단한 음성 또는 내레이션\u003c/li>\n\u003cli>기본 콘텐츠 출처 표시\u003c/li>\n\u003cli>독자 호스팅\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"_6\">선택\u003c/h4>\n\u003cul>\n\u003cli>과거 GLB 요소 1개\u003c/li>\n\u003cli>현재/과거 비교\u003c/li>\n\u003cli>위치 기반 ambient audio\u003c/li>\n\u003cli>간단한 guided path\u003c/li>\n\u003c/ul>\n\u003ch4 id=\"_7\">제외 권장\u003c/h4>\n\u003cul>\n\u003cli>멀티유저\u003c/li>\n\u003cli>아바타\u003c/li>\n\u003cli>음성 채팅\u003c/li>\n\u003cli>로그인\u003c/li>\n\u003cli>게임화\u003c/li>\n\u003cli>복잡한 AI NPC\u003c/li>\n\u003cli>전체 십상\u003c/li>\n\u003cli>전체 성지 네트워크\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2 id=\"7-mvp\">7. MVP에서 확인할 사용자 경험\u003c/h2>\n\u003cp>기술 성공과 사용자 경험 성공을 구분한다.\u003c/p>\n\u003ch3 id=\"_8\">기술 질문\u003c/h3>\n\u003cul>\n\u003cli>잘 보이는가?\u003c/li>\n\u003cli>빠르게 로딩되는가?\u003c/li>\n\u003cli>모바일에서 움직이는가?\u003c/li>\n\u003cli>벽을 통과하지 않는가?\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"_9\">경험 질문\u003c/h3>\n\u003cul>\n\u003cli>단순한 3D 사진보다 \"장소\"처럼 느껴지는가?\u003c/li>\n\u003cli>실제 장소에 가보지 않은 사람에게 공간 관계를 전달하는가?\u003c/li>\n\u003cli>정보가 3D 경험을 방해하지 않는가?\u003c/li>\n\u003cli>공간 안에서 설명을 접하는 것이 일반 웹페이지/영상보다 가치가 있는가?\u003c/li>\n\u003cli>종교적·역사적 경험에 과도한 게임성이 없는가?\u003c/li>\n\u003cli>체험 후 사용자가 해당 장소와 십상을 더 잘 이해하는가?\u003c/li>\n\u003c/ul>\n\u003cp>두 번째 질문군이 최종 프로젝트의 성격을 결정한다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"8\">8. 향후 발전 단계\u003c/h2>\n\u003ch3 id=\"phase-0-technical-spike\">Phase 0 — Technical Spike\u003c/h3>\n\u003cp>기존 Splat으로 PlayCanvas / Three.js 검증.\u003c/p>\n\u003cp>결과:\u003c/p>\n\u003cul>\n\u003cli>엔진 후보\u003c/li>\n\u003cli>성능 수치\u003c/li>\n\u003cli>모바일 가능성\u003c/li>\n\u003cli>개발 복잡도\u003c/li>\n\u003cli>저작 방식 비교\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch3 id=\"phase-1-single-site-pilot\">Phase 1 — Single Site Pilot\u003c/h3>\n\u003cp>실제 성지 한 곳.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">촬영\n↓\n3DGS\n↓\n웹 공간\n↓\nHotspot\n↓\n콘텐츠\n\u003c/code>\u003c/pre>\n\u003cp>목적:\u003c/p>\n\u003cul>\n\u003cli>제작 전체 파이프라인 검증\u003c/li>\n\u003cli>한 장소의 실제 체험 가치 검증\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch3 id=\"phase-2-historical-hybrid\">Phase 2 — Historical Hybrid\u003c/h3>\n\u003cp>현재와 과거의 차이를 부분적으로 표현한다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">Current Splat\n   +\nHistorical GLB\n   +\nNarrative\n\u003c/code>\u003c/pre>\n\u003cp>기능:\u003c/p>\n\u003cul>\n\u003cli>역사적 구조물\u003c/li>\n\u003cli>시간 레이어\u003c/li>\n\u003cli>과거/현재 비교\u003c/li>\n\u003cli>자료 출처\u003c/li>\n\u003cli>복원 신뢰도\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch3 id=\"phase-3-guided-experience\">Phase 3 — Guided Experience\u003c/h3>\n\u003cp>하나의 장소를 단순 자유 탐색에서 \u003cstrong>의도된 경험\u003c/strong>으로 확장한다.\u003c/p>\n\u003cp>예:\u003c/p>\n\u003cul>\n\u003cli>십상 관련 순서\u003c/li>\n\u003cli>해설\u003c/li>\n\u003cli>질문\u003c/li>\n\u003cli>음성\u003c/li>\n\u003cli>주요 위치 안내\u003c/li>\n\u003cli>contemplative pause / 마음공부 요소\u003c/li>\n\u003c/ul>\n\u003cp>여기서 프로젝트의 성격을 더 분명하게 결정할 수 있다.\u003c/p>\n\u003chr />\n\u003ch3 id=\"phase-4-multi-user-guided-tour\">Phase 4 — Multi-user / Guided Tour\u003c/h3>\n\u003cp>멀티유저는 가치가 확인된 뒤 추가한다.\u003c/p>\n\u003cp>가능한 형태:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">교무/해설자\n     │\n     ├── 참가자 A\n     ├── 참가자 B\n     ├── 참가자 C\n     └── 참가자 D\n\u003c/code>\u003c/pre>\n\u003cp>기능:\u003c/p>\n\u003cul>\n\u003cli>같은 월드 입장\u003c/li>\n\u003cli>사용자 위치 공유\u003c/li>\n\u003cli>간단한 아바타\u003c/li>\n\u003cli>텍스트\u003c/li>\n\u003cli>음성\u003c/li>\n\u003cli>거리 기반 음향 또는 그룹 음향\u003c/li>\n\u003cli>안내자 follow\u003c/li>\n\u003cli>특정 장소 동시 이동\u003c/li>\n\u003c/ul>\n\u003cp>기술 후보:\u003c/p>\n\u003cul>\n\u003cli>Colyseus 또는 유사 authoritative state server\u003c/li>\n\u003cli>LiveKit 또는 유사 WebRTC SFU\u003c/li>\n\u003c/ul>\n\u003cp>이 단계의 목적은 \"메타버스 기능 추가\"가 아니라 \u003cstrong>공동 성지 체험 또는 온라인 해설의 가치가 있는가\u003c/strong>를 검증하는 것이다.\u003c/p>\n\u003chr />\n\u003ch3 id=\"phase-5-multiple-sites\">Phase 5 — Multiple Sites / 십상 네트워크\u003c/h3>\n\u003cp>한 장소의 제작 방식이 반복 가능하다고 확인되면 확장한다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">십상\n │\n ├─ 영산 관련 장소\n ├─ 변산 관련 장소\n └─ 익산 관련 장소\n\u003c/code>\u003c/pre>\n\u003cp>이 단계부터 다음 필요성이 커진다.\u003c/p>\n\u003cul>\n\u003cli>콘텐츠 CMS\u003c/li>\n\u003cli>Asset 관리\u003c/li>\n\u003cli>World Composer\u003c/li>\n\u003cli>검색\u003c/li>\n\u003cli>십상/인물/사건/장소 연결\u003c/li>\n\u003cli>다국어\u003c/li>\n\u003cli>운영 권한\u003c/li>\n\u003cli>통계/분석\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2 id=\"9-world-composer\">9. World Composer 발전 방향\u003c/h2>\n\u003cp>초기에는 범용 3D Editor를 만들지 않는다.\u003c/p>\n\u003ch3 id=\"level-0\">Level 0\u003c/h3>\n\u003cp>개발자가 \u003ccode>world.json\u003c/code> 직접 수정.\u003c/p>\n\u003ch3 id=\"level-1\">Level 1\u003c/h3>\n\u003cp>간단한 내부 도구.\u003c/p>\n\u003cul>\n\u003cli>Object 선택\u003c/li>\n\u003cli>Position\u003c/li>\n\u003cli>Rotation\u003c/li>\n\u003cli>Scale\u003c/li>\n\u003cli>Hotspot 추가\u003c/li>\n\u003cli>Save\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"level-2\">Level 2\u003c/h3>\n\u003cp>십상 프로젝트 전용 World Composer.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">Scene Tree\n3D View\nInspector\nAsset Browser\nHotspot\nAudio\nHistorical Layer\nSource Metadata\nPreview\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"level-3\">Level 3\u003c/h3>\n\u003cp>콘텐츠 운영도구 통합.\u003c/p>\n\u003cp>예:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">장소\n├ 3D Asset\n├ 역사\n├ 십상\n├ 관련 인물\n├ 관련 사건\n├ 법문\n├ 사진\n├ 출처\n└ 복원 신뢰도\n\u003c/code>\u003c/pre>\n\u003cp>PlayCanvas Editor 수준의 범용 기능을 목표로 하지 않는다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"10\">10. 데이터/플랫폼 독립 원칙\u003c/h2>\n\u003cp>프로젝트 장기 존속성을 위해 다음 원칙을 적용한다.\u003c/p>\n\u003cblockquote>\n\u003cp>Cloud service is optional. Canonical assets and world data are owned by the project.\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"_10\">보존할 핵심 자산\u003c/h3>\n\u003cul>\n\u003cli>촬영 원본\u003c/li>\n\u003cli>영상/사진\u003c/li>\n\u003cli>PLY master\u003c/li>\n\u003cli>GLB\u003c/li>\n\u003cli>collision mesh\u003c/li>\n\u003cli>원본 텍스처\u003c/li>\n\u003cli>음성/이미지\u003c/li>\n\u003cli>world.json\u003c/li>\n\u003cli>콘텐츠 데이터\u003c/li>\n\u003cli>출처 데이터\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"_11\">런타임 파일\u003c/h3>\n\u003cp>필요에 따라 재생성 가능한 것으로 취급.\u003c/p>\n\u003cul>\n\u003cli>SOG\u003c/li>\n\u003cli>Streamed SOG\u003c/li>\n\u003cli>SPZ\u003c/li>\n\u003cli>압축 Texture\u003c/li>\n\u003cli>CDN 최적화 파일\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"saas\">SaaS\u003c/h3>\n\u003cp>편의를 위해 사용할 수 있지만 필수 인프라로 만들지 않는다.\u003c/p>\n\u003cp>예:\u003c/p>\n\u003cul>\n\u003cli>PlayCanvas Editor\u003c/li>\n\u003cli>SuperSplat hosted functions\u003c/li>\n\u003cli>특정 AI 3D 서비스\u003c/li>\n\u003cli>상용 호스팅\u003c/li>\n\u003c/ul>\n\u003cp>서비스가 종료되어도 핵심 콘텐츠를 다른 기술로 이전할 수 있어야 한다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"11\">11. 예상 전체 기술 구조\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">                [Content / Historical Data]\n                          │\n                          ▼\n                       world.json\n                          │\n       ┌──────────────────┼──────────────────┐\n       │                  │                  │\n       ▼                  ▼                  ▼\nGaussian Splat           GLB             Hotspot\n현재 공간             과거/복원          정보/서사\n       │                  │                  │\n       └──────────────────┼──────────────────┘\n                          ▼\n                     Web Runtime\n                 PlayCanvas or Three.js\n                          │\n                ┌─────────┴─────────┐\n                ▼                   ▼\n              Solo              Multi-user\n                                  │\n                         State + Voice Server\n\u003c/code>\u003c/pre>\n\u003chr />\n\u003ch2 id=\"12\">12. 제작 파이프라인\u003c/h2>\n\u003ch3 id=\"_12\">실제 공간 제작\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">촬영 계획\n↓\n현장 촬영\n↓\n사진/영상 정리\n↓\n카메라 Pose\n↓\n3DGS\n↓\nSplat cleanup\n↓\nPLY master\n↓\nruntime 변환\n↓\nCollision\n↓\n배치\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"_13\">역사 재구성\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">문헌/사진/지도\n↓\n사료 검토\n↓\n복원 범위 결정\n↓\nBlender/3D\n↓\nGLB\n↓\n공간 배치\n↓\n출처/신뢰도 연결\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"_14\">콘텐츠\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">십상/성지 조사\n↓\n서사 구성\n↓\n텍스트/사진/음성\n↓\nHotspot\n↓\n경험 설계\n\u003c/code>\u003c/pre>\n\u003cp>세 제작 파이프라인은 서로 다른 전문성이 필요하다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"13\">13. 필요 역할\u003c/h2>\n\u003cp>프로젝트 규모에 따라 한 사람이 여러 역할을 겸할 수 있다.\u003c/p>\n\u003ch3 id=\"_15\">기술\u003c/h3>\n\u003cul>\n\u003cli>Web 3D 개발\u003c/li>\n\u003cli>Frontend/Web service\u003c/li>\n\u003cli>Backend/Infra\u003c/li>\n\u003cli>Multiplayer/RTC (후기 단계)\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"3d\">3D\u003c/h3>\n\u003cul>\n\u003cli>현장 촬영\u003c/li>\n\u003cli>Photogrammetry / 3DGS\u003c/li>\n\u003cli>Splat cleanup\u003c/li>\n\u003cli>Blender / historical modeling\u003c/li>\n\u003cli>optimization\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"_16\">콘텐츠\u003c/h3>\n\u003cul>\n\u003cli>원불교/십상 내용 검토\u003c/li>\n\u003cli>성지 조사\u003c/li>\n\u003cli>역사자료 조사\u003c/li>\n\u003cli>사료 검수\u003c/li>\n\u003cli>시나리오/해설\u003c/li>\n\u003cli>음성/미디어 제작\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"_17\">경험\u003c/h3>\n\u003cul>\n\u003cli>UX\u003c/li>\n\u003cli>공간 동선\u003c/li>\n\u003cli>교육/해설 설계\u003c/li>\n\u003cli>접근성\u003c/li>\n\u003cli>모바일 사용성\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2 id=\"14\">14. 프로젝트의 크리티컬 포인트\u003c/h2>\n\u003ch3 id=\"1-gaussian-splat\">1. Gaussian Splat 자체보다 월드화\u003c/h3>\n\u003cp>Splat은 사진처럼 보이는 공간을 제공하지만 다음을 자동으로 제공하지 않는다.\u003c/p>\n\u003cul>\n\u003cli>바닥\u003c/li>\n\u003cli>벽\u003c/li>\n\u003cli>충돌\u003c/li>\n\u003cli>문\u003c/li>\n\u003cli>길\u003c/li>\n\u003cli>의미\u003c/li>\n\u003cli>역사\u003c/li>\n\u003cli>상호작용\u003c/li>\n\u003c/ul>\n\u003cp>따라서 실제 월드는:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">Visual\n+\nPhysics\n+\nSemantic\n+\nContent\n\u003c/code>\u003c/pre>\n\u003cp>의 결합이다.\u003c/p>\n\u003ch3 id=\"2_1\">2. 모바일 성능\u003c/h3>\n\u003cp>실제 이용자 접근성을 생각하면 고성능 PC만을 기준으로 할 수 없다.\u003c/p>\n\u003cp>첫 Pilot부터 iPhone/Android를 테스트해야 한다.\u003c/p>\n\u003ch3 id=\"3_1\">3. 제작 반복성\u003c/h3>\n\u003cp>한 장소를 잘 만드는 것만으로는 충분하지 않다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">촬영 → Splat → 정리 → Collision → 콘텐츠 → Publish\n\u003c/code>\u003c/pre>\n\u003cp>과정이 다음 장소에서도 반복 가능해야 한다.\u003c/p>\n\u003ch3 id=\"4_1\">4. 역사적 정확성\u003c/h3>\n\u003cp>몰입도가 높아질수록 사용자는 시각적 표현을 사실로 받아들이기 쉽다.\u003c/p>\n\u003cp>따라서 출처와 재구성 수준을 관리한다.\u003c/p>\n\u003ch3 id=\"5_1\">5. 서비스 성격\u003c/h3>\n\u003cp>기술이 서비스 정체성을 결정하게 두지 않는다.\u003c/p>\n\u003cp>\"3D라서 무엇을 할 것인가\"가 아니라:\u003c/p>\n\u003cblockquote>\n\u003cp>사용자가 십상과 성지를 어떤 방식으로 경험하게 할 것인가?\u003c/p>\n\u003c/blockquote>\n\u003cp>를 중심에 둔다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"15\">15. 현재 의사결정 순서\u003c/h2>\n\u003cp>지금 결정할 필요가 없는 것:\u003c/p>\n\u003cul>\n\u003cli>전체 십상 UX\u003c/li>\n\u003cli>최종 메타버스 여부\u003c/li>\n\u003cli>전체 성지\u003c/li>\n\u003cli>멀티유저 규모\u003c/li>\n\u003cli>VR 중심 여부\u003c/li>\n\u003cli>자체 Editor 수준\u003c/li>\n\u003c/ul>\n\u003cp>지금 결정하고 검증할 것:\u003c/p>\n\u003col>\n\u003cli>동일 Splat 자산 선정\u003c/li>\n\u003cli>PlayCanvas 스파이크\u003c/li>\n\u003cli>Three.js 스파이크\u003c/li>\n\u003cli>동일 기준 성능/개발성 비교\u003c/li>\n\u003cli>첫 실제 Pilot 엔진 선택\u003c/li>\n\u003cli>첫 장소 선정\u003c/li>\n\u003cli>실제 촬영/3DGS 제작 파이프라인 시작\u003c/li>\n\u003c/ol>\n\u003chr />\n\u003ch2 id=\"16-decision-gate\">16. 기술 선택 Decision Gate\u003c/h2>\n\u003cp>두 스파이크 후 다음 기준으로 판단한다.\u003c/p>\n\u003ch3 id=\"playcanvas\">PlayCanvas 우선 조건\u003c/h3>\n\u003cul>\n\u003cli>Splat 대형 장면 성능과 모바일 대응 우수\u003c/li>\n\u003cli>Editor가 월드 제작 시간을 크게 줄임\u003c/li>\n\u003cli>Engine/Editor 구조가 서비스와 잘 맞음\u003c/li>\n\u003cli>자체 호스팅과 데이터 독립성에 문제 없음\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"threejs\">Three.js 우선 조건\u003c/h3>\n\u003cul>\n\u003cli>일반 Web UI/CMS와 긴밀한 결합이 중요\u003c/li>\n\u003cli>PlayCanvas Scene/Editor가 프로젝트 구조를 제약\u003c/li>\n\u003cli>자체 World Composer 필요성이 높음\u003c/li>\n\u003cli>직접 개발 증가분이 감당 가능\u003c/li>\n\u003cli>Three.js/Spark 성능이 충분함\u003c/li>\n\u003c/ul>\n\u003cp>최종 판단은 철학적 선호가 아니라 \u003cstrong>같은 자산을 사용한 실제 스파이크 결과\u003c/strong>를 기준으로 한다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"17\">17. 기술 스파이크가 끝난 뒤 남아야 할 질문\u003c/h2>\n\u003cp>다음 질문에 답할 수 있어야 한다.\u003c/p>\n\u003col>\n\u003cli>Gaussian Splat 공간이 실제로 \"장소 경험\"을 제공하는가?\u003c/li>\n\u003cli>단순 360도 사진/영상보다 어떤 가치가 있는가?\u003c/li>\n\u003cli>Splat + GLB 혼합이 역사적 재구성에 실용적인가?\u003c/li>\n\u003cli>모바일에서 실용적인가?\u003c/li>\n\u003cli>한 장소를 제작하는 반복 비용은 어느 정도인가?\u003c/li>\n\u003cli>PlayCanvas와 Three.js 중 어느 쪽이 프로젝트 전체 비용을 낮추는가?\u003c/li>\n\u003cli>공간이 주인공인가, 아니면 콘텐츠를 담는 배경인가?\u003c/li>\n\u003cli>멀티유저가 정말 필요한가?\u003c/li>\n\u003cli>사용자는 자유 탐색과 guided experience 중 어느 쪽에서 더 많은 가치를 얻는가?\u003c/li>\n\u003cli>프로젝트의 최종 성격은 디지털 성지순례·교육·아카이브·공동체 중 어디에 중심을 두어야 하는가?\u003c/li>\n\u003c/ol>\n\u003cp>이 질문에 대한 답이 다음 기획 단계의 출발점이 된다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"18\">18. 관련 문서\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>01_tech_spike_playcanvas.md\u003c/code>\u003c/li>\n\u003cli>\u003ccode>02_tech_spike_threejs.md\u003c/code>\u003c/li>\n\u003c/ul>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
