<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>십상 디지털 공간 프로젝트 — 기술 스파이크 B: Three.js · Sotaesan Atlas</title><style>body{background:#f6f4ec;color:#173c33;font-family:system-ui,sans-serif}</style></head><body><noscript>자료를 보려면 브라우저에서 JavaScript를 허용해 주세요.</noscript><script type="application/json" id="site-page">"\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>십상 디지털 공간 프로젝트 — 기술 스파이크 B: Three.js · Sotaesan Atlas\u003c/title>\u003cstyle>\n:root{color-scheme:light;--paper:#f6f4ec;--ink:#173c33;--green:#137466;--muted:#546960;--line:#cdd6cd}\n*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:\"Apple SD Gothic Neo\",\"Noto Sans KR\",system-ui,sans-serif;font-size:17px;line-height:1.75}\na{color:var(--green);text-underline-offset:4px}header{border-bottom:1px solid var(--line);padding:20px max(24px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}header>a{font-weight:700;text-decoration:none}nav{display:flex;gap:20px;font-size:15px;flex-wrap:wrap}main{max-width:1120px;margin:auto;padding:44px 24px 70px}h1,h2,h3{line-height:1.45;word-break:keep-all;letter-spacing:-.025em}h1{font-size:36px;margin:0 0 28px}h2{font-size:26px;margin:44px 0 20px;border-top:1px solid var(--line);padding-top:28px}h3{font-size:21px;margin-top:28px}p{word-break:keep-all}table{border-collapse:collapse;width:100%;font-size:15px;margin:22px 0}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{border-bottom:2px solid var(--ink);background:#e9eee5}pre{overflow:auto;background:#e9eee5;padding:20px;font-size:14px;line-height:1.6}code{font-size:.9em;overflow-wrap:anywhere}img{max-width:100%;height:auto}.table-scroll{overflow-x:auto}footer{max-width:1120px;margin:auto;border-top:1px solid var(--line);padding:24px;font-size:14px;color:var(--muted)}.intro{max-width:750px;font-size:21px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:32px 0}.button{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);text-decoration:none;border-radius:4px;padding:11px 22px;font-weight:600}.button.secondary{background:transparent;color:var(--green)}.summary{border-left:4px solid var(--green);padding:4px 24px;margin:38px 0;font-size:19px}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.resource{border:1px solid var(--line);padding:22px}.resource h3{margin:0 0 10px}.resource p{font-size:16px;margin:0;color:var(--muted)}.local-file{color:var(--muted)}.meta{color:var(--muted);font-size:14px}.toc{border:1px solid var(--line);padding:16px 24px;margin:28px 0;font-size:15px}.toc>ul{margin:0}.toc li{margin:4px 0}li{margin:8px 0}.downloads{margin:0 0 30px}.measurements ul{padding-left:24px}@media(max-width:650px){body{font-size:16px}main{padding:30px 18px 50px}h1{font-size:29px}h2{font-size:23px}.intro{font-size:19px}.resources{grid-template-columns:1fr}header{padding:16px 18px}table{min-width:680px}.actions{gap:10px}.button{padding:9px 16px}}@media print{header,footer,.downloads{display:none}main{max-width:none;padding:0}body{font-size:11pt}h1{font-size:24pt}h2{font-size:18pt}table{font-size:9pt}.table-scroll{overflow:visible}a{color:inherit}}\n\n:focus-visible{outline:3px solid var(--green);outline-offset:5px}.trial-steps{padding-left:26px;max-width:780px}.trial-steps li{padding-left:8px;margin:18px 0}.trial-steps strong{display:block}.controls{display:grid;grid-template-columns:160px 1fr;gap:10px 24px;max-width:780px}.controls dt{font-weight:600}.controls dd{margin:0}.archive{margin-top:52px;border-top:1px solid var(--line);padding-top:24px}.archive>summary{cursor:pointer;font-size:22px;font-weight:600;line-height:1.5}.archive>summary small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin:8px 0 0 22px}.archive[open]>summary{margin-bottom:32px}.scope{max-width:780px;color:var(--muted);font-size:15px}@media(max-width:650px){.controls{grid-template-columns:1fr;gap:4px}.controls dd{margin-bottom:12px}.archive>summary{font-size:20px}}@media print{.archive{display:block}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"../../index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"../../tests/playcanvas/?scene=content&amp;character=1\">현재 테스트\u003c/a>\u003ca href=\"../../tests/index.html\">이전 기술 테스트\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-REPORT.html\">기술 보고서\u003c/a>\u003ca href=\"../../docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"../../output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"downloads\">\u003ca href=\"02_tech_spike_threejs.md\" download>Markdown 원본 다운로드\u003c/a>\u003c/p>\u003ch1 id=\"b-threejs\">십상 디지털 공간 프로젝트 — 기술 스파이크 B: Three.js\u003c/h1>\n\u003cul>\n\u003cli>문서 상태: Draft v0.1\u003c/li>\n\u003cli>작성일: 2026-09-28\u003c/li>\n\u003cli>목적: Three.js 기반으로 Gaussian Splat + GLB 하이브리드 웹 월드의 기술 가능성 검증\u003c/li>\n\u003cli>비교 대상: \u003ccode>기술 스파이크 A — PlayCanvas Engine\u003c/code>\u003c/li>\n\u003cli>원칙: 실제 성지 촬영/3DGS 생성은 본 스파이크의 테스트 범위에서 제외한다.\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2 id=\"1\">1. 스파이크의 목적\u003c/h2>\n\u003cp>이 스파이크는 PlayCanvas와 동일한 기능 범위를 \u003cstrong>Three.js 중심의 독립 웹 애플리케이션\u003c/strong>으로 구현했을 때의 장단점을 확인한다.\u003c/p>\n\u003cp>핵심 질문:\u003c/p>\n\u003col>\n\u003cli>기존 Gaussian Splat을 Three.js 공간 안에 안정적으로 배치할 수 있는가.\u003c/li>\n\u003cli>Splat과 GLB Mesh를 같은 Scene/Camera에서 자연스럽게 혼합할 수 있는가.\u003c/li>\n\u003cli>이동·Collision·Hotspot 등 월드 기능을 무리 없이 구성할 수 있는가.\u003c/li>\n\u003cli>모바일 브라우저에서도 현실적인 성능이 나오는가.\u003c/li>\n\u003cli>PlayCanvas보다 개발량은 얼마나 늘어나는가.\u003c/li>\n\u003cli>그 대신 얻는 구조적 자유도와 서비스 독립성이 실제로 가치가 있는가.\u003c/li>\n\u003cli>향후 프로젝트 전용 World Composer를 만들 수 있는 기반이 되는가.\u003c/li>\n\u003c/ol>\n\u003chr />\n\u003ch2 id=\"2\">2. 의도적으로 제외하는 범위\u003c/h2>\n\u003ch3 id=\"_1\">기술 스파이크에서 제외\u003c/h3>\n\u003cul>\n\u003cli>현장 촬영\u003c/li>\n\u003cli>영상 → 프레임\u003c/li>\n\u003cli>COLMAP / SfM\u003c/li>\n\u003cli>3DGS 학습\u003c/li>\n\u003cli>실제 역사 공간 복원\u003c/li>\n\u003cli>멀티유저\u003c/li>\n\u003cli>음성 대화\u003c/li>\n\u003cli>로그인/회원\u003c/li>\n\u003cli>DB/CMS\u003c/li>\n\u003cli>VR/XR 본격 구현\u003c/li>\n\u003cli>완성형 3D Editor\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"_2\">실제 프로젝트에서는 필요\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">현장 촬영\n  ↓\n카메라 Pose / SfM\n  ↓\n3DGS 생성\n  ↓\nSplat cleanup\n  ↓\n웹용 파일 생성\n  ↓\nThree.js Runtime\n\u003c/code>\u003c/pre>\n\u003cp>촬영/3DGS 생성은 웹 런타임과 독립적인 제작 파이프라인으로 본다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"3\">3. 테스트 자산\u003c/h2>\n\u003cp>PlayCanvas 스파이크와 \u003cstrong>가능한 한 동일한 자산\u003c/strong>을 사용한다.\u003c/p>\n\u003ch3 id=\"gaussian-splat\">Gaussian Splat\u003c/h3>\n\u003cul>\n\u003cli>PLY/SPZ/SOG 등 라이선스가 명확한 공개 샘플\u003c/li>\n\u003cli>가능하면 건물·지형·외부 공간이 포함된 장면\u003c/li>\n\u003cli>원본/출처/라이선스 기록\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"glb\">GLB\u003c/h3>\n\u003cp>동일한 테스트 GLB 1~3개 사용.\u003c/p>\n\u003ch3 id=\"collision\">Collision\u003c/h3>\n\u003cp>가능하면 두 스파이크에서 동일한 \u003ccode>collision.glb\u003c/code>를 사용한다.\u003c/p>\n\u003cp>이를 통해 엔진 외 변수를 최소화한다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"4\">4. 기본 기술 구성\u003c/h2>\n\u003ch3 id=\"baseline\">권장 Baseline\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">TypeScript\nVite\nThree.js\nSpark\nGLTFLoader\nworld.json\n간단한 Collision Layer\n정적 웹 호스팅\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"gaussian-splat-renderer\">Gaussian Splat Renderer\u003c/h3>\n\u003cp>첫 번째 비교 스파이크에서는 \u003cstrong>Three.js + Spark\u003c/strong>를 기준으로 한다.\u003c/p>\n\u003cp>이유:\u003c/p>\n\u003cul>\n\u003cli>Three.js rendering pipeline과 직접 결합\u003c/li>\n\u003cli>Splat + Mesh 혼합\u003c/li>\n\u003cli>WebGL2 기반의 넓은 기기 대응\u003c/li>\n\u003cli>여러 Splat 지원\u003c/li>\n\u003cli>PLY/SPZ/SPLAT/KSPLAT/SOG 등 다수 형식 지원\u003c/li>\n\u003cli>2026년 기준 LOD/대형 장면 스트리밍 기능 제공\u003c/li>\n\u003c/ul>\n\u003cp>Three.js 자체의 공식 \u003ccode>GaussianSplat\u003c/code> / \u003ccode>KHR_gaussian_splatting\u003c/code> 지원도 별도 실험 후보로 남겨둔다. 공식 구현은 WebGPURenderer 계열과 연결되므로 첫 비교에서는 브라우저/모바일 변수를 줄이기 위해 Spark를 우선한다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"5\">5. 권장 코드 구조\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">/src\n  main.ts\n  /engine\n    createRenderer.ts\n    createScene.ts\n    loadSplat.ts\n    loadGLTF.ts\n    cameraController.ts\n    collision.ts\n    hotspot.ts\n  /world\n    schema.ts\n    loader.ts\n  /ui\n    hotspotPanel.ts\n\n/public\n  /assets\n    scene.spz\n    historical-object.glb\n    collision.glb\n  /world\n    world.json\n\u003c/code>\u003c/pre>\n\u003cp>목표는 Three.js API를 애플리케이션 전체에 흩뿌리지 않고, 월드 데이터와 renderer adapter를 분리하는 것이다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"6-worldjson\">6. 엔진 독립적인 world.json\u003c/h2>\n\u003cp>PlayCanvas 스파이크와 동일한 schema를 사용한다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{\n  &quot;schemaVersion&quot;: 1,\n  &quot;id&quot;: &quot;spike-sample-world&quot;,\n  &quot;title&quot;: &quot;Gaussian Splat Technical Spike&quot;,\n  &quot;objects&quot;: [\n    {\n      &quot;id&quot;: &quot;present-world&quot;,\n      &quot;type&quot;: &quot;splat&quot;,\n      &quot;src&quot;: &quot;/assets/scene.spz&quot;,\n      &quot;position&quot;: [0, 0, 0],\n      &quot;rotation&quot;: [0, 0, 0],\n      &quot;scale&quot;: [1, 1, 1]\n    },\n    {\n      &quot;id&quot;: &quot;historical-object&quot;,\n      &quot;type&quot;: &quot;gltf&quot;,\n      &quot;src&quot;: &quot;/assets/historical-object.glb&quot;,\n      &quot;position&quot;: [5, 0, -4],\n      &quot;rotation&quot;: [0, 0, 0],\n      &quot;scale&quot;: [1, 1, 1]\n    },\n    {\n      &quot;id&quot;: &quot;info-01&quot;,\n      &quot;type&quot;: &quot;hotspot&quot;,\n      &quot;position&quot;: [2, 1.5, -2],\n      &quot;contentId&quot;: &quot;sample-info&quot;\n    }\n  ],\n  &quot;spawn&quot;: {\n    &quot;position&quot;: [0, 1.7, 3],\n    &quot;rotation&quot;: [0, 180, 0]\n  }\n}\n\u003c/code>\u003c/pre>\n\u003cp>렌더러 구조:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">world.json\n   ↓\nThree.js World Adapter\n   ↓\nTHREE.Scene\n├─ SparkRenderer\n├─ SplatMesh\n├─ GLTF\n├─ Collision\n└─ Hotspot anchors\n\u003c/code>\u003c/pre>\n\u003chr />\n\u003ch2 id=\"7\">7. 구현 단계\u003c/h2>\n\u003ch3 id=\"spike-b-1-splat\">Spike B-1 — Splat 표시\u003c/h3>\n\u003cp>목표:\u003c/p>\n\u003cul>\n\u003cli>Three.js Scene\u003c/li>\n\u003cli>SparkRenderer\u003c/li>\n\u003cli>SplatMesh\u003c/li>\n\u003cli>Camera\u003c/li>\n\u003cli>resize\u003c/li>\n\u003cli>FPS\u003c/li>\n\u003cli>loading state\u003c/li>\n\u003c/ul>\n\u003cp>개념 코드:\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">const renderer = new THREE.WebGLRenderer({ antialias: false });\nconst scene = new THREE.Scene();\n\nconst spark = new SparkRenderer({ renderer });\nscene.add(spark);\n\nconst splat = new SplatMesh({\n  url: &quot;/assets/scene.spz&quot;\n});\n\nscene.add(splat);\n\u003c/code>\u003c/pre>\n\u003cp>완료 조건:\u003c/p>\n\u003cul>\n\u003cli>Desktop 정상\u003c/li>\n\u003cli>iPhone/Android 정상\u003c/li>\n\u003cli>치명적 rendering artifact 없음\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch3 id=\"spike-b-2-glb\">Spike B-2 — GLB 혼합\u003c/h3>\n\u003cpre>\u003ccode class=\"language-ts\">const gltf = await gltfLoader.loadAsync(\n  &quot;/assets/historical-object.glb&quot;\n);\n\nscene.add(gltf.scene);\n\u003c/code>\u003c/pre>\n\u003cp>검증:\u003c/p>\n\u003cul>\n\u003cli>Splat과 Mesh의 depth\u003c/li>\n\u003cli>GLB shadow/light\u003c/li>\n\u003cli>투명 재질 문제\u003c/li>\n\u003cli>위치/회전/Scale\u003c/li>\n\u003cli>여러 Mesh 추가 시 성능\u003c/li>\n\u003cli>Splat과 GLB의 색/조명 이질감\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch3 id=\"spike-b-3-1\">Spike B-3 — 1인칭 이동\u003c/h3>\n\u003cp>초기 기능:\u003c/p>\n\u003cul>\n\u003cli>WASD\u003c/li>\n\u003cli>mouse look\u003c/li>\n\u003cli>touch controller\u003c/li>\n\u003cli>gravity\u003c/li>\n\u003cli>spawn\u003c/li>\n\u003c/ul>\n\u003cp>직접적인 게임 프레임워크를 만들지 말고 최소 기능부터 시작한다.\u003c/p>\n\u003chr />\n\u003ch3 id=\"spike-b-4-collision\">Spike B-4 — Collision\u003c/h3>\n\u003cp>Splat을 Collision Geometry로 사용하지 않는다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">Visual Layer\n├ Splat\n└ GLB\n\nPhysics / Collision Layer\n└ collision.glb\n\u003c/code>\u003c/pre>\n\u003cp>첫 구현 후보:\u003c/p>\n\u003col>\n\u003cli>\u003ccode>THREE.Raycaster\u003c/code> + 간단한 바닥/벽 판정\u003c/li>\n\u003cli>\u003ccode>three-mesh-bvh\u003c/code> 기반 collision\u003c/li>\n\u003cli>필요성이 확인되면 Rapier로 확장\u003c/li>\n\u003c/ol>\n\u003cp>스파이크 초기에는 복잡한 rigid body 물리가 필요하지 않다.\u003c/p>\n\u003cp>검증 목표:\u003c/p>\n\u003cul>\n\u003cli>바닥 유지\u003c/li>\n\u003cli>벽 통과 방지\u003c/li>\n\u003cli>경사/계단\u003c/li>\n\u003cli>Collision Mesh 규모가 성능에 미치는 영향\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch3 id=\"spike-b-5-hotspot\">Spike B-5 — Hotspot\u003c/h3>\n\u003cp>구현 방식:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">world.json hotspot\n      ↓\nTHREE.Object3D anchor\n      ↓\ndistance / raycast\n      ↓\nHTML UI\n\u003c/code>\u003c/pre>\n\u003cp>Hotspot UI는 3D Canvas 안에 모두 넣기보다 일반 HTML/React UI와 조합하는 방향을 우선한다.\u003c/p>\n\u003cp>최소 기능:\u003c/p>\n\u003cul>\n\u003cli>접근 거리\u003c/li>\n\u003cli>click/tap\u003c/li>\n\u003cli>제목\u003c/li>\n\u003cli>텍스트\u003c/li>\n\u003cli>이미지\u003c/li>\n\u003cli>닫기\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch3 id=\"spike-b-6\">Spike B-6 — 현재/과거 레이어 개념\u003c/h3>\n\u003cp>첫 단계에서는 런타임 Splat editing을 최소화한다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">current splat\n↔\nhistorical-base splat + historical GLB\n\u003c/code>\u003c/pre>\n\u003cp>테스트:\u003c/p>\n\u003cul>\n\u003cli>버튼으로 레이어 전환\u003c/li>\n\u003cli>GLB fade\u003c/li>\n\u003cli>Splat visible 전환\u003c/li>\n\u003cli>카메라 위치 유지\u003c/li>\n\u003cli>전환 시 성능/메모리\u003c/li>\n\u003c/ul>\n\u003cp>향후에는 Spark shader/modifier를 이용한 공간 마스킹 가능성을 별도 검토한다.\u003c/p>\n\u003chr />\n\u003ch3 id=\"spike-b-7-self-host\">Spike B-7 — Self-host\u003c/h3>\n\u003cp>Three.js 앱은 처음부터 독자 호스팅을 전제로 한다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">Vite build\n   ↓\nstatic files\n   ↓\nCloudflare Pages / GitHub Pages / Nginx\n   ↓\nSplat &amp; GLB on Object Storage/CDN\n\u003c/code>\u003c/pre>\n\u003cp>검증:\u003c/p>\n\u003cul>\n\u003cli>asset CORS\u003c/li>\n\u003cli>caching\u003c/li>\n\u003cli>CDN\u003c/li>\n\u003cli>모바일 네트워크\u003c/li>\n\u003cli>HTTPS\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2 id=\"8-editor\">8. 자체 Editor는 만들지 않는다\u003c/h2>\n\u003cp>이번 기술 스파이크에서 PlayCanvas Editor에 대응하는 편집기를 만들지 않는다.\u003c/p>\n\u003cp>초기 배치는:\u003c/p>\n\u003cul>\n\u003cli>world.json 직접 수정\u003c/li>\n\u003cli>개발자용 임시 Transform GUI\u003c/li>\n\u003cli>필요 시 lil-gui 등의 간단한 도구\u003c/li>\n\u003c/ul>\n\u003cp>정도로 제한한다.\u003c/p>\n\u003ch3 id=\"_3\">향후 필요한 경우\u003c/h3>\n\u003cp>프로젝트 전용 World Composer는 다음 정도부터 시작할 수 있다.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">Scene Tree\nViewport\nTransformControls\nInspector\nAsset add\nHotspot add\nSave world.json\n\u003c/code>\u003c/pre>\n\u003cp>PlayCanvas Editor를 복제하지 않는다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"9-threejs\">9. Three.js가 얻는 장점\u003c/h2>\n\u003ch3 id=\"_4\">독립성\u003c/h3>\n\u003cul>\n\u003cli>일반 npm 프로젝트\u003c/li>\n\u003cli>특정 제작 SaaS에 대한 필수 종속 없음\u003c/li>\n\u003cli>런타임 코드 전체 통제\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"web-ui\">Web UI 결합\u003c/h3>\n\u003cp>React/Next.js 등의 일반 웹 애플리케이션 구조와 자연스럽게 결합하기 쉽다.\u003c/p>\n\u003cp>예:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">웹 서비스\n├─ 일반 콘텐츠 페이지\n├─ 십상 탐색\n├─ 자료 아카이브\n├─ 사용자 UI\n└─ Three.js 3D Experience\n\u003c/code>\u003c/pre>\n\u003cp>3D가 서비스의 일부일 경우 이 구조는 중요한 장점이 될 수 있다.\u003c/p>\n\u003ch3 id=\"_5\">전용 제작도구 가능성\u003c/h3>\n\u003cp>필요한 기능만 가진 십상 전용 World Composer를 장기적으로 개발하기 좋다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"10-threejs\">10. Three.js의 비용\u003c/h2>\n\u003cp>PlayCanvas에 기본 포함되거나 생태계가 통합해주는 기능을 직접 조합해야 할 수 있다.\u003c/p>\n\u003cp>예:\u003c/p>\n\u003cul>\n\u003cli>asset pipeline\u003c/li>\n\u003cli>collision/physics\u003c/li>\n\u003cli>1인칭 controller\u003c/li>\n\u003cli>editor\u003c/li>\n\u003cli>scene authoring\u003c/li>\n\u003cli>audio zone tooling\u003c/li>\n\u003cli>debug tooling\u003c/li>\n\u003cli>publishing tooling\u003c/li>\n\u003cli>runtime diagnostics\u003c/li>\n\u003c/ul>\n\u003cp>따라서 단순히 코드 줄 수보다 \u003cstrong>통합과 제품 완성도 비용\u003c/strong>을 측정해야 한다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"11\">11. 비교 측정 항목\u003c/h2>\n\u003cp>PlayCanvas와 같은 양식으로 기록한다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>항목\u003c/th>\n\u003cth style=\"text-align: right;\">Desktop\u003c/th>\n\u003cth style=\"text-align: right;\">iPhone\u003c/th>\n\u003cth style=\"text-align: right;\">Android\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>최초 화면 표시 시간\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>전체 초기 다운로드\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>평균 FPS\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>최저 FPS\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>GPU/메모리 이상 여부\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Splat+GLB depth\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1인칭 이동\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Collision 안정성\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hotspot UX\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>개발 난이도\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003ctd style=\"text-align: right;\">\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>추가로 Three.js Track에서는 반드시 다음을 기록한다.\u003c/p>\n\u003cul>\n\u003cli>자체 구현 코드량\u003c/li>\n\u003cli>라이브러리 수\u003c/li>\n\u003cli>구현 중 발생한 브라우저별 예외\u003c/li>\n\u003cli>장면 authoring에 든 시간\u003c/li>\n\u003cli>기능 하나를 추가하는 데 걸리는 반복 비용\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2 id=\"12\">12. 성공 기준\u003c/h2>\n\u003col>\n\u003cli>Splat + GLB 혼합이 정상적\u003c/li>\n\u003cli>모바일 포함 실행 가능\u003c/li>\n\u003cli>최소 이동/Collision 구현 가능\u003c/li>\n\u003cli>일반 웹 UI와 Hotspot 결합이 자연스러움\u003c/li>\n\u003cli>정적 독자 호스팅 문제 없음\u003c/li>\n\u003cli>world.json 기반 Scene 생성 가능\u003c/li>\n\u003cli>PlayCanvas보다 개발량이 늘더라도 감당 가능한 수준\u003c/li>\n\u003cli>서비스 UI·CMS·콘텐츠와의 통합 자유도가 실제 이점으로 확인됨\u003c/li>\n\u003c/ol>\n\u003chr />\n\u003ch2 id=\"13\">13. 주요 위험\u003c/h2>\n\u003ch3 id=\"_6\">라이브러리 조합 비용\u003c/h3>\n\u003cp>Three.js 자체는 renderer library 성격이 강하므로 여러 라이브러리를 조합하게 된다.\u003c/p>\n\u003cp>대응:\u003c/p>\n\u003cul>\n\u003cli>의존성을 최소화\u003c/li>\n\u003cli>adapter를 둬 핵심 서비스 코드와 분리\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"splat-renderer\">Splat Renderer 변화\u003c/h3>\n\u003cp>Gaussian Splat 웹 생태계가 빠르게 발전하고 있다.\u003c/p>\n\u003cp>대응:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">world.json\n   ↓\nSplat Adapter\n   ├ Spark\n   └ Three.js native GaussianSplat\n\u003c/code>\u003c/pre>\n\u003cp>처럼 추상화한다.\u003c/p>\n\u003ch3 id=\"editor\">자체 Editor 욕심\u003c/h3>\n\u003cp>기술 검증 단계에서 편집기 개발로 빠질 가능성이 높다.\u003c/p>\n\u003cp>대응:\u003c/p>\n\u003cblockquote>\n\u003cp>런타임 검증 → 실제 제작 방식 확인 → 필요한 기능만 Editor화\u003c/p>\n\u003c/blockquote>\n\u003cp>순서를 지킨다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"14\">14. 실제 프로젝트 단계에서 추가될 제작 파이프라인\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">현장 촬영\n↓\n3DGS 생성\n↓\nSplat 편집\n↓\nPLY master\n↓\nSPZ/SOG 등 runtime format\n↓\nCollision\n↓\nworld.json\n↓\nThree.js Runtime\n\u003c/code>\u003c/pre>\n\u003cp>촬영·학습은 별도 전문 워크플로로 관리한다.\u003c/p>\n\u003chr />\n\u003ch2 id=\"15\">15. 스파이크 결과물\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">/threejs-spike\n  /src\n  /public/assets\n  /public/world/world.json\n  README.md\n  PERFORMANCE.md\n  ASSET-LICENSES.md\n\u003c/code>\u003c/pre>\n\u003cp>그리고 독자 호스팅 URL.\u003c/p>\n\u003chr />\n\u003ch2 id=\"16\">16. 판단 기준\u003c/h2>\n\u003ch3 id=\"continue\">Continue\u003c/h3>\n\u003cul>\n\u003cli>충분한 성능\u003c/li>\n\u003cli>코드 구조 단순\u003c/li>\n\u003cli>Web UI와의 통합성이 높은 가치 제공\u003c/li>\n\u003cli>운영/개발팀이 직접 관리 가능한 복잡도\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"compare\">Compare\u003c/h3>\n\u003cul>\n\u003cli>기능은 가능하지만 PlayCanvas보다 제작비가 눈에 띄게 큼\u003c/li>\n\u003cli>자체 Editor 없이는 반복 제작이 불편함\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"stop\">Stop\u003c/h3>\n\u003cul>\n\u003cli>모바일 성능 또는 renderer 안정성 문제\u003c/li>\n\u003cli>여러 라이브러리 통합 비용이 과도\u003c/li>\n\u003cli>Scene 제작/운영이 지나치게 개발자 의존적\u003c/li>\n\u003c/ul>\n\u003chr />\n\u003ch2 id=\"17\">17. 참고 자료\u003c/h2>\n\u003cul>\n\u003cli>Three.js: https://threejs.org/\u003c/li>\n\u003cli>Three.js GaussianSplat: https://threejs.org/docs/pages/GaussianSplat.html\u003c/li>\n\u003cli>Three.js GLTF Gaussian Splat extension: https://threejs.org/docs/pages/GLTFGaussianSplatLoaderExtension.html\u003c/li>\n\u003cli>Spark: https://github.com/sparkjsdev/spark\u003c/li>\n\u003cli>Spark Renderer docs: https://github.com/sparkjsdev/spark/blob/main/docs/docs/spark-renderer.md\u003c/li>\n\u003c/ul>\u003c/main>\u003cfooter>캐릭터·만남 테스트와 기존 기술 측정 자료를 함께 제공합니다. 기존 기술 측정 기간은 2026-10-02~04이며, 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="../../site-access.js"></script></body></html>
