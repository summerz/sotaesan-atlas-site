0px;margin:auto;border-top:1px solid var(--line);padding:24px;font-size:14px;color:var(--muted)}.intro{max-width:750px;font-size:21px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 16px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:32px 0}.button{display:inline-block;background:var(--green);color:white;border:1px solid var(--green);text-decoration:none;border-radius:4px;padding:11px 22px;font-weight:600}.button.secondary{background:transparent;color:var(--green)}.summary{border-left:4px solid var(--green);padding:4px 24px;margin:38px 0;font-size:19px}.resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.resource{border:1px solid var(--line);padding:22px}.resource h3{margin:0 0 10px}.resource p{font-size:16px;margin:0;color:var(--muted)}.local-file{color:var(--muted)}.meta{color:var(--muted);font-size:14px}.toc{border:1px solid var(--line);padding:16px 24px;margin:28px 0;font-size:15px}.toc>ul{margin:0}.toc li{margin:4px 0}li{margin:8px 0}.downloads{margin:0 0 30px}.measurements ul{padding-left:24px}@media(max-width:650px){body{font-size:16px}main{padding:30px 18px 50px}h1{font-size:29px}h2{font-size:23px}.intro{font-size:19px}.resources{grid-template-columns:1fr}header{padding:16px 18px}table{min-width:680px}.actions{gap:10px}.button{padding:9px 16px}}@media print{header,footer,.downloads{display:none}main{max-width:none;padding:0}body{font-size:11pt}h1{font-size:24pt}h2{font-size:18pt}table{font-size:9pt}.table-scroll{overflow:visible}a{color:inherit}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ca href=\"./index.html\">SOTAESAN ATLAS\u003c/a>\u003cnav aria-label=\"자료 메뉴\">\u003ca href=\"./tests/index.html\">직접 테스트\u003c/a>\u003ca href=\"./docs/implementation/SPIKE-DECISION-REPORT.html\">상세 보고서\u003c/a>\u003ca href=\"./docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료\u003c/a>\u003ca href=\"./output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF\u003c/a>\u003c/nav>\u003c/header>\u003cmain >\u003cp class=\"eyebrow\">스파이크 테스트 결과 · 2026-10-04 정리\u003c/p>\u003ch1>대종사 십상을 웹의 가상 공간으로\u003cbr>구현하기 위한 기술 테스트\u003c/h1>\u003cp class=\"intro\">원불교 대종사 십상과 관련 성지를 웹에서 둘러보고 이해할 수 있는 공간을 준비하고 있습니다. 성지를 촬영한 사진을 가우시안 스플랫(Gaussian Splat)으로 변환해 공간의 모습을 담고, 브라우저에서 걸으며 역사·교법·장소 설명을 읽는 방식을 검토합니다.\u003c/p>\u003cp>이 사이트는 그에 필요한 웹 실행 기술을 비교한 시험 앱과 결과 자료를 모았습니다. 아래 배경을 읽은 뒤 직접 테스트하거나 발표 자료·상세 보고서를 확인할 수 있습니다.\u003c/p>\u003cdiv class=\"actions\">\u003ca class=\"button\" href=\"tests/index.html\">직접 테스트하기\u003c/a>\u003ca class=\"button secondary\" href=\"docs/implementation/SPIKE-DECISION-PRESENTATION.html\">발표 자료 보기\u003c/a>\u003ca class=\"button secondary\" href=\"docs/implementation/SPIKE-DECISION-REPORT.html\">상세 보고서 읽기\u003c/a>\u003ca class=\"button secondary\" href=\"output/pdf/SPIKE-DECISION-PRESENTATION.pdf\">PDF 열기\u003c/a>\u003c/div>\u003ch2>왜 먼저 기술 테스트를 했나요?\u003c/h2>\n\u003cp>실제 성지를 촬영하고 콘텐츠를 만들기 전에, 사진으로 담은 공간을 웹에서 표시하고 그 안을 걸으며 설명을 읽거나 시대를 바꿀 수 있는지 확인하려고 작은 시험 앱을 만들었습니다. 이런 사전 기술 시험을 ‘스파이크’라고 부릅니다. 같은 장면과 기능을 PlayCanvas와 Three.js로 구현해 로딩·이동·모바일 실행을 비교했습니다.\u003c/p>\n\u003ch2>특정 플랫폼에 되도록 묶이지 않으려 합니다\u003c/h2>\n\u003cp>엔진이나 호스팅을 바꿔도 공간 자산과 설명 데이터를 계속 활용하는 것이 목표입니다. 두 앱이 같은 가우시안 스플랫·GLB 파일과 공통 장면 설정을 읽고, PlayCanvas도 호스팅 Editor 대신 Engine을 코드로 사용합니다. 실행 앱은 정적 웹 파일로 만들었으며, 현재는 GitHub Pages에서 공유합니다. 엔진별 구현은 따로 필요하지만 자산과 콘텐츠를 특정 서비스 안에만 남기지 않는 방향으로 시험했습니다.\u003c/p>\n\u003ch2>시험용 공간은 웹에서 내려받은 두 샘플입니다\u003c/h2>\n\u003cp>화면에 나오는 공간은 실제 성지 촬영 자료가 아닙니다. 인터넷에서 구할 수 있는 공개 가우시안 스플랫 샘플 두 개를 골라 기술 시험에 사용했습니다. 여러 실행 장면은 이 두 원본을 가공하거나 설정을 달리한 것입니다.\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>시험용 원본\u003c/th>\u003cth>제작자·출처\u003c/th>\u003cth>사용 목적\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Knock Community Hall\u003c/td>\u003ctd>SteveB(scbenoit)\u003cbr>\u003ca href=\"https://superspl.at/scene/0ff2e6dc\">SuperSplat 공개 장면\u003c/a>\u003c/td>\u003ctd>기본 공간, 시대 전환, 구역 로딩\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Sunnyvale Heritage Park Museum\u003c/td>\u003ctd>Damjan Cvetkov Dimitrov(zeitgeistarchivescans)\u003cbr>\u003ca href=\"https://superspl.at/scene/d5d397aa\">SuperSplat 공개 장면\u003c/a> · \u003ca href=\"https://code.playcanvas.com/examples_data/example_sunnyvale/sunnyvale.sog\">PlayCanvas 예제 파일\u003c/a>\u003c/td>\u003ctd>대형 장면 로딩, 보행, 벽 비침\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>‘과거 보기’의 건물·벽과 장소 설명도 기능 확인용 시험 데이터입니다. 이번에는 이미 만들어진 가우시안 스플랫을 웹에서 실행하는 단계를 확인했으며, 현장 촬영·사진에서 스플랫 생성·실제 역사 복원은 시험 범위에 포함하지 않았습니다.\u003c/p>\u003ch2>이번 비교의 결과\u003c/h2>\u003cdiv class=\"summary\">\u003cp>이번 테스트에서는 \u003cstrong>PlayCanvas + Ammo를 우선 후보로 추천\u003c/strong>합니다. Three.js 연동과 데이터 축소를 허용하는 경우에는 Three.js + BVH도 대안입니다.\u003c/p>\u003cp class=\"meta\">이번 스파이크 범위에서의 조건부 추천입니다. 전체 서비스 성능이나 최종 엔진 선택을 확정한 결과는 아닙니다.\u003c/p>\u003c/div>\u003ch2>항목별 결과와 근거\u003c/h2>\u003cdiv class=\"resources\">\u003carticle class=\"resource\">\u003ch3>\u003ca href=\"docs/implementation/LOADING-MEMORY-COMPARISON.html\">로딩·메모리\u003c/a>\u003c/h3>\u003cp>원본 로딩 18회와 메인·worker 메모리 측정\u003c/p>\u003c/article>\u003carticle class=\"resource\">\u003ch3>\u003ca href=\"docs/implementation/PHYSICS-COST-COMPARISON.html\">이동·프레임\u003c/a>\u003c/h3>\u003cp>보행 처리 비용과 전체 프레임 간격\u003c/p>\u003c/article>\u003carticle class=\"resource\">\u003ch3>\u003ca href=\"docs/implementation/MOBILE-COMPARISON.html\">iPhone 테스트\u003c/a>\u003c/h3>\u003cp>대형 원본 로딩과 소규모 장면의 측정 결과\u003c/p>\u003c/article>\u003carticle class=\"resource\">\u003ch3>\u003ca href=\"docs/implementation/PAIRED-SPATIAL-STREAMING.html\">장면 분할 로딩\u003c/a>\u003c/h3>\u003cp>화면·충돌 데이터를 함께 나눈 기능 테스트\u003c/p>\u003c/article>\u003carticle class=\"resource\">\u003ch3>\u003ca href=\"docs/implementation/SUNNYVALE-ERA-INTEGRATION.html\">시대 전환·설명 연동\u003c/a>\u003c/h3>\u003cp>분할 장면과 시대별 화면·설명의 연동\u003c/p>\u003c/article>\u003carticle class=\"resource\">\u003ch3>\u003ca href=\"docs/implementation/SUNNYVALE-WALL-AUDIT.html\">벽 비침 조사\u003c/a>\u003c/h3>\u003cp>두 렌더러의 화면 비교와 부분 보정 결과\u003c/p>\u003c/article>\u003c/div>\u003ch2>전체 관련 문서\u003c/h2>\u003cul>\u003cli>\u003ca href=\"docs/implementation/AUTHORING-COST.html\">제작·변경 작업과 의존성\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/BROWSER-DEBUGGING.html\">브라우저 디버깅 방법\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/CONTENT-LIFECYCLE.html\">장소 정보·콘텐츠 수명 시험\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/CRITICAL-CAPABILITIES.html\">본 개발 전 핵심 기능 검증\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/ERA-COLLISION-SWITCH.html\">시대별 충돌 교체 검증\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/FAR-LOD.html\">원거리 저해상도 표현과 근거리 교체\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/LOADING-MEMORY-COMPARISON.html\">초기 로딩·시대 전환·메모리 비교\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/MOBILE-COMPARISON.html\">iPhone 11 모바일 비교\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/MOBILE-DECODER-CONTROLS.html\">iPhone 대형 SOG 해독 대조 시험\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/MOBILE-STREAMING-ERA.html\">iPhone에서 공간 분할과 시대 전환 확인\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/PAIRED-SPATIAL-STREAMING.html\">Sunnyvale 화면·충돌 구역 로딩\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/PHYSICS-COST-COMPARISON.html\">보행 물리 처리 비용 비교\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/PORCH-WALKMESH-REPAIR.html\">Sunnyvale 현관 보행 바닥 보정\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/SECOND-SCENE.html\">두 번째 장면: Sunnyvale Museum 벽 비교\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/SPATIAL-STREAMING.html\">공간 분할·선택 로딩 시험\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/SPIKE-DECISION-REPORT.html\">3D 공간 스파이크 결과 보고서: 엔진 비교와 선택\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/STABILITY-COMPARISON.html\">10분 반복 조작 안정성 비교\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/STREAMING-ERA.html\">공간 분할과 현재·과거 전환의 결합\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/SUNNYVALE-ERA-INTEGRATION.html\">Sunnyvale 구역·시대·설명 결합과 충돌 재사용\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/SUNNYVALE-WALL-AUDIT.html\">Sunnyvale 벽 비침 조사\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/WALKMESH-AUTHORING.html\">보행 메시 검수와 콘텐츠 작성 원본\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/measurements/2026-10-03/wall-audit/repair-probes/README.html\">국소 벽 보정 시안의 근거\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/implementation/measurements/2026-10-04/wall-audit/walking-probes/README.html\">Sunnyvale 보행·시대 전환과 근접 범위 조사 — 2026-10-04\u003c/a>\u003c/li>\u003cli>\u003ca href=\"docs/spike/adr/ADR-005-era-switch.html\">ADR-005 — 시대 전환은 과거 배경 SOG 교체가 필수, 모바일 기본은 해제 후 로드\u003c/a>\u003c/li>\u003c/ul>\u003c/main>\u003cfooter>테스트 기간 2026-10-02~04 · 기존 측정 기록을 정리한 자료입니다. 조건이 다른 결과는 직접 비교하지 않습니다.\u003c/footer>\u003c/body>\u003c/html>"</script><script src="site-access.js"></script></body></html>
